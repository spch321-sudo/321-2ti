","gram":"<p><strong>一節經文裡有四代人。</strong>第一代是 παρʼ ἐμοῦ（par' emou） 的「我」，第二代是 ἤκουσας（ēkousas） 的「你」，第三代是 πιστοῖς ἀνθρώποις（pistois anthrōpois），第四代是 ἑτέρους（heterous）。ἃ（ha） 放在句首，接著用 ταῦτα（tauta） 回指：「你所聽見的——這些」，強調交出去的是同一份內容，不是改良版。</p><p>παράθου（parathou） 是 παρατίθημι（paratithēmi） 的不定過去式中間語態命令，是存款、寄放的字。它與 1:12 τὴν παραθήκην μου（tēn parathēkēn mou）、1:14 τὴν καλὴν παραθήκην（tēn kalēn parathēkēn） 同一家族，也回指提前 6:20 的「所託付你的」。保羅把自己的寄託交給神（1:12），又把神寄放在他手裡的交給提摩太（1:14），現在要提摩太再寄放出去。</p><p>διὰ πολλῶν μαρτύρων（dia pollōn martyrōn） 的 διά（dia） 帶屬格，可讀「藉著」許多見證人，也可讀「在……面前」。兩讀意思接近：提摩太領受的，是在眾人眼前教的，可以查驗，不是關起門來的秘傳。這一點直接反駁了 2:18 那種另立新說的人。</p><p>條件有兩個，次序不能倒：πιστοῖς（pistois） 在前，ἱκανοὶ（hikanoi）……διδάξαι（didaxai） 在後。οἵτινες（hoitines） 是性質關係代名詞，「是這樣一種人：他們將足以也教導別人」。ἔσονται（esontai） 是將來式：能教導是被培養出來的，忠心卻要先看得見。</p>","exp":"<p>「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」（2:2）這是全卷那條線的第三站：棒要交出去。保羅寫這句話的時候，已經知道自己跑不了多久了。接力賽最危險的不是跑得慢，是交棒的那幾步——掉了棒，前面跑得再快也算不得數。</p><p>保羅挑人的條件，第一個是忠心，第二個才是能教。這與我們的直覺相反：我們常先找有恩賜的、口才好的。保羅卻知道，一個人能不能把棒傳下去，看的是他會不會半路把棒據為己有，或把它改造成自己的東西。忠心的人手裡拿著的，始終是別人託付的。</p><p>傳承也不等於複製。提摩太不必變成保羅，忠心的人也不必變成提摩太；傳下去的是「所聽見的」，不是某一個人的性格與風格。保羅叫提摩太「我兒」，卻沒有要他變成自己的影子；第 3 章還要他自己去分辨「你知道是跟誰學的」（3:14）。屬靈父親不是屬靈主人。</p><p>這一卷有兩條傳承線：1:5 外祖母、母親、兒子，是家裡的一條；2:2 保羅、提摩太、忠心的人、別人，是教會裡的一條。提摩太的父親是希臘人，他的家本來就不完整；沒有基督徒家庭的人，不是少了甚麼，第二條線同樣真實，同樣可以把一個人帶到神面前。</p><p>讀到這裡，熟悉 321 的人會認出「繁殖」這一步，也會認出 235 的「3 屬靈父母兒女」。這是末端的認出，不是經文的定義：2:2 不是 321 繁殖的插圖，是一位快要殉道的父親，把神寄放在他手裡的交出去。先讓這句話作它自己——一個人的事奉能活多久，要看他交出去了沒有。</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">συγκακοπάθησον ὡς καλὸς στρατιώτης Χριστοῦ Ἰησοῦ.</p><p lang=\"grc\">οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·</p>","lit":"<p>你要同受苦難，如同基督耶穌美好的兵。</p><p>沒有一個正在當兵的人讓自己纏在生活的事務裡，好叫他討那招募他的人喜悅；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>συγκακοπάθησον</td><td>synkakopathēson</td><td>要同受苦難</td><td>◆ 經文鑑別：RP 作 Σὺ οὖν κακοπάθησον</td></tr><tr><td>καλὸς στρατιώτης Χριστοῦ Ἰησοῦ</td><td>kalos stratiōtēs Christou Iēsou</td><td>基督耶穌美好的兵</td><td>屬格：屬於基督、由他統領</td></tr><tr><td>στρατευόμενος</td><td>strateuomenos</td><td>正在當兵的</td><td>現在分詞：現役中</td></tr><tr><td>ἐμπλέκεται</td><td>empleketai</td><td>讓自己纏住</td><td>與彼後 2:20 ἐμπλακέντες 同字：被纏住、被困住</td></tr><tr><td>ταῖς τοῦ βίου πραγματείαις</td><td>tais tou biou pragmateiais</td><td>生活的事務</td><td>營生、買賣、打理產業</td></tr><tr><td>τῷ στρατολογήσαντι ἀρέσῃ</td><td>tō stratologēsanti aresē</td><td>討那招募他的人喜悅</td><td>不定過去式分詞：是他先招了我</td></tr></table>","gram":"<p><strong>◆ 經文鑑別 2:3。</strong>SBLGNT、WH、Treg、NA28 作 συγκακοπάθησον（synkakopathēson），「要與……同受苦難」；RP 所根據的拜占庭抄本多數作 Σὺ οὖν κακοπάθησον（Sy oun kakopathēson），「所以你要受苦難」。前者的抄本根據較早、較好；而且 1:8 保羅已用過同一個字 συγκακοπάθησον τῷ εὐαγγελίῳ（synkakopathēson tō euangeliō），這是他在本卷的用語。抄寫的人看見 2:1 開頭的 Σὺ οὖν（Sy oun），容易照樣補上，再把少見的複合字改成常見的 κακοπάθησον（kakopathēson），4:5 就用這個字。本講義從 SBLGNT。</p><p>字首的「同」沒有說和誰同受。和合本補了一個小字「我」，作「和我同受苦難」，是合理的補法：1:8 是與福音同受，這裡的上文是保羅與提摩太。重點在字首本身——這苦不是一個人扛的。</p><p>2:4 的 ἐμπλέκεται（empleketai） 是「纏進去」，像腳被網纏住，動彈不得。纏住人的是 ταῖς τοῦ βίου πραγματείαις（tais tou biou pragmateiais），βίου（biou） 指日常生計，πραγματείαις（pragmateiais） 指營生與買賣。當時的現役兵不可另外經商、替人管產業，原因不是生活不重要，而是一個被別的主人綁住的兵，聽不見號角。ἵνα（hina） 交代目的：τῷ στρατολογήσαντι ἀρέσῃ（tō stratologēsanti aresē）。不定過去式分詞指一個已經發生的動作——他已經招了我；我不是應徵來找工作的，是被他選上的。</p>","exp":"<p>〔提前〕提前 5:8（提摩太前書講義第 5 章）</p><p>「你要和我同受苦難，好像基督耶穌的精兵。」（2:3）全卷四章四字「火、兵、經、冠」，這一章是「兵」。可是讀到 2:24 就知道，這個兵有一條很奇怪的軍紀：「主的僕人不可爭競」（2:24）。基督的精兵打的仗，不是跟人打的。</p><p>「同」字是這一節的心臟。苦難有對象（為福音），也有同伴（同受）。教會的責任不是站在旁邊看一個人受苦，再稱讚他「真是精兵」，是一起受。這也表示不是一切的苦都叫「為主受苦」：自己犯錯的後果、過勞拖垮的身體、被虐待的關係，都不是這一節說的苦。</p><p>「凡在軍中當兵的，不將世務纏身，好叫那招他當兵的人喜悅。」（2:4）這一句常被誤用。不將世務纏身，不等於不顧家人，也不等於不可以有正職。本系列提摩太前書講義第 5 章講過：「人若不看顧親屬，就是背了真道，比不信的人還不好」（提前 5:8）。保羅自己也織帳棚為業（徒 18:3），他在第 4 章要外衣、要書、要同伴——他是一個有需要的人。</p><p>問題不在有沒有家、有沒有工作，而在被誰纏住。同一份工作，可以是事奉的地方，也可以是纏住腳的網。一個帶職的弟兄，可能比一個全職卻被名聲、比較與業績纏住的人，更像精兵。分辨的問題只有一個：我現在要討誰的喜悅？那位招我的，是先選上我的主——為一位主而活，這就是 321 說的無己；不是把自己榨乾，是把自己交給那一位。</p>"},{"a":5,"z":7,"star":1,"grk":"<p lang=\"grc\">ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·</p><p lang=\"grc\">τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.</p><p lang=\"grc\">νόει ὃ λέγω· δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.</p>","lit":"<p>並且若有人在場上比賽，他不得冠冕，除非他按規則比賽；</p><p>那勞苦的農夫應當首先分得果實。</p><p>你要思想我所說的；因為主必在一切事上賜你悟性。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐὰν δὲ καὶ ἀθλῇ τις</td><td>ean de kai athlē tis</td><td>若有人比賽</td><td>運動場的字：摔角、賽跑</td></tr><tr><td>οὐ στεφανοῦται</td><td>ou stephanoutai</td><td>不得冠冕</td><td>στέφανος 是勝利者的花冠，接 4:8</td></tr><tr><td>ἐὰν μὴ νομίμως ἀθλήσῃ</td><td>ean mē nomimōs athlēsē</td><td>除非按規則比賽</td><td>νομίμως：合乎規則</td></tr><tr><td>τὸν κοπιῶντα γεωργὸν</td><td>ton kopiōnta geōrgon</td><td>勞苦的農夫</td><td>κοπιάω：做到筋疲力盡</td></tr><tr><td>πρῶτον τῶν καρπῶν μεταλαμβάνειν</td><td>prōton tōn karpōn metalambanein</td><td>首先分得果實</td><td>πρῶτον 放在前面：先吃的是他</td></tr><tr><td>νόει ὃ λέγω</td><td>noei ho legō</td><td>思想我所說的</td><td>現在式命令：一直想下去</td></tr></table>","gram":"<p><strong>三個畫面，三種美德。</strong>兵（2:3--4）是專一，比武的（2:5）是守規矩，農夫（2:6）是勤苦。三句各有一個「條件——結果」：兵不纏身，才能討主人喜悅；比武的按規矩，才得冠冕；農夫勞苦，才先得果實。保羅在林前 9 章也用過兵、農夫、運動員的畫面，說的是同一類事。</p><p>νομίμως（nomimōs） 是「合乎規則地」。競賽的人不但比賽時要守規，賽前的操練也有規定。στεφανοῦται（stephanoutai） 的字根是 στέφανος（stephanos），競賽得勝者頭上的花冠——4:8 的「公義的冠冕」就是這個字，不是王冠。</p><p>2:6 的 τὸν κοπιῶντα（ton kopiōnta） 是現在分詞，強調「正在勞苦的」。πρῶτον（prōton） 放在前面，句子的重心在「先」。2:7 νόει（noei） 是現在式命令，接著 δώσει γάρ（dōsei gar） 給理由：你去想，主會給。思想與領受不是二選一。</p>","exp":"<p>三個畫面的共同點是：沒有一樣是一夜之間完成的。兵要受訓，比武的要操練，農夫要等收成。保羅給提摩太的不是一張速成表，而是一種長跑的節奏。</p><p>「按規矩」不是律法主義。比賽的規則是主人定的，不是選手發明的；這條路的規則，2:11--12 會說得很清楚：與他同死，才與他同活；忍耐，才同作王。想跳過十字架直接拿冠冕的，就是不按規矩比賽。</p><p>「勞力的農夫理當先得糧食。」（2:6）這句話有兩層。一層是工人得工價，事奉的人得供養並不羞恥（提前 5:18）；另一層更深：農夫自己先吃到果子。講道的人先被道餵飽，帶人的人先被恩典滋潤。一個天天端菜給別人、自己卻餓著的人，撐不了幾季。為了賞賜而事奉錯了嗎？那是議題頁的題目；這裡只說，保羅不怕提起冠冕與果實。</p><p>最後一句很溫柔：「我所說的話，你要思想，因為凡事主必給你聰明。」（2:7）保羅不替提摩太把每個比喻解釋到底，他相信主會親自教他的兒子。屬靈父親的分寸就在這裡：該說的說了，留空間給主。</p>"},{"a":8,"z":10,"star":2,"grk":"<p lang=\"grc\">Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·</p><p lang=\"grc\">ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·</p><p lang=\"grc\">διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.</p>","lit":"<p>你要一直記念耶穌基督——那已經從死人中被復活的，出於大衛的後裔——照著我的福音；</p><p>在這福音裡我受苦難，直到鎖鍊，如同作惡的人；但神的道卻沒有被捆綁。</p><p>因此我為了選民的緣故忍受一切，好叫他們也得著那在基督耶穌裡的救恩，連同永遠的榮耀。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μνημόνευε</td><td>Mnēmoneue</td><td>要一直記念</td><td>現在式命令：不是想起一次</td></tr><tr><td>Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν</td><td>Iēsoun Christon egēgermenon ek nekrōn</td><td>已從死人中被復活的耶穌基督</td><td>完成式分詞：復活了，而且一直活著</td></tr><tr><td>ἐκ σπέρματος Δαυίδ</td><td>ek spermatos Dauid</td><td>出於大衛的後裔</td><td>王的血統：接 2:12 同作王</td></tr><tr><td>κακοπαθῶ μέχρι δεσμῶν</td><td>kakopathō mechri desmōn</td><td>受苦直到鎖鍊</td><td>本卷「受苦」追蹤</td></tr><tr><td>ὡς κακοῦργος</td><td>hōs kakourgos</td><td>如同作惡的</td><td>與主同釘的犯人是 κακοῦργοι</td></tr><tr><td>οὐ δέδεται</td><td>ou dedetai</td><td>沒有被捆綁</td><td>完成式被動：鎖鍊對它無效</td></tr><tr><td>πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς</td><td>panta hypomenō dia tous eklektous</td><td>為選民忍受一切</td><td>ὑπομένω 接 2:12 ὑπομένομεν</td></tr></table>","gram":"<p><strong>原文的次序與和合本相反。</strong>希臘文是 Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν（Iēsoun Christon egēgermenon ek nekrōn）, ἐκ σπέρματος Δαυίδ（ek spermatos Dauid）：先說復活，後說大衛的後裔。保羅要受苦的兒子先記住的，是那位已經從死裡起來的主。ἐγηγερμένον（egēgermenon） 是完成式被動分詞，「已被復活、如今仍活著」。Μνημόνευε（Mnēmoneue） 是現在式命令，不是回憶一次，是一直放在眼前。</p><p>2:9 有一組文字遊戲：保羅 μέχρι δεσμῶν（mechri desmōn），被鎖鍊鎖著；ὁ λόγος τοῦ θεοῦ οὐ δέδεται（ho logos tou theou ou dedetai），神的道卻沒有被捆綁。δεσμῶν（desmōn） 與 δέδεται（dedetai） 同字根，一個人被綁住了，他傳的道沒有。κακοῦργος（kakourgos） 是「作惡者」，路 23:32--33 與耶穌同釘的兩個犯人就是這個字：保羅背上的罪名，與他的主同一個。</p><p>2:10 διὰ τοῦτο（dia touto） 回指 2:9：正因為道沒有被捆綁，保羅的忍耐才有意義。πάντα ὑπομένω（panta hypomenō） 的 ὑπομένω（hypomenō），兩節之後在可信的話裡再出現，寫作 ὑπομένομεν（hypomenomen），把保羅的處境接進那首詩。</p>","exp":"<p>「你要記念耶穌基督乃是大衛的後裔，他從死裡復活，正合乎我所傳的福音。」（2:8）一個受苦的人最容易記住的，是自己的苦。保羅叫提摩太記念的不是保羅的鎖鍊，也不是自己的眼淚，是一位已經復活的主。這是 321 說的「耶穌是我的榜樣」：他走過的路，盡頭是空墳墓。</p><p>「大衛的後裔」也不是隨口加上的。那是王的血統，是神對大衛的應許（撒下 7:12）。被捆綁的使徒在牢裡說：我傳的那一位是王。兩節之後，可信的話會說「我們若能忍耐，也必和他一同作王」（2:12）。</p><p>「然而神的道卻不被捆綁。」（2:9）這是改變觀點的一句話。從環境看，保羅完了：鎖著、被當成罪犯、同工離開。從神看，道正在跑：他在腓立比書說「我所遭遇的事更是叫福音興旺」（腓 1:12）。人可以被鎖，神的話不能。在病床上、在小小的線上聚會裡、在一個不能出門的老人家口中，神的道都沒有被捆綁。</p><p>2:10 交代受苦的對象：「為選民」。保羅的苦有方向，是為了別人得著救恩。這也是一條界線：不是一切的鎖鍊都是為福音的鎖鍊。保羅的苦是「為這福音」（2:9）；一個人若在不安全的關係裡被傷害，那不是這節經文要他忍的苦。選民是誰，牽涉揀選的教義，本講義指回以弗所書立場二，在議題頁處理。</p>"},{"a":11,"z":13,"star":3,"grk":"<p lang=\"grc\">πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·</p><p lang=\"grc\">εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ἀρνησόμεθα κἀκεῖνος ἀρνήσεται ἡμᾶς·</p><p lang=\"grc\">εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ἀρνήσασθαι ἑαυτὸν οὐ δύναται.</p>","lit":"<p>這話是可信的：因為我們若已與他同死，也必與他同活；</p><p>我們若忍耐，也必與他同作王；我們若將要否認，那一位也必否認我們；</p><p>我們若不忠信，那一位仍然是忠信的；他不能否認他自己。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πιστὸς ὁ λόγος</td><td>pistos ho logos</td><td>這話是可信的</td><td>教牧書信的套語，本卷唯一一次</td></tr><tr><td>εἰ γὰρ συναπεθάνομεν</td><td>ei gar synapethanomen</td><td>我們若已同死</td><td>不定過去式：已經發生</td></tr><tr><td>καὶ συζήσομεν</td><td>kai syzēsomen</td><td>也必同活</td><td>將來式</td></tr><tr><td>εἰ ὑπομένομεν καὶ συμβασιλεύσομεν</td><td>ei hypomenomen kai symbasileusomen</td><td>若忍耐，也必同作王</td><td>現在式→將來式</td></tr><tr><td>εἰ ἀρνησόμεθα</td><td>ei arnēsometha</td><td>若將要否認</td><td>◆ 經文鑑別：RP 作現在式 ἀρνούμεθα</td></tr><tr><td>κἀκεῖνος ἀρνήσεται ἡμᾶς</td><td>kakeinos arnēsetai hēmas</td><td>那一位也必否認我們</td><td>太 10:33 的回聲</td></tr><tr><td>εἰ ἀπιστοῦμεν</td><td>ei apistoumen</td><td>我們若不忠信</td><td>另一個字：ἀπιστέω，不是 ἀρνέομαι</td></tr><tr><td>ἐκεῖνος πιστὸς μένει</td><td>ekeinos pistos menei</td><td>那一位仍是忠信的</td><td>對稱被打破的一行</td></tr><tr><td>ἀρνήσασθαι ἑαυτὸν οὐ δύναται</td><td>arnēsasthai heauton ou dynatai</td><td>他不能否認自己</td><td>全卷樞紐的最後一行</td></tr></table>","gram":"<p><strong>可信的話。</strong>πιστὸς ὁ λόγος（pistos ho logos） 是教牧書信的套語（提前 1:15；3:1；4:9；多 3:8），本卷只有這一次。γάρ（gar） 表示後面是被引用的內容；四個「若」句工整對稱，多數學者認為是當時教會的詩歌或信條。和合本以詩行排版，本講義已併回各節。2:12「能」是和合本的小字。</p><p>前三句是整齊的對稱：已同死的 συναπεθάνομεν（synapethanomen） 對必同活的 συζήσομεν（syzēsomen），忍耐的 ὑπομένομεν（hypomenomen） 對同作王的 συμβασιλεύσομεν（symbasileusomen），不認的 ἀρνησόμεθα（arnēsometha） 對也不認的 ἀρνήσεται（arnēsetai）。三個「同」字首把信徒與基督綁在一起。第四句故意打破對稱：εἰ ἀπιστοῦμεν（ei apistoumen），結論不是「他也失信」，而是 ἐκεῖνος πιστὸς μένει（ekeinos pistos menei）。</p><blockquote><p>◆ 經文鑑別 2:12：SBLGNT、WH、Treg、NA28 作將來式 ἀρνησόμεθα（arnēsometha），「若將來不認」；RP 作現在式 ἀρνούμεθα（arnoumetha），「若正在不認」。將來式的抄本根據較好，也是較難的讀法（夾在兩個現在式條件句之間），抄寫者較可能改成現在式。本講義從 SBLGNT。將來式把眼光放到終點：問的不是某一刻的軟弱，而是一個人最後站在哪裡。</p></blockquote><p><strong>「不認」與「失信」是兩個不同的字。</strong>ἀρνέομαι（arneomai） 是「否認、棄絕、公開地說不認識」，與主在太 10:33 說的 ἀρνήσομαι（arnēsomai） 同字，是有意的、立場式的否認。ἀπιστέω（apisteō） 是「不忠信、不信」，與 πιστὸς（pistos） 正好成對：人的 ἀπιστοῦμεν（apistoumen） 撞上神的 πιστὸς（pistos）。末句 ἀρνήσασθαι ἑαυτὸν οὐ δύναται（arnēsasthai heauton ou dynatai） 沒有「若」，是全詩的根基。◆ 經文鑑別：SBLGNT 與 RP 在這裡沒有連接詞；WH、Treg、NA28 在 ἀρνήσασθαι（arnēsasthai） 後面多一個 γὰρ（因為），和合本「因為」跟的是這個讀法——兩讀的意思一樣，末句都是前一行的根據。οὐ δύναται（ou dynatai） 是「不能」——不是不願，是他的本性做不到。本卷「能力」追蹤在這裡轉了一個彎：全能的神有一件事不能，就是背乎自己。</p><p>三種讀法並陳。改革宗（聖徒恆忍）：2:12b 指最終全然的背棄，是從未真正得救的人的結局，2:13 保證神的選民不會全然離棄。阿民念／衛斯理宗：真實的信徒有可能最終離棄並失落，2:13 是神信實於他的話，包括他的警告。「警告是保守的工具」：警告是真的，神正是藉著警告保守他的人，確據與警告並行，不互相抵消。本講義沿用希伯來書講義對 6:4--6、10:26--39 的處理，全卷立場見 ISS00_3；講台落點掛在 2:13 末句。</p>","exp":"<p>「有可信的話說：我們若與基督同死，也必與他同活」（2:11）。這首詩是在最低的地方唱出來的：上一節保羅才說自己「被捆綁，像犯人一樣」（2:9）。一個戴著鎖鍊的人，用詩歌回答鎖鍊。這是全卷兩個必停之處的第一個，也是全卷地勢的第二座山。</p><p>前半是我們的路。同死，是已經發生的事：受洗歸入基督，舊人已與他同死（羅 6:8）；同活，是將來必有的事。「我們若能忍耐，也必和他一同作王」（2:12）——忍耐的盡頭不是被遺忘，是同作王。讓耶穌作王的人，將來與他同作王；這是 321 得勝者盼望的經文根據，但先讓它是一首在牢裡唱的詩。</p><p>後半是兩種失敗。「我們若不認他，他也必不認我們」（2:12）是真的警告，不可以削掉。主自己說過：「凡在人面前不認我的，我在我天上的父面前也必不認他。」（太 10:33）一個刻意、持續地轉身說「我不認識他」的人，不可以拿 2:13 當擋箭牌，說「反正他仍是可信的」。</p><p>但 2:13 是另一個字。彼得在大祭司院子裡三次不認主，福音書用的也是 ἠρνήσατο（ērnēsato）；可是那一夜之前，主已經說了：「我已經為你祈求，叫你不至於失了信心。你回頭以後，要堅固你的弟兄。」（路 22:32）彼得那一夜的跌倒，是害怕、是軟弱，出去就痛哭；主沒有照那一刻判他，而是把他找回來。所以分辨不在字面上抓到哪一個動詞，而在一個人最後的方向。正在軟弱中、懷疑自己還算不算數的人，這首詩不是要把你推出去：「我們縱然失信，他仍是可信的，因為他不能背乎自己。」（2:13）</p><p>最後這一行把整卷書翻過來。第 1 章說「要挑旺」，第 2 章說「要剛強」，讀到這裡，一切「我要忠心」都站在「他是可信的」上面。攀岩的人能爬上去，不是因為抓得最緊，是因為繩子綁在不會鬆的錨點上。保羅在 1:12 說「我知道我所信的是誰」——不是我抓住他，是他保全我。他不能背乎自己，所以他不會放手。</p>"},{"a":14,"z":14,"star":1,"grk":"<p lang=\"grc\">Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ κυρίου μὴ λογομαχεῖν, ἐπʼ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.</p>","lit":"<p>這些事你要使人回想，在主面前鄭重見證，叫他們不要在言詞上爭戰——那於甚麼都無益，只叫聽的人傾覆。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ταῦτα ὑπομίμνῃσκε</td><td>Tauta hypomimnēske</td><td>這些事要使人回想</td><td>現在式命令：一再提醒</td></tr><tr><td>διαμαρτυρόμενος</td><td>diamartyromenos</td><td>鄭重見證、囑咐</td><td>法庭上的字：當著見證人說</td></tr><tr><td>ἐνώπιον τοῦ κυρίου</td><td>enōpion tou kyriou</td><td>在主面前</td><td>◆ 經文鑑別：WH NA28 作 θεοῦ</td></tr><tr><td>μὴ λογομαχεῖν</td><td>mē logomachein</td><td>不要在言詞上爭戰</td><td>λόγος＋μάχομαι：用字打仗</td></tr><tr><td>ἐπʼ οὐδὲν χρήσιμον</td><td>ep' ouden chrēsimon</td><td>於甚麼都無益</td><td></td></tr><tr><td>ἐπὶ καταστροφῇ τῶν ἀκουόντων</td><td>epi katastrophē tōn akouontōn</td><td>叫聽的人傾覆</td><td>καταστροφῇ：翻倒、毀滅</td></tr></table>","gram":"<p><strong>◆ 經文鑑別 2:14。</strong>SBLGNT 與 RP 作 ἐνώπιον τοῦ κυρίου（enōpion tou kyriou），和合本「在主面前」跟這個讀法；WH、Treg、NA28 作 θεοῦ（theou），「在神面前」。兩邊的抄本證據相當，意思也沒有實質差別：囑咐是當著那位審判者說的。本講義從 SBLGNT 與和合本。</p><p>Ταῦτα（Tauta） 指上一段的可信的話與福音。ὑπομίμνῃσκε（hypomimnēske） 是「使人回想」，不是「教新的」：教會最需要的常常不是新東西，是被提醒已經知道的。λογομαχεῖν（logomachein） 是複合字，λόγος（logos） 加上「打仗」的字根，提前 6:4 的 λογομαχίας（logomachias） 是同一家族。結果是 ἐπὶ καταστροφῇ τῶν ἀκουόντων（epi katastrophē tōn akouontōn）：輸的不是吵架的雙方，是在旁邊聽的人。</p>","exp":"<p>這一節是第三段的門口：從「可信的話」轉到「怎樣處理不可信的話」。保羅的第一個指示不是「去辯倒他們」，是「使眾人回想這些事」。對付錯誤最好的辦法，常常是把真的講清楚、講到大家記得。</p><p>「不可為言語爭辯；這是沒有益處的，只能敗壞聽見的人。」（2:14）言詞的戰爭有一個特徵：吵的人越吵越有勁，聽的人越聽越灰心。一個線上的團契，最傷人的有時不是外面的逼迫，是群組裡為一個字、一個說法吵到深夜，旁觀的初信者悄悄離開。保羅說這種戰爭的結果是「傾覆」，翻倒的是聽的人的信心。</p><p>這不是說真理不需要分辨——下一節就要「按著正意分解真理的道」。分別在於目的：為了把人扶正而說的話，和為了贏而說的話，聽起來可能很像，結果完全不同。精兵打的仗，不是跟人打的；言詞的戰爭，正是跟人打的那一種。</p>"},{"a":15,"z":15,"star":3,"grk":"<p lang=\"grc\">σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.</p>","lit":"<p>你要竭力把你自己呈現給神，作經過考驗而蒙認可的，作無須羞愧的工人，直直地切開那真理的道。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σπούδασον</td><td>spoudason</td><td>要竭力</td><td>不定過去式命令：認真、趕緊去做</td></tr><tr><td>σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ</td><td>seauton dokimon parastēsai tō theō</td><td>把自己呈現給神，作經過考驗的</td><td>σεαυτὸν 放在前面：先是你自己</td></tr><tr><td>ἐργάτην ἀνεπαίσχυντον</td><td>ergatēn anepaischynton</td><td>無須羞愧的工人</td><td>接 1:8、12、16 的「不以為恥」</td></tr><tr><td>ὀρθοτομοῦντα</td><td>orthotomounta</td><td>直直地切開</td><td>新約只此一次：切直、開直路</td></tr><tr><td>τὸν λόγον τῆς ἀληθείας</td><td>ton logon tēs alētheias</td><td>那真理的道</td><td>本卷「道」追蹤</td></tr></table>","gram":"<p><strong>σεαυτὸν（seauton） 是這一節的第一個重點。</strong>上一節是「使眾人回想」，這一節立刻轉回提摩太自己：σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ（spoudason seauton dokimon parastēsai tō theō）。σπούδασον（spoudason） 是「竭力、趕緊、認真去做」；英王欽定本譯作 study（用功），容易被讀成只是讀書。δόκιμον（dokimon） 是金屬驗過、合格的意思，與 3:8 說人「可廢棄的」ἀδόκιμοι（adokimoi） 正好相反。ἀνεπαίσχυντον（anepaischynton） 是「無須羞愧」，接回第 1 章三次出現的「恥」：不以主為恥的人，也要作一個在主面前不必羞愧的工人。</p><p>ὀρθοτομοῦντα（orthotomounta） 在新約只出現這一次，字典形是 ὀρθοτομέω（orthotomeō），由表示「直」的 ὀρθός（orthos） 加上「切」的字根組成。七十士譯本箴 3:6、11:5 用這個字形容「修直」道路。解經家提出的畫面有好幾個：開一條直的路、犁一道直的溝、裁皮子（保羅本是做帳棚的）、祭司切祭牲。各種畫面的共同點都是「直」：不偏、不歪、照著材料本來的紋理下刀。這正與 2:18 說人「射偏了靶」的 ἠστόχησαν（ēstochēsan） 相對。和合本「按著正意分解」抓住的就是這個「正」。</p>","exp":"<p>「你當竭力在神面前得蒙喜悅，作無愧的工人，按著正意分解真理的道。」（2:15）這是本卷「聖經是我的準則」的第一處經文，第 3 章的「神所默示」是第二處。兩處放在一起，意思才完整：聖經是直的，我手上的刀也要直。</p><p>次序很重要。σεαυτὸν（seauton） 排在最前面：在你去切任何人之前，先把你自己呈現給神，讓他驗。按著正意分解，是先把自己切直，不是拿經文去切別人。一把刀若先砍過拿刀的人的手，他下刀時就會小心。希伯來書說「神的道是活潑的，是有功效的，比一切兩刃的劍更快」（來 4:12）——兩刃的劍，一邊對著聽的人，一邊對著講的人。</p><p>開路是最好的畫面。一條路修直了，後面的人走得省力；修歪了，走得越遠，離目的地越遠。斷章取義、只挑自己喜歡的經句、把經文剪成支持自己立場的碎片，都是把路修歪。英王欽定本把這個字譯成「正確地劃分」，後來也有人以它作為劃分時代的經文根據（各家讀法見本章議題頁）；不論怎樣看那個系統，這個字本身的重點是「直」，不是「分」。這個字要的不是切得多細，是切得多直。</p><p>「竭力」也提醒我們，切直不是一次學會的技術。δόκιμον（dokimon） 是驗過的金屬，驗的方法是火與時間；一個工人在神面前蒙認可，也是一年一年被驗出來的。讀經的人會累、會偏、會被自己的成見牽著走，所以要常常回到經文的上下文，讓整本聖經彼此解釋，也讓同行的弟兄姊妹提醒自己。</p><p>「無愧」也是給膽怯的人的安慰。提摩太不必怕人嘲笑他年輕，也不必在辯論場上贏過每一個人；他只需要在神面前站得住。一個天天讓聖經先把自己扶正的人，講台上就有一種安靜的權柄。321 說「聖經是我的準則」，這一節多加一筆：準則先量我，再量我手上的事工。</p>"},{"a":16,"z":18,"star":2,"grk":"<p lang=\"grc\">τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,</p><p lang=\"grc\">καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,</p><p lang=\"grc\">οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.</p>","lit":"<p>但那些世俗的空談，你要繞開；因為他們將向前推進，到更多的不敬虔，</p><p>他們的話也要像壞疽一樣蔓延吃開；其中有許米乃和腓理徒，</p><p>這些人在真理上射偏了靶，說復活已經發生了，並且傾覆一些人的信心。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὰς δὲ βεβήλους κενοφωνίας</td><td>tas de bebēlous kenophōnias</td><td>世俗的空談</td><td>κενοφωνίας：聲音空洞的話；提前 6:20 同字</td></tr><tr><td>περιΐστασο</td><td>periistaso</td><td>要繞開</td><td>現在式中間語態命令：站到旁邊去</td></tr><tr><td>ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας</td><td>epi pleion gar prokopsousin asebeias</td><td>必推進到更不敬虔</td><td>「進步」的字，用得很諷刺</td></tr><tr><td>ὡς γάγγραινα νομὴν ἕξει</td><td>hōs gangraina nomēn hexei</td><td>像壞疽蔓延</td><td>新約只此一次；νομὴν 原指放牧、吃草</td></tr><tr><td>ἠστόχησαν</td><td>ēstochēsan</td><td>射偏了靶</td><td>提前 1:6、6:21 同字</td></tr><tr><td>ἀνάστασιν ἤδη γεγονέναι</td><td>anastasin ēdē gegonenai</td><td>復活已經發生了</td><td>完成式不定詞：已成定局</td></tr><tr><td>ἀνατρέπουσιν</td><td>anatrepousin</td><td>傾覆</td><td>把桌子掀翻的字</td></tr></table>","gram":"<p><strong>προκόψουσιν（prokopsousin） 是一個諷刺。</strong>προκόπτω（prokoptō） 是哲學家愛用的「進步」；保羅在提前 4:15 要提摩太的「長進」顯明出來，用的也是這個字根。這些人自以為走在前面，其實是 ἐπὶ πλεῖον（epi pleion）……ἀσεβείας（asebeias）：越進步，越不敬虔。περιΐστασο（periistaso） 是中間語態，「你自己站到旁邊去」，繞開，不跟著走。</p><p>γάγγραινα（gangraina） 是醫學用語，壞疽，新約只此一次。νομὴν ἕξει（nomēn hexei） 字面是「將有牧場」，νομή（nomē） 原指羊群吃草，醫學上指潰爛向四周擴散，像羊群把草地一路啃過去。ἠστόχησαν（ēstochēsan） 是「沒射中目標」，提前 1:6、6:21 都用它，說的是同一群人。</p><p>他們的主張是 ἀνάστασιν ἤδη γεγονέναι（anastasin ēdē gegonenai）。完成式不定詞，意思是「復活已經發生、已成定局」。很可能是把復活完全靈意化：受洗、重生就是復活，再沒有將來身體的復活。這正與 2:11 的將來式 συζήσομεν（syzēsomen） 衝突：保羅說「必與他同活」，他們說「已經活過了」。ἀνατρέπουσιν（anatrepousin） 是現在式，傾覆正在發生。</p>","exp":"<p>〔提前〕提前 1:20（提摩太前書講義第 1 章）</p><p>許米乃這個名字，提摩太前書已經出現過：保羅說「其中有許米乃和亞歷山大；我已經把他們交給撒但」（提前 1:20）。本系列提摩太前書講義第 1 章講過那一次的管教。幾年過去，他還在，而且多了一個同伴。這是全卷地勢的一道谷：錯誤沒有自己消失，它在擴散。</p><p>壞疽可怕的地方，是一開始不痛。一小塊壞死的組織，若不處理，會一路吃掉好肉。錯誤的教導也是這樣：它常常不是從大聲否認信仰開始，而是從一句聽起來很屬靈的話開始。「復活的事已過」聽起來像是信心很大：我們已經在基督裡活過來了，還等甚麼？</p><p>可是把將來的盼望全部拉到現在，會敗壞人的信心。若復活已經過了，身體的病痛、牢裡的鎖鍊、老去與死亡，就沒有答案了；或者反過來，人會以為現在就該全然得勝、不該再有軟弱。今天「現在就要全然得勝」的教導，本講義在議題頁處理。保羅的盼望是「必與他同活」——將來式，所以今天可以忍耐。</p><p>保羅點名，是為了保護以弗所的群羊，對象是公開教導、正在擴散的錯誤。這不是給講台開先例，去影射、點名離開教會或曾經傷害教會的人。下一節就會說：誰是屬主的，主認識。</p>"},{"a":19,"z":19,"star":3,"grk":"<p lang=\"grc\">ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.</p>","lit":"<p>然而神那堅固的根基站立著，帶著這個印記：「主認識那些屬他的人」，又：「凡稱呼主名的，都要離開不義。」</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ</td><td>ho mentoi stereos themelios tou theou</td><td>然而神堅固的根基</td><td>μέντοι：強烈的轉折</td></tr><tr><td>ἕστηκεν</td><td>hestēken</td><td>站立著</td><td>完成式：立住了，至今仍立著</td></tr><tr><td>ἔχων τὴν σφραγῖδα ταύτην</td><td>echōn tēn sphragida tautēn</td><td>帶著這個印記</td><td>基石上刻的字：屬誰、誰立的</td></tr><tr><td>Ἔγνω κύριος τοὺς ὄντας αὐτοῦ</td><td>Egnō kyrios tous ontas autou</td><td>主認識屬他的人</td><td>引民 16:5（七十士譯本）</td></tr><tr><td>Ἀποστήτω ἀπὸ ἀδικίας</td><td>Apostētō apo adikias</td><td>要離開不義</td><td>第三人稱命令</td></tr><tr><td>πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου</td><td>pas ho onomazōn to onoma kyriou</td><td>凡稱呼主名的</td><td>接 2:22「呼求主的人」</td></tr></table>","gram":"<p><strong>μέντοι（mentoi） 把整段翻過來。</strong>前面是壞疽、射偏、傾覆；ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν（ho mentoi stereos themelios tou theou hestēken），然而神堅固的根基站著。ἕστηκεν（hestēken） 是完成式：立住了，現在仍然立著。有人的信心被 ἀνατρέπουσιν（anatrepousin） 傾覆了，神的根基沒有。</p><p>古代的基石常刻上字，說明這座建築屬誰、為何而立。保羅說這根基有 σφραγῖδα（sphragida），兩行字。第一行 Ἔγνω κύριος τοὺς ὄντας αὐτοῦ（Egnō kyrios tous ontas autou） 引自民 16:5，可拉黨事件。七十士譯本作 ἔγνω ὁ θεὸς（egnō ho theos），保羅寫作 κύριος（kyrios）；希伯來原文是耶和華的名。可拉一黨質疑摩西、亞倫，誰真屬神的問題鬧到全會眾面前，摩西把判斷交給神。</p><p>第二行 Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου（Apostētō apo adikias pas ho onomazōn to onoma kyriou） 不是逐字引自某一節，而是舊約多處字句的回聲：這使我們想起賽 26:13 提主的名、賽 52:11「你們離開吧」，也使我們想起同一章民 16:26 摩西叫會眾離開可拉的帳棚。兩行一前一後：第一行是神那一面（他認識），第二行是人這一面（要離開）。ἔγνω（egnō） 也是本卷「知道、認識」追蹤的一站：1:12 我知道我所信的是誰，2:19 主認識誰是他的人。</p>","exp":"<p>〔舊約〕民 16:5（民數記講義第 16 章）</p><p>「然而，神堅固的根基立住了；上面有這印記說：『主認識誰是他的人』」（2:19）。上一段是全章最低的谷，這一節馬上立起一塊基石。保羅沒有說「放心，錯誤會自己消失」；他說的是：不管別人怎樣，神的根基沒有動。</p><p>可拉的事件，本系列民數記講義第 16 章講過。當時的問題正是「誰才是真的」：可拉說全會眾個個都是聖潔的，摩西憑甚麼高過眾人？摩西沒有跟他辯論，他說：「到了早晨，耶和華必指示誰是屬他的」（民 16:5）。保羅用這句話回答以弗所的混亂：誰是真的，不是我們要一個一個鑑定的；主認識。</p><p>這是一個極大的安慰，也是一個極大的釋放。安慰在於：一個被人誤解、被同工離棄的人，主認識他；一個在錯誤教導中被傷過、還在掙扎的人，主也認識他。釋放在於：我們不必扛起「判斷誰得救」的重擔，那不是我們的工作。</p><p>第二行才是我們的工作：「凡稱呼主名的人總要離開不義。」（2:19）注意，命令的對象是「稱呼主名的」，也就是我自己。印記的一面是神的認識，另一面是我的離開；有確據的人，不是因此放心犯罪，而是因此有力量離開。</p><p>321 說「建立屬神的體系」。這一節告訴我們，體系的地基不是組織、不是名單、不是誰的口才，是神自己的認識與印記。上面蓋甚麼，各有各的樣式；地基只有一塊，而且它站著。</p><p>民數記還留下一個細節：可拉一黨被地吞滅之後，經上特別記了一句「然而可拉的眾子沒有死亡」（民 26:11）。這使我們想起，詩篇裡有好幾篇題為可拉後裔的詩。在一個背叛的家裡，主仍然認識屬他的人；人看見的是一整黨的混亂，主看見的是一個一個的名字。</p>"},{"a":20,"z":21,"star":2,"grk":"<p lang=\"grc\">Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·</p><p lang=\"grc\">ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.</p>","lit":"<p>但在大的家裡，不只有金的和銀的器皿，也有木的和陶土的；有些是為了尊貴，有些是為了卑賤。</p><p>所以人若潔淨自己脫離這些，他就將是一個為了尊貴的器皿，已被分別為聖，對主人有用，為各樣善工已被預備好。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐν μεγάλῃ δὲ οἰκίᾳ</td><td>En megalē de oikia</td><td>在大戶人家</td><td>接 2:19 的根基：建築→房子裡面</td></tr><tr><td>σκεύη χρυσᾶ καὶ ἀργυρᾶ</td><td>skeuē chrysa kai argyra</td><td>金器銀器</td><td>貴重的材料</td></tr><tr><td>ξύλινα καὶ ὀστράκινα</td><td>xylina kai ostrakina</td><td>木器瓦器</td><td>林後 4:7 的瓦器是 ὀστρακίνοις</td></tr><tr><td>ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν</td><td>ha men eis timēn ha de eis atimian</td><td>有作貴重的，有作卑賤的</td><td>用途，不是材料</td></tr><tr><td>ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων</td><td>ekkatharē heauton apo toutōn</td><td>潔淨自己脫離這些</td><td>ἑαυτὸν：又是先對自己</td></tr><tr><td>ἡγιασμένον</td><td>hēgiasmenon</td><td>已被分別為聖</td><td>完成式分詞</td></tr><tr><td>εὔχρηστον τῷ δεσπότῃ</td><td>euchrēston tō despotē</td><td>對主人有用</td><td>4:11 說馬可 εὔχρηστος</td></tr><tr><td>ἡτοιμασμένον</td><td>hētoimasmenon</td><td>已被預備好</td><td>接 3:17 預備行各樣的善事</td></tr></table>","gram":"<p><strong>ἀπὸ τούτων（apo toutōn） 是這一段的難處。</strong>「脫離這些」指甚麼？一說指 2:20 的卑賤的器皿，也就是那些人；一說指 2:16--18 的世俗虛談與錯誤教導，也就是那些事。和合本譯作「脫離卑賤的事」，已經選了後者。本講義同意和合本：上下文的焦點是錯誤的教導（2:16--18）與爭競（2:23），而緊接著 2:25 要提摩太「用溫柔勸戒那抵擋的人」，不是叫他與人斷絕。</p><p>ἐκκαθάρῃ ἑαυτὸν（ekkatharē heauton） 的受詞是 ἑαυτὸν（heauton）：潔淨的是自己。比喻在這裡悄悄轉了一個彎：2:20 讀起來像是材料決定貴賤，2:21 卻說人若自潔，就作貴重的器皿——決定貴重的，不是金子還是木頭，是有沒有被潔淨。後面三個修飾語：ἡγιασμένον（hēgiasmenon）、εὔχρηστον（euchrēston）、ἡτοιμασμένον（hētoimasmenon），兩個完成式分詞夾著一個形容詞，描寫一個準備好被使用的器皿。</p>","exp":"<p>大戶人家裡甚麼器皿都有，這是保羅對教會的現實描寫，不是失敗的記號。一個教會裡有錯誤、有軟弱、有讓人失望的人，提摩太不必驚訝；本系列提摩太前書講義第 3 章講過，教會是「神的家」，家裡本來就有各樣的器皿。</p><p>「人若自潔，脫離卑賤的事，就必作貴重的器皿，成為聖潔，合乎主用，預備行各樣的善事。」（2:21）要脫離的是「事」，不是隔離「人」。這一節常被拿來支持一種越來越窄的分離：誰有一點錯，就與他斷絕。可是保羅接下來說的是溫柔、忍耐、勸戒。分離與合一的界線，議題頁另有處理；這一節本身的方向，是先把自己洗乾淨。</p><p>最動人的是「合乎主用」這個字。εὔχρηστον（euchrēston） 在 4:11 用在馬可身上：「因為他在傳道的事上於我有益處。」（4:11）馬可曾經半途離開，保羅曾經拒絕再帶他（徒 15:38）。一個被認為「沒有用」的人，後來成了臨死的保羅最想見、最「有用」的人。保羅也用同一個字說阿尼西謀：「他從前與你沒有益處，但如今與你我都有益處」（門 11）。</p><p>所以貴重不是天生的材料。木器瓦器被潔淨，就是貴重的器皿；保羅在別處說「我們有這寶貝放在瓦器裡」（林後 4:7）。神不是只用金器的主人。</p>"},{"a":22,"z":23,"star":1,"grk":"<p lang=\"grc\">τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.</p><p lang=\"grc\">τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·</p>","lit":"<p>但少年人的私慾你要逃避，要追求公義、信、愛、和平，與那些從清潔的心呼求主的人一起。</p><p>但那些愚拙而未受教的辯論，你要推辭，因為知道它們生出爭戰；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε</td><td>tas de neōterikas epithymias pheuge</td><td>少年的私慾要逃避</td><td>現在式命令：一直逃</td></tr><tr><td>δίωκε</td><td>diōke</td><td>要追求</td><td>與 3:12 διωχθήσονται（受逼迫）同一個動詞</td></tr><tr><td>μετὰ τῶν ἐπικαλουμένων τὸν κύριον</td><td>meta tōn epikaloumenōn ton kyrion</td><td>同那些呼求主的人</td><td>複數：不是一個人追</td></tr><tr><td>ἐκ καθαρᾶς καρδίας</td><td>ek katharas kardias</td><td>從清潔的心</td><td>接 2:21 的自潔</td></tr><tr><td>μωρὰς καὶ ἀπαιδεύτους ζητήσεις</td><td>mōras kai apaideutous zētēseis</td><td>愚拙、未受教的辯論</td><td>ἀπαιδεύτους 與 2:25 παιδεύοντα 同字根</td></tr><tr><td>παραιτοῦ</td><td>paraitou</td><td>要推辭</td><td>現在式中間語態命令</td></tr><tr><td>γεννῶσι μάχας</td><td>gennōsi machas</td><td>生出爭戰</td><td>μάχας 接 2:24 μάχεσθαι</td></tr></table>","gram":"<p><strong>φεῦγε（pheuge） 與 δίωκε（diōke） 是一對。</strong>兩個都是現在式命令：一直逃，一直追。δίωκε（diōke） 是本卷「受苦、逼迫」追蹤裡的一個字：同一個動詞在 3:12 的 διωχθήσονται（diōchthēsontai） 譯作「受逼迫」。追求公義的人，常常也是被追趕的人。</p><p>νεωτερικὰς ἐπιθυμίας（neōterikas epithymias） 不只指情慾。放在上下文裡，還包括少年人常有的急躁、好辯、愛新奇、急著證明自己；2:23 緊接著說辯論，可見保羅想到的包括這一類。ἀπαιδεύτους（apaideutous） 是「沒受過管教的」，與 2:25 表示管教、訓練的 παιδεύοντα（paideuonta） 同字根：沒受教的辯論，要用受過教的溫柔來對付。μάχας（machas） 則與下一節的 μάχεσθαι（machesthai） 接在一起。</p>","exp":"<p>「你要逃避少年的私慾，同那清心禱告主的人追求公義、信德、仁愛、和平。」（2:22）保羅不只說「不要」，他給了一個方向：逃離甚麼，就奔向甚麼。一個只會逃的人，最後會不知道往哪裡去；一個有所追求的人，比較不容易被拉回去。</p><p>「同那清心禱告主的人」是這一節的溫度。追求不是一個人的事。提摩太在以弗所很孤單，保羅卻提醒他：你不是唯一一個呼求主名的人。321 的 920 與 235 裡「屬靈同伴」那一層，在這裡可以認出來：找到幾個一起禱告的人，比一個人硬撐走得遠。</p><p>「惟有那愚拙無學問的辯論，總要棄絕，因為知道這等事是起爭競的。」（2:23）辯論本身不是罪，但有一種辯論只會生出爭戰。分辨的方法很簡單：這場討論結束後，人更明白真道，還是只是更想贏？前者值得花時間，後者要推辭。推辭不是軟弱，是知道自己的時間屬於誰。</p>"},{"a":24,"z":26,"star":2,"grk":"<p lang=\"grc\">δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,</p><p lang=\"grc\">ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,</p><p lang=\"grc\">καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπʼ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.</p>","lit":"<p>而主的奴僕不應當爭戰，卻要對眾人溫和，善於教導，能忍受惡待，</p><p>用溫柔管教那些對抗的人，或許神會賜他們悔改，以致認識真理，</p><p>並且他們可以從魔鬼的網羅中清醒過來——他們是已被他活捉、去行那一位旨意的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι</td><td>doulon de kyriou ou dei machesthai</td><td>主的僕人不應當爭戰</td><td>δεῖ：必須如此的事</td></tr><tr><td>ἤπιον εἶναι πρὸς πάντας</td><td>ēpion einai pros pantas</td><td>對眾人溫和</td><td>πάντας：包括抵擋的人</td></tr><tr><td>διδακτικόν</td><td>didaktikon</td><td>善於教導</td><td>提前 3:2 同字</td></tr><tr><td>ἀνεξίκακον</td><td>anexikakon</td><td>能忍受惡待</td><td>新約只此一次</td></tr><tr><td>ἐν πραΰτητι παιδεύοντα</td><td>en praytēti paideuonta</td><td>用溫柔管教</td><td>παιδεύω：像教養孩子</td></tr><tr><td>τοὺς ἀντιδιατιθεμένους</td><td>tous antidiatithemenous</td><td>那些對抗的人</td><td>現在分詞：正在對抗</td></tr><tr><td>μήποτε δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν</td><td>mēpote dōē autois ho theos metanoian</td><td>或許神賜他們悔改</td><td>悔改是神的禮物</td></tr><tr><td>ἀνανήψωσιν</td><td>ananēpsōsin</td><td>醒悟過來</td><td>從醉中清醒</td></tr><tr><td>ἐζωγρημένοι</td><td>ezōgrēmenoi</td><td>已被活捉</td><td>路 5:10「得人」是 ζωγρῶν</td></tr></table>","gram":"<p><strong>οὐ δεῖ μάχεσθαι（ou dei machesthai） 接回 2:23 的 μάχας（machas）。</strong>辯論生出爭戰，而主的僕人「不應當」爭戰。δεῖ（dei） 是「必須如此」的字，這不是建議，是僕人的本分。2:3 的精兵 στρατιώτης（stratiōtēs） 在這裡換了名字：δοῦλον κυρίου（doulon kyriou），主的奴僕。舊約稱摩西為神的僕人；保羅把這個稱呼放在一個不爭競的人身上。</p><p>四樣品格排成一串：ἤπιον（ēpion）、διδακτικόν（didaktikon）、ἀνεξίκακον（anexikakon）、ἐν πραΰτητι παιδεύοντα（en prautēti paideuonta）。ἀνεξίκακον（anexikakon） 新約只此一次，是被惡待時不記恨。παιδεύοντα（paideuonta） 是教養孩子的字：糾正，但目的是成長，不是懲罰。μήποτε（mēpote） 帶假設語氣，「或許」：悔改不在提摩太手裡，是 δώῃ（dōē）……ὁ θεὸς（ho theos），神所賜的。</p><p>2:26 的 ἐζωγρημένοι ὑπʼ αὐτοῦ εἰς τὸ ἐκείνου θέλημα（ezōgrēmenoi hyp' autou eis to ekeinou thelēma） 有兩種讀法。αὐτοῦ（autou） 與 ἐκείνου（ekeinou） 若都指魔鬼，就是「被魔鬼活捉去行他的旨意」（和合本的方向）；若 ἐκείνου（ekeinou） 指神，就是「醒悟過來，去行神的旨意」。本講義從和合本，但兩讀的結局都一樣：人是被擄的，可以被救回來。ζωγρέω（zōgreō） 這個字，主在路 5:10 對彼得說「得人」，用的就是它：魔鬼活捉人，主也「活捉」人——為了救。</p>","exp":"<p>「然而主的僕人不可爭競，只要溫溫和和地待眾人，善於教導，存心忍耐」（2:24）。這是第 2 章的收尾，也是「兵」這個字的解答：基督的精兵打的仗，不是跟人打的。讀到這裡才明白，2:3 的兵與 2:24 的僕人是同一個人。</p><p>關鍵在 2:26：抵擋的人是「被魔鬼任意擄去的」。他們不是敵人，是人質。救人質的人不會對人質開槍。這一句改變了提摩太看那些抵擋他的人的眼光：他們需要的不是被擊倒，是被救出網羅。所以用溫柔——溫柔是讓對方有路回來。一個被罵倒的人很少悔改，一個被溫柔對待的人，比較有機會醒過來。</p><p>「或者神給他們悔改的心」（2:25）——這個「或者」叫事奉的人謙卑。我負責溫柔、忍耐、教導，悔改卻是神的禮物。這把兩種重擔一起卸下來：不必因為對方沒改變就覺得自己失敗，也不必用壓力去逼出一個悔改。這是 321「謙卑・回到本位」：回到僕人的位置，把結果交給主。第 4 章馬可的回轉會告訴我們，謙卑會帶動謙卑。</p><p>溫和也有一條界線：溫和不等於任人欺壓。一個在關係裡被傷害、被威脅的人，經文沒有要他為了「存心忍耐」留在不安全的處境；人身安全受威脅時，先保護生命、依法求助。保羅這幾節說的，是教會面對錯誤教導的態度，不是叫受害者沉默。</p>"}],"3":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·</p>","lit":"<p>但這事你要知道：在末後的日子裡，艱難的時候將要來到。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τοῦτο δὲ γίνωσκε</td><td>Touto de ginōske</td><td>但這事你要知道</td><td>現在式命令：要一直知道著</td></tr><tr><td>ἐν ἐσχάταις ἡμέραις</td><td>en eschatais hēmerais</td><td>在末後的日子</td><td>從基督第一次顯現就開始的時代</td></tr><tr><td>ἐνστήσονται</td><td>enstēsontai</td><td>將要臨到</td><td>將來式；3:5 的命令卻是現在式</td></tr><tr><td>καιροὶ χαλεποί</td><td>kairoi chalepoi</td><td>艱難的時候</td><td>難對付的、凶猛的時候</td></tr></table>","gram":"<p><strong>3:1 的「末世」不是日曆上的某一年。</strong>ἐν ἐσχάταις ἡμέραις（en eschatais hēmerais） 是舊約先知的用語，指神要成就應許的那段時候。新約把它接在基督身上：彼得在五旬節引約珥書，說「在末後的日子」（徒 2:17），意思是就在眼前；希伯來書說神「就在這末世藉著他兒子曉諭我們」（來 1:2）；約翰說「如今是末時了」（約壹 2:18）。末世從基督第一次顯現（1:10）就開始了，一直延伸到他再來。</p><p>ἐνστήσονται（enstēsontai） 是將來式，好像在說遙遠的事；但到了 3:5，保羅用現在式命令 ἀποτρέπου（apotrepou） 叫提摩太躲開這等人，3:6 又用現在式 εἰσιν（eisin） 說「正是這等人」。將來式的預言，在提摩太的時代已經在發生。這種「已經」與「還沒有」的張力，就是新約的末世觀。</p><p>καιροὶ χαλεποί（kairoi chalepoi）：καιρός（kairos） 是「時機、時候」，不是一天一天的 ἡμέρα（hēmera）；χαλεπός（chalepos） 是「難對付的、凶猛的」，馬太用它形容加大拉兩個被鬼附的人「極其凶猛」（太 8:28）。危險不在日曆，在人：3:2 的 γὰρ（gar） 立刻解釋，因為人要如何如何。Τοῦτο δὲ γίνωσκε（Touto de ginōske） 是現在式命令，不是知道一次，是一直知道著。</p>","exp":"<p>「你該知道，末世必有危險的日子來到。」（3:1）第 2 章剛說完「神堅固的根基立住了」（2:19），又說「主的僕人不可爭競」（2:24），第 3 章一開口就把鏡頭拉遠：提摩太要面對的不只是兩三個講錯道理的人，是一整個艱難的時代。本章的字是「經」，亂世中的準則；這一節先讓他看清楚甚麼是亂世。</p><p>「末世」這兩個字，常被拿來算日子。有人把某一年寫上講台，有人把新聞頭條排成時間表。保羅不是這樣用的。他沒有給提摩太一個年份，他給他一個命令：要知道。這是叫人警醒，不是叫人恐慌。從五旬節那天起，教會就活在末後的日子裡；第一世紀的以弗所、中世紀的修道院、今天手機上的團契，每一代都站在同一個時代裡。所以本講義不說這就是今天，只說：這是每一代都要警醒的日子。</p><p>保羅也沒有說危險來自政局、瘟疫或天象。3:2 用「因為」解釋，答案是人。危險的不是時候本身，是人心在那個時候顯出的樣子。這像氣象報告：說颱風要來，不是叫人整天盯著雲看，是叫人把門窗釘牢。</p><p>對一個坐在以弗所、屬靈父親在羅馬等死的年輕人來說，這一節不是要嚇他。父親在交棒之前先告訴他：路上不會平順，你不必驚訝。被提醒過的人，遇到風浪時不會以為自己走錯了路。末世論在這裡的功用是預備，不是恐嚇。</p>"},{"a":2,"z":4,"star":3,"grk":"<p lang=\"grc\">ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,</p><p lang=\"grc\">ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,</p><p lang=\"grc\">προδόται, προπετεῖς, τετυφωμένοι, φιλήδονοι μᾶλλον ἢ φιλόθεοι,</p>","lit":"<p>因為人們將要是愛自己的、愛錢的、自誇的、高傲的、褻瀆的、不順從父母的、不感恩的、不聖潔的、</p><p>沒有親情的、不肯和解的、毀謗人的、不能自制的、凶暴的、不愛良善的、</p><p>出賣人的、魯莽的、被煙薰昏而自高的、愛享樂勝過愛神的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>φίλαυτοι</td><td>philautoi</td><td>愛自己的</td><td>清單第一項；新約只此一次</td></tr><tr><td>φιλάργυροι</td><td>philargyroi</td><td>愛錢的</td><td>清單第二項，仍是「愛」</td></tr><tr><td>ἄστοργοι</td><td>astorgoi</td><td>沒有親情的</td><td>家人之間天然的情感也沒有了</td></tr><tr><td>διάβολοι</td><td>diaboloi</td><td>毀謗人的</td><td>與「魔鬼」同一個字</td></tr><tr><td>τετυφωμένοι</td><td>tetyphōmenoi</td><td>被煙薰昏了頭的</td><td>完成式被動分詞：自高自大</td></tr><tr><td>φιλήδονοι μᾶλλον ἢ φιλόθεοι</td><td>philēdonoi mallon ē philotheoi</td><td>愛享樂勝過愛神</td><td>清單最後一項：愛錯了對象</td></tr></table>","gram":"<p><strong>3:2--4 是十八項的清單，用「愛」開頭，也用「愛」收尾。</strong>第一項 φίλαυτοι（philautoi）「愛自己」，第二項 φιλάργυροι（philargyroi）「愛錢」；最後一項 φιλήδονοι μᾶλλον ἢ φιλόθεοι（philēdonoi mallon ē philotheoi），和合本作「愛宴樂，不愛神」，原文是比較句「愛享樂勝過愛神」。中間還有 ἀφιλάγαθοι（aphilagathoi）「不愛良善」。同一個字根前後出現五次。清單的病根不是人不會愛，是愛的方向倒過來了：先愛自己，就會愛錢、愛享樂，最後愛甚麼都勝過愛神。</p><p>φίλαυτοι（philautoi） 在新約只出現這一次，和合本譯作「專顧自己」。後面的項目大都可以從它推出來：ἀλαζόνες（alazones）、ὑπερήφανοι（hyperēphanoi） 是對人誇口、對人高傲；γονεῦσιν ἀπειθεῖς（goneusin apeitheis）、ἀχάριστοι（acharistoi） 是對父母、對恩人的態度；ἄστοργοι（astorgoi） 連家人之間的天然情感都沒有了。</p><p>清單的音韻也很講究。ἀχάριστοι（acharistoi）、ἀνόσιοι（anosioi）、ἄστοργοι（astorgoi）、ἄσπονδοι（aspondoi）、ἀκρατεῖς（akrateis）、ἀνήμεροι（anēmeroi）、ἀφιλάγαθοι（aphilagathoi） 一連串以否定字首開頭：沒有感恩、沒有聖潔、沒有親情、不肯和解、沒有節制、沒有馴服、沒有對善的愛。人一旦以自己為中心，剩下的就是一連串的「沒有」。διάβολοι（diaboloi） 原是「魔鬼」的字，在這裡指毀謗人的人；τετυφωμένοι（tetyphōmenoi） 是完成式被動分詞，字根是「煙」，被自己的煙薰昏了頭，提前 3:6 用同一個動詞警告初入教的人不可自高自大。</p><p>ἔσονται γὰρ οἱ ἄνθρωποι（esontai gar hoi anthrōpoi） 有冠詞，不是指某一群特別壞的人，是「人」的一般寫照。這張清單與羅 1:29--31 外邦人的罪相似，可是 3:5 立刻說這些人有敬虔的外貌：保羅描寫的不是教會外面的人，是教會裡面的人。</p>","exp":"<p>「因為那時，人要專顧自己，貪愛錢財，自誇，狂傲，謗讟，違背父母，忘恩負義，心不聖潔」（3:2）。這張清單讀起來像新聞，很容易往外貼：貼在某一個世代、某一群人、某一個宗派或政治陣營身上。保羅不是這樣用的。他列出這張單子，不是要提摩太去找誰對號入座，是要他認出一個病根。</p><p>病根在第一項。φίλαυτοι（philautoi） 原文是「愛自己」，和合本譯得很準：專顧自己。這不是說人不可以照顧自己，保羅自己也要外衣、要書、要同伴（4:9--13）。問題是中心換了，一切都繞著「我」轉。這是全新約對「有己」最直接的描述。一個人以自己為中心，就會愛錢，因為錢保護那個自己；會自誇、狂傲，因為那個自己需要被看見；會忘恩負義，因為別人給的都成了理所當然；會賣主賣友，因為朋友只在對自己有利的時候才算朋友。</p><p>最後一項把整張清單收住：「愛宴樂，不愛神」（3:4）。原文是比較句，愛享樂勝過愛神。這些人不一定完全不愛神，只是有一樣東西排在神前面。這像一個羅盤：指針沒有壞，只是旁邊放了一塊磁鐵。整張清單是同一塊磁鐵造成的偏差。</p><p>所以讀這張單子，最安全的讀法是先對準自己。主說：「為甚麼看見你弟兄眼中有刺，卻不想自己眼中有樑木呢？」（太 7:3）站在講台上的人，最容易用這張清單量會眾；坐在座位上的人，最容易用它量講台。保羅的次序正好相反：清單從「自己」開始。</p><p>321 說，問題的根源是有己與驕傲。這張清單讓我們在經文裡認出它的長相：不是一個大罪，是一個方向。出路也不是更用力地不愛自己，是讓更大的愛把心轉回來。到了 3:17，「屬神的人」正是這張清單的反面：那個人的中心不再是自己，是神。</p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.</p>","lit":"<p>有著敬虔的外形，卻已經否認了它的能力；這些人你也要轉身避開。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἔχοντες μόρφωσιν εὐσεβείας</td><td>echontes morphōsin eusebeias</td><td>有著敬虔的外形</td><td>外形、樣式：有模子，不一定有內容</td></tr><tr><td>τὴν δὲ δύναμιν αὐτῆς</td><td>tēn de dynamin autēs</td><td>它的能力</td><td>和合本「實意」；與 1:7「剛強」同字</td></tr><tr><td>ἠρνημένοι</td><td>ērnēmenoi</td><td>已經否認了</td><td>完成式分詞；與 2:12「不認」同一動詞</td></tr><tr><td>καὶ τούτους ἀποτρέπου</td><td>kai toutous apotrepou</td><td>這些人你要轉身避開</td><td>現在式命令；新約只此一次</td></tr></table>","gram":"<p><strong>3:5 是一個對照：μόρφωσιν（morphōsin） 對 δύναμιν（dynamin）。</strong>μόρφωσις（morphōsis） 是「外形、樣式」，保羅在羅 2:20 用它說猶太人在律法上有知識和真理的「模範」：有模子，不一定有內容。δύναμιν（dynamin） 是「能力」，和合本譯作「實意」，把意思帶出來了：敬虔的實質，就是敬虔的能力。這是本卷「能力」追蹤的一站：1:7 神賜的是 δυνάμεως（dynameōs） 的心，3:5 有人卻否認了這能力。</p><p>ἠρνημένοι（ērnēmenoi） 是 ἀρνέομαι（arneomai） 的完成式分詞，與 2:12 的 ἀρνησόμεθα（arnēsometha）「不認」同一個動詞。完成式表示一種已經定型的狀態：不是一時的軟弱，是長期否認敬虔的能力，卻保留著敬虔的樣子。</p><p>καὶ τούτους ἀποτρέπου（kai toutous apotrepou） 是現在式關身語態命令，「你要一直轉身避開」。現在式說明這些人不是遙遠將來的人，提摩太現在就要面對；這也再一次說明 3:1 的末世已經開始了。</p>","exp":"<p>「有敬虔的外貌，卻背了敬虔的實意；這等人你要躲開。」（3:5）這一節是全卷地勢圖的最低點。最低的不是外面的逼迫，是裡面的空殼。十八項的清單讀到這裡，才知道這些人在哪裡：在教會裡，有禱告、有聚會、會講屬靈的話。</p><p>外貌與實意的分別，像一棵塑膠樹。葉子綠、枝幹挺，擺在大廳裡比真樹還整齊；只是它不會長，也不會結果子。敬虔的外貌可以學，可以整理得很漂亮；敬虔的能力卻學不來，是從神來的。主耶穌責備法利賽人「洗淨杯盤的外面，裡面卻盛滿了勒索和放蕩」（太 23:25），是同一種病。</p><p>「背了」就是否認。這些人不是沒聽過神的能力，是不要它，因為能力會改變人，外貌不會。一個人可以保留所有屬靈的習慣，卻拒絕讓神碰他的錢、他的脾氣、他的驕傲。這正是 3:2 的第一項：專顧自己。</p><p>「這等人你要躲開」常被誤用成論斷人的許可證。保羅給的是分辨的方向，不是一張黑名單。分辨看的是長期的方向，不是一次的跌倒；躲開是不跟從、不被牽著走，不是公開羞辱。更要緊的是，這一節第一個要照的是讀的人自己。問「我是不是有外貌、沒有能力」，比問「誰是那種人」安全得多，也有用得多。</p><p>321 說聖靈是我的引導。外貌靠自己撐得出來，實意只能靠住在裡面的聖靈（1:14）。塑膠樹不必澆水，真樹卻每天都要水；敬虔的能力不是一次領受就存起來的，是天天從主那裡接上的。</p>"},{"a":6,"z":7,"star":2,"grk":"<p lang=\"grc\">ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,</p><p lang=\"grc\">πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.</p>","lit":"<p>因為從這些人中，有那些鑽進各家、擄掠小婦人的；她們被罪堆滿，被各樣的私慾牽著走，</p><p>常常在學，卻永遠不能來到真理的認識。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἱ ἐνδύνοντες εἰς τὰς οἰκίας</td><td>hoi endynontes eis tas oikias</td><td>鑽進各家的</td><td>現在分詞：悄悄滲入</td></tr><tr><td>αἰχμαλωτίζοντες</td><td>aichmalōtizontes</td><td>擄掠</td><td>擄戰俘的字</td></tr><tr><td>γυναικάρια</td><td>gynaikaria</td><td>小婦人</td><td>指小詞：描寫被利用的處境</td></tr><tr><td>σεσωρευμένα ἁμαρτίαις</td><td>sesōreumena hamartiais</td><td>被罪堆滿</td><td>完成式被動分詞</td></tr><tr><td>ἀγόμενα ἐπιθυμίαις ποικίλαις</td><td>agomena epithymiais poikilais</td><td>被各樣的私慾牽著走</td><td>現在式被動分詞</td></tr><tr><td>πάντοτε μανθάνοντα</td><td>pantote manthanonta</td><td>常常在學</td><td>學習本身沒有錯</td></tr><tr><td>εἰς ἐπίγνωσιν ἀληθείας</td><td>eis epignōsin alētheias</td><td>到真理的認識</td><td>2:25 同一片語</td></tr></table>","gram":"<p><strong>3:6 的主角是那些「偷進人家」的人。</strong>ἐκ τούτων γάρ εἰσιν（ek toutōn gar eisin） 把 3:6--7 接到 3:5：做這件事的，正是這等人。兩個現在分詞描寫他們的手法：ἐνδύνοντες（endynontes） 是悄悄鑽進去，αἰχμαλωτίζοντες（aichmalōtizontes） 是擄成俘虜。當時的教會在家裡聚會，假師傅不必上台，只要進得了門。</p><p>γυναικάρια（gynaikaria） 是 γυνή（gynē） 的指小詞，帶輕看的口氣，和合本譯作「無知婦女」。這口氣不是對著所有女人，是描寫被利用的那一小群人的處境：σεσωρευμένα ἁμαρτίαις（sesōreumena hamartiais） 是完成式被動分詞，被罪「堆滿」了；ἀγόμενα ἐπιθυμίαις ποικίλαις（agomena epithymiais poikilais） 是現在式被動分詞，被各樣的私慾「牽著走」。兩個都是被動語態：罪疚壓在身上，私慾拉著往前走。</p><p>3:7 是最痛的一句：πάντοτε μανθάνοντα（pantote manthanonta） 對 μηδέποτε（mēdepote）……ἐλθεῖν δυνάμενα（elthein dynamena），「常常」對「從不」，「學習」對「到達」。δυνάμενα（dynamena） 又是「能力」的字：不是不學，是學了也到不了。εἰς ἐπίγνωσιν ἀληθείας（eis epignōsin alētheias） 與 2:25 一模一樣：主的僕人用溫柔勸戒，盼望對方可以明白真道；這裡的人卻一直學、一直到不了。</p>","exp":"<p>〔提前〕提前 2:11（提摩太前書講義第 2 章）</p><p>「那偷進人家、牢籠無知婦女的，正是這等人。」（3:6）這一節常被讀成貶低女性的經文。經文不是這樣說的。保羅指出的問題有兩個：「被各樣的私慾引誘」（3:6），「常常學習，終久不能明白真道」（3:7）。這兩樣，男女都可能有。下一節敵擋摩西的雅尼和佯庇是男人；3:8「他們的心地壞了」說的是那些假師傅；3:13「他欺哄人，也被人欺哄」更不分男女。</p><p>保羅為甚麼特別提到婦女？第一世紀以弗所的女性多半沒有受教育的機會，白天留在家裡，假師傅正好挑這個時候上門。提摩太前書講義第 2 章講過，保羅給的對策不是叫她們閉嘴，是「女人要沉靜學道」（提前 2:11），在那個時代是很前進的一句話：讓她們好好學。問題從來不在性別，在私慾，也在有沒有被真道餵養。</p><p>3:7 是給每一個常上課、常聽道的人的一面鏡子。有人從一個講座跑到另一個講座，筆記一本換一本，心裡的罪疚卻一直壓著，私慾一直牽著走。學習沒有錯，錯在學習變成了逃避：只要一直在學，就可以不必悔改。這像一個人每天看食譜，卻從來不進廚房，越看越餓。</p><p>保羅的語氣也值得注意：這些婦女是被擄的，是被罪壓著的。他責備的是鑽進門的人，對被擄的人卻帶著憐憫。今天的教會若遇到被錯謬教訓牽著走的人，先看見的應該是一個被擄的人，不是一個笨的人。認識真理不在於上了多少課，在於有沒有讓真理碰到心裡的那一堆罪；碰到了，才算到達。</p>"},{"a":8,"z":9,"star":2,"grk":"<p lang=\"grc\">ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.</p><p lang=\"grc\">ἀλλʼ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.</p>","lit":"<p>雅尼和佯庇怎樣抵擋摩西，這些人也照樣抵擋真理：心思已被敗壞的人，在信仰上是驗不過的。</p><p>但他們不會再往前進了，因為他們的愚昧必向眾人顯明，正如那兩人的也曾顯明一樣。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἰάννης καὶ Ἰαμβρῆς</td><td>Iannēs kai Iambrēs</td><td>雅尼和佯庇</td><td>出 7:11 沒有名字，名字出自猶太傳統</td></tr><tr><td>ἀντέστησαν</td><td>antestēsan</td><td>抵擋了</td><td>不定過去式：當年</td></tr><tr><td>ἀνθίστανται</td><td>anthistantai</td><td>正在抵擋</td><td>同一個動詞，現在式：今天</td></tr><tr><td>κατεφθαρμένοι τὸν νοῦν</td><td>katephtharmenoi ton noun</td><td>心思已被敗壞</td><td>完成式被動分詞</td></tr><tr><td>ἀδόκιμοι</td><td>adokimoi</td><td>驗不過的</td><td>2:15 δόκιμον「無愧」的反面</td></tr><tr><td>οὐ προκόψουσιν ἐπὶ πλεῖον</td><td>ou prokopsousin epi pleion</td><td>不能再往前</td><td>與 2:16、3:13 的「進展」對照</td></tr><tr><td>ἄνοια</td><td>anoia</td><td>愚昧、失了心思</td><td>與 νοῦν 同字根</td></tr></table>","gram":"<p><strong>3:8 用了兩個舊約沒有記下的名字。</strong>出 7:11、22 只說法老召來的術士用邪術照樣而行，沒有提名字。Ἰάννης καὶ Ἰαμβρῆς（Iannēs kai Iambrēs），和合本作「雅尼和佯庇」，名字出自猶太傳統：亞蘭文的意譯本（他爾根）、死海古卷的文獻、後來的拉比著作，連希臘、羅馬作家都知道這兩個名字，早期教父還提到一本講他們的書。保羅用的是當時人人知道的名字，像我們說「法老的術士」一樣，指的就是那一群人。</p><p>用一個傳統裡的名字，不等於替整套傳統背書。猶大書引以諾的話也是這樣（猶 14）：使徒借用讀者熟悉的材料，說的是聖經自己記下的事實——有人在摩西面前敵擋神的作為，最後失敗了。本講義把這兩個名字當作傳統的稱呼，不從它們推演任何教義。</p><p>ὃν τρόπον（hon tropon）……οὕτως（houtōs） 是「怎樣……也怎樣」的對照：ἀντέστησαν（antestēsan） 是不定過去式，ἀνθίστανται（anthistantai） 是同一個動詞的現在式，從前與現在一模一樣。κατεφθαρμένοι τὸν νοῦν（katephtharmenoi ton noun） 是完成式被動分詞，心思被敗壞而且定了型。3:9 的 ἄνοια（anoia） 與 νοῦν（noun） 同字根：心思壞了的人，最後顯出來的是沒有心思。</p><p>προκόψουσιν（prokopsousin） 在本卷出現三次，形成一個反諷。2:16 說這等人必進到更不敬虔的地步，3:13 說他們要越久越惡，3:9 卻說 οὐ προκόψουσιν ἐπὶ πλεῖον（ou prokopsousin epi pleion），不能再往前了。他們只在變壞這件事上有進展；在敵擋真理這件事上，神會劃一條線。</p>","exp":"<p>〔舊約〕出 7:11（出埃及記講義第 7 章）</p><p>「從前雅尼和佯庇怎樣敵擋摩西，這等人也怎樣敵擋真道。」（3:8）出埃及記講義第 7 章講過那個場面：亞倫的杖變作蛇，法老召來的術士也丟下杖，杖也變作蛇，「但亞倫的杖吞了他們的杖」（出 7:12）。他們能模仿頭幾樣神蹟，到了虱子那一災就做不出來了，只好對法老說：「這是神的手段。」（出 8:19）</p><p>保羅選這個例子很準。術士不是不承認超自然，他們很會做屬靈的樣子；他們的手法是用模仿來敵擋。3:5 的「有敬虔的外貌」，在這裡有了舊約的臉孔：外貌可以仿得很像，實意卻仿不來。最有力的敵擋，常常不是公開反對真理，是做一個很像真理的東西。</p><p>3:9 是給提摩太的安慰：「然而他們不能再這樣敵擋」（3:9）。術士最後連自己都承認做不到；假教訓也有它的盡頭，「他們的愚昧必在眾人面前顯露出來」（3:9）。提摩太不必靠自己的力量把每一個錯謬的人打倒，他只要站在真道上，時間會替真理說話。</p><p>這一段不是叫我們把雅尼、佯庇的名字貼到今天的某一個人身上。它讓我們看見一條歷史的規律：神的工作會被模仿，模仿的終究被吞掉。這使我們放心：亂世裡的準則不必靠我們去保護，它比所有模仿它的東西活得長。</p>"},{"a":10,"z":11,"star":2,"grk":"<p lang=\"grc\">Σὺ δὲ παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,</p><p lang=\"grc\">τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.</p>","lit":"<p>但你已經緊緊跟隨了我的教訓、生活方式、志向、信心、恆忍、愛心、忍耐、</p><p>逼迫、苦難——就是在安提阿、在以哥念、在路司得臨到我的那些；我忍受了何等的逼迫，而主從這一切中救了我出來。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Σὺ δὲ</td><td>Sy de</td><td>但你</td><td>本章的轉折：3:10、3:14</td></tr><tr><td>παρηκολούθησάς μου</td><td>parēkolouthēsas mou</td><td>你緊緊跟隨了我的</td><td>貼身跟著走、全盤領受</td></tr><tr><td>τῇ ἀγωγῇ</td><td>tē agōgē</td><td>品行、生活方式</td><td>新約只此一次</td></tr><tr><td>τῇ προθέσει</td><td>tē prothesei</td><td>志向</td><td>1:9 神的「旨意」同字</td></tr><tr><td>τοῖς διωγμοῖς τοῖς παθήμασιν</td><td>tois diōgmois tois pathēmasin</td><td>逼迫、苦難</td><td>清單收在苦難上</td></tr><tr><td>ἐκ πάντων με ἐρρύσατο ὁ κύριος</td><td>ek pantōn me errysato ho kyrios</td><td>主從一切中救了我出來</td><td>4:17--18 同一動詞再出現兩次</td></tr></table>","gram":"<p><strong>Σὺ δὲ（Sy de） 是本章的轉折。</strong>3:1--9 說的都是「他們」，3:10 一開口就是「但你」；3:14 又是一次 σὺ δὲ（sy de），4:5 再一次。保羅把提摩太從那群人中間拉出來：他們是那樣，你卻不是。</p><p>παρηκολούθησάς（parēkolouthēsas） 原意是「緊跟在旁邊走」，引申為仔細觀察、全盤領受。和合本譯作「服從」，重點在跟從。路加說自己把主的事從起頭都詳細考察了（路 1:3），用的是同一個字根：不是遠遠聽說，是貼身看過。後面接九個名詞，都帶冠詞，都掛在 μου（mou） 底下：教訓、品行、志向、信心、寬容、愛心、忍耐、逼迫、苦難。與 3:2--4 的十八項對照，這是另一張清單：一個人的生命，被另一個人近距離看見。</p><p>清單的次序值得注意：從教訓開始，經過品格，收在 τοῖς διωγμοῖς τοῖς παθήμασιν（tois diōgmois tois pathēmasin）。οἷά（hoia） 與 οἵους（hoious） 兩個關係詞重複「何等的」，語氣越說越重；最後卻用 καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος（kai ek pantōn me errysato ho kyrios） 翻轉。ἐρρύσατο（errysato） 是 ῥύομαι（rhyomai） 的不定過去式，「救出來」；ἐκ（ek） 是「從裡面出來」，不是免於進去。同一個動詞在 4:17--18 還要出現兩次：ἐρρύσθην（errysthēn）、ῥύσεταί（rhysetai）。</p>","exp":"<p>〔背景〕徒 14:19（使徒行傳講義第 14 章）</p><p>「以及我在安提阿、以哥念、路司得所遭遇的逼迫、苦難。」（3:11）保羅舉的三個城，都在第一次宣教旅程。使徒行傳講義第 14 章講過：在安提阿被趕出境，在以哥念有人要用石頭打他們，他們「就逃往呂高尼的路司得、特庇兩個城和周圍地方去」（徒 14:6）；到了路司得，有人「就用石頭打保羅，以為他是死了，便拖到城外」（徒 14:19）。</p><p>路司得就是提摩太的家鄉（徒 16:1）。保羅不提羅馬、不提哥林多，偏偏提這三個城，因為那是提摩太親眼看得見的地方。一個少年人很可能站在人群裡，看見這個傳福音的人被石頭打倒、被拖出城，然後在門徒圍著的時候站起來，走回城裡。保羅說「你已經服從了」：你不是只聽我講過，是看我活過。</p><p>這是傳承最真實的樣子。信仰不是只在教室裡傳的，是在路上、在苦難裡、在近距離的觀察中傳的。一個屬靈的父親留給兒子的，不只是講章，還有他被打倒以後怎樣站起來。</p><p>但這一節的焦點不在保羅多能忍，在最後一句：「但從這一切苦難中，主都把我救出來了。」（3:11）救出來不是沒有受傷，路司得的石頭是真的。保羅有時被救是靠逃走，有時是靠門徒圍著，有時是在石頭底下活過來。主救人的方法很多，不都是神蹟。會眾記得的不該是保羅多勇敢，而是那一位一次又一次把他救出來的主。</p>"},{"a":12,"z":12,"star":2,"grk":"<p lang=\"grc\">καὶ πάντες δὲ οἱ θέλοντες ζῆν εὐσεβῶς ἐν Χριστῷ Ἰησοῦ διωχθήσονται·</p>","lit":"<p>而且凡願意在基督耶穌裡敬虔地活的人，都要被逼迫。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καὶ πάντες δὲ</td><td>kai pantes de</td><td>而且凡……的也都</td><td>把保羅的經歷推到每一個跟從的人</td></tr><tr><td>οἱ θέλοντες</td><td>hoi thelontes</td><td>願意的、立志的</td><td>現在分詞：持續的心志</td></tr><tr><td>ζῆν εὐσεβῶς ἐν Χριστῷ Ἰησοῦ</td><td>zēn eusebōs en Christō Iēsou</td><td>在基督耶穌裡敬虔地活</td><td>條件：在基督裡的真敬虔</td></tr><tr><td>διωχθήσονται</td><td>diōchthēsontai</td><td>將要被逼迫</td><td>將來式被動：陳述，不是命令</td></tr></table>","gram":"<p><strong>3:12 是一個陳述句，不是一個命令。</strong>διωχθήσονται（diōchthēsontai） 是將來式被動語態：逼迫會臨到，不是叫人去找。καὶ πάντες δὲ（kai pantes de） 把 3:11 保羅個人的經歷推到「凡」跟從的人，主語卻有嚴格的限定：οἱ θέλοντες ζῆν εὐσεβῶς ἐν Χριστῷ Ἰησοῦ（hoi thelontes zēn eusebōs en Christō Iēsou）。</p><p>這個限定有三層。θέλοντες（thelontes） 是「願意、立志」，一個持續的心志；εὐσεβῶς（eusebōs） 是「敬虔地」，與 3:5 的 εὐσεβείας（eusebeias） 同字根：外貌的敬虔不會招來逼迫，敬虔的能力才會；ἐν Χριστῷ Ἰησοῦ（en Christō Iēsou） 是範圍，這敬虔是在基督裡的，不是在自己的規條裡。</p><p>διώκω（diōkō） 在本卷有兩個方向：2:22 的 δίωκε（diōke） 是「追求」公義、信德、仁愛、和平；3:12 的 διωχθήσονται（diōchthēsontai） 是「被追趕」。同一個動詞，追求的人也會被追趕。這是本卷「受苦難、逼迫」追蹤的一站，與 3:11 的 διωγμοῖς（diōgmois） 連成一線。</p>","exp":"<p>「不但如此，凡立志在基督耶穌裡敬虔度日的也都要受逼迫。」（3:12）保羅說完自己的經歷，轉過來對每一個人說：這不是我一個人的事。主耶穌早說過：「他們若逼迫了我，也要逼迫你們」（約 15:20）。跟從一位被釘十字架的主，路不會比他走過的平坦。</p><p>這一節也常被反過來用。有人把一切不順都叫作逼迫：工作上被批評、家裡起衝突、團契裡意見不合，都說成為主受苦。這樣說，就不必檢討自己了。保羅的條件很清楚：在基督耶穌裡敬虔度日。被批評，可能是因為我真的錯了；起衝突，可能是因為我的態度太硬。彼得說：「你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？」（彼前 2:20）不是一切的苦都叫為主受苦。</p><p>更要緊的是，被傷害、被虐待不是逼迫的同義詞。一個在家裡受暴力的人，不必為了「背十字架」留在危險裡。保羅自己也逃過：在大馬士革，門徒「在夜間用筐子把他從城牆上縋下去」（徒 9:25）；在以哥念聽說有人要打他，就逃往路司得（徒 14:6）。主說：「有人在這城裡逼迫你們，就逃到那城裡去。」（太 10:23）人身安全受威脅時先保護生命、依法求助，與忠心並不衝突。</p><p>這一節也不是說沒有受逼迫的人就不夠敬虔。逼迫的形式與輕重，因時因地而不同；有人面對的是牢獄，有人面對的是同事一句冷笑。保羅要提摩太知道的是：如果你因為在基督裡敬虔地活而被追趕，不要以為自己走錯了路。你正走在主走過的路上，而 3:11 已經說了，主會把人救出來。</p>"},{"a":13,"z":13,"star":1,"grk":"<p lang=\"grc\">πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.</p>","lit":"<p>但惡人和術士要往更壞處進展，迷惑人，也被迷惑。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πονηροὶ δὲ ἄνθρωποι</td><td>ponēroi de anthrōpoi</td><td>惡人</td><td>本章又一次用「人」</td></tr><tr><td>γόητες</td><td>goētes</td><td>術士、騙子</td><td>新約只此一次；接回 3:8 的術士</td></tr><tr><td>προκόψουσιν ἐπὶ τὸ χεῖρον</td><td>prokopsousin epi to cheiron</td><td>往更壞處進展</td><td>與 3:9 的「不能再往前」對照</td></tr><tr><td>πλανῶντες καὶ πλανώμενοι</td><td>planōntes kai planōmenoi</td><td>迷惑人，也被迷惑</td><td>主動與被動分詞並列</td></tr></table>","gram":"<p><strong>3:13 用兩個分詞收住整段：πλανῶντες καὶ πλανώμενοι（planōntes kai planōmenoi）。</strong>同一個動詞，一個主動、一個被動：欺哄人的，自己也被欺哄。πλανάω（planaō） 原是「使人迷路」，迷路的人帶別人迷路，自己也走不出來。</p><p>γόητες（goētes） 在新約只出現這一次，原指念咒的術士，後來泛指江湖騙子。保羅選這個字，把 3:8 的雅尼和佯庇接回來：法老宮裡的術士，在以弗所換了一身衣服。προκόψουσιν ἐπὶ τὸ χεῖρον（prokopsousin epi to cheiron） 是反話：「進步」本是好字，這裡卻是往更壞的方向進步。3:9 說他們 οὐ προκόψουσιν ἐπὶ πλεῖον（ou prokopsousin epi pleion），3:13 說他們 προκόψουσιν ἐπὶ τὸ χεῖρον（prokopsousin epi to cheiron）：在影響別人這件事上走不遠，在自己變壞這件事上越走越深。</p>","exp":"<p>「只是作惡的和迷惑人的，必越久越惡，他欺哄人，也被人欺哄。」（3:13）這一節夾在逼迫與聖經之間，像一個提醒：危險的日子不會自己變好。保羅沒有給提摩太一幅樂觀的圖畫，說錯謬會慢慢消失；他說會越來越惡。</p><p>最深的一筆是「他欺哄人，也被人欺哄」（3:13）。騙人的人，最先騙的往往是自己。他說服自己沒有問題，然後再去說服別人。這像一個拿著錯誤地圖帶隊的嚮導：他不是故意帶錯路，他自己就相信那張地圖。所以面對迷惑人的人，教會需要分辨，也需要憐憫；他們害了人，也被害了。</p><p>這一節不是叫我們去找越久越惡的那個人。保羅緊接著說「但你」。在一個越來越亂的環境裡，提摩太能做的不是追著每一個騙子跑，是確定自己沒有被騙。怎樣確定？下一段的答案是：回到你學過的、你確信的，回到聖經。地圖對了，路就不會越走越偏。</p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ τίνων ἔμαθες,</p><p lang=\"grc\">καὶ ὅτι ἀπὸ βρέφους ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·</p>","lit":"<p>但你，要住在你所學、所被確信的事裡，因你知道是跟哪些人學的，</p><p>並且你從嬰孩時就知道神聖的文字，這些能使你有智慧以致得救，藉著那在基督耶穌裡的信。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σὺ δὲ μένε</td><td>sy de mene</td><td>但你要住在</td><td>現在式命令：持續地留在</td></tr><tr><td>ἐν οἷς ἔμαθες καὶ ἐπιστώθης</td><td>en hois emathes kai epistōthēs</td><td>在你所學、所被確信的事裡</td><td>被證實可信，新約只此一次</td></tr><tr><td>παρὰ τίνων</td><td>para tinōn</td><td>跟哪些人</td><td>複數：不只一個老師</td></tr><tr><td>ἀπὸ βρέφους</td><td>apo brephous</td><td>從嬰孩時</td><td>吃奶的嬰孩</td></tr><tr><td>ἱερὰ γράμματα</td><td>hiera grammata</td><td>神聖的文字</td><td>當時猶太人稱舊約的用語</td></tr><tr><td>τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν</td><td>ta dynamena se sophisai eis sōtērian</td><td>能使你有智慧以致得救</td><td>「能力」的字再出現</td></tr><tr><td>διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ</td><td>dia pisteōs tēs en Christō Iēsou</td><td>藉著在基督耶穌裡的信</td><td>聖經指向基督</td></tr></table>","gram":"<p><strong>σὺ δὲ μένε（sy de mene） 是本章第二個「但你」。</strong>μένε（mene） 是現在式命令，「要一直住在裡面」；不是往前找新的，是留在已經有的。ἐν οἷς ἔμαθες καὶ ἐπιστώθης（en hois emathes kai epistōthēs）：ἔμαθες（emathes） 是學過，ἐπιστώθης（epistōthēs） 是 πιστόω（pistoō） 的被動式，新約只此一次，「被證實可信、被說服」。學習是頭腦的事，確信是經過檢驗以後心裡的落定。這是本卷「信、可信」追蹤的一站。</p><p>εἰδὼς παρὰ τίνων ἔμαθες（eidōs para tinōn emathes） 的 τίνων（tinōn） 是複數：「跟哪些人」。最自然的讀法是兩條線：1:5 的外祖母羅以、母親友妮基，和寫這封信的保羅。家裡的線從嬰孩時開始，屬靈父親的線從路司得開始。</p><p>ἱερὰ γράμματα（hiera grammata） 是當時講希臘話的猶太人稱呼舊約的用語，「神聖的文字」，與 3:16 的 γραφὴ（graphē） 指同一批書。τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν（ta dynamena se sophisai eis sōtērian） 說這些書「能」叫人有得救的智慧；δυνάμενά（dynamena） 與 3:7 那些人「不能」明白真道的 δυνάμενα（dynamena） 是同一個字，一個能、一個不能。關鍵在 διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ（dia pisteōs tēs en Christō Iēsou）：舊約本身不是終點，是藉著在基督耶穌裡的信，才把人帶到救恩。這是本卷「知道、認識」追蹤的兩站：εἰδὼς（eidōs） 與 οἶδας（oidas）。</p>","exp":"<p>〔背景〕徒 16:1--3（使徒行傳講義第 16 章）</p><p>「因為你知道是跟誰學的，並且知道你是從小明白聖經」（3:14--15）。使徒行傳講義第 16 章講過提摩太的家：他「是信主之猶太婦人的兒子，他父親卻是希臘人」（徒 16:1）。他的家不是一個完整的信仰家庭，長大了還沒有受割禮。可是外祖母和母親把聖經放在他手裡，從他還是吃奶的嬰孩開始。</p><p>這是傳承的第一條線：家。但這一節不讓沒有基督徒家庭的人覺得自己次等。τίνων（tinōn） 是複數，提摩太學的對象不只是家人，還有保羅。他的父親在信仰上缺席，神給了他一個屬靈的父親。今天許多人是家裡第一代信主的，沒有外祖母為他禱告，沒有母親教他背經文；屬靈父母這一條線，對他們同樣真實。也不必讓兒女還沒信主的父母因此自責：友妮基的丈夫在經文裡只留下希臘人這個身分，信心不是父母可以替家人決定的。</p><p>「你知道是跟誰學的」不是叫人崇拜老師，是叫人看見真理怎樣經過可信的生命傳過來。提摩太看過保羅在路司得被石頭打，看過他的忍耐與愛心（3:10）。教訓與生命對得上，所學的才確信得來。但老師只是管道，3:15 的結論不是這些人能使你得救，是「這聖經能使你因信基督耶穌，有得救的智慧」（3:15）。</p><p>321 說用心靠聖靈：所學的，要存在心裡。μένε（mene） 是住在裡面，像一棵樹留在原來的土裡，不是每一季搬一次家。在講座、短片、新說法每天湧進來的時代，提摩太得到的建議很樸素：留在你已經確信的聖經裡，它會把你帶到基督面前。</p>"},{"a":16,"z":17,"star":3,"grk":"<p lang=\"grc\">πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ἐλεγμόν πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,</p><p lang=\"grc\">ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.</p>","lit":"<p>每一段經文都是神所呼出的，也是有益的：為了教導、為了指出錯處、為了重新扶直、為了在義中的教養，</p><p>好叫屬神的人是完備的，為了一切善工已經被裝備齊全。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πᾶσα γραφὴ</td><td>pasa graphē</td><td>每一段經文／全部經文</td><td>沒有冠詞</td></tr><tr><td>θεόπνευστος</td><td>theopneustos</td><td>神所呼出的</td><td>新約只此一次</td></tr><tr><td>ὠφέλιμος</td><td>ōphelimos</td><td>有益的</td><td>提前 4:8 敬虔「凡事都有益處」同字</td></tr><tr><td>πρὸς ἐλεγμόν</td><td>pros elegmon</td><td>為了指出錯處</td><td>督責：說出甚麼不對</td></tr><tr><td>πρὸς ἐπανόρθωσιν</td><td>pros epanorthōsin</td><td>為了重新扶直</td><td>使人歸正：把倒下的扶起來</td></tr><tr><td>πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ</td><td>pros paideian tēn en dikaiosynē</td><td>為了在義中的教養</td><td>養育孩子的字</td></tr><tr><td>ἄρτιος</td><td>artios</td><td>合用的、完備的</td><td>與下一個字同字根</td></tr><tr><td>ἐξηρτισμένος</td><td>exērtismenos</td><td>已經裝備齊全</td><td>完成式被動分詞</td></tr></table>","gram":"<p><strong>3:16 沒有動詞，所以有兩種文法讀法。</strong>πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος（pasa graphē theopneustos kai ōphelimos） 要讀者自己補上「是」。①把 θεόπνευστος（theopneustos） 與 ὠφέλιμος（ōphelimos） 都當述語：「聖經都是神所默示的，〔也〕都是有益的」，和合本與多數譯本這樣讀。②把 θεόπνευστος（theopneustos） 當形容詞修飾 γραφὴ（graphē），καὶ（kai） 當「也」：「凡神所默示的聖經，也都是有益的」，和合本的註腳「或譯：凡神所默示的聖經」就是這一讀。第一讀有 καὶ（kai） 連接兩個形容詞的平行，較為自然；第二讀也合文法。</p><p>要緊的是：<strong>兩讀都承認聖經出於神。</strong>第二讀不是說有一些經文不是默示的，保羅不是在聖經裡挑揀；它說的是：既然是神所默示的，就必然有益。本講義從和合本正文，並把兩讀同列。</p><p>θεόπνευστος（theopneustos） 在新約只出現這一次，由 θεός（theos） 與 πνέω（pneō）「吹氣、呼出」組成，意思是「神所呼出的」。中文的「默示」與拉丁文的譯法都容易讓人想成「吹進去」，原文的重點卻是「從神口中出來」：聖經不是人寫好以後神再加一口氣，是神自己呼出的話。πᾶσα（pasa） 沒有冠詞，可以譯「每一段」，也可以譯「全部」，兩種都把聖經的每一部分包括在內。直接的上下文是 3:15 提摩太從小讀的舊約。</p><p>四個 πρὸς（pros） 是四個用處：πρὸς διδασκαλίαν（pros didaskalian）、πρὸς ἐλεγμόν（pros elegmon）、πρὸς ἐπανόρθωσιν（pros epanorthōsin）、πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ（pros paideian tēn en dikaiosynē）。前兩個說甚麼是對的、甚麼是錯的，後兩個說怎樣把人扶正、怎樣養育人。ἐπανόρθωσιν（epanorthōsin） 是「重新扶直」，與 2:15 的 ὀρθοτομοῦντα（orthotomounta）「直直地切開」有同一個「直」的字根。督責的字，RP 作另一個同字根的寫法，意思相同。3:17 的 ἄρτιος（artios） 與 ἐξηρτισμένος（exērtismenos） 是同字根的文字遊戲：完備，因為被裝備齊全；這字在當時也可以用在裝備好、可以出航的船上。</p>","exp":"<p>「聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的」（3:16）。這是全卷地勢圖的第三座山，也是 321「聖經是我的準則」最直接的經文根據。它立在全章最亂的地方：前面是十八項的清單、模仿的術士、越久越惡的騙子。亂世裡，保羅留給兒子的不是一套策略，是一本書。</p><p>「神所默示」原文是神所呼出的。這使我們想起創造的那一刻：「將生氣吹在他鼻孔裡，他就成了有靈的活人」（創 2:7）。神一吹氣，塵土就活了；神呼出的話，也帶著叫人活的生命。彼得說得更直接：「乃是人被聖靈感動，說出神的話來」（彼後 1:21）。神沒有繞過寫作的人，摩西、大衛、以賽亞的筆跡都留著；但說話的是神。</p><p>3:16 的「聖經」直接指提摩太從小讀的舊約。新約自己已經把使徒的書信放在別的經書旁邊：彼得提到保羅的信，說無學問的人「強解，如強解別的經書一樣」（彼後 3:16）。教會因此把新約與舊約同認為神的話。至於無誤論、有限無誤論等細部定義，福音派內部各有主張；本講義站在福音派對聖經權威的共同立場，不在本卷裁判細部，也不把這些分歧當作分門的標準（全卷立場見 ISS00_4）。</p><p>四個用處的次序很溫柔。教訓與督責說甚麼是對的、甚麼錯了；使人歸正與教導人學義，是把倒下的扶起來，像養孩子一樣養人在義裡長大。四個用處裡，兩個是扶正。聖經像木匠的直尺：它量出哪裡歪了，但木匠拿尺不是為了把木頭打斷，是為了把它修直。拿經文打人，是把直尺當成棍子用。第 2 章才說過，主的僕人要「用溫柔勸戒那抵擋的人」（2:25）。</p><p>3:17 說出這一切的目的：「叫屬神的人得以完全，預備行各樣的善事。」（3:17）這一章用了好幾次「人」：專顧自己的人、心地壞了的人、作惡的人；最後一個是「屬神的人」。聖經第一個要扶正的，就是讀它的人自己。2:15 叫提摩太「按著正意分解真理的道」（2:15），先切直的是他自己。屬神的人被裝備齊全，不是為了贏過誰，是為了出去行善。這本書不是審判別人的法典，是先把我扶正、再差我出去的工具。</p>"}],"4":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·</p>","lit":"<p>我鄭重地囑咐，在神面前，並基督耶穌——那將要審判活人和死人的——面前，又憑著他的顯現和他的國度：</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Διαμαρτύρομαι</td><td>Diamartyromai</td><td>我鄭重地囑咐</td><td>法庭用語：在證人面前立下的託付</td></tr><tr><td>τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς</td><td>tou mellontos krinein zōntas kai nekrous</td><td>那將要審判活人死人的</td><td>囑咐的見證人，也是將來的審判者</td></tr><tr><td>καὶ τὴν ἐπιφάνειαν αὐτοῦ</td><td>kai tēn epiphaneian autou</td><td>並憑著他的顯現</td><td>RP 作 κατὰ τὴν ἐπιφάνειαν「在他顯現的時候」</td></tr><tr><td>καὶ τὴν βασιλείαν αὐτοῦ</td><td>kai tēn basileian autou</td><td>和他的國度</td><td>4:18 保羅要被救「進」的那個國</td></tr></table>","gram":"<p><strong>Διαμαρτύρομαι（Diamartyromai） 是全章的第一個字，也是全卷最重的一個動詞。</strong>它是法庭與立約的用語：在證人面前把一件事鄭重交代清楚，日後要拿出來對質。保羅請出的證人不是普通人：ἐνώπιον τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ（enōpion tou theou kai Christou Iēsou），一個介系詞管兩位，神與基督耶穌並列。接著一個分詞片語說明這位基督是誰：τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς（tou mellontos krinein zōntas kai nekrous）。μέλλοντος（mellontos） 說的是「必定要來」，不是「也許會來」。</p><blockquote><p><strong>經文鑑別：</strong>SBLGNT、WH、Treg、NA28 作 καὶ τὴν ἐπιφάνειαν αὐτοῦ（kai tēn epiphaneian autou），兩個直接受格是起誓的對象，「憑著他的顯現和他的國度」，和合本照這個讀法。RP 作 κατὰ τὴν ἐπιφάνειαν（kata tēn epiphaneian），「在他顯現的時候」審判，變成一個時間片語；RP 又在句首加 οὖν ἐγώ（oun egō），並在基督前面加「主」。本講義的判斷：照 SBLGNT。較早的抄本支持 καὶ（kai），而 κατὰ（kata） 很像抄寫者覺得「憑著顯現起誓」太難懂，改成較順的句子。兩種讀法都把囑咐掛在基督的再來上，意思不變，講台照和合本。</p></blockquote><p>ἐπιφάνειαν（epiphaneian） 在本卷出現三次：1:10 是第一次的顯現，「藉著我們救主基督耶穌的顯現才表明出來了」（1:10）；4:1 與 4:8 是再來的顯現。保羅的一生夾在兩次顯現中間。</p>","exp":"<p>「我在神面前，並在將來審判活人死人的基督耶穌面前，憑著他的顯現和他的國度囑咐你」（4:1）。這是一個快要上刑場的人，在交代最後的事。臨終的人說話，旁人都會豎起耳朵；但保羅提醒提摩太：真正在聽的不是旁人，是神與基督。這份託付是在天上的法庭立案的。</p><p>一個囚犯，竟然請出審判者來作證。羅馬的法官很快就要審判保羅，可是保羅說，還有一位審判活人死人的要來。地上的法庭會判他死刑，天上的法庭卻在為他存留冠冕（4:8）。提摩太若只看見羅馬的法庭，他會怕；若看見那位將來審判的主，他就知道這份工作的分量。「審判」二字不是用來嚇人的。在這裡它的作用是定錨：傳道的人最後要向一位交帳，所以不必向眾人的掌聲交帳。基督徒將來站在基督臺前的事，保羅在別處講得清楚：「因為我們眾人必要在基督臺前顯露出來」（林後 5:10），這個題目留給議題頁處理。</p><p>「憑著他的顯現和他的國度」把整章框起來。4:1 起頭說顯現與國度，4:8 說「凡愛慕他顯現的人」，4:18 說「救我進他的天國」。這一章看起來是一份遺囑、一張名單、一個冷天裡要外衣的老人，底下卻是一位要來的王。這正是 321 說的「讓耶穌作王」：託付的權柄不是來自保羅的資歷，是來自那位要來的王。火、兵、經、冠，第 4 章走到「冠」，整個人生的終點，站著的是這一位。</p>"},{"a":2,"z":2,"star":3,"grk":"<p lang=\"grc\">κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.</p>","lit":"<p>你要傳揚那道，要站定，合時地、不合時地；要責證，要斥責，要勸勉，在一切的忍耐和教導中。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κήρυξον τὸν λόγον</td><td>kēryxon ton logon</td><td>你要傳揚那道</td><td>κῆρυξ 是傳令官：照原文宣讀，不自己編</td></tr><tr><td>ἐπίστηθι</td><td>epistēthi</td><td>要站定</td><td>與 4:6 ἐφέστηκεν 同一個動詞</td></tr><tr><td>εὐκαίρως ἀκαίρως</td><td>eukairōs akairōs</td><td>合時、不合時</td><td>兩個副詞並排，沒有連接詞</td></tr><tr><td>ἔλεγξον</td><td>elenxon</td><td>要責證</td><td>把錯攤開來；3:16 ἐλεγμόν 同字根</td></tr><tr><td>ἐπιτίμησον</td><td>epitimēson</td><td>要斥責</td><td>直接指出</td></tr><tr><td>παρακάλεσον</td><td>parakaleson</td><td>要勸勉</td><td>站到身邊來勸</td></tr><tr><td>ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ</td><td>en pasē makrothymia kai didachē</td><td>在一切的忍耐和教導中</td><td>管住前面三個動詞的氣氛</td></tr></table>","gram":"<p><strong>一節經文，五個不定過去式命令語氣：</strong>κήρυξον（kēryxon）、ἐπίστηθι（epistēthi）、ἔλεγξον（elenxon）、ἐπιτίμησον（epitimēson）、παρακάλεσον（parakaleson）。沒有一個連接詞，一個接一個砸下來，像臨終的人沒有時間多說。</p><p>κήρυξον τὸν λόγον（kēryxon ton logon）：κῆρυξ（kēryx） 是城邦或君王的傳令官，他的本分是把王的話一字不改地宣讀出來。受詞是 τὸν λόγον（ton logon），有冠詞，指那個特定的道，就是 2:9「神的道卻不被捆綁」的那道。本卷第四條追蹤在這裡轉進高潮：4:2 κήρυξον（kēryxon），4:17 τὸ κήρυγμα（to kērygma），保羅要提摩太去做的事，正是保羅自己在法庭上剛剛做完的事。</p><p>ἐπίστηθι（epistēthi） 是 ἐφίστημι（ephistēmi） 的命令式，字面是「站到崗位上」「隨時就位」。四節之後，保羅說自己離世的時候 ἐφέστηκεν（ephestēken），同一個動詞的完成式：時候已經站到他面前了。老兵的時候到了，新兵要站上崗位。εὐκαίρως ἀκαίρως（eukairōs akairōs） 兩個同字根的副詞並排：εὔκαιρος（eukairos） 是合宜的時機，加上否定字首就是不合時。</p><p>三個動詞由重到輕再到暖：ἔλεγξον（elenxon） 是攤開證據，ἐπιτίμησον（epitimēson） 是直接指出，παρακάλεσον（parakaleson） 是靠過去勸。最後的 ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ（en pasē makrothymia kai didachē） 管住全部：責備要帶著長久的忍耐，也要帶著教導。只有罵，沒有教，不是 4:2。</p>","exp":"<p>「務要傳道，無論得時不得時，總要專心，並用百般的忍耐、各樣的教訓責備人，警戒人，勸勉人。」（4:2）這是一位父親在牢裡交出的最後一份工作說明。他沒有說「要把教會做大」，也沒有說「要保住我的名聲」，他說：傳道。</p><p>傳令官的比喻很要緊。傳令官不寫稿子，他拿到的是王的詔書。他的才華不在創作，在忠實；他的成功不在聽眾鼓掌，在一字不漏地讀完。傳道人的壓力常常是「要講出新東西」；κήρυξον（kēryxon） 卻說，你要講的不是你的東西。這反而是一種釋放：講台不靠你發明，只靠你忠心。</p><p>「無論得時不得時」最容易被誤用。它不是說不必看場合、不顧關係、在婚宴上大聲責備人；保羅同一封信才說「主的僕人不可爭競，只要溫溫和和地待眾人」（2:24）。它說的是另一件事：不看氣氛決定忠心。聽眾愛聽的時候要講，聽眾不愛聽的時候也要講；自己狀態好的時候要講，覺得乾的時候也要講。得時與不得時，是指傳道的人與聽道的人兩邊的「時」，忠心不跟著溫度計升降。</p><p>「用百般的忍耐」放在責備旁邊，是一道防線。真理若沒有忍耐，就變成刀；忍耐若沒有真理，就變成糖。保羅兩樣都要。321 說「聖經是我的準則」，這一節說，準則要被傳出來，也要帶著長久忍耐地傳出來。改變觀念八大步驟裡的「反覆」，在這裡有一個很實在的樣子：得時不得時，一遍又一遍。</p><p>還有一個字不要漏掉：「總要專心」原文是站上崗位。站崗的兵不會因為夜裡沒有敵人就回營睡覺，也不會因為白天太熱就離開哨所；他站在那裡，是因為差派他的人叫他站。傳道的人也是這樣，他的崗位不是聽眾給的，是主給的。</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ἰδίας ἐπιθυμίας ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,</p><p lang=\"grc\">καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.</p>","lit":"<p>因為將有一個時候，他們不再忍受那健全的教導，反倒照著自己的私慾，為自己堆積教師，耳朵發癢；</p><p>並且一方面要把耳朵從真理轉開，另一方面要偏轉到那些神話上去。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἔσται γὰρ καιρὸς</td><td>estai gar kairos</td><td>因為將有一個時候</td><td>γάρ 說明 4:2 為甚麼急</td></tr><tr><td>τῆς ὑγιαινούσης διδασκαλίας</td><td>tēs hygiainousēs didaskalias</td><td>健全的教導</td><td>教牧書信的醫學用語：健康的</td></tr><tr><td>ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους</td><td>heautois episōreusousin didaskalous</td><td>為自己堆積教師</td><td>像堆柴一樣一個一個疊上去</td></tr><tr><td>κνηθόμενοι τὴν ἀκοήν</td><td>knēthomenoi tēn akoēn</td><td>耳朵發癢</td><td>κνήθω 新約只此一次</td></tr><tr><td>ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται</td><td>epi de tous mythous ektrapēsontai</td><td>偏轉到神話上去</td><td>ἐκτρέπω：脫臼、偏離正位</td></tr></table>","gram":"<p>4:3 用 γάρ（gar） 接上 4:2：要得時不得時地傳，因為 ἔσται γὰρ καιρὸς（estai gar kairos），將有一個時候。這是將來式，但保羅在 3:1 已經說過末世的危險「必有」，在 3:5 又說「這等人你要躲開」，可見這個「將來」提摩太已經在經歷。</p><p>主動詞 ἀνέξονται（anexontai） 前面加了 οὐκ（ouk）：他們不再「忍受」健全的教導。問題不在聽不懂，在受不了。接著 ἀλλὰ（alla） 轉出他們做的事：κατὰ τὰς ἰδίας ἐπιθυμίας ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους（kata tas idias epithymias heautois episōreusousin didaskalous）。ἐπισωρεύσουσιν（episōreusousin） 是「堆上去」，ἑαυτοῖς（heautois） 是為自己；教師變成一堆照自己口味挑來的東西。</p><p>κνηθόμενοι τὴν ἀκοήν（knēthomenoi tēn akoēn） 是全句的病根，κνήθω（knēthō） 在新約只出現這一次，是搔癢的意思。分詞放在句尾，像醫生最後才說出診斷：耳朵癢，所以要找人來搔。</p><p>4:4 用 μὲν（men）……δὲ（de） 排出一個對稱的動作：ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν（apo men tēs alētheias tēn akoēn apostrepsousin），耳朵從真理轉開；ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται（epi de tous mythous ektrapēsontai），人偏到神話上去。先轉開耳朵，人才跟著偏過去。ἐκτρέπω（ektrepō） 在醫學上可以指關節脫位；提前 1:6 說有人「反去講虛浮的話」（提前 1:6），「反去」原文 ἐξετράπησαν（exetrapēsan） 正是這個動詞。</p>","exp":"<p>「因為時候要到，人必厭煩純正的道理，耳朵發癢，就隨從自己的情慾增添好些師傅」（4:3），「並且掩耳不聽真道，偏向荒渺的言語。」（4:4）</p><p>這兩節描寫的不是一群不聽道的人，是一群很愛聽道的人。他們「增添好些師傅」，講員一個接一個地加；只是挑選的標準換了，不是「甚麼是真的」，是「甚麼聽起來舒服」。健康的教導像藥，有時候苦；發癢的耳朵要的是撓癢，撓完很舒服，病卻沒有好，還越撓越癢。</p><p>這兩節很容易被拿去貼標籤：貼在某個網路講員、某個教會、某個宗派、某個世代身上。這不是保羅寫這兩節的用法。他是寫給提摩太的：你要知道會有這樣的時候，所以你不要跟著氣氛走（4:5「你卻要」）。保羅沒有叫提摩太去點名，是叫他自己站穩。</p><p>這面鏡子要先照自己。我的耳朵會不會癢？我是不是只收藏讓我舒服的講道，跳過那些戳到我的？聽到一段扎心的經文，我的第一個反應是悔改，還是轉台？「時候要到」也不是叫人算日子，看今天是不是那一天；每一個世代的教會都要面對自己發癢的耳朵。321 說問題的根源是「有己」：連聽道都在服事自己，就是 3:2「專顧自己」走進了禮拜堂。出路不是換一批更好的講員，是讓耳朵重新回到主的話面前，願意被扶正。</p>"},{"a":5,"z":5,"star":1,"grk":"<p lang=\"grc\">σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.</p>","lit":"<p>但你，要在一切事上清醒，要忍受苦難，要做傳福音者的工作，要把你的服事完全盡滿。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σὺ δὲ</td><td>sy de</td><td>但你</td><td>與 4:3--4 的「他們」對立</td></tr><tr><td>νῆφε ἐν πᾶσιν</td><td>nēphe en pasin</td><td>在一切事上清醒</td><td>不醉、頭腦清楚</td></tr><tr><td>κακοπάθησον</td><td>kakopathēson</td><td>要忍受苦難</td><td>本卷追蹤一：2:3 συγκακοπάθησον</td></tr><tr><td>ἔργον ποίησον εὐαγγελιστοῦ</td><td>ergon poiēson euangelistou</td><td>做傳福音者的工作</td><td>εὐαγγελιστής 新約只三次</td></tr><tr><td>τὴν διακονίαν σου πληροφόρησον</td><td>tēn diakonian sou plērophorēson</td><td>把你的服事盡滿</td><td>4:17 πληροφορηθῇ 同一個動詞</td></tr></table>","gram":"<p><strong>σὺ δὲ（sy de） 是一個轉身。</strong>4:3--4 的主詞都是「他們」，到 4:5 突然換成「你」，而且 σὺ（sy） 放在句首，帶著強調：不管他們怎樣，你卻要。本卷這個轉身用了好幾次，3:10、3:14 都是 σὺ δὲ（sy de）。</p><p>四個命令式：νῆφε ἐν πᾶσιν（nēphe en pasin）、κακοπάθησον（kakopathēson）、ἔργον ποίησον εὐαγγελιστοῦ（ergon poiēson euangelistou）、τὴν διακονίαν σου πληροφόρησον（tēn diakonian sou plērophorēson）。第一個 νῆφε（nēphe） 是現在式，要持續保持清醒；後三個是不定過去式，是要完成的動作。νῆφε（nēphe） 原意是沒有喝醉。滿街都是發癢的耳朵，傳道的人第一件事是自己不要醉。</p><p>εὐαγγελιστοῦ（euangelistou） 在新約只出現三次：徒 21:8 的腓利、弗 4:11 恩賜名單，以及這裡。πληροφόρησον（plērophorēson） 是「裝滿、盡滿」，同一個動詞在 4:17 以被動語態 πληροφορηθῇ（plērophorēthē） 出現：提摩太要把職分盡滿，保羅在法庭上「使福音被我盡都傳明」，同一個字。</p>","exp":"<p>「你卻要凡事謹慎，忍受苦難，做傳道的工夫，盡你的職分。」（4:5）這一節的「卻」字很有力量。別人的耳朵都在發癢，你卻不必跟著；別人換師傅，你卻不換福音。</p><p>「謹慎」原文是清醒。清醒的人知道自己是誰、知道自己的限度。這一節常被拿來美化過勞，「忍受苦難」被聽成「拚到倒下」；但保羅在這裡說的苦，是為福音的苦，而且是「同」受的苦（2:3），不是一個人燃燒到盡的苦。清醒的僕人會休息，也會求助；過勞不是屬靈的勳章。同一章保羅也要外衣、要書、要同伴（4:11--13）。</p><p>「做傳道的工夫」是「做傳福音者的工作」。提摩太是牧養一個城市教會的人，保羅卻提醒他：別忘了你還是一個傳福音的人。牧養與傳福音不是兩種人，是同一個人的兩隻手。「盡你的職分」是把服事裝滿，不是做到一半。棒交到手上，就要跑完你那一段。</p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ἀναλύσεώς μου ἐφέστηκεν.</p>","lit":"<p>因為我已經正在被澆奠，並且我解纜的時候已經站在眼前了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐγὼ γὰρ ἤδη σπένδομαι</td><td>Egō gar ēdē spendomai</td><td>因為我已經正在被澆奠</td><td>現在式：倒酒已經開始</td></tr><tr><td>σπένδομαι</td><td>spendomai</td><td>被澆奠</td><td>奠祭：酒倒在祭壇上給耶和華；腓 2:17 同一形</td></tr><tr><td>ὁ καιρὸς τῆς ἀναλύσεώς μου</td><td>ho kairos tēs analyseōs mou</td><td>我解纜的時候</td><td>ἀνάλυσις：解開纜繩、拔起營釘</td></tr><tr><td>ἐφέστηκεν</td><td>ephestēken</td><td>已經站到眼前</td><td>完成式；與 4:2 ἐπίστηθι 同一個動詞</td></tr></table>","gram":"<p><strong>Ἐγὼ（Egō） 放在句首，與 4:5 的 σὺ（sy） 正面相對。</strong>「你」要站上崗位，因為「我」要下崗了。γὰρ（gar） 把兩節扣在一起：4:5 的命令，理由在 4:6。</p><p>σπένδομαι（spendomai） 是現在式被動語態，加上 ἤδη（ēdē）「已經」：澆奠不是將來的事，酒已經開始倒了。這個字是祭禮用語，奠祭是在燔祭之外加倒的酒，民 28:7 吩咐「在聖所中，你要將醇酒奉給耶和華為奠祭」（民 28:7）。保羅在腓立比書用過同一個形：σπένδομαι（spendomai），「我若被澆奠在其上，也是喜樂」（腓 2:17）。那時是「若」，現在是「已經」。被動語態也要注意：倒酒的不是羅馬的劊子手，是獻祭的人；酒是倒給主的。</p><p>第二個比喻換了一幅畫。ἀναλύσεώς（analyseōs） 是名詞 ἀνάλυσις（analysis） 的屬格，新約只此一次；動詞 ἀναλύω（analyō） 是解開纜繩讓船出港，或拔起營釘讓帳棚收起。保羅在腓 1:23 用過動詞 ἀναλῦσαι（analysai），和合本譯作「離世」：「情願離世與基督同在」（腓 1:23）。所以和合本的「離世」，原文是一條船解纜、一支軍隊拔營。</p><p>ἐφέστηκεν（ephestēken） 是 ἐφίστημι（ephistēmi） 的完成式：那個時候已經走過來，站在門口了。四節之前，保羅才用同一個動詞叫提摩太 ἐπίστηθι（epistēthi）。</p>","exp":"<p>〔舊約〕民 28:7（民數記講義第 28 章）</p><p>「我現在被澆奠，我離世的時候到了。」（4:6）這是一個知道自己快死的人寫的句子，卻沒有一個字是哀嚎。他用了兩幅畫，一幅是祭壇，一幅是碼頭。</p><p>第一幅畫是祭壇。本系列民數記講義第 28 章講過：每天的燔祭之外，還要加上奠祭的酒，倒在祭壇上，酒一倒下去就收不回來，化成馨香。保羅說，我的一生就是這樣被倒出來的。要緊的是倒給誰。澆奠是把自己倒給主，不是讓人把你榨乾；是獻祭，不是消耗。這一句不能拿來說「為主燒盡」才算屬靈。被倒出來的人知道自己是倒在祭壇上的，所以他也知道甚麼時候該停下來吃飯、睡覺、要一件外衣（4:13）。321 說的無己，在這裡有了最清楚的樣子：把自己倒給主，一滴不留；但倒的方向是主，不是任何一個要求你無限付出的人或體制。</p><p>第二幅畫是碼頭。「離世」原文是解纜。從岸上看，船是「離開」了；從船上看，船是「出發」了。保羅沒有說「我要被處死了」，他說「我要開船了」。羅馬的法官以為自己在結束一個人的生命，保羅知道自己是在啟航，往「與基督同在」的地方去（腓 1:23）。</p><p>這兩幅畫給今天每一個病床邊、靈堂前的人一個眼光。死亡在信的人身上，不是被奪走，是被倒出；不是沉沒，是解纜。焦點不是保羅多勇敢，是那一位在對岸等他的主。一個基督徒的告別式可以有眼淚，但不必絕望；岸上的人揮手送別，對岸的主已經伸手迎接。</p>"},{"a":7,"z":8,"star":3,"grk":"<p lang=\"grc\">τὸν καλὸν ἀγῶνα ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·</p><p lang=\"grc\">λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.</p>","lit":"<p>那美好的競賽我已經競賽過了，那賽程我已經跑完了，那信我已經守住了；</p><p>此後，為我存放著那公義的冠冕，就是主——那公義的審判者——在那日要還給我的；不但是給我，也給一切已經愛慕他顯現的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸν καλὸν ἀγῶνα ἠγώνισμαι</td><td>ton kalon agōna ēgōnismai</td><td>那美好的競賽我已經競賽過了</td><td>同字根受詞＋完成式；ἀγών 是競技場</td></tr><tr><td>τὸν δρόμον τετέλεκα</td><td>ton dromon teteleka</td><td>那賽程我已經跑完了</td><td>徒 20:24「行完我的路程」</td></tr><tr><td>τὴν πίστιν τετήρηκα</td><td>tēn pistin tetērēka</td><td>那信我已經守住了</td><td>本卷追蹤三</td></tr><tr><td>ἀπόκειταί μοι</td><td>apokeitai moi</td><td>為我存放著</td><td>來 9:27 ἀπόκειται「按著定命」</td></tr><tr><td>ὁ τῆς δικαιοσύνης στέφανος</td><td>ho tēs dikaiosynēs stephanos</td><td>公義的冠冕</td><td>競賽得勝者的花冠，不是王冠</td></tr><tr><td>ὃν ἀποδώσει μοι ὁ κύριος</td><td>hon apodōsei moi ho kyrios</td><td>主要還給我的</td><td>4:14 同一個動詞：ἀποδώσει</td></tr><tr><td>τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ</td><td>tois ēgapēkosi tēn epiphaneian autou</td><td>已經愛慕他顯現的人</td><td>完成式分詞；對照 4:10 ἀγαπήσας</td></tr></table>","gram":"<p><strong>4:7 是三個完成式排成一列，每一句都把受詞放在前面：</strong>τὸν καλὸν ἀγῶνα ἠγώνισμαι（ton kalon agōna ēgōnismai）、τὸν δρόμον τετέλεκα（ton dromon teteleka）、τὴν πίστιν τετήρηκα（tēn pistin tetērēka）。完成式說的是動作已經完成，結果一直留著。第一句是同字根的受詞與動詞，「那美好的競賽，我競賽過了」。ἀγών（agōn） 是競技場上的比賽，也可以指搏鬥；和合本譯「仗」，原文的畫面更接近運動場。保羅曾經吩咐提摩太 Ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως（Agōnizou ton kalon agōna tēs pisteōs），「你要為真道打那美好的仗」（提前 6:12）；如今他自己說：這一場，我打完了。</p><p>τὸν δρόμον τετέλεκα（ton dromon teteleka）：大約十年前在米利都，保羅說「只要行完我的路程」（徒 20:24），那裡的「路程」就是 δρόμον（dromon）。當年是心願，今天是完成式。τὴν πίστιν τετήρηκα（tēn pistin tetērēka） 有兩種讀法：「信」指所信的內容（和合本「所信的道」），或指自己的忠信。兩讀可以並存；本卷 1:14 吩咐「牢牢地守著」所交託的善道，這裡的 τετήρηκα（tetērēka） 是那份託付的收尾。</p><p>4:8 以 λοιπὸν（loipon） 開頭，「此後、剩下的就是」。ἀπόκειταί μοι（apokeitai moi） 是「為我存放著」；同一個動詞在來 9:27 說「按著定命，人人都有一死」（來 9:27）。給每個人存著的是死，給保羅存著的卻是冠冕。</p><p>ὁ τῆς δικαιοσύνης στέφανος（ho tēs dikaiosynēs stephanos） 的屬格可以讀成「以公義為冠冕」、「因公義而得的冠冕」或「公義的審判者所賜的冠冕」，句子後半 ὁ δίκαιος κριτής（ho dikaios kritēs） 支持第三種。στέφανος（stephanos） 是競賽得勝者頭上的花冠，不是君王的 διαδήματα（diadēmata）。ἀποδώσει（apodōsei） 是「還給、償付」，同一個動詞六節之後用在亞歷山大身上（4:14）。最後的 τοῖς ἠγαπηκόσι（tois ēgapēkosi） 是完成式分詞：已經愛上、而且一直愛著他顯現的人；與 4:10 底馬 ἀγαπήσας τὸν νῦν αἰῶνα（agapēsas ton nyn aiōna） 對看，兩種愛，兩個方向。</p>","exp":"<p>「那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。」（4:7）這三句話是全卷的終點，也是保羅一生的總結。可是他用的不是「我贏了」，是「我打過了、跑盡了、守住了」。</p><p>得勝的定義在這裡被改寫了。不是贏得多，是守得住、跑得完。保羅這時候在人眼中是一個失敗者：亞細亞的人離棄他（1:15），同工散了，自己戴著鎖鍊，快要被處死。但他說，賽程跑完了。馬拉松最後一名衝過終點，也是跑完了；主看的不是名次，是有沒有跑到底。321 說的「得勝者」，經文根據不是一張戰績表，是這三個完成式。</p><p>「從此以後，有公義的冠冕為我存留，就是按著公義審判的主到了那日要賜給我的；不但賜給我，也賜給凡愛慕他顯現的人。」（4:8）羅馬有一個不公義的法官要判他死刑；天上有一位「按著公義審判的主」要給他冠冕。地上的判決書不是最後一張。</p><p>冠冕是花冠，不是王冠。競技場上，花冠不分貴族奴隸，只看有沒有跑完。所以保羅緊接著說「不但賜給我」：這個冠冕不是使徒專用的，是給「凡愛慕他顯現的人」。雅各說「生命的冠冕」（雅 1:12），彼得說「永不衰殘的榮耀冠冕」（彼前 5:4），主自己說「我就賜給你那生命的冠冕」（啟 2:10）。冠冕有很多名字，頒獎的都是同一位。</p><p>所以這兩節的焦點不是保羅多了不起。他之所以打得完，是因為九節之後他說「惟有主站在我旁邊，加給我力量」（4:17）。先有主站在旁邊，才有「我已經打過了」。這就是 321 說的「改變觀點」：從暫時的眼光換成永恆的眼光，從「我還剩甚麼」換成「主為我存留甚麼」。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">Σπούδασον ἐλθεῖν πρός με ταχέως·</p><p lang=\"grc\">Δημᾶς γάρ με ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·</p>","lit":"<p>你要盡力快快到我這裡來；</p><p>因為底馬離棄了我，他愛了這現今的世代，就往帖撒羅尼迦去了；革勒士往加拉太，提多往撻馬太；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Σπούδασον ἐλθεῖν πρός με ταχέως</td><td>Spoudason elthein pros me tacheōs</td><td>你要盡力快快到我這裡來</td><td>4:21 再說一次：冬天以前</td></tr><tr><td>Δημᾶς γάρ με ἐγκατέλιπεν</td><td>Dēmas gar me enkatelipen</td><td>因為底馬離棄了我</td><td>4:16 ἐγκατέλιπον 同一個動詞</td></tr><tr><td>ἀγαπήσας τὸν νῦν αἰῶνα</td><td>agapēsas ton nyn aiōna</td><td>愛了這現今的世代</td><td>對照 4:8 ἠγαπηκόσι</td></tr><tr><td>Κρήσκης εἰς Γαλατίαν</td><td>Krēskēs eis Galatian</td><td>革勒士往加拉太</td><td>有抄本作 Γαλλίαν 高盧</td></tr><tr><td>Τίτος εἰς Δαλματίαν</td><td>Titos eis Dalmatian</td><td>提多往撻馬太</td><td>差派，不是離棄</td></tr></table>","gram":"<p>Σπούδασον（Spoudason） 是不定過去式命令語氣，「盡力、趕快」，配上 ταχέως（tacheōs）。4:21 又用一次 Σπούδασον（Spoudason），加上「冬天以前」。全段名單被兩個「快來」夾住：父親想見兒子。</p><p>4:10 的 γάρ（gar） 說明為甚麼要快：身邊的人走了。Δημᾶς γάρ με ἐγκατέλιπεν（Dēmas gar me enkatelipen），ἐγκατέλιπεν（enkatelipen） 是「撇下、丟下不管」，同一個動詞在 4:16 說眾人「都離棄我」，在太 27:46 是主在十字架上說的「為甚麼離棄我」（太 27:46）。來 13:5 主應許「我總不撇下你，也不丟棄你」（來 13:5），「丟棄」原文 ἐγκαταλίπω（enkatalipō） 也是同一個字：人會 ἐγκατέλιπεν（enkatelipen），主不會。</p><p>原因用一個分詞說明：ἀγαπήσας τὸν νῦν αἰῶνα（agapēsas ton nyn aiōna）。這個分詞與 4:8 τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ（tois ēgapēkosi tēn epiphaneian autou） 是同一個動詞 ἀγαπάω（agapaō）：兩種愛，兩個方向。一個愛「現今的世代」，一個愛「他的顯現」；一個向後抓住現在，一個向前等候將來。</p><blockquote><p><strong>經文鑑別：</strong>SBLGNT 作 Γαλατίαν（Galatian），和合本「加拉太」；西乃抄本、C 抄本等作 Γαλλίαν（Gallian），即高盧。當時希臘文的 Γαλατία（Galatia） 本身也可以指高盧，所以兩個讀法可能指同一個地方。本講義照 SBLGNT 與和合本，不影響解經：革勒士與提多是被差去的，不是離棄。</p></blockquote>","exp":"<p>〔背景〕西 4:14（歌羅西書講義第 4 章）</p><p>「你要趕緊地到我這裡來。」（4:9）一個剛說完「那美好的仗我已經打過了」的人，下一句是：我想見你。屬靈的高峰之後，緊接著一個很人性的請求。保羅不是一尊雕像，是一個寂寞的父親。</p><p>「因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了；革勒士往加拉太去；提多往撻馬太去」（4:10）。底馬不是外人。保羅第一次坐監時，他和路加並列：「所親愛的醫生路加和底馬問你們安」（西 4:14），門 24 也稱他為同工。本系列歌羅西書講義第 4 章講過這一份名單。幾年之後，同一張名單上，路加留下，底馬走了。</p><p>保羅沒有詳述底馬做錯了甚麼，只用一個字說明他的方向：他愛的對象換了。這不是用來論斷人的經文。我們不知道底馬後來怎樣，保羅也沒有說他一定沉淪；這張名單不是用來點名今天任何一個離開教會、離開事奉的人。它是一面鏡子：我愛慕的是他的顯現，還是現今的世界？兩種愛常常住在同一顆心裡，日子久了，總有一種會把人帶走。</p><p>名單上其他的人也要看清楚：革勒士與提多不是離棄，是被差出去。不在身邊的人，不一定是背叛；同工散在各地，是事工本來的樣子。這也使我們想起 321 說的「人比事重要」：一個快要離世的人，最在乎的是人，誰走了，誰還在，誰可以來。</p>"},{"a":11,"z":13,"star":2,"grk":"<p lang=\"grc\">Λουκᾶς ἐστιν μόνος μετʼ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,</p><p lang=\"grc\">Τυχικὸν δὲ ἀπέστειλα εἰς Ἔφεσον.</p><p lang=\"grc\">τὸν φαιλόνην, ὃν ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.</p>","lit":"<p>路加獨自與我同在。你要把馬可接上，帶著與你同來，因為他對我在服事上是有用的。</p><p>而推基古我已經差往以弗所去了。</p><p>那件外衣，就是我留在特羅亞加布那裡的，你來的時候要帶來，還有那些書卷，尤其是那些皮卷。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Λουκᾶς ἐστιν μόνος μετʼ ἐμοῦ</td><td>Loukas estin monos met' emou</td><td>路加獨自與我同在</td><td>μόνος：只剩一個</td></tr><tr><td>Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ</td><td>Markon analabōn age meta seautou</td><td>把馬可接上，帶著同來</td><td>沿路把他接上</td></tr><tr><td>εὔχρηστος εἰς διακονίαν</td><td>euchrēstos eis diakonian</td><td>在服事上有用</td><td>和合本註腳：或譯「服事我」</td></tr><tr><td>τὸν φαιλόνην</td><td>ton phailonēn</td><td>那件外衣</td><td>新約只此一次：厚斗篷</td></tr><tr><td>τὰ βιβλία μάλιστα τὰς μεμβράνας</td><td>ta biblia malista tas membranas</td><td>書卷，尤其是皮卷</td><td>μεμβράνα：拉丁外來字，羊皮紙</td></tr></table>","gram":"<p>Λουκᾶς ἐστιν μόνος μετʼ ἐμοῦ（Loukas estin monos met' emou）：μόνος（monos） 放在 ἐστιν（estin） 之後，像一聲嘆息。下一句沒有任何連接詞，直接轉到馬可：Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ（Markon analabōn age meta seautou）。分詞 ἀναλαβὼν（analabōn） 是「接上、帶起」，提摩太從以弗所北上，沿路要把馬可接上。</p><p>理由由 γάρ（gar） 引出：ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν（estin gar moi euchrēstos eis diakonian）。εὔχρηστος（euchrēstos） 是「好用、合用」，本卷 2:21 說人若自潔，就作貴重的器皿，「合乎主用」（2:21），原文是同字根的 εὔχρηστον（euchrēston）。保羅給馬可的評語，正是他給「貴重器皿」的評語。</p><blockquote><p><strong>和合本註腳：</strong>εἰς διακονίαν（eis diakonian） 和合本作「在傳道的事上」，註腳作「或譯：服事我」。διακονία（diakonia） 可以指廣義的事奉與傳道，也可以指對保羅個人的服事，μοι（moi） 兩讀都講得通。本講義兩讀並存：馬可對福音的事工有用，也對一個坐監的老人有用；兩件事在保羅身上本來就分不開。</p></blockquote><p>4:12 Τυχικὸν δὲ ἀπέστειλα（Tychikon de apesteila）：推基古大概就是帶這封信去以弗所、接替提摩太的人（這使我們想起弗 6:21；多 3:12）。4:13 τὸν φαιλόνην（ton phailonēn） 新約只此一次，是一件厚的圓斗篷；τὰ βιβλία（ta biblia） 是書卷，μάλιστα τὰς μεμβράνας（malista tas membranas）「尤其是皮卷」，μεμβράνα（membrana） 是拉丁文借字，新約只此一次。皮卷可能是保羅的舊約抄本，也可能是他自己的筆記，經文沒有說。</p>","exp":"<p>〔背景〕徒 15:37--39（使徒行傳講義第 15 章）</p><p>「獨有路加在我這裡。你來的時候，要把馬可帶來，因為他在傳道的事上於我有益處。」（4:11）這是全卷最有盼望的一行。</p><p>本系列使徒行傳講義第 15 章講過那一場爭論：馬可第一次出去宣教就半途回家（徒 13:13），第二次巴拿巴要帶他，「但保羅因為馬可從前在旁非利亞離開他們，不和他們同去做工，就以為不可帶他去」（徒 15:38），「於是二人起了爭論，甚至彼此分開」（徒 15:39）。當年被保羅拒絕的年輕人，十幾年後被保羅指名請回來。中間有一段回轉的路：保羅第一次坐監時，馬可已經在他身邊（西 4:10；門 24）。</p><p>這一行說了兩個人的改變。馬可改變了：從半途離開的人，變成「有益處」的人。保羅也改變了：他願意寫下「於我有益處」，等於承認當年那個被他判定「不可帶」的人，如今是他最需要的。這就是 321 說的「謙卑帶動謙卑」。破裂的同工關係可以修復，不是因為誰贏了那場爭論，是因為兩邊都被主改變了。</p><p>「我在特羅亞留於加布的那件外衣，你來的時候可以帶來，那些書也要帶來，更要緊的是那些皮卷。」（4:13）這一節看起來最不屬靈，其實最真實。冬天要到了，羅馬的牢房很冷，他要一件外衣；他快死了，還要讀書。保羅不是苦修主義者，不美化冷和餓。一個被澆奠的人仍然是一個有需要的人：他要外衣、要書、要人。照顧自己的身體、承認自己需要同伴，不是不屬靈。</p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—</p><p lang=\"grc\">ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ἀντέστη τοῖς ἡμετέροις λόγοις.</p>","lit":"<p>銅匠亞歷山大向我顯出了許多惡事——主要照他的行為還給他——</p><p>你也要提防他，因為他極力抵擋了我們的話。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀλέξανδρος ὁ χαλκεὺς</td><td>Alexandros ho chalkeus</td><td>銅匠亞歷山大</td><td>是否即提前 1:20 那一位，並陳</td></tr><tr><td>πολλά μοι κακὰ ἐνεδείξατο</td><td>polla moi kaka enedeixato</td><td>向我顯出許多惡事</td><td>ἐνδείκνυμι：也可指出面告發</td></tr><tr><td>ἀποδώσει αὐτῷ ὁ κύριος</td><td>apodōsei autō ho kyrios</td><td>主要還給他</td><td>將來式直述；RP 作願望式 ἀποδῴη</td></tr><tr><td>ὃν καὶ σὺ φυλάσσου</td><td>hon kai sy phylassou</td><td>你也要提防他</td><td>關身語態：保護你自己</td></tr><tr><td>λίαν γὰρ ἀντέστη</td><td>lian gar antestē</td><td>因為他極力抵擋了</td><td>對照 4:17 παρέστη</td></tr></table>","gram":"<p>Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο（Alexandros ho chalkeus polla moi kaka enedeixato）：ἐνεδείξατο（enedeixato） 是「顯出、展示」，有學者認為帶法律意味，指他出面告發保羅，這可以解釋保羅為何突然被捕。經文沒有細說，本講義只並陳。</p><p><strong>這一節的關鍵是 ἀποδώσει（apodōsei）。</strong>SBLGNT、NA28 作 ἀποδώσει（apodōsei），將來式直述語氣：「主將要照他所行的還給他」，是陳述一件確定的事。RP 作 ἀποδῴη（apodōē），願望語氣：「願主報應他」，就成了一句祈願。和合本「主必照他所行的報應他」跟從將來式。本講義照 SBLGNT：這不是咒詛，是一句交託。κατὰ τὰ ἔργα αὐτοῦ（kata ta erga autou） 的語句幾乎是詩篇的回音：「因為你照著各人所行的報應他」（詩 62:12）。保羅不是發明一句詛咒，是引用以色列人一向相信的公義。</p><p>更值得注意的是 ἀποδώσει（apodōsei） 這個字六節之前才出現過：4:8 主要把冠冕 ἀποδώσει（apodōsei） 給保羅。同一位主、同一個動詞：還給保羅的是冠冕，還給亞歷山大的是他所行的。賞與罰都在那一位「按著公義審判的主」手裡，不在保羅手裡。</p><p>4:15 ὃν καὶ σὺ φυλάσσου（hon kai sy phylassou） 是關身語態的命令：你自己要提防。λίαν γὰρ ἀντέστη τοῖς ἡμετέροις λόγοις（lian gar antestē tois hēmeterois logois），ἀντέστη（antestē） 是「站在對面」，兩節之後主卻 παρέστη（parestē）「站在旁邊」。3:8 雅尼佯庇「敵擋」摩西，原文 ἀνθίστανται（anthistantai） 也是同一個字根。</p>","exp":"<p>〔提前〕提前 1:20（提摩太前書講義第 1 章）</p><p>〔背景〕徒 19:33（使徒行傳講義第 19 章）</p><p>「銅匠亞歷山大多多地害我；主必照他所行的報應他。」（4:14）亞歷山大是誰？提前 1:20 有一個亞歷山大，在以弗所被保羅「交給撒但」；徒 19:33 也有一個亞歷山大，在以弗所暴動中被推上前。這個名字當時很常見，本講義並陳：與提前 1:20 是同一人的可能性較高，與徒 19:33 是否同一人較難斷定。不論是誰，他的身分不是重點，保羅怎樣處理他才是重點。</p><p>4:14 不能讀成「求神報應仇敵」。原文是將來式直述，不是祈願，保羅是把這筆帳交給主，而不是自己去討。這正是「親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19）的實踐，也是主耶穌受害時的樣子：「只將自己交託那按公義審判人的主」（彼前 2:23）。把報應交給主，自己的心就不必被仇恨綁住。</p><p>要把這一節與 4:16 並看。兩節之後，保羅說到那些在法庭上離棄他的人：「但願這罪不歸與他們」（4:16）。原文那一句才用願望語氣。保羅的祈願是赦免，保羅的直述是交託；他沒有一句話是在求主懲罰誰。這不是說傷害不重要，傷害是真的，「多多地害我」；但真實的傷害交到公義的主手裡，人才能真實地放下。</p><p>「你也要防備他，因為他極力敵擋了我們的話。」（4:15）交託不等於天真。保羅提醒提摩太要保護自己，遠離繼續傷害人的人。饒恕與防備可以同時存在；受到威脅的人先保護生命、依法求助，不是沒有愛心。這兩節也不給講台在今天點名任何曾經傷害教會的人。</p>"},{"a":16,"z":17,"star":3,"grk":"<p lang=\"grc\">Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι παρεγένετο ἀλλὰ πάντες με ἐγκατέλιπον μὴ αὐτοῖς λογισθείη—</p><p lang=\"grc\">ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα διʼ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.</p>","lit":"<p>在我第一次申辯的時候，沒有一個人到我身邊，反倒眾人都離棄了我——願這不被算在他們身上——</p><p>但主站在我旁邊，並且加給我能力，好叫藉著我，那宣講得以完全盡滿，並且萬國都聽見；我也從獅子的口裡被救了出來。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐν τῇ πρώτῃ μου ἀπολογίᾳ</td><td>En tē prōtē mou apologia</td><td>在我第一次申辯時</td><td>法庭上的初審答辯</td></tr><tr><td>οὐδείς μοι παρεγένετο</td><td>oudeis moi paregeneto</td><td>沒有一個人到我身邊</td><td>沒有辯護人，也沒有證人</td></tr><tr><td>μὴ αὐτοῖς λογισθείη</td><td>mē autois logistheiē</td><td>願這不被算在他們身上</td><td>願望語氣；λογίζομαι 是記帳的字</td></tr><tr><td>ὁ δὲ κύριός μοι παρέστη</td><td>ho de kyrios moi parestē</td><td>但主站在我旁邊</td><td>δέ 轉折；徒 27:23 同一形</td></tr><tr><td>ἐνεδυνάμωσέν με</td><td>enedynamōsen me</td><td>加給我能力</td><td>2:1 ἐνδυναμοῦ 同一個動詞</td></tr><tr><td>τὸ κήρυγμα πληροφορηθῇ</td><td>to kērygma plērophorēthē</td><td>那宣講得以盡滿</td><td>4:2 κήρυξον、4:5 πληροφόρησον 在此會合</td></tr><tr><td>ἐρρύσθην ἐκ στόματος λέοντος</td><td>errysthēn ek stomatos leontos</td><td>從獅子口裡被救出來</td><td>不定過去式被動：已經發生的拯救</td></tr></table>","gram":"<p>Ἐν τῇ πρώτῃ μου ἀπολογίᾳ（En tē prōtē mou apologia）：ἀπολογία（apologia） 是法庭上的答辯。多數解經家認為這是本次監禁的初審；也有人認為指徒 28 那一次的羅馬受審，但那時保羅身邊並不缺人（腓 1:14）。本講義採前者。</p><p>οὐδείς μοι παρεγένετο ἀλλὰ πάντες με ἐγκατέλιπον（oudeis moi paregeneto alla pantes me enkatelipon）：「沒有一個……眾人都」，兩個全稱詞相撞。ἐγκατέλιπον（enkatelipon） 與 4:10 底馬的 ἐγκατέλιπεν（enkatelipen） 是同一個動詞。接著一句插入語：μὴ αὐτοῖς λογισθείη（mē autois logistheiē）。λογισθείη（logistheiē） 是不定過去式願望語氣，λογίζομαι（logizomai） 是記帳、算在某人名下的字，羅馬書第 4 章「算為義」用的就是它。保羅的祈願是：這筆帳不要記在他們名下。</p><p><strong>4:17 以 ὁ δὲ κύριός（ho de kyrios） 開頭，δέ（de） 是全卷最重的一個轉折。</strong>παρέστη（parestē） 是 παρίστημι（paristēmi） 的不定過去式，「站在旁邊」，在法庭上就是辯護人或支持者站的位置。徒 27:23 船要沉的那一夜，保羅說神的使者 παρέστη γάρ μοι（parestē gar moi），「他的使者昨夜站在我旁邊」（徒 27:23），同一個字形。對照 4:15 亞歷山大 ἀντέστη（antestē）「站在對面」：有人站在對面，有人走開，主站在旁邊。</p><p>ἐνεδυνάμωσέν με（enedynamōsen me） 與 2:1 ἐνδυναμοῦ（endynamou） 同一個動詞，本卷第二條追蹤在這裡落地：保羅叫提摩太「在恩典上剛強起來」，自己在法庭上正是這樣被剛強。ἵνα（hina） 子句 τὸ κήρυγμα πληροφορηθῇ（to kērygma plērophorēthē） 把 4:2 的 κήρυξον（kēryxon） 與 4:5 的 πληροφόρησον（plērophorēson） 收在一起。最後 ἐρρύσθην ἐκ στόματος λέοντος（errysthēn ek stomatos leontos），獅子口可能是比喻致命的危險，也有人認為指尼祿或撒但（彼前 5:8），本講義採比喻的讀法。</p>","exp":"<p>「我初次申訴，沒有人前來幫助，竟都離棄我；但願這罪不歸與他們。」（4:16）這是全卷的最低處之一。一個為福音走遍半個帝國的人，在最需要有人站出來的時候，回頭一看，一個人都沒有。</p><p>可是他接著說的話，這使我們想起另一個法庭外的場景。司提反被石頭打的時候跪下說：「主啊，不要將這罪歸於他們！」（徒 7:60）那一天，「作見證的人把衣裳放在一個少年人名叫掃羅的腳前」（徒 7:58）。本系列使徒行傳講義第 7 章講過這一幕。三十多年後，當年看守衣裳的掃羅，在自己被眾人離棄的時候，說出了司提反的禱告。被主改變的人，最後連饒恕的話都長得像他的主。這不是叫被傷害的人立刻假裝沒事，是讓我們看見：主能把一個人改變到這個地步。</p><p>「惟有主站在我旁邊，加給我力量，使福音被我盡都傳明，叫外邦人都聽見；我也從獅子口裡被救出來。」（4:17）全卷四座山，這是最高的一座。環境全空了，焦點只剩下主。這就是 321 說的「焦點在耶穌」：不在自己有多孤單，不在別人怎樣離開，不在法庭多可怕，在那一位站在旁邊的主。</p><p>主站在旁邊做了甚麼？不是讓保羅無罪釋放，是「加給我力量，使福音被我盡都傳明」。被告席變成了講台。一個囚犯在帝國的法庭上把福音講完了，叫外邦人都聽見。這使我們想起主多年前在耶路撒冷的應許：「當夜，主站在保羅旁邊，說：『放心吧！你怎樣在耶路撒冷為我作見證，也必怎樣在羅馬為我作見證。』」（徒 23:11）</p><p>讀到這裡，會眾記得的不應該是「保羅好勇敢」，而是「主沒有走」。每一個在醫院、在法庭、在空蕩蕩的房間裡覺得被所有人遺忘的人，都可以聽見這一句：惟有主，站在我旁邊。</p>"},{"a":18,"z":18,"star":3,"grk":"<p lang=\"grc\">ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.</p>","lit":"<p>主要救我脫離一切惡的作為，並且要拯救我進入他那屬天的國度；願榮耀歸給他，直到眾世代的世代，阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ῥύσεταί με ὁ κύριος</td><td>rhysetai me ho kyrios</td><td>主要救我</td><td>將來式；4:17 ἐρρύσθην 是過去式</td></tr><tr><td>ἀπὸ παντὸς ἔργου πονηροῦ</td><td>apo pantos ergou ponērou</td><td>脫離一切惡的作為</td><td>回音：太 6:13 ῥῦσαι</td></tr><tr><td>σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον</td><td>sōsei eis tēn basileian autou tēn epouranion</td><td>要拯救我進入他屬天的國度</td><td>εἰς：救「進」，不只是救「出」</td></tr><tr><td>ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων</td><td>hō hē doxa eis tous aiōnas tōn aiōnōn</td><td>願榮耀歸給他，直到眾世代的世代</td><td>全卷唯一的頌讚</td></tr><tr><td>ἀμήν</td><td>amēn</td><td>阿們</td><td>在最低處唱出的阿們</td></tr></table>","gram":"<p><strong>4:17 的 ἐρρύσθην（errysthēn） 是過去式，4:18 的 ῥύσεταί（rhysetai） 是將來式，兩個是同一個動詞。</strong>上一次，主把他從獅子口裡救出來；這一次，他知道自己逃不過死刑，卻仍然說 ῥύσεταί με ὁ κύριος（rhysetai me ho kyrios）。3:11 保羅也說「主都把我救出來了」，原文 ἐρρύσατο（errysato）。「救」這個字在保羅身上用了兩個時態：過去式是一再經歷過的拯救，將來式是最後的盼望。</p><p>ἀπὸ παντὸς ἔργου πονηροῦ（apo pantos ergou ponērou） 使人想起主禱文的最後一句，ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ（rhysai hēmas apo tou ponērou），「救我們脫離凶惡」（太 6:13）。保羅臨終的盼望，是一個一生都在禱告這句話的人得到的答案。</p><p>關鍵在第二個動詞：καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον（kai sōsei eis tēn basileian autou tēn epouranion）。σώσει（sōsei） 後面接的不是 ἀπό（apo）「脫離」，是 εἰς（eis）「進入」。這是一個濃縮的句法：救，是把人安全地帶進去。4:1 保羅憑著「他的國度」囑咐提摩太，4:18 他自己要被救進那個國度。</p><p>最後是頌讚：ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων（hō hē doxa eis tous aiōnas tōn aiōnōn）, ἀμήν（amēn）。關係代名詞 ᾧ（hō） 指前面的 ὁ κύριος（ho kyrios），就是站在他旁邊的主基督；彼後 3:18 也是一首直接歸給基督的頌讚。還有一個對照：4:10 底馬愛的是 τὸν νῦν αἰῶνα（ton nyn aiōna），這個現今的世代；保羅頌讚的是 εἰς τοὺς αἰῶνας τῶν αἰώνων（eis tous aiōnas tōn aiōnōn），世代的世代。</p>","exp":"<p>「主必救我脫離諸般的凶惡，也必救我進他的天國。願榮耀歸給他，直到永永遠遠。阿們。」（4:18）這是全卷唯一的一首頌讚。講到這裡，要停下來。</p><p>要停，因為這首頌讚是在最低的地方唱出來的。兩節之前才說「竟都離棄我」（4:16），他知道自己快被處死，同工散了，冬天要到了。人在這個時候最自然的一句話是「為甚麼」；保羅最後的一句話卻是「願榮耀歸給他」。第 2 章那首「可信的話」是在被捆綁之後唱的（2:9--13），這首頌讚是在眾人離棄之後唱的。兩處都在谷底，越往下走，主越近。</p><p>這裡有全卷最深的一個改變觀點：「救」不是免死。保羅說「主必救我」，同時清楚知道自己快要被殺。他的意思不是「主會讓我不死」，是「主會帶我進天國」。對信的人來說，最終的拯救不是被救出某一個困境，是被救進他的國。這句話對每一個病到最後的弟兄姊妹，對每一個為親人禱告卻沒有等到醫治的家庭，都是真的：主沒有失信，他的救恩比我們求的更遠。</p><p>這就是 321 說的「讓耶穌得榮耀」，也是「讓耶穌作王」：一個被眾人離棄、要被帝國處死的人，最後一句話把榮耀歸給另一位王，而且是「直到永永遠遠」。羅馬的帝國早已不在，這一首頌讚還在被唱。</p><p>這一節也給每一個正在谷底的人一個次序。保羅沒有等到處境變好才頌讚，他是在處境最壞的時候，先想起主過去怎樣救他（4:17），再望見主將來要帶他進國（4:18），然後就唱了。回頭看見主的手，往前看見主的國，中間的苦就有了邊界。頌讚不是否認痛苦，是在痛苦中認出誰是王。</p>"},{"a":19,"z":22,"star":1,"grk":"<p lang=\"grc\">Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.</p><p lang=\"grc\">Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.</p><p lang=\"grc\">Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.</p><p lang=\"grc\">Ὁ κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθʼ ὑμῶν</p>","lit":"<p>你要問候百基拉和亞居拉，以及阿尼色弗的家。</p><p>以拉都留在哥林多，特羅非摩我留在米利都，他正在生病。</p><p>你要盡力在冬天以前來。友布羅和布田和利奴和革老底亞和眾弟兄都問候你。</p><p>主與你的靈同在。恩典與你們同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν</td><td>Aspasai Priskan kai Akylan</td><td>你要問候百基拉和亞居拉</td><td>妻子的名字又放在前面</td></tr><tr><td>τὸν Ὀνησιφόρου οἶκον</td><td>ton Onēsiphorou oikon</td><td>阿尼色弗的家</td><td>1:16 回音</td></tr><tr><td>Τρόφιμον δὲ ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα</td><td>Trophimon de apelipon en Milētō asthenounta</td><td>特羅非摩生病，我留他在米利都</td><td>保羅沒有醫好他</td></tr><tr><td>Σπούδασον πρὸ χειμῶνος ἐλθεῖν</td><td>Spoudason pro cheimōnos elthein</td><td>要盡力在冬天以前來</td><td>冬天封海；與
