內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：3:2--5 的清單是先照自己的鏡子；3:11 被記住的是救人的主；3:16--17 四個用處有兩個是扶正，目的是叫屬神的人得以完全。"],["n","1. ★ 開場那兩句話，聖經是拿來對付錯誤的人用的、讀經就是要找到答案，哪一句你比較常在自己身上看見？說一次最近的例子：在哪裡、對誰。"],["n","2. ★★★ 請用自己的話說：為甚麼 3:2 的清單從專顧自己開始、在愛宴樂不愛神結束？這張清單拿來照別人和拿來照自己，結果有甚麼不同？"],["n","3. ★★ 保羅說主都把他救出來了，可是他在路司得還是被石頭打了。對你來說，被救出來和沒有受傷，有甚麼不一樣？"],["n","4. ★★ 督責像 X 光片，歸正像夾板。你經歷到的聖經，比較像 X 光片、夾板，還是棍子？說一件事。"],["m","帶領提醒：不排時間表、不評論任何時事是不是應驗；不把清單貼在任何世代、宗派、政黨或講員身上；默示論或譯本的問題，一句指向議題頁，不在組裡辯論。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：每一個人照一次鏡子，說出一個一直沒有讓神碰的地方，和這一週要被扶直的第一步。"],["t","【看】看見自己"],["n","5. ★★★ 從 3:2--5 的十八項裡，挑一項你最不想承認、卻在這個月出現過的。說出是哪一項，以及它出現在家裡、公司、教會還是群組裡。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:14--17 兩遍。哪一個詞讓你停下來：存在心裡、跟誰學的、使人歸正，還是得以完全？今天它對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 有哪一件事，你聽過很多道、上過很多課，卻一直沒有讓神碰？是甚麼讓你卡在那裡：怕失去、怕丟臉，還是覺得反正改不了？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：那一張清單，我先拿來照我自己。然後說出這一週你要被扶直的那一個地方，不必說細節。右手邊的人只回一句「主扶你起來」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的第一步：哪一天、在哪裡、對哪一個人、做哪一件事；如果你曾經拿經文指著某個人說話，也寫下你要在甚麼時候、用哪一句話把口氣收回來。"],["m","帶領提醒：這一化可能碰到被人拿經文定罪的傷、家庭暴力、父母的自責與長期無望感。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」。若有人說出仍在暴力、威脅或控制之中，不在組裡處理，會後單獨關心，先確認他現在是否安全，必要時協助他聯絡求助專線與法律管道，並協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一節經文、一通道謝的電話、一位要陪的人、一位要講給他聽的朋友。"],["n","10. ★★ 說出教你信仰的那一位的名字。這一週星期幾、用電話、訊息還是當面，你要告訴他你一直記得他生命裡的哪一個片段？若他已經不在，就寫在聖經扉頁上。"],["n","11. ★ 這一週你每天早上幾點、在哪裡讀 3:14--17 其中一節？讀完你要問主的那一句話是甚麼？"],["n","12. ★★ 這一週收到末世到了的轉發時，你要回給誰、用哪一句溫和的話？省下來的時間要讀哪一章？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位家裡只有他一個人信主、或剛信主不久的人。當場說出他的名字，說出這一週哪一天、在哪裡，你要和他一起讀 3:14--15。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，聖經不是拿來對付別人的武器，是神先用來扶直我自己的話。第二句，它像一副夾板，把斷掉的人固定在可以癒合的地方。第三句，這本書從頭到尾都在指向耶穌，他能把人從一切苦難裡救出來。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多讀經」這類答案；不評斷任何不在場的人。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週你要讓神先扶直的那一個地方。"],["p","然後彼此代禱，為三種人指名禱告：一位家裡只有他一個人信主的人，一對兒女還沒有信主的父母，一位正被恐嚇式末世訊息牽著走的人。"],["p","最後由組長慢慢讀一遍：「叫屬神的人得以完全，預備行各樣的善事。」（3:17）"]]},"4":{"no":4,"vol":"《321提摩太後書講義》第四課·提摩太後書第四章","title":"惟有主站在我旁邊——外衣、馬可、花冠","chars":4859,"min":60,"deep":8,"dchars":1742,"tchars":1250,"blocks":[["h","一、一封信的最後幾行"],["p","弟兄姊妹平安。設想有一封信，是一位八十多歲的老弟兄住院的最後一個星期，請護士替他拿來紙筆，一筆一筆寫給家人的。字歪歪斜斜，只有短短幾行：「陽台那盆蘭花，一個星期澆一次水，不要多。我那件灰色的毛背心，冬天給小弟穿。書架第二層那本舊聖經，留給阿明。還有，你們兄弟倆，找個時間一起吃頓飯。爸爸。」"],["p","家人讀完，愣了很久。他們以為一個要走的人，最後會交代大事：房子怎麼分，存款怎麼辦，喪禮要怎樣辦。結果他交代的是一盆蘭花、一件背心、一本書，和一頓飯。可是讀過這種信的人都知道，那幾件小事一點也不小。一個人到了最後，才看得清甚麼是真的要緊。"],["p","保羅的最後一封信，最後一章也是這樣。前面有最莊嚴的囑咐，有「那美好的仗我已經打過了」這樣的句子；可是信的末了，他寫的是一件外衣、幾卷書、一些皮卷，還有一個名字：「你來的時候，要把馬可帶來，因為他在傳道的事上於我有益處。」（4:11）一件取暖的衣服，一些要讀的書，一個曾經和他鬧翻、如今他想見的人。"],["p","全卷四章四個字：火、兵、經、冠。裡面的火挑旺了，外面的苦同受了，亂世中有聖經作準則，今天走到最後一個字：冠，人生的終點。可是我要先把這一課的答案說出來：這封遺書最要緊的一句，不是保羅說他做到了甚麼，是他說「惟有主站在我旁邊，加給我力量」（4:17）。這一課跟著本章走三步：交到你手上的棒、一張臨終的名單、一位站在旁邊的主。"],["d",["外衣、書、皮卷這些生活瑣事，為甚麼會被寫進聖經？讀它對今天的我有甚麼用？","因為神的話不只說到天上的事，也說到一個人在牢房裡會冷、會想讀書、會想見人。4:13 讓我們看見，一個被澆奠的使徒仍然是一個有需要的人；照顧身體、要求幫助、想念朋友，都不是不屬靈。對今天的讀者，這一節至少有三個用處。第一，它保護累壞的服事者：休息、添衣、讀書，是聖經裡最屬靈的人也做的事。第二，它提醒我們留意身邊的人缺甚麼，常常不是一篇道理，是一件外衣、一頓飯、一次探望。第三，「更要緊的是那些皮卷」，一個快走完的人還在讀，學習沒有退休的年紀。"]],["h","二、交到你手上的棒：你卻要"],["p","第四章一開頭，保羅的語氣變得很重：「我在神面前，並在將來審判活人死人的基督耶穌面前，憑著他的顯現和他的國度囑咐你」（4:1）。一個很快要站在羅馬法官面前的囚犯，請出另一位審判者來作證。地上的法庭會判他死刑，可是還有一個法庭，那裡坐著要來的王。審判二字在這裡不是用來嚇人，是用來定錨的：傳道的人最後要向一位交帳，所以不必向眾人的掌聲交帳。"],["p","然後是一連五個命令，沒有一個連接詞，像一個沒有時間多說的父親：「務要傳道，無論得時不得時，總要專心，並用百般的忍耐、各樣的教訓責備人，警戒人，勸勉人。」（4:2）「總要專心」原文是站上崗位；四節之後保羅說「我離世的時候到了」，「到了」是同一個動詞的完成式，那個時候已經站到他面前。一個要下崗，一個要上崗，棒正在從一隻手交到另一隻手。"],["p","為甚麼急？因為「時候要到，人必厭煩純正的道理，耳朵發癢，就隨從自己的情慾增添好些師傅」（4:3）。這裡說的不是不聽道的人，是很愛聽道、卻只挑順耳的人。這一節很容易被拿去指認今天的某一位講員、某一間教會，請不要這樣用。保羅沒有叫提摩太去點名，他接著說的是：「你卻要凡事謹慎，忍受苦難，做傳道的工夫，盡你的職分。」（4:5）別人的耳朵在癢，你卻不必跟著；別人換師傅，你卻不換福音。這面鏡子要先照自己：聽到扎心的經文，我是悔改，還是轉台？"],["p","接著保羅說到自己：「我現在被澆奠，我離世的時候到了。」（4:6）奠祭是倒在祭壇上的酒，倒下去就收不回來。這裡要說清楚，澆奠是把自己倒給主，不是讓任何人或任何體制把你榨乾。寫這一句的人，同一章裡要外衣取暖、要書來讀、要同伴來陪；被倒出來的人，也會吃飯、睡覺、求助。「離世」原文是解纜：從岸上看，船離開了；從船上看，船出發了。"],["p","「那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。」（4:7）三個完成式，沒有一句是我贏了多少。得勝的定義在這裡被改寫：不是贏得多，是守得住、跑得完。而冠冕是競賽得勝者頭上的花冠，不是王冠，保羅還特別加一句「不但賜給我，也賜給凡愛慕他顯現的人」（4:8）。跑完自己那一段的人，都有一份。"],["d",["4:2 說無論得時不得時，是不是表示傳福音可以不看場合、不顧對方的處境？","不是。「得時不得時」說的是不看氣氛決定忠心，不是不看人決定方式。同一封信說主的僕人不可爭競，只要溫溫和和地待眾人；4:2 的責備旁邊也放著百般的忍耐。所以在喪禮上逼家屬決志、在同事的婚宴上大聲責備人，都不是這一節的意思。它真正對付的是另一件事：我們常常只在大家愛聽、自己狀態好的時候才開口。帶這一題可以請組員分享：你有沒有一次因為氣氛不對就把該說的話吞回去？下一次在甚麼場合，可以用溫和的方式說出來？"]],["d",["我服事得很累，怎樣分辨自己是在被澆奠，還是已經過勞、需要停下來？","可以問三個問題。第一，倒給誰：我是把自己倒給主，還是為了不讓某個人失望、為了撐住某個體制的期待？第二，有沒有界線：我還吃得下、睡得著嗎？家人是否已經長期在哭、在等？第三，有沒有同伴：我是一個人扛，還是有人可以分擔、接手？保羅在被澆奠的同時要外衣、要書、要同伴，也把生病的特羅非摩留下休養。若你連續幾個月失眠、情緒低落、對一切失去興趣，那不是不夠屬靈，是身心在求救，請告訴你的牧者，也去看醫生或輔導；暫停服事不是背叛，是讓你能把那一段跑完。本講義的全卷立場見 ISS00_2。"]],["h","三、原文亮光：撇下、合用、還給"],["p","第九節開始，信忽然從天上掉回牢房：「你要趕緊地到我這裡來。」（4:9）剛說完冠冕的人，下一句是我想見你。接下來是一張名單，有人走了，有人留下，有人被請回來。這一課從名單裡拆三個原文字，主日講章已經講過的澆奠、解纜、花冠，這裡不再重複。"],["p","第一個是 ἐγκατέλιπεν（enkatelipen），撇下。「底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」（4:10），六節之後，「沒有人前來幫助，竟都離棄我」（4:16），是同一個動詞，撇下、丟下不管。請再聽兩處：主在十字架上喊「為甚麼離棄我」（太 27:46），用的是這個字；希伯來書說「我總不撇下你，也不丟棄你」（來 13:5），「丟棄」還是這個字。人會撇下人，主被撇下過，所以他應許不撇下。被撇下的那一夜，你不是站在一個主不懂的地方。"],["p","還要提醒一件事：底馬曾經是同工，在保羅第一次坐監時，他和路加的名字排在一起。保羅沒有說底馬的結局，只說他愛的方向換了，「貪愛」和第八節「愛慕他顯現」是同一個愛字。這不是一張論斷別人的名單，是一面照自己的鏡子：我心裡的愛，今天朝哪一個方向？名單上的革勒士和提多也不是離棄，是被差出去；不在身邊的人，不一定是背叛。"],["p","第二個是 εὔχρηστος（euchrēstos），合用。保羅說馬可「於我有益處」，原文就是好用、合用。這個字根本卷出現過一次：人若自潔，「就必作貴重的器皿，成為聖潔，合乎主用」（2:21）。保羅給馬可的評語，正是他給貴重器皿的評語。當年他對馬可的判斷是另一句話：「但保羅因為馬可從前在旁非利亞離開他們，不和他們同去做工，就以為不可帶他去。」（徒 15:38）十幾年後，那個「不可帶」的人，成了「合乎主用」的人。"],["p","這一行有兩個人改變了。馬可改變了，從半途回家的人，變成合用的器皿；保羅也改變了，他願意把當年的判斷改寫進自己最後的信裡。謙卑帶動謙卑。還有第三個人：保羅說「要把馬可帶來」，原文是沿路把他接上，提摩太要繞路去接人。兩人的修復在保羅第一次坐監時已經開始；修復之後，還需要有人願意繞路，把人接回到旁邊來。"],["p","第三個是 ἀποδώσει（apodōsei），還給。「銅匠亞歷山大多多地害我；主必照他所行的報應他。」（4:14）這個字在 4:8 剛出現過：主要把冠冕「賜給」我，同一個動詞，同樣是將來式直述，不是祈願。所以這一句不是咒詛，是交託：賞與罰都在那位按著公義審判的主手裡，不在保羅手裡。下一節保羅還說「你也要防備他」（4:15），交託不等於天真，饒恕和保護自己可以同時存在。"],["d",["底馬離開了，後來怎樣？今天離開教會、離開事奉的人，我們該怎樣看？","經文沒有說底馬的結局，我們也不該替他寫。保羅只說他「貪愛現今的世界」，愛的方向換了；兩節之後他對離棄他的眾人說「但願這罪不歸與他們」。今天離開的人，原因有千百種：有人是愛錯了方向，有人是累垮了，也有人是被教會傷害才走的。所以小組裡談這一題，不點名、不猜測任何人。我們能做的有三件事：先照自己的心，我愛慕的是他的顯現，還是現今的世界；為離開的人禱告，不在背後議論；讓門一直開著，像保羅請回馬可一樣，讓想回來的人知道有路回來。"]],["d",["保羅和馬可和好了，那我是不是也要馬上原諒傷害我的人，回到原來的關係？","不一定，也不必馬上。保羅和馬可的修復，是十幾年裡兩個人都被主改變的結果；在保羅第一次坐監時，馬可已經回到他身邊，這是一條慢慢走的路，不是一次被要求的和好。饒恕是把報應交給主，不再自己討帳；和好是雙方重建信任，需要對方真實的改變。兩件事可以分開。若對方仍在傷害你，4:15 說要防備他，安全先於和好，界線也是愛。若傷害涉及暴力或侵害，請先保護自己，必要時尋求專業與法律的協助。你可以先禱告：主啊，我還做不到，但我願意把這筆帳交給你。"]],["h","四、旁聽席空了，被告席旁邊不空"],["p","然後是全卷最低的一幕：「我初次申訴，沒有人前來幫助，竟都離棄我；但願這罪不歸與他們。」（4:16）「歸與」原文是記帳的字，保羅的禱告是：這筆帳，不要記在他們名下。所以 4:14 和 4:16 要並在一起讀，一句把報應交給主，一句為離棄他的人求赦免，保羅沒有一個字是在求主懲罰誰。這使我們想起多年前司提反臨死的禱告：「主啊，不要將這罪歸於他們！」（徒 7:60）那一天替人看守衣裳的少年，就是掃羅。"],["p","接著一個小小的「但」字，翻轉了整封信：「惟有主站在我旁邊，加給我力量，使福音被我盡都傳明，叫外邦人都聽見；我也從獅子口裡被救出來。」（4:17）旁聽席空了，被告席旁邊不空。亞歷山大「敵擋」，原文是站在對面；眾人站得遠遠的；惟有主，站在旁邊。「加給我力量」和第二章叫提摩太「剛強起來」是同一個動詞，保羅叫兒子去領受的，主先在父親身上做成了。"],["p","所以前面那一句「打過了」，不是一個人打完的。保羅不是一個天生不怕的英雄，他是一個被站在旁邊的主扶著、把仗打完的人。今天我們讀這一章，不是為了更佩服保羅，是為了認得那一位。"],["p","下一節是全卷唯一的一首頌讚：「主必救我脫離諸般的凶惡，也必救我進他的天國。願榮耀歸給他，直到永永遠遠。阿們。」（4:18）請在這裡停一下。寫這句話的人知道自己快被處死，他說的救不是免死，是救「進」天國。上一次主救他出獅子口，這一次主要帶他回家。他沒有等處境變好才頌讚，是在眾人離棄之後、冬天到來以前，唱出了這一句。"],["p","信的末了還有兩句很安靜的話。「特羅非摩病了，我就留他在米利都。」（4:20）行過神蹟的保羅，這一次只能把生病的同工留下休養；病了不是信心不夠，留下來也不是失敗。然後是「你要趕緊在冬天以前到我這裡來」（4:21），冬天一到海路就關了，外衣送不到，人也來不了。最後一句：「願主與你的靈同在！願恩惠常與你們同在！」（4:22）前一句的「你」是單數，後一句的「你們」是複數。這封最私人的信，最後一句是對整個教會說的，也是對今天的你說的。"],["d",["4:18 說主必救我，可是我為家人禱告了很久，他還是走了，這是不是主沒有應允？","保羅寫「主必救我」的時候，清楚知道自己快要被處死，他說的救不是免死，是「救我進他的天國」。對屬主的人來說，最終的拯救不是被救出某一個困境，是被安全地帶進他的國。所以你的家人若是屬主的，主沒有失信，他的救比我們求的更遠。這不是說你的禱告白費，也不是說你信心不夠；保羅自己也把生病的特羅非摩留在米利都。你的眼淚是真實的，主不要你假裝不痛。思念的時候，可以讀 4:6 解纜的那一幅畫：從岸上看，船離開了；從船上看，船出發了；而在對岸，主已經伸手迎接。若悲傷很久仍走不出來，請讓牧者或輔導陪你走一段。"]],["d",["保羅行過醫病的神蹟，為甚麼特羅非摩病了，他只能把他留在米利都？","經文沒有解釋，保羅也沒有解釋，他只是平平地寫下來：特羅非摩病了，我就留他在米利都。這一句很誠實，它告訴我們，神蹟是神的主權，不是使徒手上可以隨時取用的工具；同一位神，有時醫治，有時讓人在病中被照顧。所以病了不是信心不夠的記號，留下來養病也不是被淘汰。對教會來說，這一句也是一個提醒：被留在米利都的人，不是體系的損耗，是我們要記得、要探望的人。對病中的人來說，你可以安心就醫、休養，你在主面前仍然有分。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 4:9--21 的名單講成 321 五重職份的插圖：路加是哪一職、推基古是哪一職，排成一張組織圖。經文裡沒有一個人被標上職份，名單講的是離開的、留下的、病了的、被請回來的；先讓名單說完，321 的團隊與傳承才在末端認出它。"],["p","第二個偏差，是用 4:6 的澆奠美化過勞：好像真愛主就要燒到最後一滴，休息就是不夠委身。這不是澆奠的意思。澆奠是倒給主，不是被人榨乾；寫這一節的人要外衣、要書、要同伴，也把生病的同工留下休養。"],["p","第三個偏差，是把 4:3 的耳朵發癢貼在某一位網路講員、某一間教會或某一個世代身上，甚至拿來推算末世已到。保羅給提摩太的是「你卻要」，不是一張通緝令；這面鏡子先照聽道的我自己。"],["p","第四個偏差，是拿 4:10 的底馬影射今天離開教會的人，或把 4:14 讀成咒詛，鼓勵人禱告叫仇敵遭報。底馬的結局經文沒有說；4:14 是交託不是咒詛，兩節之後就是「但願這罪不歸與他們」。講台該講的，是馬可怎樣被請回來。"],["p","第五個偏差，是把這一章講成保羅的英雄傳記，叫會眾學他咬緊牙關、堅強到底，或把 4:18 講成保證免死、保證醫治。保羅打得完，是因為主站在旁邊；他說的救，是救進天國。會眾該記得的是那位主，不是那位使徒。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：遺囑只寫財產，不寫和好。很多華人家庭，長輩到最後交代的是房子、存款和墓地，真正壓在心裡的那件事，兄弟為甚麼不說話、當年那一句傷人的話，一直沒有說出口；結果兄弟姊妹第一次同桌，是在告別式上。保羅的最後一章正好相反，他交代的是要把馬可帶來。和好不必等到臨終，也不必等對方先開口；可以先打一通電話，必要時請一位雙方都信任的人陪著。若曾有傷害或侵害，安全先於和好，界線也是愛。"],["p","第二個問題：交接禮拜與人走茶涼。教會裡的長輩、老傳道退下來，常常只有兩種結局：一種是感恩禮拜念一長串的履歷，之後再也沒有人去探望；另一種是捨不得交棒，因為除了這份服事，不知道自己還是誰。4:7 說的是三個完成式，打過了就可以交出去；4:17 說的是，站在旁邊的那一位不會因為你退下來就走開。教會能做的，是在交接之後仍然記得他，像保羅記得阿尼色弗一家、記得留在米利都的特羅非摩。"],["h","七、活出321——先有主站在旁邊，才有打完的仗"],["p","經文自己講完了，我們才在末端認出 321 常說的幾句話。"],["p","耶穌是我的榜樣：被捉拿的那一夜，「門徒都離開他，逃走了」（可 14:50），可是他說「其實我不是獨自一人，因為有父與我同在」（約 16:32），十字架上還為釘他的人求赦免。保羅臨終看見同在、說出赦免，是在學他的主。"],["p","聖經是我的準則：4:2 說要傳的是道，不是自己的東西；4:13 一個快死的人還要那些皮卷。我們的耳朵癢不癢，用的尺不是聽起來舒不舒服，是經文。"],["p","聖靈是我的引導：被撇下的時候，靠自己只會記帳；求聖靈讓我們像 4:16 那樣，把帳交出去，也讓我們看見誰是我們該去接回來的馬可。"],["p","讓耶穌作王：4:1 憑著他的顯現和他的國度囑咐，4:14 把報應交給主，4:18 被救進他的天國。審判官的位置、評分者的位置都讓出來，王座上就只剩下他。"],["p","讓耶穌得著一切的榮耀：被眾人離棄的人，最後一句話是「願榮耀歸給他，直到永永遠遠」（4:18）。打完的仗是主陪著打完的，榮耀也歸他。建立屬神的體系：提摩太要來羅馬，推基古被差往以弗所，很可能就是去頂上崗位；有人被差派，有人留下照顧，有人病了被留下休養，有人被請回來。一個屬神的體系，有人接棒，有一扇讓人回來的門，也不忘記被留在米利都的人。"],["h","八、四種心，各自在這張名單上找到自己"],["p","驕傲型的心想被記得：把「我已經打過了」聽成自己的履歷，暗暗盼望交接那一天有人替我念出功勞。這一章請你看見，保羅最後一句不是我做到了，是願榮耀歸給他；仗是主陪著打完的。"],["p","恐懼型的心怕到最後一個人：怕撐不到終點，怕回頭一看椅子都空了。請聽 4:17 那一句，惟有主站在我旁邊。怕不是罪，提摩太也可能是一個膽小的人；你不必先變勇敢，只要知道你不是一個人在跑。"],["p","羞恥型的心覺得自己就是那個馬可：半途離開過服事，辜負過人，不敢再回來。請看保羅最後的信，他指名要你回來，還說你合用。主可以把半途回家的人，帶回到旁邊來。"],["p","受傷型的心被撇下過，也被人多多地害過：在最需要的時候沒有人來，或有人站在對面敵擋你。你不需要先原諒才算屬靈，也不需要立刻和好；可以先把那筆帳交給主，若傷害還在繼續，就像 4:15 說的防備，先保護自己，找一位信得過的人陪你，必要時尋求專業的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 4:17，說出今天你最怕一個人面對的那件事，然後說：主，你站在我旁邊。"],["p","第二，寫一封你自己的短信，不是遺囑，是幾行字：如果只能交代三件小事，你會寫甚麼？寫給誰？這一週把其中一件做出來。"],["p","第三，找出你心裡的一個馬可，或你可以替別人去接的一個馬可，這一週打一通電話或傳一則訊息，說一句具體的話：謝謝你，或，我們可以重新開始嗎。"],["p","第四，照顧自己的身體：天冷添衣，按時睡覺，讀一本好書；若你正在病中，像特羅非摩一樣安心休養。"],["p","第五，探望或聯絡一位已經退下來的長輩、老同工，告訴他你記得他曾經怎樣使你暢快。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：被撇下的時候，我不是一個人；惟有主站在我旁邊，加給我力量。"],["p","我宣告：我要把那本帳簿交給主，報應在他手裡，我要為傷害我的人說：但願這罪不歸與他們。"],["p","我宣告：我不必贏過誰，我要把我那一段跑完，把所信的道守住，到那日有冠冕為凡愛慕他顯現的人存留。"],["p","我宣告：主必救我進他的天國，願榮耀歸給他，直到永永遠遠。"],["d",["要打那一通冬天以前的電話，卻不知道怎麼開口，有沒有具體的做法？","可以分四步。第一，先寫下來：對方的名字、你想說的一句話、你不打算說的話。第一通電話不談對錯，不翻舊帳。第二，選一個時間，例如這個星期六上午十點，先禱告五分鐘，求主站在你旁邊。第三，開口用一句具體的話，例如：好久沒有聯絡，我常想起你當年幫我的那件事，想謝謝你；或是：我知道我們之間有一段不好受的事，我想請你吃一頓飯。第四，不論對方怎樣回應，把結果交給主，回小組說一句就好。若你們之間有過嚴重的傷害，請一位雙方都信任的人陪你，不要單獨冒險。"]],["h","十、結語"],["p","全卷四課回望一眼：火，神所賜的不是膽怯的心；兵，我們縱然失信，他仍是可信的；經，聖經都是神所默示的；冠，那美好的仗我已經打過了。一場接力賽的最後一棒，從羅以、友妮基、保羅、提摩太，一直傳到今天的我們。"],["p","現在回到開頭那封短信。那位老弟兄最後寫的是一頓飯，保羅最後寫的是馬可，兩封信都在說，到了最後，人比事重要。可是保羅的信比那封信多了一行，也是這一課的焦點：不在保羅多勇敢，也不在我們撐不撐得住，焦點在「惟有主站在我旁邊，加給我力量」（4:17）的那一位。保羅要走了，主不走；提摩太接過來的不只是一份工作，是那位一直站在旁邊的主。"],["p","我們一起低頭禱告。站在我們旁邊的主，謝謝你，在旁聽席都空了的時候，你沒有走。求你扶持每一位累了、想退下來的人，讓他知道自己不是一個人在跑；求你醫治被撇下、被傷害的心，幫助我們把帳交給你，也保護仍在危險中的人。求你給我們勇氣，在冬天以前去接回一個馬可，去探望一位被留在米利都的人。到了那一日，我們要和保羅一起說：願榮耀歸給你，直到永永遠遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這是全卷最後一次小組，不比誰的仗打得漂亮，是讓每一個人說出一個被撇下的時刻、一個要去接回來的人，和一件冬天以前要做的事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課是全卷最後一課，主軸是撇下、合用、站在旁邊。席上可能有剛經歷喪親的人、被同工離棄或傷害的人、正在病中的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：得勝是守得住、跑得完；4:14 是交託不是咒詛；保羅打得完，是因為主站在旁邊。"],["n","1. ★ 如果你只能留下一封短信，交代三件小事，你會寫甚麼？寫給誰？為甚麼是這三件？"],["n","2. ★★★ 4:8 冠冕的「賜給」和 4:14 的「報應」原文是同一個動詞。請用自己的話說：為甚麼 4:14 不是咒詛，而是交託？它和 4:16 並在一起讀，讓你看見甚麼？"],["n","3. ★★ 讀 4:7 三個完成式：打過了、跑盡了、守住了。這和你原本對得勝的想像有甚麼不同？說一個你身邊默默跑完那一段的人。"],["n","4. ★★ 4:16 說眾人都離棄，4:17 說惟有主站在旁邊。讀完這兩節，你對保羅的印象和對主的印象，哪一個更深？為甚麼？"],["m","帶領提醒：談底馬、亞歷山大與耳朵發癢時，只談原則，不點名、不影射任何離開的人、任何講員或教會。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出一個被撇下的時刻，認出主當時站在哪裡，並說出這一週要去接回來的那個人。"],["t","【看】看見自己"],["n","5. ★★★ 說出一次你回頭看、身邊好像一個人都沒有的時候：是哪一年、在甚麼地方？那一次你最想有誰站在旁邊？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:17 兩遍，第二遍把「我」換成自己的名字。回頭看那一段日子，主藉著誰、哪一句經文、哪一件小事站在你旁邊？"],["t","【想】想通關卡"],["n","7. ★★★ 你心裡那本帳簿交不出去，卡在哪裡：怕交出去就等於說傷害不算數、怕對方沒有被追究，還是自己也曾是那個馬可？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：我需要一件外衣，就是……。說出一個你現在真實的需要，右手邊的人只回一句：主站在你旁邊，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要聯絡的那個馬可，或那位曾經使你暢快的人：名字、星期幾、用電話還是當面，第一句話怎麼說？"],["m","帶領提醒：這一化可能碰到喪親、被離棄、被同工或家人傷害、長期病痛與無望感。不追問細節，不要求原諒，不對正在流淚的人說你要有信心，也不催人和好；有人正在接受治療或輔導，肯定他。若有人仍在危險裡，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一通冬天以前的電話、一次探望、一位接棒的人、一位一起讀經的同伴。"],["n","10. ★★ 說出一位已經退下來的長輩、老同工或正在病中的肢體，這一週哪一天、用甚麼方式，你要去探望或聯絡他？"],["n","11. ★ 說出你正在做的一件服事，和一位可以接棒的人的名字。這一週哪一天，你要約他在旁邊一起做？"],["n","12. ★★ 照顧自己的身體：這一週你要在哪一天早一點睡、哪一天和一位朋友吃飯、讀哪一本書的第幾章？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位最近覺得被撇下、想退下來的人。當場說出他的名字，說出這一週哪一天、在哪裡，你要和他一起讀 4:16--18，並問他：最近誰站在你旁邊？"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，一個人到了最後，才看得清甚麼是真的要緊，常常是人，不是事。第二句，聖經裡有一個被所有人撇下的老人，他說惟有主站在我旁邊。第三句，所以人生最後那一段，不必一個人走，也不必帶著一本帳走。下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收我會多關心這類答案；正在病中或照顧病人的組員，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：冬天以前，我要聯絡的人是誰、哪一天。"],["p","然後彼此代禱，為一位被撇下想退下來的同工、一位正在病中的肢體、一位你心裡的馬可指名禱告。"],["p","最後由組長慢慢讀一遍：「主必救我脫離諸般的凶惡，也必救我進他的天國。願榮耀歸給他，直到永永遠遠。阿們。」（4:18）全卷就在這一首頌讚裡結束。"]]}}}</script>

  /* 表格與條列讀出來的零件。

    rowN: '{link}「{label}」：{parts}。',      // 三欄以上

    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個

  }

  function pick(kind, i) {

    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;

  }

    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();

      if (head.length === 2) {

         十點全部報數，聽的人會累。 */
      var ww = w();

    C.words = ext(ext({}, W), (c && c.words) || {});

   *   · 回答被截斷（stop_reason＝max_tokens／length）就自動接著寫完，最多再接 4 次
   *   · 新回答進來時把較早的長回答收起來，頂列「收合」一次收合全部；
   *     展開／收合只改那一則的 class，不重畫整個對話，才不會打斷朗讀
   *   · 每則回答多了「分享」與「做成美圖」
   *   · reask()：切換回答長度時，用新長度把最後一個問題重新回答（取代、不疊加）
   */
  var DEF = {
    worker: '',
    model: 'claude-sonnet-4-6',
    maxTokens: 1600,
    history: 12,
    timeoutMs: 60000,
    longChars: 240,
    maxCont: 4,
    el: 'xz',
    name: '小智',
    emoji: '✨',
    tagline: '陪讀 · 解經 · 禱告',
    hello: '',
    system: null,
    sysExtra: null,        // fn() -> 接在系統提示後面（回答對象、長度）
    quicks: null,
    followups: null,       // fn() -> [[圖示, 短標, 完整追問句], …]
    controls: null,        // fn() -> html（頂列下方的設定列，由 App 畫）
    store: null,
    chapter: null,
    rich: true,
    speechClean: null,
    linkify: null,
    onSpeak: null,
    onCard: null,          // fn(text, question)
    onShare: null,         // fn(text, question)；沒給就用 navigator.share／剪貼簿
    shareTail: '',
    toast: null,
    onChange: null,
    labels: {
      hello: '陪你讀經的小幫手。',
      caveat: '我不是聖靈，也不能代替你的牧者——有疑問，還是要回到聖經，並找真實的屬靈同伴談。',
      placeholder: '問小智…', send: '送出', clear: '清空', close: '✕',
      thinking: '正在想…',
      more: '展開全文 ▾', less: '收合 ▴',
      speak: '🔊', save: '☆ 收藏', saved: '★ 已收藏', del: '刪除',
      share: '↗ 分享', card: '🖼 美圖', copied: '已複製，可以貼上分享',
      foldAll: '收合', foldedAll: '已收合所有長回答', foldNone: '目前沒有需要收合的回答',
      cont: '小智還在接著寫…', contAsk: '請從中斷的地方直接接著寫完，不要重複前面已經寫過的內容，也不要加開場白。',
      fuT: '追問：',
      didSave: '已加入收藏', didUnsave: '已取消收藏', didDel: '已刪除',
      offline: '目前沒有網路，小智暫時陪不了你。',
      slow: '小智等候得有點久，先暫停一下。',
      down: '小智暫時連不上線，請稍後再試。',
      comfort: '別忘了——最好的同伴是聖靈與神的話，你隨時可以直接向主傾心吐意。',
      empty: '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？',
      exportTitle: '# 小智收藏', exportFile: 'sage-saved.md'
    }
  };

  var C = null;
  var XZ = { open: false, msgs: [], busy: false };

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escA(s) {
    return String(s == null ? '' : s).replace(/'/g, '&#39;').replace(/"/g, '&quot;')
      .replace(/\n/g, ' ').slice(0, 300);
  }
  function L(k) { return (C && C.labels && C.labels[k]) || DEF.labels[k] || ''; }
  function toast(m) { if (C && C.toast) C.toast(m); }
  function saved() { return (C.store && C.store.get && C.store.get()) || []; }
  function keep() { if (C.store && C.store.save) C.store.save(); if (C.onChange) C.onChange(); }
  function link(html) {
    if (!C.linkify) return html;
    try { return C.linkify(html); } catch (e) { return html; }
  }
  function nl(text) { return esc(text).split('\n').join('<br>'); }
  function body(text) {
    if (C.rich !== false && typeof NAR321 !== 'undefined' && NAR321.html) {
      try { return NAR321.html(text); } catch (e) {}
    }
    return nl(text);
  }
  function toSpeech(text) {
    var t = String(text == null ? '' : text);
    if (typeof NAR321 !== 'undefined' && NAR321.speech) {
      try { t = NAR321.speech(t); } catch (e) {}
    }
    if (C.speechClean) { try { t = C.speechClean(t); } catch (e) {} }
    return t;
  }
  function plainOf(text) {
    if (typeof NAR321 !== 'undefined' && NAR321.text) {
      try { return NAR321.text(text); } catch (e) {}
    }
    return String(text || '').replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/^>\s?/gm, '').replace(/^\s*[-*]\s+/gm, '・').replace(/\|/g, ' ');
  }
  function isLong(m) {
    return !!(m && m.role === 'assistant' && !m.cont && String(m.text || '').length > C.longChars);
  }
  function qOf(i) {
    for (var p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user') return XZ.msgs[p].text;
    return '';
  }

  /* ── 送出與接收 ───────────────────────────────────────────────── */

  function open() { XZ.open = true; draw(); }
  function close() {
    XZ.open = false;
    var el = document.getElementById(C.el);
    if (el) el.className = el.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ');
  }
  function push(role, text, extra) {
    var m = { role: role, text: text };
    if (extra) ext(m, extra);
    XZ.msgs.push(m);
    return m;
  }

  function send(text) {
    var t = text;
    if (t == null) {
      var i = document.getElementById('xzin');
      t = (i && i.value) || '';
      if (i) i.value = '';
    }
    t = String(t).replace(/^\s+|\s+$/g, '');
    if (!t || XZ.busy) return;
    XZ.open = true;
    push('user', t);
    draw(); call();
  }
  function pick(q) { send(q); }

  function ask(quote, note, tmpl) {
    XZ.open = true;
    var q = (tmpl || C.askTemplate || function (s, n) {
      return '我讀到這一句：\n「' + s + '」\n' + (n ? n + '\n' : '') +
             '請幫我更明白這句話，並幫助我活出來。';
    })(String(quote || '').slice(0, 300), note || '');
    if (XZ.busy) { draw(); return; }
    push('user', q);
    draw(); call();
  }

  /* 切換回答長度：把最後一組問答拿掉，用同一個問題重新問一次 */
  function reask() {
    if (XZ.busy) return false;
    var ui = -1, i;
    for (i = XZ.msgs.length - 1; i >= 0; i--) if (XZ.msgs[i].role === 'user') { ui = i; break; }
    if (ui < 0 || ui === XZ.msgs.length - 1) return false;
    var q = XZ.msgs[ui].text;
    XZ.msgs.splice(ui);
    push('user', q);
    draw(); call();
    return true;
  }

  function truncated(text, stop) {
    if (stop === 'max_tokens' || stop === 'length') return 'sure';
    if (stop) return '';
    var x = String(text || '').replace(/\s+$/, '');
    if (x.length < 280) return '';
    if (/[。！？.!?」』）)”"…~|]$/.test(x) || /(阿們|阿门|amen\.?)$/i.test(x)) return '';
    return 'guess';
  }
  function join(acc, piece) {
    piece = String(piece || '').replace(/^\s*(好的|好|OK|Okay|Sure)[，,。.!！]?\s*/i, '');
    var max = Math.min(40, acc.length, piece.length), k;
    for (k = max; k >= 4; k--) {
      if (acc.slice(-k) === piece.slice(0, k)) { piece = piece.slice(k); break; }
    }
    var head = piece.replace(/^\s+/, '');
    if (/^(#{1,6} |>|---)/.test(head)) return acc.replace(/\s+$/, '') + '\n\n' + head;
    if (/^([-*] |\d+[.)] |\|)/.test(head)) return acc.replace(/\s+$/, '') + '\n' + head;
    return acc + piece;
  }

  function post(sys, msgs, cb) {
    var ctrl = null, timer = null, done = false;
    try { if (window.AbortController) ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, C.timeoutMs);
    function fin(out, why, stop) {
      if (done) return; done = true;
      if (timer) clearTimeout(timer);
      cb(out, why, stop);
    }
    fetch(C.worker, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model: C.model, max_tokens: C.maxTokens, system: sys, messages: msgs })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      var t = '';
      if (data && data.content && data.content.length) {
        t = data.content.filter(function (b) { return !b.type || b.type === 'text'; })
          .map(function (b) { return b.text || ''; }).join('\n');
      } else if (data) {
        t = data.reply || data.text || data.message ||
          (data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '') || '';
      }
      var stop = (data && (data.stop_reason || data.finish_reason ||
        (data.choices && data.choices[0] && data.choices[0].finish_reason))) || '';
      fin(String(t).replace(/^\s+|\s+$/g, ''), '', stop);
    })['catch'](function (e) {
      fin('', (e && e.name === 'AbortError') ? 'slow' : 'down', '');
    });
  }

  function foldOld() {
    var last = -1, i;
    for (i = 0; i < XZ.msgs.length; i++) if (XZ.msgs[i].role === 'assistant') last = i;
    for (i = 0; i < XZ.msgs.length; i++) {
      var m = XZ.msgs[i];
      if (isLong(m)) m.col = (i !== last);
    }
  }

  function call() {
    XZ.busy = true; draw();
    var off = false;
    try { off = (navigator.onLine === false); } catch (e) {}
    if (off) {
      push('assistant', L('offline') + '\n' + L('comfort'));
      XZ.busy = false; return draw();
    }
    var hist = [], i, src = XZ.msgs.slice(-C.history);
    for (i = 0; i < src.length; i++) {
      if (src[i].cont) continue;
      hist.push({ role: src[i].role, content: src[i].text });
    }
    while (hist.length && hist[0].role !== 'user') hist.shift();
    var sys = (C.system ? C.system() : '');
    if (C.sysExtra) { try { sys += C.sysExtra() || ''; } catch (e) {} }
    var m = null, n = 0;

    function finish(acc, why) {
      if (m) XZ.msgs.splice(XZ.msgs.indexOf(m), 1);
      if (acc) push('assistant', acc, { ok: true });
      else push('assistant', (why === 'slow' ? L('slow') : (why ? L('down') : L('empty'))) + '\n' + L('comfort'));
      XZ.busy = false;
      foldOld();
      draw();
    }
    function step(acc, why, stop) {
      if (!acc) return finish('', why);
      var tr = truncated(acc, stop);
      if (!tr || n >= (tr === 'sure' ? C.maxCont : 1)) return finish(acc, '');
      n++;
      if (!m) m = push('assistant', acc, { cont: true }); else m.text = acc;
      draw();
      post(sys, hist.concat([{ role: 'assistant', content: acc }, { role: 'user', content: L('contAsk') }]),
        function (out, w2, st2) {
          if (!out) return finish(acc, '');
          step(join(acc, out), '', st2);
        });
    }
    post(sys, hist, function (out, why, stop) { step(out, why, stop); });
  }

  /* ── 收藏、刪除、分享 ─────────────────────────────────────────── */

  function savedIdx(i) {
    var a = XZ.msgs[i];
    if (!a) return -1;
    var arr = saved(), j;
    for (j = 0; j < arr.length; j++) if (arr[j].a === a.text) return j;
    return -1;
  }
  function star(i) {
    var a = XZ.msgs[i];
    if (!a) return;
    var arr = saved(), k = savedIdx(i);
    if (k >= 0) {
      arr.splice(k, 1); keep(); draw();
      return toast(L('didUnsave'));
    }
    arr.unshift({
      q: qOf(i), a: a.text,
      ch: (C.chapter ? C.chapter() : 0) || 0,
      at: (new Date()).getTime()
    });
    keep(); draw(); toast(L('didSave'));
  }
  function drop(i) {
    XZ.msgs.splice(i, 1);
    if (i > 0 && XZ.msgs[i - 1] && XZ.msgs[i - 1].role === 'user') XZ.msgs.splice(i - 1, 1);
    draw(); toast(L('didDel'));
  }
  function unstar(i) {
    var arr = saved();
    arr.splice(i, 1); keep();
    toast(L('didDel'));
  }
  function share(i) {
    var m = XZ.msgs[i]; if (!m) return;
    var q = qOf(i);
    if (C.onShare) return C.onShare(m.text, q);
    var t = (q ? q + '\n\n' : '') + plainOf(m.text) + (C.shareTail ? '\n\n' + C.shareTail : '');
    try {
      if (navigator.share) { navigator.share({ text: t })['catch'](function () {}); return; }
    } catch (e) {}
    try {
      navigator.clipboard.writeText(t).then(function () { toast(L('copied')); }, function () {});
    } catch (e) {}
  }
  function card(i) {
    var m = XZ.msgs[i]; if (!m || !C.onCard) return;
    C.onCard(m.text, qOf(i));
  }
  function exportMd(opt) {
    opt = opt || {};
    var arr = saved(), t = (opt.title || L('exportTitle')) + '\n\n', i;
    for (i = 0; i < arr.length; i++) {
      var x = arr[i];
      t += '## ' + new Date(x.at).toLocaleDateString() +
           (x.ch ? '　' + (opt.chapterLabel ? opt.chapterLabel(x.ch) : '第 ' + x.ch + ' 章') : '') + '\n\n';
      if (x.q) t += '**Q:** ' + x.q + '\n\n';
      t += x.a + '\n\n---\n\n';
    }
    try {
      var b = new Blob([t], { type: 'text/markdown' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = opt.file || L('exportFile');
      a.click();
    } catch (e) {}
    return t;
  }

  /* ── 面板 ─────────────────────────────────────────────────────── */

  function fuHtml(m, i) {
    if (!C.followups || m.role !== 'assistant' || !m.ok || m.cont || XZ.busy || i !== XZ.msgs.length - 1) return '';
    var l = [];
    try { l = C.followups() || []; } catch (e) { l = []; }
    if (!l.length) return '';
    var h = '<div class="xzfu"><span class="xzfut">' + esc(L('fuT')) + '</span>', k;
    for (k = 0; k < l.length; k++) {
      h += '<button class="xzfuc" onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' +
        esc(l[k][2]) + '">' + esc(l[k][0] + ' ' + l[k][1]) + '</button>';
    }
    return h + '</div>';
  }

  function bubble(m, i) {
    if (m.role !== 'assistant') {
      return '<div class="xzm user">' + nl(m.text) + '</div>';
    }
    if (m.cont) {
      return '<div class="xzm assistant" id="xzm' + i + '"><div class="xzt">' + link(body(m.text)) + '</div>' +
        '<div class="xzcont">' + esc(L('cont')) + '</div></div>';
    }
    var long = isLong(m);
    var col = long && m.col !== false;
    var sav = savedIdx(i) >= 0;
    return '<div class="xzm assistant" id="xzm' + i + '">' +
      '<div class="xzt ' + (col ? 'clip' : '') + '">' + link(body(m.text)) + '</div>' +
      (long ? '<button class="xzmore" onclick="SAGE321.fold(' + i + ')">' +
        esc(col ? L('more') : L('less')) + '</button>' : '') +
      (m.ok ? '<div class="xzact">' +
      (C.onSpeak ? '<button onclick="SAGE321.speak(' + i + ')">' + esc(L('speak')) + '</button>' : '') +
      '<button class="' + (sav ? 'on' : '') + '" onclick="SAGE321.star(' + i + ')">' +
      esc(sav ? L('saved') : L('save')) + '</button>' +
      '<button onclick="SAGE321.share(' + i + ')">' + esc(L('share')) + '</button>' +
      (C.onCard ? '<button onclick="SAGE321.card(' + i + ')">' + esc(L('card')) + '</button>' : '') +
      '<button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button>' +
      '</div>' : '<div class="xzact"><button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button></div>') +
      fuHtml(m, i) + '</div>';
  }

  /* 只改這一則——不重畫整個對話，正在朗讀的那一則才不會斷 */
  function fold(i) {
    var m = XZ.msgs[i];
    if (!m || !isLong(m)) return;
    m.col = (m.col === false);
    var el = document.getElementById('xzm' + i);
    if (!el) return draw();
    var t = el.querySelector('.xzt'), b = el.querySelector('.xzmore');
    if (t) t.className = 'xzt' + (m.col ? ' clip' : '');
    if (b) b.textContent = m.col ? L('more') : L('less');
    if (m.col) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
  function foldAll() {
    var n = 0, i;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { XZ.msgs[i].col = true; n++; }
    if (!n) return toast(L('foldNone'));
    draw(true);
    toast(L('foldedAll'));
  }
  function speak(i) {
    var m = XZ.msgs[i];
    if (m && C.onSpeak) C.onSpeak(toSpeech(m.text), C.name);
  }

  function draw(keepScroll) {
    var el = document.getElementById(C.el);
    if (!el) {
      el = document.createElement('div');
      el.id = C.el; el.className = 'xz';
      document.body.appendChild(el);
    }
    el.className = ('xz ' + (XZ.open ? 'on' : '')).replace(/\s+$/, '');
    if (!XZ.open) return;
    var oldB = document.getElementById('xzb'), oldTop = oldB ? oldB.scrollTop : 0;
    var inp = document.getElementById('xzin'), typed = inp ? inp.value : '';

    var bd = '', i;
    if (XZ.msgs.length) {
      for (i = 0; i < XZ.msgs.length; i++) bd += bubble(XZ.msgs[i], i);
    } else {
      bd = '<div class="xzhi"><b>' + esc(L('iam') || ('我是' + C.name + '。')) + '</b><br>' +
        esc(C.hello || L('hello')) + '<br>' +
        '<span class="xs muted">' + esc(L('caveat')) + '</span></div>';
    }
    var quicks = '';
    if (!XZ.msgs.length && C.quicks) {
      var qs = [];
      try { qs = C.quicks() || []; } catch (e) { qs = []; }
      if (qs.length) {
        quicks = '<div class="xzq">';
        for (i = 0; i < qs.length; i++) {
          quicks += '<button onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' + esc(qs[i]) + '">' +
            esc(qs[i]) + '</button>';
        }
        quicks += '</div>';
      }
    }
    var ctl = '';
    if (C.controls) { try { ctl = C.controls() || ''; } catch (e) { ctl = ''; } }
    var anyLong = false;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { anyLong = true; break; }

    el.innerHTML =
      '<div class="xzmask" onclick="SAGE321.close()"></div>' +
      '<div class="xzcard">' +
      '<div class="xzh"><b>' + esc(C.emoji + ' ' + C.name) + '</b>' +
      '<span class="xs muted" style="flex:1">' + esc(C.tagline) + '</span>' +
      (anyLong ? '<button class="ico" onclick="SAGE321.foldAll()">' + esc(L('foldAll')) + '</button>' : '') +
      (XZ.msgs.length ? '<button class="ico" onclick="SAGE321.clear()">' + esc(L('clear')) + '</button>' : '') +
      '<button class="ico" onclick="SAGE321.close()">' + esc(L('close')) + '</button></div>' +
      (ctl ? '<div class="xzctl">' + ctl + '</div>' : '') +
      '<div class="xzb" id="xzb">' + bd + quicks +
      (XZ.busy && !(XZ.msgs.length && XZ.msgs[XZ.msgs.length - 1].cont)
        ? '<div class="xzm assistant xzwait">' + esc(C.name + L('thinking')) + '</div>' : '') +
      '</div>' +
      '<div class="xzf">' +
      '<input id="xzin" placeholder="' + esc(L('placeholder')) + '"' +
      ' onkeydown="if(event.key===\'Enter\'&&!event.isComposing)SAGE321.send()">' +
      '<button class="btn pri" onclick="SAGE321.send()">' + esc(L('send')) + '</button>' +
      '</div></div>';
    var ni = document.getElementById('xzin');
    if (ni && typed) ni.value = typed;
    setTimeout(function () {
      var b = document.getElementById('xzb');
      if (!b) return;
      b.scrollTop = keepScroll ? oldTop : b.scrollHeight;
    }, 30);
  }

  function clear() { XZ.msgs = []; draw(); }

  function init(cfg) {
    C = ext(ext({}, DEF), cfg || {});
    C.labels = ext(ext({}, DEF.labels), (cfg && cfg.labels) || {});
    if (!C.worker) throw new Error('SAGE321.init 需要 worker');
    return API;
  }

  var API = {
    init: init,
    open: open, close: close, clear: clear,
    ask: ask, send: send, pick: pick, reask: reask,
    star: star, drop: drop, unstar: unstar, savedIdx: savedIdx,
    share: share, card: card,
    fold: fold, foldAll: foldAll, speak: speak, draw: draw,
    exportMd: exportMd,
    saved: saved,
    msgs: function () { return XZ.msgs; },
    isOpen: function () { return !!XZ.open; },
    speechOf: toSpeech,
    plainOf: plainOf,
    isBusy: function () { return !!XZ.busy; },
    linkify: link,
    _truncated: truncated, _join: join,
    version: '2.0.0'
  };
  return API;

境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  async function aiRaw(sys, ask, ms, maxT) {

    for (let a = 0; a <= waits.length; a++) {

      try {
        const r = await fetch(SVC.xz, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: SVC.model, max_tokens: maxT || 1600, system: sys, messages: [{ role: 'user', content: ask }] }),
          signal: ac ? ac.signal : undefined
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const d = await r.json().catch(() => null);
        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');
        else if (d) out = d.reply || d.text || d.message || '';
        if (!out) why = T('回覆是空的', 'empty reply');
        clearTimeout(tm);

      } catch (e) {
        clearTimeout(tm);
        why = (e && e.name === 'AbortError') ? T('逾時', 'timeout') : ((e && e.message) ? String(e.message) : 'network');
        if (a === waits.length) break;
        await new Promise(rs => setTimeout(rs, waits[a]));
      }
    }
    return { out: String(out || '').trim(), why };
  }

${st}請用繁體中文。只回傳 JSON，不要任何說明、不要 markdown 圍欄：{"r":[{"t":"人物","h":["提示1","提示2","提示3"],"a":"答案","alt":["別名"],"v":"3","e":"亮點"}]}`;

  function plParse(text) {
    let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const st = s.indexOf('{'); if (st < 0) return null;
    s = s.slice(st);
    try { return JSON.parse(s.slice(0, s.lastIndexOf('}') + 1)); } catch (e) {}
    const m = s.match(/"(q|r)"\s*:\s*\[/); if (!m) return null;
    let i = m.index + m[0].length; const items = [];
    while (i < s.length) {
      while (i < s.length && s[i] !== '{') i++;
      if (i >= s.length) break;
      let depth = 0, inStr = false, es = false, j = i;
      for (; j < s.length; j++) {
        const c = s[j];
        if (inStr) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;

      try { items.push(JSON.parse(s.slice(i, j + 1))); } catch (e) {}

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function vOf(v) {

  function normQuiz(list, src, k) {

      const as = String(x.a).trim();
      const ai = /^[A-Da-d]$/.test(as) ? 'abcd'.indexOf(as.toLowerCase()) : (as === '' ? NaN : +x.a);

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

  const PUN = /[\s，。、；：？！「」『』（）《》〈〉“”‘’—…·,.;:?!"'()\[\]\-–]/g;
  function normV(x) {

    const q = normV(text);
    if (q.length < 4 || !D || !D.txt) return null;
    const head = q.slice(0, 30), tail = q.slice(-30);
    const order = [];
    const N = GX.NCH();
    if (hint >= 1 && hint <= N) order.push(hint);
    for (let c = 1; c <= N; c++) if (c !== hint) order.push(c);
    for (const c of order) {
      const vs = D.txt[c] || [];
      let joined = '', starts = [];
      vs.forEach(v => { starts.push(joined.length); joined += normV(v); });
      const i = joined.indexOf(head);
      if (i < 0) continue;
      let j = joined.indexOf(tail, i);
      if (j < 0) j = i + head.length - 1; else j = j + tail.length - 1;
      let a = 0, b = 0;
      for (let k = 0; k < starts.length; k++) { if (starts[k] <= i) a = k; if (starts[k] <= j) b = k; }
      return { ch: c, v: a + 1, v2: b + 1 };

<script>/* ===== 321提摩太後書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.2ti.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

/* ===== 進度 ===== */
const STEPS = [
  ['資訊','讀完本章卡片'], ['啟示','讀經文，寫下你看見的一件事'], ['信服','記住本章金句'],
  ['實踐','選一項本週操練'], ['檢討','第七天回填：做了嗎'], ['修正','回到哪一節重讀'],
  ['反覆','複習通過三次'], ['繁殖','講給一位課外的人聽'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

/* ===== 複習 ===== */
function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 朗讀 ===== */
let VOICE = null;
function say(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, ''));
  u.lang = 'zh-TW'; u.rate = 0.94;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const plain = el => (el || $('#view')).innerText.slice(0, 3000);

/* ===== 路由 ===== */
let R = { tab:'today', ch:0, sub:'' };
function go(tab, ch, sub){ R = { tab, ch: ch || 0, sub: sub || '' }; if (ch) { S.last = ch; save(); } render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('nav.tabs button'); if (!b) return;
  go(b.dataset.t);
});
$('#back').onclick = () => { if (R.ch) go(R.tab === 'text' ? 'text' : 'course'); else go('today'); };
/* 頁首的 🔊：在講義那一頁，直接讀講義本文（不念卷名、提詞機與目錄） */
$('#spk').onclick = () => {
  if (SPK.on) return stopSpeak();
  if (R.tab === 'course' && R.ch && R.sub === 'lesson' && (D.lesson || {})[R.ch]) return lesSpeak(R.ch);
  speak(plain(), $('#ttl').textContent);
};
$('#spk').onlongpress = null;
(function(){ let t; const b = $('#spk');
  const st = () => { t = setTimeout(() => { voiceSheet(); t = null; }, 550); };
  const cl = () => { if (t){ clearTimeout(t); t = null; } };
  b.style.webkitTouchCallout = 'none'; b.style.webkitUserSelect = 'none'; b.style.userSelect = 'none';
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('touchstart', st, { passive:true });
  b.addEventListener('touchend', cl); b.addEventListener('touchmove', cl);
  b.addEventListener('mousedown', st); b.addEventListener('mouseup', cl);
})();
$('#fsz').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); toast('字級 ' + (S.set.fs + 1) + ' / 5'); };

/* 繁 ↔ 简：頁首一鍵切換。按鈕上寫的是「要切過去的那一邊」。 */
function applyLang(){
  document.documentElement.setAttribute('lang', S.set.sc ? 'zh-Hans' : 'zh-Hant');

function toggleSC(){
  S.set.sc = S.set.sc ? 0 : 1; save();
  // 轉簡是單向的：切回繁體要重讀一次，否則靜態外殼的字回不來
  if (!S.set.sc) { goLang('tc'); return; }
  render();
  try { if (typeof F !== 'undefined' && F) fDraw(); } catch(e){}   // 全螢幕模式也要跟著換
  scApply(); applyLang();

}
if ($('#lang')) $('#lang').onclick = toggleSC;

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 4;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 每章二到四點（第 3 章兩點、第 4 章四點）：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="提摩太後書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">火 · 兵 · 經 · 冠</p></div>`;
}

/* ===== 今日 ===== */
function vToday(){

  h += `<div class="foot">全書四章 83 節經文、${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} 段逐節解經、4 篇講章逐字稿，全部收錄。<br>
    內容出自《321提摩太後書解經與講章》。經文引用《和合本》。</div>`;
  return h;
}
const practiceItems = n => [meta(n).prac.main].concat(meta(n).prac.items);

/* ===== 經文 ===== */
function vText(){
  setTitle('經文', false);
  if (!R.ch){
    let h = `<div class="sect"><p class="eyebrow">提摩太後書</p><h2 class="big">從第一章讀到第四章。</h2>
      <p class="sm muted">點任何一節，該節的解經就會打開。</p>
      <div class="row" style="margin:14px 0">`;
    for (let i = 1; i <= 4; i++){
      const n = (D.txt[i] || []).length;
      h += `<button class="pill on" onclick="go('text',${i})">${i}　${n}節</button>`;
    }
    h += `</div><p class="xs muted">全書四章 83 節，逐節解經 ${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} 段，全部收錄。</p></div>`;
    return h;
  }
  const n = R.ch, m = meta(n);
  setTitle('提摩太後書 ' + n, false);
  let h = `<div class="sect"><p class="eyebrow">第 ${n} 章　${esc(m.arc)}</p>
    <h2 class="big">${esc(m.t)}</h2><p class="sm muted">${esc(m.sub)}</p></div>`;
  const full = D.txt[n] || [];
  h += `<div class="mkhint">💡 <b>點一下經文</b>畫線，<b>再點一下</b>寫下領受；點左邊的<b>節號</b>看解經。</div>`;
  h += '<div style="margin-bottom:10px">';
  full.forEach((t, i) => {

        onclick="event.stopPropagation();mkTap('${mk}',this)">${sv}</span>`;
      if (on && mkNote(mk)) notes += `<div class="mknote"${c ? ` data-c="${c}"` : ''} style="margin-left:29px">
        <b>領受</b>　${esc(mkNote(mk))}

        <button class="mkask del" onclick="mkDrop('${mk}')">🗑 刪除</button></div>`;
    });
    h += `<div class="${cls}" data-v="${ref}">
      <span class="vn" ${b ? `onclick="openV('${ref}')"` : ''}>${vn}</span>
      <span class="vt">${vb}${note}${tag}</span></div>` + notes;
  });
  h += '</div>';
  h += `<div class="hr"></div><button class="btn" onclick="go('course',${n})">看第 ${n} 章講義 ›</button>`;
  return h;
}

let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>提摩太後書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">下一段 ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 朗讀</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ 問小智</button>
    <button class="btn" onclick="go('course',${v.ch})">整章講義</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), '羅 ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + '。' + m.mv.r, '本章金句'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  const keys = segs.map(s => voiceName() + '|' + rateAttr() + '|' + s.t);
  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ 已下載'
      : got ? `⤓ 預先下載（已有 ${got}/${keys.length}）` : '⤓ 預先下載';
  });
}
