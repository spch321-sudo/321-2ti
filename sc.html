 4:9 首尾呼應</td></tr><tr><td>ἡ χάρις μεθʼ ὑμῶν</td><td>hē charis meth' hymōn</td><td>恩典與你們同在</td><td>ὑμῶν 是複數</td></tr></table>","gram":"<p>4:19 Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν（Aspasai Priskan kai Akylan）：保羅提到這對夫妻時，常把妻子的名字放在前面（這使我們想起羅 16:3）。τὸν Ὀνησιφόρου οἶκον（ton Onēsiphorou oikon） 只問候阿尼色弗的「家」，與 1:16 相同；有人推測阿尼色弗已經離世，經文沒有明說。4:20 Τρόφιμον δὲ ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα（Trophimon de apelipon en Milētō asthenounta）：現在式分詞 ἀσθενοῦντα（asthenounta），留下他的時候他正在病中。4:21 Σπούδασον πρὸ χειμῶνος ἐλθεῖν（Spoudason pro cheimōnos elthein），冬天地中海停航，錯過了就要等到春天。</p><p><strong>4:22 有兩句祝福，人稱不同。</strong>Ὁ κύριος μετὰ τοῦ πνεύματός σου（Ho kyrios meta tou pneumatos sou），σου（sou） 是單數，對提摩太一個人說；ἡ χάρις μεθʼ ὑμῶν（hē charis meth' hymōn），ὑμῶν（hymōn） 是複數，「你們」。這封最私人的信，最後一句是對全會眾說的。</p><blockquote><p><strong>經文鑑別：</strong>SBLGNT、WH、Treg、NA28 作 Ὁ κύριος（Ho kyrios），和合本「願主」；RP 作 ὁ κύριος Ἰησοῦς Χριστός（ho kyrios Iēsous Christos），並在句末加 Ἀμήν（Amēn）。和合本沒有「阿們」，跟從 SBLGNT。本講義照 SBLGNT：較短的讀法有早期抄本支持，加上「耶穌基督」與「阿們」很像是會眾誦讀時的自然擴充。兩讀意思相同。和合本的「常」是小字，原文沒有，是譯者補上的。</p></blockquote>","exp":"<p>「問百基拉、亞居拉，和阿尼色弗一家的人安。」（4:19）最後一段是一串名字。百基拉與亞居拉是保羅在哥林多一起織帳棚的同工（徒 18:2--3）；阿尼色弗是那個「不以我的鎖鍊為恥」、在羅馬殷勤找他的人（1:16--17）。臨終的人一個一個點名，他記得每一個人。</p><p>「以拉都在哥林多住下了。特羅非摩病了，我就留他在米利都。」（4:20）這一節很安靜，卻很誠實。保羅曾經行過醫病的神蹟，但他沒有醫好特羅非摩，只好把生病的同工留下。病不是信心不夠的記號，留下來養病也不是失敗。保羅把這件事平平地寫進信裡，沒有解釋，也沒有自責。</p><p>「你要趕緊在冬天以前到我這裡來。」（4:21）冬天一到，海路就關了，那件外衣（4:13）也就趕不上了。我們不知道提摩太有沒有趕上，教會傳統說保羅不久就殉道。接著問安的友布羅、布田、利奴、革老底亞，是羅馬教會裡的弟兄姊妹；利奴，後來的傳統說他接續帶領羅馬教會。這張分散各地的名單是 235 的「5」，一個團隊；但它不是五重職份的證明，不要把職分硬套在這些名字上。</p><p>「願主與你的靈同在！願恩惠常與你們同在！」（4:22）第一句給提摩太，第二句給「你們」。保羅最後的話，從一個兒子擴大到整個教會。這封遺書從眼淚開始（1:4），在主的同在裡結束。這也是交棒的樣子：保羅要走了，主不走；提摩太接下的不只是工作，是那位一直站在旁邊的主。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《我不以為恥；因為知道我所信的是誰》"],["p","弟兄姊妹平安，今天我們開始讀一卷新的書信，提摩太後書，第一章。"],["p","今天，我想請你和我一起，停在一個畫面上。"],["p","不要急著往下走。就停在這裡，慢慢看。"],["q","羅馬。一間地牢。冬天快要到了。"],["p","上面只有一個小小的洞口，透進來一點灰白的光。"],["p","光落下來的地方，坐著一個老人。"],["p","請你先看他的手腕。"],["q","一條鐵鍊。"],["p","鍊子的一頭扣在他的手腕上，另一頭釘在牆裡。"],["p","他的手腕上，有一圈磨破又結疤、結疤又磨破的痕跡。"],["p","這個人，就是寫這封信的保羅。"],["p","這不是他第一次坐牢。可是這一次不一樣。"],["p","這一次，他自己在信裡說："],["q","「我為這福音受苦難，甚至被捆綁，像犯人一樣。」（2:9）"],["p","他知道自己出不去了。他在信的最後寫：我離世的時候到了。"],["p","他還寫：我在特羅亞留下一件外衣，你來的時候帶來。"],["q","「你要趕緊在冬天以前到我這裡來。」（4:21）"],["p","一個老人，在冬天來以前，想要一件外衣，想要見他的兒子。"],["p","現在，請你把目光從那條鍊子，移到門口。"],["p","門口站著一個人。風塵僕僕，腳上都是土。"],["p","他從以弗所來。到了羅馬，他一間一間牢房地打聽。"],["p","去找一個被定罪的犯人，你就可能被當作同黨。"],["p","可是他沒有回頭。他一直找，一直找。"],["q","「反倒在羅馬的時候，殷勤地找我，並且找著了。」（1:17）"],["p","我們就停在這一刻。"],["p","一個戴著鍊子的人抬起頭。一個走遍整座城的人，終於站在他面前。"],["p","這個人的名字，叫阿尼色弗。"],["p","弟兄姊妹，這一章，整章都繞著這條鍊子。"],["p","「以為恥」這個字，這一章出現了三次。三次，都跟這條鍊子有關。"],["p","可是我要先說清楚：今天我們不是來佩服保羅的，也不是來佩服阿尼色弗的。"],["p","這個畫面裡，其實還有一位。我們先不說他是誰，講到最後，我們再回到這間牢房來找他。"],["p","這一章有三個字：火，恥，守。我們今天走三步。"],["q","第一步：挑旺的火。"],["p","一個知道自己快要被處死的人，寫遺書，第一句話寫甚麼？"],["q","「我感謝神，就是我接續祖先用清潔的良心所事奉的神。」（1:3）"],["p","然後，他想起一個人。"],["q","「記念你的眼淚，晝夜切切地想要見你，好叫我滿心快樂。」（1:4）"],["p","「晝夜」，原文是先說夜，再說日，這本是猶太人的說法。可是寫在牢裡，讀起來特別重：牢裡的夜很長。"],["p","在那些很長的夜裡，他想起兒子的眼淚。"],["p","屬靈的父親記得的，不是兒子的成績，是兒子的眼淚。"],["p","保羅沒有一開口就交代任務。他先讓兒子知道：你被想念著。"],["q","棒子交出去以前，先是一個擁抱。"],["p","接著，保羅想起提摩太的家。"],["q","「想到你心裡無偽之信，這信是先在你外祖母羅以和你母親友妮基心裡的，我深信也在你的心裡。」（1:5）"],["p","外祖母，母親，兒子。三代的信。"],["p","聽到這裡，也許有人心裡一沉。"],["p","我家裡沒有外祖母禱告，也沒有母親帶我讀經。我是家裡第一個信主的。"],["p","也有做父母的，心裡在痛：我的孩子到今天還沒有信主。"],["p","請你再聽一次使徒行傳怎麼介紹提摩太。"],["q","「是信主之猶太婦人的兒子，他父親卻是希臘人。」（徒 16:1）"],["p","那個「卻」字很重。提摩太的家，並不完整。"],["p","所謂三代的信，其實是兩個女人，在一個不完整的家裡，一點一點把聖經放進孩子心裡。"],["p","所以，沒有基督徒家庭的人，不是次等的。提摩太自己，就有一半是這樣長大的。"],["p","而且你聽，保羅叫他甚麼？「我親愛的兒子」。他們沒有血緣。"],["p","這是另一條傳承的線，一樣真實。神的家裡，有屬靈的父親，也有屬靈的母親。"],["p","兒女還沒有信主的父母，也不必在這節經文前面自責。"],["p","友妮基能做的，是讓信住在自己裡面。叫信住進兒子裡面的，是神。"],["p","「先在」這個字，原文是「住進去」。像一個人搬進一個家，住下來。"],["p","然後，保羅說了這一章第一個重要的動詞。"],["q","「為此我提醒你，使你將神藉我按手所給你的恩賜再如火挑旺起來。」（1:6）"],["p","「挑旺」這個字，整本新約只出現這一次。"],["p","它原本是爐子邊的字。你們有誰小時候燒過炭爐？"],["p","晚上炭火燒過了，表面蓋著一層灰，看起來好像熄了。"],["p","可是你拿火鉗把灰撥開，底下還是紅的。你湊過去吹一口氣，火又活起來了。"],["q","炭還在，只是蒙了灰。"],["p","請你留意，保羅不是在罵一個沒有火的人。"],["p","他是在提醒一個有火的人：你裡面有真的東西。"],["p","灰是從哪裡來的？從疲倦，從挫折，從反對的聲音。"],["p","灰不是罪名。日子久了，灰自然會積。"],["p","對付灰，不是換一爐新炭，是把原來的撥開。"],["p","你也許服事了很多年，今天坐在這裡，覺得自己只剩下灰。"],["p","神給你的恩賜，還「在你裡面」。他沒有收回。"],["p","至於按手，那不是魔術。手不是電線，恩賜也不是從保羅的手流過去的電。"],["p","經文說得很清楚，是「神」所給你的恩賜。點火的，始終是神。"],["p","火的性情是甚麼？下一節，是這一章最常被抄在卡片上的一句。"],["q","「因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。」（1:7）"],["p","這一節常被抄，也常被用錯。"],["p","有人拿它來說：你會怕，就是你信心不夠。"],["p","請你看清楚這一句的主詞和動詞。主詞是神，動詞是賜。"],["q","這是一句關於恩典的話，不是一張考卷。"],["p","如果你正在焦慮、恐懼、憂鬱或創傷裡掙扎，你不必在這節經文前面多背一個罪名。"],["p","去看醫生，吃該吃的藥，找輔導陪你走，都不是不屬靈。"],["p","神所賜的剛強，常常正是藉著醫生、藥物、輔導，和弟兄姊妹的陪伴臨到你。"],["p","禱告和就醫，不是二選一。"],["p","再看一個小字：「我們」。保羅沒有說神賜給你，他說神賜給我們。"],["p","寫這句話的人，手上戴著鍊子，身邊的人一個一個走了。他自己也需要這句話。"],["p","這是一個軟弱的人，對另一個軟弱的人說：我們手上的，都是領受來的。"],["p","「剛強」，原文就是「能力」。「謹守」，原文是在壓力底下，心思還清明。"],["p","三樣東西，像一盞油燈。剛強是火，仁愛是方向，謹守是燈罩。"],["p","神把三樣一起給。"],["p","這些不是靠意志力撐出來的性格。是住在我們裡面的聖靈，慢慢結出來的。"],["q","神使用的，不是天生勇敢的人。是領受了他所賜的心的人。"],["p","火挑旺了，接下來就要面對一件比痛更難受的事。"],["p","保羅說：所以。"],["q","第二步：不以為恥。"],["q","「你不要以給我們的主作見證為恥，也不要以我這為主被囚的為恥」（1:8）"],["p","弟兄姊妹，我們華人最懂這個字。我們叫它「丟臉」。"],["p","皮肉受苦，咬咬牙還過得去。臉丟了，人就抬不起頭來。"],["p","提摩太的屬靈父親，現在是一個犯人。"],["p","跟一個坐牢的人站在一起，是要付面子的代價的。"],["p","請你留意保羅怎麼稱呼自己：為主被囚的。"],["p","原文是「他的囚犯」。不是羅馬的囚犯，是主的。"],["p","然後保羅說："],["q","「總要按神的能力，與我為福音同受苦難。」（1:8）"],["p","「同受苦難」，原文前面加了一個「同」字。"],["p","保羅沒有叫兒子一個人去扛。他說：跟我一起。"],["p","力量從哪裡來？按神的能力。上一節的「剛強」，在這裡兌現了。是同一個字。"],["p","提摩太不必先變成一個勇敢的人，才去受苦。他只要不離開那位賜能力的神。"],["p","我也要很小心地說一句。這裡說的，是「為福音」的苦。"],["p","不是一切的苦，都叫作為主受苦。"],["p","自己犯錯的後果，過勞拖垮的身體，在關係裡被欺負、被打，都不是這一節說的苦。"],["p","如果你的人身安全受到威脅，先保護自己，依法求助。這不是不屬靈。"],["p","保羅自己，也曾經被人用筐子從城牆上縋下去逃命。"],["p","講到受苦，保羅的筆忽然一轉，轉到很遠很遠的地方。"],["q","「神救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典；這恩典是萬古之先，在基督耶穌裡賜給我們的」（1:9）"],["p","這兩節，像地牢的牆上，忽然開了一扇窗。"],["p","從一個又窄又冷的地方望出去，是永恆。"],["p","不是按我們的行為。在時間開始以前，恩典已經在基督裡賜給我們了。"],["q","恩典，比我們的軟弱古老得多。"],["q","「他已經把死廢去，藉著福音，將不能壞的生命彰顯出來。」（1:10）"],["p","請你想一想，寫這句話的人，正在等自己的死刑。"],["p","「廢去」這個字，不是讓死亡消失，是讓它失效。"],["p","像一條毒蛇，被拔掉了毒牙。它還會咬人，會叫人痛，可是它留不住人了。"],["p","是誰拔掉的？是我們的救主基督耶穌。他自己進到死裡，又從死裡出來。"],["p","所以這間地牢最深的地方，不是黑的。有一盞燈，已經被他點亮了。"],["p","接著，保羅說了這一章的高峰，也是今天的章題。"],["q","「為這緣故，我也受這些苦難。然而我不以為恥；因為知道我所信的是誰」（1:12）"],["p","請你聽清楚，他說的是「誰」，不是「甚麼」。"],["p","他沒有說：我知道我信的道理是對的。那當然也重要。"],["p","可是他說：我認識那一位。"],["p","在法庭上，證據可以被駁倒，論證可以被嘲笑。"],["p","可是一個人認識另一個人，是駁不倒的。"],["p","大馬士革路上那一道光以後，三十年了。這一位，一次也沒有讓他失望過。"],["q","不以為恥的祕訣，不是自己勇敢。是焦點換了。"],["p","焦點在自己身上，人會怕。焦點在別人的眼光上，人會羞。"],["p","焦點落在主身上，人就站得住。"],["q","「也深信他能保全我所交付他的，直到那日。」（1:12）"],["p","「交付」這個字，是寄存的意思。把最貴重的東西，交給一個可靠的人保管。"],["p","保羅說：我交給的那一位，是「能」的。"],["p","請你想像一個攀岩的人，掛在半山腰。"],["p","他安不安全，不在他的手抓得多緊。在繩子的另一頭，繫在哪裡。"],["q","不是我抓住他，是他保全我。"],["p","這一句，和合本在旁邊有一個小註腳：也可以譯作「他所交託我的」。"],["p","兩種讀法，講台上不必爭。因為兩種讀法有一個共同點：最後保管的，是神。"],["p","保羅快死了，可是福音不會跟著他死。因為保管它的那一位，從來沒有換過人。"],["p","神保全保羅所交付的。那麼提摩太呢？"],["p","保羅接下來，用了同一個動詞。"],["q","第三步：牢牢地守著。"],["q","「你從我聽的那純正話語的規模，要用在基督耶穌裡的信心和愛心，常常守著。」（1:13）"],["p","「規模」這個字，是一張草圖。畫家先勾出輪廓，學徒照著描。"],["p","保羅沒有叫提摩太逐字背他的講章。他交給兒子的，是福音的輪廓。"],["p","提摩太不必變成保羅。可是他講的福音，要和保羅講的是同一個。"],["p","還要「在基督耶穌裡的信心和愛心」中守著。"],["p","對的話，也可以被冷冰冰地守，守成一把刀。對的話，要用對的心拿著。"],["q","「從前所交託你的善道，你要靠著那住在我們裡面的聖靈牢牢地守著。」（1:14）"],["p","請你留意。上一段說神能「保全」，這一段說你要「守著」。原文是同一個字。"],["p","神把要守的交給人，又把守的力量也給了人。"],["p","靠著甚麼守？靠著那住在我們裡面的聖靈。"],["p","「住在」這個字，你記得嗎？剛才第五節，信「先在」外祖母心裡，就是這個字。"],["q","守住，不靠意志力。"],["p","一個膽怯的年輕人，憑自己是守不住的。尤其是接下來那一句。"],["q","「凡在亞細亞的人都離棄我，這是你知道的，其中有腓吉路和黑摩其尼。」（1:15）"],["p","這是整卷書的第一道谷。"],["p","亞細亞，是保羅傳了兩年多道的地方。現在，都轉過臉去了。"],["p","「離棄」這個字，原文是把臉轉開。在街上遇見了，眼睛看向別處。"],["p","保羅寫下兩個名字。沒有咒罵，沒有解釋。只說：這是你知道的。"],["p","像一個父親，把一件心碎的事，輕輕放在桌上。"],["p","弟兄姊妹，這兩個名字，不是給講台拿來點名的。"],["p","我們不可以拿這一節，去影射哪一個離開教會的人，或曾經傷過教會的人。"],["p","這一節要說的是：被離棄是真的，會痛。連使徒也躲不過。"],["p","如果你服事的時候，有同工離開了，你不必假裝不痛，也不必認定全是你的失敗。"],["p","可是這道谷，不是終點。下一節，那個人就來了。"],["p","我們回到那間地牢。"],["q","「願主憐憫阿尼色弗一家的人；因他屢次使我暢快，不以我的鎖鍊為恥」（1:16）"],["p","阿尼色弗，這個名字的意思是「帶來益處的人」。他真的名副其實。"],["p","「使我暢快」，原文是讓人再透一口氣。"],["p","像悶熱的牢房裡，忽然吹進來一陣涼風。"],["p","這是這一章第三次「以為恥」。這一次，經文說：他不以我的鎖鍊為恥。"],["p","別人把臉轉開，他把身子轉過來。別人假裝不認識，他滿城去找。"],["p","第八節那一句「不要以我這為主被囚的為恥」，在他身上活出來了。"],["p","保羅為他禱告了兩次，兩次求的都是憐憫。"],["q","「願主使他在那日得主的憐憫。」（1:18）"],["p","原文這裡有一個很美的呼應。他在羅馬「找著了」我，願主使他在那日「找著」憐憫。"],["p","弟兄姊妹，你也可以是某一個人的阿尼色弗。"],["p","不必是一個很大的計劃。一次探訪，一通電話，一件送去的外衣，一句「我來看你」。"],["p","有些人，就在今天，在醫院裡，在家裡，在某一種看不見的牢房裡，等一個人找到他。"],["p","現在，我們再看一次那個畫面。"],["q","地牢，鐵鍊，一個老人，一個找到他的朋友。"],["p","開頭我說過，這個畫面裡，其實還有一位。"],["p","阿尼色弗很好。可是阿尼色弗會回以弗所。提摩太就算趕在冬天以前到了，也不能替他坐牢。"],["p","到了這封信的最後，保羅寫到他第一次上法庭。"],["p","他說：沒有人前來幫助，竟都離棄我。"],["p","然後，他寫下這一句："],["q","「惟有主站在我旁邊，加給我力量」（4:17）"],["p","在阿尼色弗找到他以前，主已經在那裡了。"],["p","在眾人都轉過臉去的那一天，主沒有轉過臉。"],["p","那位「他已經把死廢去」的主，就坐在鍊子旁邊。"],["p","所以保羅說得出：我不以為恥。不是因為他的鍊子比別人輕。"],["p","是因為他知道，那一位就在旁邊。他知道他所信的是誰。"],["p","弟兄姊妹，也許今天，你的手腕上也有一條鍊子。"],["p","也許你心裡的火，只剩下一層灰。也許你很怕。"],["p","請你不要因為怕，就責備自己。"],["p","神所賜給我們的，不是膽怯的心。這不是一道你要考過的題目，是他要放在你手裡的禮物。"],["p","炭還在。他會把灰撥開。"],["p","你所交付他的，他能保全。直到那日。"],["q","「然而我不以為恥；因為知道我所信的是誰，也深信他能保全我所交付他的，直到那日。」（1:12）"],["p","我們一起低頭禱告。"]]},"2":{"min":17,"blocks":[["h","《好像基督耶穌的精兵》"],["p","弟兄姊妹平安，今天我們一起讀提摩太後書第二章。"],["p","這一章裡有一個數字。經文沒有寫出來，可是你一數就數得到。"],["q","「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」（2:2）"],["p","請你跟我一起數。"],["p","第一個，是說話的人：保羅。"],["p","第二個，是聽的人：提摩太。"],["p","第三個，是提摩太要交託的：忠心的人。"],["p","第四個，是忠心的人要教導的：別人。"],["q","四。一節經文裡，有四代人。"],["p","如果一代算三十年，從保羅到今天，大概是六十多代。"],["q","坐在這裡的你，大概是第六十幾代。"],["p","你是家裡第一個信主的嗎？沒有關係。"],["p","在家裡你也許是第一代，在這一條線上，你是第六十幾代。"],["p","可是弟兄姊妹，六十多代，這棒怎麼沒有掉？"],["p","兩千年裡，有逼迫，有分裂，有冷淡，有講錯的講台。"],["p","每一棒都跑得很好嗎？我們都知道，不是。"],["p","這一章有三個詞：兵，信，器。"],["p","我們走三步：剛強與交託，他仍是可信的，無愧的工人。"],["q","第一步：剛強與交託。"],["q","羅馬，一間冬天的牢房。石牆很冷，手上有鐵鍊。"],["p","第一章的末了，他才說亞細亞的人都離棄了他。"],["p","然後第二章一開口，他叫了一聲："],["q","「我兒啊，你要在基督耶穌的恩典上剛強起來。」（2:1）"],["p","「剛強起來」這個字，原文是被動的：要被加上力量。"],["p","提摩太年輕，可能天性怯懦，身體也不好。"],["p","保羅對他說：力量不在你裡面。力量在恩典裡。你站到那裡去。"],["q","帆船不能自己生風。它能做的，是把帆張開，轉向風來的方向。"],["p","所以如果你今天很累，很怕，這一節不是在考你。"],["p","它不是說：你怕，就是你不夠屬靈。"],["p","它是說：有一個地方，力量會一直流進來。"],["p","先被加力，然後才是交託。次序不能倒過來。"],["p","保羅要提摩太交託給甚麼人？請你聽那兩個條件的順序。"],["p","第一個是忠心，第二個才是能教導別人。"],["p","保羅先找忠心的。為甚麼？"],["p","因為接力賽最危險的地方，不是跑得慢，是交棒的那幾步。"],["p","忠心的人手裡拿著的，始終是別人託付給他的。"],["p","還有一件事。傳承不等於複製。"],["p","提摩太不必變成保羅，忠心的人也不必變成提摩太。"],["q","屬靈父親，不是屬靈主人。"],["p","熟悉我們團契的人，讀到這裡會認出一個字：繁殖。"],["p","可是請你先讓這一節作它自己。"],["p","它不是一個方法的插圖。它是一位快要殉道的父親，把神寄放在他手裡的，交出去。"],["p","一個人的事奉能活多久，要看他交出去了沒有。"],["p","接著保羅給了三個畫面。第一個是兵。"],["q","「你要和我同受苦難，好像基督耶穌的精兵。」（2:3）"],["p","請你聽那個「和我」。原文是一個字：同受苦難。"],["p","苦難有對象，是為福音。苦難也有同伴，是一起受。"],["p","也要說清楚：不是一切的苦都叫為主受苦。"],["p","自己犯錯的後果，過勞拖垮的身體，被傷害的關係，都不是這一節說的苦。"],["p","如果你在一段關係裡不安全，先保護自己，找人幫忙。那不是不屬靈。"],["q","「凡在軍中當兵的，不將世務纏身，好叫那招他當兵的人喜悅。」（2:4）"],["p","不將世務纏身，不等於不顧家人，也不等於不可以有正職。"],["p","保羅在前一封信才說過：不看顧親屬的人，比不信的人還不好。"],["p","保羅自己織過帳棚。他在第四章還要外衣，要書，要同伴。"],["p","所以問題不在有沒有家、有沒有工作，是被甚麼纏住。"],["q","同一份工作，可以是事奉的地方，也可以是纏住腳的網。"],["p","分辨的問題只有一個：我現在要討誰的喜悅？"],["p","那位招我當兵的，是先選上我的主。為一位主而活，不是把自己榨乾。"],["p","第二個畫面，是運動場。"],["q","「人若在場上比武，非按規矩，就不能得冠冕。」（2:5）"],["p","這條路的規矩是甚麼？再過幾節，那首詩會說：先同死，才同活。"],["p","想跳過十字架直接拿冠冕，就是不按規矩比賽。"],["p","第三個畫面，是田裡。"],["q","「勞力的農夫理當先得糧食。」（2:6）"],["p","講道的人，先被道餵飽。帶人的人，先被恩典滋潤。"],["p","一個天天端菜給別人、自己卻餓著的人，撐不了幾季。"],["p","可是弟兄姊妹，一個怯懦的年輕人，聽完精兵、比武、農夫，會怎麼想？"],["p","他可能會想：我做不到。我會掉棒。"],["p","保羅知道。所以他接下來，叫提摩太把眼睛抬起來。"],["q","第二步：他仍是可信的。"],["q","「你要記念耶穌基督乃是大衛的後裔，他從死裡復活，正合乎我所傳的福音。」（2:8）"],["p","一個受苦的人，最容易記住的是甚麼？是自己的苦。"],["p","他說：記念耶穌基督。那一位，已經從死裡復活了。"],["p","他走過的路，盡頭是一個空墳墓。這就是我們說的，耶穌是我的榜樣。"],["p","還有「大衛的後裔」。那是王的血統。"],["p","一個戴著鎖鍊的人在牢裡說：我傳的那一位，是王。"],["q","「我為這福音受苦難，甚至被捆綁，像犯人一樣。然而神的道卻不被捆綁。」（2:9）"],["p","從環境看，保羅完了。鎖著，被當成罪犯，同工離開。"],["q","人可以被鎖。神的話不能。"],["p","在病床上，在一個不能出門的老人家口中，在一個小小的線上聚會裡。"],["p","神的道都沒有被捆綁。"],["p","然後，就在這個最低的地方，保羅唱起一首詩來。"],["p","這是全卷兩個要停下來的地方之一。所以我們停下來。"],["q","「有可信的話說：我們若與基督同死，也必與他同活；」（2:11）"],["q","「我們若能忍耐，也必和他一同作王。我們若不認他，他也必不認我們；」（2:12）"],["q","「我們縱然失信，他仍是可信的，因為他不能背乎自己。」（2:13）"],["p","請你想像這個畫面。一個手上有鐵鍊的人，用一首詩回答鐵鍊。"],["p","這首詩有四行，四個「若」。"],["p","前兩行，是我們的路。"],["p","同死，是已經發生的事。我們受洗的時候，舊人已經和他一同死了。"],["p","同活，是將來必有的事。"],["p","忍耐的盡頭，不是被遺忘，是和他一同作王。"],["p","這就是剛才說的規矩：先同死，才同活。先忍耐，才作王。"],["p","後兩行，是兩種失敗。我們要慢慢讀，不可以讀快。"],["p","第三行說：我們若不認他，他也必不認我們。"],["p","這是真的警告，我們不可以把它削掉。"],["p","主耶穌自己說過同樣的話。"],["q","「凡在人面前不認我的，我在我天上的父面前也必不認他。」（太 10:33）"],["p","一個人刻意地、一直地轉身說「我不認識他」，這一行是說給他聽的。"],["p","這樣的人，不可以拿下一行當擋箭牌。"],["p","可是第四行，保羅換了一個字。"],["p","第三行的「不認」，是一個字。第四行的「失信」，是另一個字。"],["p","「失信」，就是軟弱，就是沒有守住，就是信不下去。"],["p","福音書記彼得在大祭司的院子裡三次不認主，"],["p","用的正是第三行那個「不認」的字。"],["q","「我不認得那個人。」（太 26:72）"],["p","和合本在那裡譯作「不承認」。原文就是這一節的「不認」。"],["p","那麼彼得完了嗎？"],["p","請你聽，那一夜還沒有到，主已經先對他說了一句話。"],["q","「我已經為你祈求，叫你不至於失了信心。你回頭以後，要堅固你的弟兄。」（路 22:32）"],["p","主不是說「如果你回頭」。他說的是「你回頭以後」。"],["p","雞叫了，主轉過身來看他。"],["q","「他就出去痛哭。」（路 22:62）"],["p","所以分別不只在用了哪一個字。分別在最後的方向。"],["p","第三行說的，是到底不回頭的否認。"],["p","彼得跌倒了，可是他被找回來了。找他回來的，是那一位主。"],["p","講義的議題頁把三種讀法都擺出來了，這裡我們不辯論。"],["p","我們只做一件事：讀完第三行，一定接著讀第四行。"],["p","如果你今天坐在這裡，心裡在問：我這麼軟弱，我還算數嗎？"],["p","這首詩不是要把你推出去。"],["p","它是要你把眼睛從自己身上，移到他身上。"],["p","請你聽最後那幾個字：他不能。"],["p","全能的神，有一件事做不到。他不能背乎自己。"],["p","「不能」這個字，和第一節「剛強起來」，是同一個字根。"],["q","他的能力，用在一件事上：不放開他自己說過的話。"],["p","第一章說要挑旺，第二章說要剛強，聽起來全是「我要」。"],["p","讀到這裡，整卷書翻過來了。"],["q","我要忠心，站在他是可信的上面。"],["p","保羅在第一章說過："],["q","「因為知道我所信的是誰」（1:12）"],["p","不是我抓住他，是他保全我。"],["p","現在我們可以回答開頭那個問題了。"],["p","六十多代，這棒為甚麼沒有掉？"],["p","不是因為每一棒都跑得很好。有人掉過棒，有人跑錯過方向，有人在半路哭過。"],["p","棒沒有掉，是因為跑道的盡頭，站著一位不能背乎自己的主。"],["p","保羅接下來，轉到一個很實際的問題：當有人講錯的時候，怎麼辦？"],["q","第三步：無愧的工人。"],["q","「不可為言語爭辯；這是沒有益處的，只能敗壞聽見的人。」（2:14）"],["p","保羅先說的，不是去辯倒他們，是「使眾人回想這些事」。把真的講清楚，講到大家記得。"],["q","深夜十二點，團契的群組還在跳。兩個人為了一個說法，已經吵了一百多則。"],["p","有一個剛信主的姊妹，一直在看，一句話都沒有說。"],["p","第二天早上，她悄悄退出了群組。"],["p","保羅說：這種爭辯，敗壞的是聽見的人。"],["q","「你當竭力在神面前得蒙喜悅，作無愧的工人，按著正意分解真理的道。」（2:15）"],["p","「按著正意分解」，這個字整本新約只出現這一次。"],["p","它的意思是：直直地切開。也有人用它說，直直地開一條路。"],["q","山上開路。路修直了，後面的人走得省力；修歪了，走得越遠，離得越遠。"],["p","在切任何東西以前，先是「你自己」，在神面前被驗過。"],["q","按著正意分解，是先把自己切直，不是拿經文去切別人。"],["p","我們說，聖經是我的準則。這一節多加一筆："],["p","準則先量我，再量我手上的事工。"],["p","「無愧」也是給膽怯的人的安慰。"],["p","提摩太不必在每一場辯論裡贏過每一個人。"],["p","他只需要在神面前站得住。"],["p","可是錯誤不會因為我們不吵，就自己消失。"],["q","「他們的話如同毒瘡，越爛越大；其中有許米乃和腓理徒，」（2:17）"],["p","「毒瘡」這個字，就是醫院裡說的壞疽。"],["p","壞疽可怕的地方，是一開始不痛。"],["p","一小塊壞死的肉，不處理，會一路把好肉吃掉。"],["q","「他們偏離了真道，說復活的事已過，就敗壞好些人的信心。」（2:18）"],["p","這句話聽起來很屬靈：我們已經在基督裡活過來了，還等甚麼？"],["p","可是如果復活已經過了，那身體的病痛呢？牢裡的鎖鍊呢？老去和死亡呢？"],["p","就都沒有答案了。"],["p","保羅的盼望是「必與他同活」。那是將來式。所以今天可以忍耐。"],["p","這是全章最低的一道谷。"],["p","可是谷底的下一節，保羅馬上立起一塊石頭。"],["q","「然而，神堅固的根基立住了；上面有這印記說：『主認識誰是他的人』；又說：『凡稱呼主名的人總要離開不義。』」（2:19）"],["p","「主認識誰是他的人」，這句話是從民數記來的。"],["p","可拉帶著一群人起來，說：摩西憑甚麼高過我們？"],["p","摩西沒有跟他辯論。他說："],["q","「到了早晨，耶和華必指示誰是屬他的」（民 16:5）"],["p","誰是真的，不是我們要一個一個去鑑定的。主認識。"],["p","一個被人誤解、被同工離開的人，主認識他。"],["p","一個被錯誤的教導傷過、還在掙扎的人，主也認識他。"],["p","這也是一個釋放。我們不必扛起判斷誰得救的重擔。那不是我們的工作。"],["p","印記的另一面，才是我們的工作：離開不義。"],["p","命令的對象是「稱呼主名的人」。那就是我自己。"],["p","我們說要建立屬神的體系。這一節告訴我們，地基不是組織，不是名單。"],["p","地基是神自己的認識。而且它站著。"],["q","「人若自潔，脫離卑賤的事，就必作貴重的器皿，成為聖潔，合乎主用，預備行各樣的善事。」（2:21）"],["p","請你聽清楚，要脫離的是「事」，不是隔離「人」。"],["p","這一節不是叫我們看誰有一點錯，就和他斷絕來往。"],["p","它的方向，是先把自己洗乾淨。"],["p","「合乎主用」這個字，保羅在第四章用在一個人身上。"],["q","「因為他在傳道的事上於我有益處」（4:11）"],["p","那個人是馬可。當年半路離開，保羅不肯再帶他。"],["p","一個被認為沒有用的人，後來成了臨死的保羅最想見的人。"],["p","所以貴重不是天生的材料。瓦器被潔淨了，就是貴重的器皿。"],["q","「你要逃避少年的私慾，同那清心禱告主的人追求公義、信德、仁愛、和平。」（2:22）"],["p","保羅不只說逃，他也說追。逃離甚麼，就奔向甚麼。"],["p","請你聽那個「同」。追求不是一個人的事。"],["p","找到兩三個一起禱告的人，比一個人硬撐，走得遠。"],["p","最後，這一章回到開頭那個字：兵。"],["q","「然而主的僕人不可爭競，只要溫溫和和地待眾人，善於教導，存心忍耐，」（2:24）"],["p","讀到這裡你就明白了。第三節的兵，和這一節的僕人，是同一個人。"],["q","基督的精兵打的仗，不是跟人打的。"],["p","那抵擋的人是誰？保羅說，他們是被魔鬼任意擄去的。"],["p","他們不是敵人，是人質。"],["p","救人質的人，不會對人質開槍。"],["q","「用溫柔勸戒那抵擋的人；或者神給他們悔改的心，可以明白真道，」（2:25）"],["p","溫柔，是讓對方有一條路可以回來。"],["p","一個被罵倒的人很少悔改。一個被溫柔對待的人，比較有機會醒過來。"],["p","請你也聽那個「或者」。"],["p","我負責溫柔、忍耐、教導。悔改，是神的禮物。"],["p","所以對方沒有改變，你不必覺得自己失敗。你也不必用壓力去逼出一個悔改。"],["p","這就是回到本位。回到僕人的位置，把結果交給主。"],["p","弟兄姊妹，我們從一個數字開始。四。"],["p","保羅，提摩太，忠心的人，別人。然後一直數到你。"],["p","可是這一章的心臟，不在我們的手上。"],["q","我們縱然失信，他仍是可信的。"],["p","這封信的最後一章，保羅說他第一次上法庭的時候，沒有一個人來幫他。"],["p","可是他又說，惟有主站在他旁邊，加給他力量。"],["p","就是第一節那個字。"],["p","讀完這一章，請你不要更佩服保羅。"],["p","請你更愛那一位，站在保羅旁邊、也站在你旁邊，從來沒有背乎自己的主耶穌。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件：想一想，是誰把這棒交到你手上的。"],["p","可能是一位長輩，一位老師，一個在你最難的時候陪你禱告的朋友。"],["p","為他感謝主。如果可以，打個電話謝謝他。"],["p","第二件：如果你覺得自己快要掉棒了，很累，很軟弱，"],["p","每天早上，把第十三節慢慢念一次。"],["p","不用念得很大聲。只要讓你自己聽見：他仍是可信的，他不能背乎自己。"],["p","然後把帆張開。風會來的。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《聖經都是神所默示的》"],["p","弟兄姊妹平安，今天我們一起讀提摩太後書第三章。"],["p","這一章的最後，有一個希臘字，整本新約只出現這一次。"],["p","它是兩個字黏在一起的：一個是「神」，一個是「呼氣」。"],["q","神所呼出的。"],["p","和合本把它譯作「默示」。"],["p","請你低頭看一看你手上的聖經，或是你手機上那一頁。"],["p","保羅說，那不是一本關於神的書而已。那是神的一口氣。"],["p","你今天早上讀的那一節，是從神口裡出來的。"],["p","神一呼氣，會發生甚麼事？聖經的第二章就告訴過我們。"],["q","「將生氣吹在他鼻孔裡，他就成了有靈的活人」（創 2:7）"],["p","一團塵土，被神吹了一口氣，就活了。"],["p","這使我們想起：神呼出的話，也帶著叫人活過來的力量。"],["p","所以你那顆乾掉的心，不需要更多的資訊。它需要那一口氣。"],["p","可是保羅說這句話的地方，不是在一個安靜的書房裡。"],["p","他是在一個很亂的段落最後，說出這一句的。"],["p","在一片亂裡面，一個快要被處死的父親，留給兒子一本書。"],["p","這一章有三個字：外，學，經。"],["p","我們走三步：危險的日子，跟誰學的，神所默示。"],["q","第一步：危險的日子。"],["q","「你該知道，末世必有危險的日子來到。」（3:1）"],["p","「末世」這兩個字，在講台上常常被拿來算日子。"],["p","有人把某一年寫上白板，有人把新聞頭條排成一張時間表。"],["p","保羅沒有給提摩太一個年份。他給他一個命令：要知道。"],["p","新約說，從耶穌第一次來，末後的日子就開始了。"],["p","所以第一世紀的以弗所，和今天手機上的空中團契，站在同一段時間裡。"],["q","這不是叫你恐慌的日子。這是每一代都要警醒的日子。"],["p","保羅下一節說了「因為」，答案只有一個字：人。"],["q","「因為那時，人要專顧自己，貪愛錢財，自誇，狂傲」（3:2）"],["p","讀起來像晚間新聞，所以很容易往外貼。"],["p","貼在某一個世代身上，貼在某一群人身上，貼在對面那個陣營身上。"],["p","請你先不要貼。請你先聽它的第一個字。"],["p","「專顧自己」，原文是「愛自己」。這個字，整本新約也只出現這一次。"],["p","第二項是「愛錢」。最後一項，是「愛宴樂，不愛神」。"],["p","原文是一個比較句：愛享樂，勝過愛神。"],["q","這張清單用「愛」開頭，也用「愛」收尾。"],["p","這些人不是不會愛。是愛的方向倒過來了。"],["p","先愛自己，就會愛錢，因為錢保護那個自己。"],["p","會自誇，因為那個自己需要被看見。"],["p","最後，甚麼都排在神前面。"],["p","像一個羅盤。指針沒有壞，只是旁邊放了一塊磁鐵。"],["p","整張清單，是同一塊磁鐵造成的偏差。那塊磁鐵叫作「我」。"],["p","我們國度321空中團契常說，問題的根源是有己與驕傲。"],["p","弟兄姊妹，這張清單最危險的讀法，是拿來量別人。"],["p","站在講台上的人，最容易拿它量會眾。"],["p","坐在座位上的人，最容易拿它量講台。"],["p","所以今天，我先把這張單子拿來量我自己。"],["p","上一次我滑手機滑到半夜，卻說沒有時間禱告，那是愛甚麼勝過愛神？"],["p","上一次我在會議裡一直想被看見，那是誰坐在中間？"],["q","「為甚麼看見你弟兄眼中有刺，卻不想自己眼中有樑木呢？」（太 7:3）"],["p","保羅的清單從「自己」開始。我們的悔改，也從自己開始。"],["q","「有敬虔的外貌，卻背了敬虔的實意；這等人你要躲開。」（3:5）"],["p","讀到這裡才知道，這張清單上的人在哪裡。"],["p","不在教會外面，在教會裡面。"],["p","「外貌」是模子，有模子，不一定有內容。「實意」原文是能力。"],["q","大廳裡擺著一棵塑膠樹。葉子很綠，枝幹很挺，比真樹還整齊。"],["p","只是它不會長，也不會結果子。"],["p","外貌可以學，可以整理得很漂亮。能力學不來，是從神來的。"],["p","「背了」就是否認。不是沒聽過神的能力，是不要它。"],["p","一個人可以保留所有屬靈的習慣，卻不讓神碰他的錢、他的脾氣、他的驕傲。"],["p","「這等人你要躲開」，常被拿來當作論斷人的許可證。"],["p","保羅給的是分辨，不是一張黑名單。"],["p","而且第一個要照這面鏡子的，是讀的人自己。"],["q","問「我是不是只剩下外貌」，比問「誰是那種人」，安全得多。"],["p","好消息是：塑膠樹不能自己變成真樹，可是神能。"],["p","第一章說，要靠著住在我們裡面的聖靈守著。實意，是天天從主那裡接上的。"],["p","接著，保羅說這等人怎樣做事。"],["q","「那偷進人家、牢籠無知婦女的，正是這等人。」（3:6）"],["p","這一節，常常被讀成看不起女性的經文。經文不是這樣說的。"],["q","「被各樣的私慾引誘，常常學習，終久不能明白真道。」（3:6--7）"],["p","被私慾牽著走，學了很久卻到不了。這兩樣，弟兄也會，姊妹也會。"],["p","下一節敵擋摩西的那兩個人，是男人。"],["p","保羅給的解藥，在提摩太前書講過了，不是叫她們閉嘴，是叫她們好好學。"],["q","「女人要沉靜學道」（提前 2:11）"],["p","請你注意保羅的語氣。他責備的是鑽進門的人。"],["p","對那些被擄的人，他是帶著憐憫的。她們是被罪壓著的人，不是笨的人。"],["p","第七節，是給每一個常上課、常聽道的人的一面鏡子。"],["p","心裡那一堆罪疚，卻一直壓著，沒有碰過。"],["p","像一個人每天看食譜，從來不進廚房。越看越餓。"],["p","學習沒有錯。錯在學習變成了逃避：只要一直在學，就可以不必悔改。"],["q","「從前雅尼和佯庇怎樣敵擋摩西，這等人也怎樣敵擋真道。」（3:8）"],["p","出埃及記沒有記下這兩個名字，只說是法老的術士。名字是猶太人傳下來的。"],["p","你記得那個場面嗎？亞倫的杖丟在地上，變作蛇。"],["p","術士也丟下杖，也變作蛇。看起來一模一樣。"],["q","「但亞倫的杖吞了他們的杖。」（出 7:12）"],["p","最有力的敵擋，常常不是公開反對真理，是做一個很像真理的東西。"],["p","可是保羅接著說，他們不能再這樣敵擋了，他們的愚昧必顯露出來。"],["q","模仿的，終究會被吞掉。"],["p","提摩太不必把每一個錯謬的人都打倒。"],["p","讀到這裡，你可能會覺得很重。清單，空殼，術士。"],["p","一個年輕的傳道人，站在這樣的日子裡，要怎麼辦？"],["p","保羅接下來用了兩個字，把鏡頭整個轉過來。"],["q","但你。"],["q","第二步：跟誰學的。"],["q","「但你已經服從了我的教訓、品行、志向、信心、寬容、愛心、忍耐」（3:10）"],["p","前面九節，講的都是「他們」。這裡一開口，是「你」。"],["p","「服從」這個字，原文的意思是緊緊跟在旁邊走。"],["p","不是遠遠聽說，是貼身看過。"],["p","這也是一張清單。前面那一張，是一個人以自己為中心的樣子。"],["p","這一張，是一個人的生命，被另一個人近距離看見。"],["q","「以及我在安提阿、以哥念、路司得所遭遇的逼迫、苦難。」（3:11）"],["p","因為路司得，就是提摩太的家鄉。"],["q","「就用石頭打保羅，以為他是死了，便拖到城外。」（徒 14:19）"],["p","那一天，人群裡可能站著一個少年人。"],["p","然後他看見，門徒圍著他的時候，他站起來了，又走回城裡去。"],["p","保羅說：你已經跟從了。你不是只聽我講過，你是看我活過。"],["p","可是請你不要停在保羅多能忍。這一節最後還有一句。"],["q","「我所忍受是何等的逼迫；但從這一切苦難中，主都把我救出來了。」（3:11）"],["p","「救出來」，原文是從裡面拉出來。不是沒有進去，是進去了，又被拉出來。"],["p","路司得的石頭是真的。傷也是真的。"],["p","有時候是叫他逃走：在以哥念逃往路司得，在大馬士革被人用筐子從城牆上縋下去。"],["p","有時候，是在石頭底下活過來。"],["q","會眾記得的，不該是保羅多勇敢，而是那一位一次又一次把他救出來的主。"],["q","「不但如此，凡立志在基督耶穌裡敬虔度日的也都要受逼迫。」（3:12）"],["p","這是一句陳述，不是一個命令。逼迫會來，不是叫你去找。"],["p","可是這一節，也常被反過來用。"],["p","工作上被批評，說是逼迫。家裡吵架，說是逼迫。小組意見不合，也說是逼迫。"],["p","這樣一說，就不必檢討自己了。"],["p","請你聽保羅的條件：在基督耶穌裡，敬虔度日。"],["p","被批評，可能是因為我真的錯了。起衝突，可能是因為我的口氣太硬。"],["q","「你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？」（彼前 2:20）"],["p","不是一切的苦，都叫作為主受苦。"],["p","還有一件事，我要很清楚地說。"],["p","如果你在家裡被打、被威脅，那不是為主受逼迫，也不是你該背的十字架。"],["p","你不必為了屬靈，留在危險裡。"],["q","「有人在這城裡逼迫你們，就逃到那城裡去。」（太 10:23）"],["p","先保護生命，找人幫忙，依法求助。這和忠心一點都不衝突。保羅自己也逃過。"],["p","這一節也不是說，沒有受逼迫的人就不夠敬虔。"],["p","保羅要提摩太知道的只是：如果你因為在基督裡好好活著被追趕，"],["p","不要以為自己走錯了路。你正走在主走過的路上。"],["p","而且同一位主，會把人救出來。"],["p","在越來越亂的日子裡，提摩太要站在哪裡？"],["q","「但你所學習的，所確信的，要存在心裡；因為你知道是跟誰學的」（3:14）"],["p","「存在心裡」，原文是住在裡面。"],["p","不是往前去找一個新的說法，是留在你已經確信的那裡。"],["p","在一個每天都有新講座、新短片、新說法的時代，這句話很樸素，也很救命。"],["p","那提摩太是跟誰學的？原文「誰」是複數。不只一個人。"],["q","「這信是先在你外祖母羅以和你母親友妮基心裡的」（1:5）"],["q","「並且知道你是從小明白聖經」（3:15）"],["p","「從小」原文是吃奶的嬰孩。一個外祖母，抱著孩子，念經文給他聽。"],["p","可是請你記得，提摩太的家，不是一個完整的信仰家庭。"],["q","「他父親卻是希臘人。」（徒 16:1）"],["p","父親在信仰上缺席。可是神給了他另一條線：一個屬靈的父親。"],["p","弟兄姊妹，我們當中有許多人，是家裡第一代信主的。"],["p","沒有外祖母為你禱告，沒有母親教你背經文。"],["p","你一點都不次等。屬靈父母這一條線，對你同樣真實。"],["p","有些父母坐在這裡，兒女還沒有信主。請你也不要因為這一節自責。"],["p","友妮基的丈夫，在經文裡只留下「希臘人」這三個字。信心不是父母可以替家人決定的。"],["p","然後保羅說了一句很重要的話。"],["q","「這聖經能使你因信基督耶穌，有得救的智慧。」（3:15）"],["p","前面那些婦女，「不能」明白真道。這裡說，聖經「能」。"],["p","差別不在讀的人多聰明，在這本書指向誰。"],["q","因信基督耶穌。"],["p","這本書最後要把你帶到的，不是一套知識，是一個人。"],["p","可是為甚麼是這本書？為甚麼不是保羅自己的一套方法？"],["p","保羅接下來，說了整卷書第三座山上的那一句。"],["q","第三步：神所默示。"],["q","「聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的」（3:16）"],["p","我們開頭說過了，「默示」原文是神所呼出的。"],["p","原文的重點是：這些話，是從神口裡出來的。"],["p","不是人寫好了，神再加一口氣。是神自己說話。"],["q","「乃是人被聖靈感動，說出神的話來。」（彼後 1:21）"],["p","神沒有繞過寫的人，他們的筆跡都還在；可是說話的，是神。"],["p","這一節的文法，有兩種讀法。"],["p","一種是和合本：聖經都是神所默示的，也都是有益的。"],["p","另一種在和合本的註腳裡：凡神所默示的聖經，都是有益的。"],["p","請你放心，兩種讀法，都承認聖經出於神。"],["p","至於默示的細部要怎樣定義，福音派弟兄姊妹之間有不同的說法。"],["p","我們站在福音派對聖經權威的共同立場上，不拿這些細節來分門別類。講義的議題頁有詳細的整理。"],["p","保羅這裡說的聖經，直接指的是提摩太從小讀的舊約。"],["p","然後請你慢慢聽，這一口氣是用來做甚麼的。"],["p","四個用處：教訓，督責，使人歸正，教導人學義。"],["p","「教訓」，告訴你甚麼是對的。"],["p","「督責」，告訴你哪裡錯了。"],["p","可是保羅沒有停在這裡。"],["p","「使人歸正」，原文是重新扶直。像一棵被風吹歪的小樹，有人綁上一根竹子，把它扶起來。"],["p","「教導人學義」，原文是養育孩子的那個字。"],["q","四個用處裡，有兩個是扶正。"],["p","聖經像木匠手上的直尺。"],["p","直尺一靠上去，哪裡歪了，清清楚楚。"],["p","可是木匠拿直尺，不是為了把木頭打斷，是為了把它修直。"],["q","拿經文打人，不是在用直尺，是把直尺當成棍子揮。"],["p","弟兄姊妹，我們有沒有這樣用過聖經？"],["p","在家裡吵架的時候，翻出一節經文，指著對方說：你看，聖經說的。"],["p","保羅上一章才剛說過，主的僕人要怎樣對待抵擋的人。"],["q","「用溫柔勸戒那抵擋的人」（2:25）"],["p","溫柔，是讓對方有一條路可以回來。"],["p","那這把直尺，第一個要量的是誰？保羅在下一節說出來了。"],["q","「叫屬神的人得以完全，預備行各樣的善事。」（3:17）"],["p","請你注意，這一章出現了好幾種「人」：專顧自己的人，心地壞了的人，作惡的人。"],["p","最後一個，是屬神的人。"],["p","第三章最後一句話，是前面那張清單的反面。"],["p","那個人的中心，不再是自己，是神。"],["p","「得以完全」，原文是合用的、裝備好的。"],["p","當時也可以用在一條船上：桅杆立好了，繩子綁好了，可以出航了。"],["p","聖經扶正你，不是為了讓你坐在船塢裡，比別人更直。"],["p","是為了讓你出去，行各樣的善事。"],["p","所以聖經第一個要扶正的，就是讀它的人自己。"],["q","這本書不是審判別人的法典，是先把我扶正、再差我出去的工具。"],["p","國度321空中團契說，聖經是我的準則。"],["p","讀完這一章，我們可以更準確地說：準則，不是用來量別人的。"],["p","是一口每天吹進我裡面的氣，把我這個歪掉的人，一次又一次扶正。"],["p","外，學，經。外面是一個危險的日子，裡面是一個容易只剩外貌的我。"],["p","可是在這兩者中間，有一本神呼出來的書。"],["p","而這本書，一直在講一個人。"],["p","主耶穌復活的那一天，有兩個門徒在往以馬忤斯的路上，很灰心。"],["p","一個陌生人和他們同走，一路講解聖經。"],["q","「於是從摩西和眾先知起，凡經上所指著自己的話都給他們講解明白了。」（路 24:27）"],["p","後來他們認出他來，他就不見了。他們回頭說了一句話。"],["q","「在路上，他和我們說話，給我們講解聖經的時候，我們的心豈不是火熱的嗎？」（路 24:32）"],["p","第一章說，要把恩賜如火挑旺。這裡我們看見，火是從哪裡點起來的。"],["p","神呼出的話，指著那一位講。那一位一靠近，冷掉的心就熱了。"],["p","讀完這一章，請你不要更佩服保羅，也不要更佩服今天站在台上的人。"],["p","請你更愛那一位，從摩西和眾先知起，整本書都在講的主耶穌。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件：把第三章第二節那張清單抄下來，貼在你自己的書桌前，不要貼在別人身上。"],["p","每天看一項，問主：這一項，在我身上有沒有？然後讓他扶正你。"],["p","第二件：每天讀一段經文。讀之前，先停三秒鐘，對主說："],["q","主啊，請你向我吹一口氣。"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《那美好的仗我已經打過了》"],["p","弟兄姊妹平安，今天我們讀提摩太後書第四章，這封信的最後一章。"],["p","請你跟我一起，走進羅馬城裡的一間牢房。"],["q","羅馬，秋天快要過去了。一間石頭砌的牢房，光線從高處一個小口照下來。"],["p","牆角坐著一個老人。手上有鐵鍊，一動，就叮噹地響。"],["p","他身邊只有一個人，一位醫生，叫路加。"],["p","一個知道自己快死的人，最後一封信裡，會交代甚麼？"],["p","教會的將來，最後的囑咐，他都寫了。可是在信的末了，他寫了一句很小、很小的話。"],["q","「我在特羅亞留於加布的那件外衣，你來的時候可以帶來，那些書也要帶來，更要緊的是那些皮卷。」（4:13）"],["p","一件外衣。幾卷書。"],["p","外衣，是因為冷。原文這個字指一件厚的斗篷，晚上可以裹著睡覺的那一種。"],["p","書和皮卷，是因為他還要讀。快要死了，還要讀。"],["q","「你要趕緊在冬天以前到我這裡來。」（4:21）"],["p","冬天一到，海路就關了。船不開，人來不了，那件外衣也送不到了。"],["p","弟兄姊妹，寫這封信的，就是使徒保羅。"],["p","可是我要先說清楚：今天我們不是來佩服保羅的。"],["q","「惟有主站在我旁邊，加給我力量」（4:17）"],["p","今天你走出這個門，我盼望你記得的，不是那個勇敢的老人。"],["p","是那位在冰冷的牢房裡、在空蕩蕩的法庭上，一直站在他旁邊的主。"],["p","這一章有三個詞：道，仗，站。我們今天走三步：務要傳道，美好的仗，惟有主。"],["q","第一步：務要傳道。"],["q","「我在神面前，並在將來審判活人死人的基督耶穌面前，憑著他的顯現和他的國度囑咐你」（4:1）"],["p","「囑咐」這個字，原文是法庭用語。在證人面前，把一件事鄭重交代清楚。"],["p","一個囚犯，很快要站在羅馬的法官面前。可是他說：還有另一個法庭。還有一位，要審判活人死人。"],["p","地上的法庭會判他死刑。那一位的法庭，卻在為他存留冠冕。"],["p","那份工作是甚麼？"],["q","「務要傳道，無論得時不得時，總要專心，並用百般的忍耐、各樣的教訓責備人，警戒人，勸勉人。」（4:2）"],["p","「傳道」這個字，原文 κήρυξον，是從「傳令官」這個字來的。"],["p","古時候，王有一道詔書，傳令官騎著馬到城門口，站上高處，大聲宣讀。"],["p","傳令官不寫稿子。他的本事不在創作，在忠實。"],["p","講台不靠你發明新東西。只靠你忠心，把王的話傳出來。"],["p","再看「無論得時不得時」。這一句最容易被聽錯。"],["p","它不是說不看場合，不是說在人家的婚宴上大聲責備人。"],["p","同一封信，保羅才說過：主的僕人不可爭競，只要溫溫和和地待眾人。"],["p","它說的是：不看氣氛決定忠心。"],["p","請你也留意，責備旁邊放著「百般的忍耐」。"],["q","真理沒有忍耐，就變成刀。忍耐沒有真理，就變成糖。"],["p","保羅兩樣都要。"],["p","為甚麼這麼急？下一節說了原因。"],["q","「因為時候要到，人必厭煩純正的道理，耳朵發癢，就隨從自己的情慾增添好些師傅」（4:3）"],["p","「耳朵發癢」，原文這個字整本新約只出現這一次，就是搔癢的意思。"],["p","請你留意，這裡說的不是一群不聽道的人。是一群很愛聽道的人。"],["p","不再問「甚麼是真的」，只問「甚麼聽起來舒服」。"],["p","健康的教導像藥，有時候是苦的。發癢的耳朵要的是有人來搔。"],["p","弟兄姊妹，這兩節很容易被拿去貼標籤。"],["p","貼在某個網路講員身上，貼在某個教會、某個世代身上。我今天不要這樣做，保羅也沒有叫提摩太這樣做。"],["p","這面鏡子，要先照自己。"],["p","我的耳朵會不會癢？聽到一段扎心的經文，我的第一個反應是悔改，還是轉台？"],["p","連聽道都在服事自己的時候，那就是有己。這話我先對自己說。"],["q","「你卻要凡事謹慎，忍受苦難，做傳道的工夫，盡你的職分。」（4:5）"],["p","「你卻要」。別人的耳朵都在發癢，你卻不必跟著。別人換師傅，你卻不換福音。"],["p","「謹慎」，原文是清醒，沒有喝醉的那種清醒。"],["p","我要在這裡停一下。「忍受苦難」這四個字，常常被聽成「拚到倒下」。"],["p","不是這樣的。保羅在這封信裡說的苦，是為福音的苦，而且是要「同」受的苦。"],["p","不是一個人燒到只剩灰，也不是叫家人為了你的事奉一直讓路。"],["p","清醒的僕人會休息，也會求助。過勞不是屬靈的勳章。"],["p","你看，寫這句話的人，自己在牢裡要外衣、要書、要同伴。"],["p","再往下讀。第五節的主詞是「你」，第六節的主詞是「我」。你要站上崗位，因為我要下崗了。"],["p","這是一場接力賽的最後一棒，正在從一隻手，交到另一隻手。"],["q","第二步：美好的仗。"],["q","「我現在被澆奠，我離世的時候到了。」（4:6）"],["p","他用了兩幅畫。一幅是祭壇，一幅是碼頭。"],["p","先看祭壇。「澆奠」這個字，原文 σπένδομαι，是舊約獻祭的用語。"],["p","每天獻燔祭的時候，還要加上一份酒，倒在祭壇上，叫作奠祭。"],["p","保羅說：我的一生，就是這樣被倒出來的。而且原文是現在式，酒已經開始倒了。"],["p","弟兄姊妹，這裡最要緊的一件事，是倒給誰。"],["q","澆奠是把自己倒給主，不是讓人把你榨乾。"],["p","所以，這一句不能拿來對一個已經累垮的同工說：你要再撐一下，這才叫被澆奠。"],["p","倒給主的人，主會看顧那個杯子。"],["p","再看碼頭。「離世」，原文是解纜，把船從岸邊的纜繩上解開。"],["p","從岸上看，船是離開了。從船上看，船是出發了。"],["p","保羅沒有說：我要被處死了。他說：我要開船了。"],["p","他在腓立比書用過同字根的動詞：「情願離世與基督同在」（腓 1:23）。"],["p","弟兄姊妹，也許今天你剛從某一個病床邊回來。也許你剛送走一位家人。"],["p","這兩幅畫是給你的。死亡在信主的人身上，不是被奪走，是被倒出。不是沉沒，是解纜。"],["p","岸上的人揮手，可以有眼淚。可是對岸，主已經伸出手來迎接。"],["q","「那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。」（4:7）"],["p","三句話，原文三個動詞都是完成式。打過了。跑盡了。守住了。"],["p","他沒有說「我贏了很多場」。他說：我打完了，我跑完了，我守住了。"],["q","得勝的定義，不是贏得多，是守得住、跑得完。"],["p","主到那一天不會問你：你比隔壁跑得快嗎？他會問：你那一段，跑完了嗎？"],["p","把你那一段跑完，就是美好的仗。"],["p","可是請你不要在這裡就佩服保羅。等一下我們會看見，這一場仗，不是他一個人打完的。"],["q","「從此以後，有公義的冠冕為我存留，就是按著公義審判的主到了那日要賜給我的；不但賜給我，也賜給凡愛慕他顯現的人。」（4:8）"],["p","「冠冕」，原文 στέφανος，不是國王頭上的金冠。是比賽得勝的人，頭上戴的那一圈花冠。"],["p","羅馬的法官要給他的，是死刑。按著公義審判的主要給他的，是冠冕。"],["p","這個冠冕不是使徒專用的。是給每一個盼望主再來、愛他顯現的人。"],["p","「愛慕」這個字，請你記住它。等一下，它會再出現一次，走的卻是相反的方向。"],["p","可是保羅還沒有放下筆。下一句話，忽然從天上掉回牢房裡。"],["q","「你要趕緊地到我這裡來。」（4:9）"],["p","剛剛還在說冠冕的人，下一句是：你快來，我一個人在這裡。"],["q","第三步：惟有主。"],["p","接下來是一張名單。全新約最動人的一張名單。"],["q","「因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」（4:10）"],["p","底馬曾經是同工。在別的書信裡，他的名字和路加排在一起。"],["p","記得剛才那個字嗎？「愛慕他顯現」。底馬「貪愛現今的世界」，原文是同一個「愛」字。"],["q","兩種愛，兩個方向。"],["p","保羅寫下這一句，不是為了讓我們今天拿來論斷誰。他只是誠實地說：我很痛。"],["p","如果要想一個名字，請想你自己。我心裡的愛，今天是朝哪一個方向？"],["q","「獨有路加在我這裡。」（4:11）"],["p","一位醫生。一直沒有走。"],["q","「你來的時候，要把馬可帶來，因為他在傳道的事上於我有益處。」（4:11）"],["p","馬可是誰？很多年前，他跟保羅第一次出去宣教，走到半路就回家了。"],["p","第二次出發的時候，巴拿巴想再帶他去，保羅不肯。"],["q","「但保羅因為馬可從前在旁非利亞離開他們，不和他們同去做工，就以為不可帶他去。」（徒 15:38）"],["p","十幾年後，在羅馬的牢房裡，保羅說：把馬可帶來，他對我有益處。"],["p","這一行裡，有兩個人改變了。"],["p","馬可改變了。從半途離開的人，變成有益處的人。"],["p","保羅也改變了。他願意寫下這句話，等於承認：當年那個被我放棄的人，如今是我最需要的。"],["q","謙卑帶動謙卑。"],["p","弟兄姊妹，破裂的同工關係，可以修復嗎？"],["p","這一行說：可以。不是因為誰贏了當年那一場爭論，是因為兩邊都被主改變了。"],["p","也許你心裡有一個馬可。也許你自己就是那個馬可。"],["p","主可以把半途回家的人，帶回到旁邊來。"],["p","再看一個名字。"],["q","「銅匠亞歷山大多多地害我；主必照他所行的報應他。」（4:14）"],["p","這一句很容易被讀成咒詛，好像保羅在說：願神好好收拾他。"],["p","不是咒詛，是交託。保羅把這筆帳，交到主的手裡，不自己去討。"],["p","賞和罰，都在那位按著公義審判的主手裡。不在保羅手裡，也不在我們手裡。"],["p","保羅還加了一句：你也要防備他。"],["p","交託不等於天真。饒恕和保護自己，可以同時存在。有人一直在傷害你，先保護自己，該求助就求助，那不是沒有愛心。"],["q","「我初次申訴，沒有人前來幫助，竟都離棄我；但願這罪不歸與他們。」（4:16）"],["p","這是全卷最低的地方之一。"],["q","羅馬的法庭。被告席上站著一個老人。他回頭看旁聽席。"],["p","一個人都沒有。"],["p","他說了甚麼？但願這罪不歸與他們。"],["p","三十多年前，耶路撒冷城外，一個叫司提反的人被石頭打，臨死前跪下來說——"],["q","「主啊，不要將這罪歸於他們！」（徒 7:60）"],["p","那一天，旁邊有一個少年人，替打石頭的人看守衣裳。他的名字叫掃羅。"],["p","三十多年後，那個看守衣裳的掃羅，在自己被眾人離棄的時候，說出了司提反的禱告。"],["p","弟兄姊妹，這不是保羅修養好。這是主把一個人改變到這個地步。"],["p","被主改變的人，到了最後，連饒恕的話，都長得像他。"],["p","所以這兩節並在一起讀：一句是交託，一句是赦免。保羅沒有一個字，是在求主去懲罰誰。"],["p","然後，全卷最重的一個轉折來了。原文只是一個小小的「但」字。"],["q","「惟有主站在我旁邊，加給我力量，使福音被我盡都傳明，叫外邦人都聽見；我也從獅子口裡被救出來。」（4:17）"],["p","旁聽席空了。可是被告席旁邊，不是空的。"],["p","「站在旁邊」，原文 παρέστη，在法庭上，就是辯護人站的那個位置。"],["p","前面的亞歷山大，是「敵擋」我們的話，原文是站在對面。"],["p","有人站在對面。眾人站得遠遠的。惟有主，站在旁邊。"],["p","他沒有讓保羅當庭無罪釋放。他加給保羅力量，叫福音被他盡都傳明。"],["q","被告席，變成了講台。"],["p","叫提摩太去做的事，主先在保羅身上做成了。不是靠保羅的膽量，是靠站在旁邊的那一位。"],["p","所以剛才那一場美好的仗，不是一個人打完的。是主陪他打完的。"],["p","弟兄姊妹，也許你此刻就站在某一個被告席上。"],["p","也許是醫院的走廊，等一張報告。也許是一個空蕩蕩的家，孩子都走了。"],["p","你回頭看，好像一個人都沒有。"],["p","這一節要對你說：主沒有走。"],["q","惟有主，站在我旁邊。"],["p","接下來這一節，我要請大家停下來。這是整封信唯一的一首頌讚。"],["q","「主必救我脫離諸般的凶惡，也必救我進他的天國。願榮耀歸給他，直到永永遠遠。阿們。」（4:18）"],["p","請你再聽一次這一句：主必救我。"],["p","上一次，主把他從獅子口裡救出來。這一次，他知道自己逃不過死刑。"],["p","可是他還是說：主必救我。"],["p","原文說得很清楚：救我「進」他的天國。不只是救我離開，是把我安全地帶進去。"],["q","救，不是免死。救，是進天國。"],["p","這是整卷書最深的一個改變觀點。"],["p","弟兄姊妹，我知道今天有人為家人禱告，禱告了很久，卻沒有等到醫治。"],["p","這一節要對你說：主沒有失信。他的救，比我們求的更遠。"],["p","再看這首頌讚是在哪裡唱出來的。兩節之前才說「竟都離棄我」（4:16）。同工散了，冬天要到了，案子快判了。"],["p","一個人在這個時候最自然的一句話，是「為甚麼」。"],["p","保羅最後的一句話，卻是：願榮耀歸給他。"],["p","他沒有等到處境變好才頌讚。他先回頭，看見主過去怎樣救他。再往前看，看見主要帶他進國。"],["p","回頭看見主的手，往前看見主的國，中間的苦，就有了邊界。"],["q","頌讚不是否認痛苦。是在痛苦裡，認出誰是王。"],["p","我們安靜一下，用自己的心，跟著保羅說一次：願榮耀歸給他，直到永永遠遠。"],["p","然後，信又回到了一串名字。"],["q","「特羅非摩病了，我就留他在米利都。」（4:20）"],["p","這一句很安靜，卻很誠實。保羅行過醫病的神蹟，可是這一次，他只能把生病的同工留下。"],["p","病了，不是信心不夠的記號。留下來養病，也不是失敗。"],["p","然後是最後一句。"],["q","「願主與你的靈同在！願恩惠常與你們同在！」（4:22）"],["p","第一句的「你」，是單數，給提摩太一個人。"],["p","第二句的「你們」，是複數。這一封最私人的信，最後一句話，是對整個教會說的。"],["p","所以，弟兄姊妹，這一句也是對你說的。"],["p","我們回到那間牢房。"],["q","冬天快到了。石頭牆越來越冷。那件外衣，還在特羅亞。"],["p","提摩太有沒有趕在冬天以前到？那件外衣有沒有送到？"],["p","我們不知道。聖經沒有告訴我們。"],["p","可是有一件事，我們知道：在那間牢房裡，保羅不是一個人。"],["p","弟兄姊妹，你知道主為甚麼能站在被離棄的人旁邊嗎？"],["p","因為他自己，被離棄過。"],["p","客西馬尼園的那一夜，兵丁來拿他的時候，福音書只寫了一句話。"],["q","「門徒都離開他，逃走了。」（可 14:50）"],["p","保羅在法庭上回頭，一個人都沒有。主耶穌在園子裡回頭，也一個人都沒有。"],["p","他走過那條沒有人陪的路，所以今天，沒有一個屬他的人，要一個人走那條路。"],["q","「因為主曾說：我總不撇下你，也不丟棄你。」（來 13:5）"],["p","這封遺書，在主的同在裡結束。這也是交棒的樣子：保羅要走了，主不走。"],["p","提摩太從保羅手上接過來的，不只是一份工作。是那位一直站在旁邊的主。"],["p","今天你接過來的，也是這一位。"],["p","所以，如果你累了，想退下來，不必先假裝剛強。你只要知道，你不是一個人在跑。"],["p","如果你被離棄了，不必急著論斷誰。把帳交給主，把赦免說出來，然後抬頭看看旁邊。"],["p","仗會打完，路會跑盡。到那一天，有一圈冠冕，為凡愛慕他顯現的人存留。"],["p","而從現在到那一天，每一步，惟有主站在你旁邊。"],["q","願榮耀歸給他，直到永永遠遠。阿們。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"作者與最後一封信的處境：保羅在哪裡寫這封信？","r":"1:8；1:16--17；2:9；4:6--21","ch":[],"why":"一、本講義採使徒保羅——沿用提摩太前書立場一（提前 ISS00_1），本卷補述：第二次羅馬監禁、殉道前不久、私人書信的語氣。提摩太後書是一封遺書：寫信的人被捆綁像犯人，冬天快到了，同工一個一個離開，他知道自己離世的時候到了。這封信的力量，有一大半來自這個處境；若不先講定是誰、在哪裡、在甚麼光景中寫的，4:6--8 會被講成英雄的告別演說，4:17「惟有主站在我旁邊」也會失去它的重量。","pos":[["【一】經文問的是甚麼","","<p>作者的身分，本講義沿用提摩太前書立場一，不重寫：信的開頭自稱「作基督耶穌使徒的保羅」（1:1），歷代教會一致接受；近代託名說的理由與回應已在提摩太前書講義並陳。本卷要補的，是這封信自己透露的處境。</p><p>這一次的監禁和使徒行傳末了不一樣。那時「保羅在自己所租的房子裡住了足足兩年」（徒 28:30），凡來見他的人他都接待；這一次他說「甚至被捆綁，像犯人一樣」（2:9），連阿尼色弗都要「在羅馬的時候，殷勤地找我，並且找著了」（1:17）——人要找很久才找得到他。他已經過了一次庭：「我初次申訴，沒有人前來幫助，竟都離棄我」（4:16）；他也不再期待獲釋：「我現在被澆奠，我離世的時候到了」（4:6）。<strong>經文問的是：這封信是誰、在哪裡、在甚麼光景中寫的？這個處境怎樣影響我們讀它？</strong></p>"],["使徒保羅・第二次羅馬監禁說（歷代傳統）","","<p>多數福音派與歷代教會的讀法：保羅在使徒行傳 28 章的軟禁之後曾經獲釋，又到東方走了一段路——提摩太前書說「我往馬其頓去的時候，曾勸你仍住在以弗所」（提前 1:3），提多書說他定意在尼哥坡里過冬（多 3:12）；後來再次被捕，押回羅馬，這一次是重監，提摩太後書就寫在殉道前不久。早期教會的史家也記載保羅在尼祿年間於羅馬殉道。這個讀法最能解釋信中那些具體的細節：外衣、皮卷、病了留在米利都的特羅非摩（4:13、20）。</p><p><strong>難處：</strong>使徒行傳沒有記載保羅獲釋，第二次監禁是從書信裡的行程與教父的記載「推」出來的；提摩太前書、提多書的行程也不容易排進使徒行傳的時間表。所以這個讀法是最合理的重建，不是經文直接寫明的事實，講台上要說「最可能」，不說「確定」。</p>"],["託名說（保羅門生借他的名寫成）","","<p>部分近代學者主張教牧書信三卷都是保羅死後由他的門生寫成，理由是用字與保羅其他書信不同、教會組織像較晚的時代、所對付的假教訓像二世紀初的異端。有人認為提摩太後書是仿照當時流行的「遺言」文體，借保羅之口向下一代的教會交棒。這派的優點是認真處理文字與歷史的差異，逼讀者不能只說「傳統就是這樣」。</p><p><strong>難處：</strong>提摩太後書恰恰是三卷裡最私人的一封：要外衣、要書、要皮卷（4:13），問候一連串名不見經傳的人（4:19--21），連特羅非摩在米利都生病都記下來（4:20）——這些細節對一位假託者沒有用處，反而容易被當時的讀者拆穿。而且本卷幾乎沒有教會職分，「教會組織太晚」的理由在這一卷最站不住。一封一再叫人「不要以給我們的主作見證為恥」（1:8）的信，開頭若是借名，早期教會也不會一致接受。</p>"],["殘篇說與代筆說","","<p>殘篇說是折衷的看法：信的主體是後人寫的，但其中保存了保羅真實的短箋，特別是 4:9--21 的人名與交代、1:15--18 對阿尼色弗的記念，後人把它們編進了一封較長的信裡。代筆說則從另一頭看：「獨有路加在我這裡」（4:11）——被重重捆綁的保羅，很可能是口述，由路加執筆，所以文字與早期書信不同。兩說的優點都是想同時解釋文字的差異與細節的真實。</p><p><strong>難處：</strong>殘篇說無法指出殘篇與主體的界線在哪裡，切法因人而異；而且全卷的情感是一條線——從 1:4 的眼淚到 4:22 的祝福，很難切開。代筆說是可能的，當時的書信常有執筆人，但經文沒有說路加執筆，只能當作解釋文字差異的一種可能，不能當作定論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用提摩太前書立場一——作者是使徒保羅（1:1），託名說的理由與回應並陳，不嘲諷持這個看法的學者。本卷補一段：提摩太後書最可能寫於保羅第二次在羅馬被囚、殉道前不久；這不是徒 28:30 的租房軟禁，是「被捆綁，像犯人一樣」（2:9）的重監。這是保羅留下的最後一封信。</strong></p><p>所以這封信要當遺書讀：它從眼淚開始——「記念你的眼淚，晝夜切切地想要見你」（1:4），在「願主與你的靈同在」（4:22）結束；人名多、情感濃、要求具體。他要外衣，因為「你要趕緊在冬天以前到我這裡來」（4:21）；他要人，因為「獨有路加在我這裡」（4:11）。使徒到了最後，是一個會冷、會孤單、需要朋友的人。</p><p><strong>但講台上的焦點不是保羅，是站在保羅旁邊的那一位。</strong>這封信最高的一句不是 4:7 的「那美好的仗我已經打過了」，是 4:17：「惟有主站在我旁邊，加給我力量」（4:17）。講保羅的處境很動人，但每一處都要落在主身上——會眾記得的，應該是那位在眾人離棄時仍然站在旁邊的主。</p>"],["【四】這件事該不該影響你的信心","","<p>作者是誰、第二次監禁能不能排進使徒行傳的年表，這些學術上的討論不該動搖你的信心；這封信被眾教會收入正典，是因為他們在其中聽見了主的聲音。</p><p>但有一件事該問：<strong>我讀完這封遺書，是更佩服保羅，還是更認識保羅所信的那一位？</strong>保羅自己說：「因為知道我所信的是誰，也深信他能保全我所交付他的，直到那日」（1:12）。他在牢裡沒有誇自己的忠心，他誇的是主的保全。讀這封信的人若走出去更有盼望，不是更沉重，就讀對了。</p>"]],"con":[],"say":"本講義的全卷立場：沿用提摩太前書立場一——作者是使徒保羅，託名說並陳；本卷最可能寫於第二次羅馬監禁、殉道前不久，是保羅的最後一封信，要當遺書讀。講保羅的處境，焦點卻在 4:17「惟有主站在我旁邊」的那一位。","care":"席上會有在網路上聽到「教牧書信是偽作」而動搖的年輕人，也有一聽到學者有爭論就不安的長輩；不要說「懷疑作者的都是不信派」，讓他看見教會能誠實擺出理由。講保羅的孤單、寒冷與被離棄時，席上會有正在住院、坐牢、獨居、被同工離棄的人；不要把這封信講成悲壯的英雄傳，也不要說「保羅都能撐，你也要撐」——要讓他聽見：保羅不是撐過來的，是主站在他旁邊。"},{"id":"ISS00_2","t":"受苦、羞恥與「為主受苦」的界線在哪裡？","r":"1:8--12；2:3--10；3:10--12；4:5--6","ch":[],"why":"二、為福音受的苦要擔當，而且是「同」受；不是一切的苦都叫「為主受苦」——犯錯的後果、過勞、被虐待都不是 2:3 的苦；受苦的人可以求助、可以逃離危險——本講義的全卷立場之二（本卷新立；受苦的四種分辨回指彼得前書立場二）。提摩太後書是全新約講「同受苦難」最密集的一卷，也最容易被拿來美化過勞、叫受害者留在傷害裡、把一切不順都講成逼迫。這一題必須在開卷講定，免得一封叫人剛強的信被講成叫人害怕的信。","pos":[["【一】經文問的是甚麼","","<p>保羅一再叫提摩太一起受苦：「總要按神的能力，與我為福音同受苦難」（1:8）；「你要和我同受苦難，好像基督耶穌的精兵」（2:3）；「你卻要凡事謹慎，忍受苦難」（4:5）；又說「凡立志在基督耶穌裡敬虔度日的也都要受逼迫」（3:12）。會眾會問：基督徒一定要受苦嗎？甚麼苦才算「為福音」？我受苦時覺得羞恥、害怕，是信心不夠嗎？我的過勞、我的家暴、我被公司欺壓，也是「為主受苦」嗎？</p><p>先讓經文自己說四件事。①<strong>苦難有對象</strong>：是「為福音」（1:8），是「為選民凡事忍耐」（2:10）。②<strong>苦難是「同」受的</strong>：1:8 與 2:3 的 συγκακοπάθησον 是一個帶「同」字的命令——不是一個人扛。③<strong>苦難中有拯救</strong>：「但從這一切苦難中，主都把我救出來了」（3:11）；但拯救不一定是免於受苦——「也必救我進他的天國」（4:18）。④<strong>苦難的力量來自恩典</strong>：「按神的能力」（1:8），「要在基督耶穌的恩典上剛強起來」（2:1）。<strong>經文問的是：哪一種苦是要擔當的？界線在哪裡？</strong></p>"],["受苦本身是屬靈記號說（苦修與殉道的美化）","","<p>有些傳統把受苦本身當成屬靈等級的證明：越苦越屬靈，越累越忠心，事奉的人不該休息、不該有自己的需要。它引用的經文是真的——「凡在軍中當兵的，不將世務纏身」（2:4），「我現在被澆奠」（4:6）；華人教會也常用「為主燒盡」來稱讚一位病倒的傳道人，彷彿病倒不是警訊，而是勳章。這派的優點是嚴肅看待福音的代價，不讓信仰變成消費品。</p><p><strong>難處：</strong>同一封信裡，保羅要外衣取暖：「我在特羅亞留於加布的那件外衣，你來的時候可以帶來」（4:13）；他要書，要皮卷，要人陪——「你要趕緊地到我這裡來」（4:9）。他不是苦修主義者，是一個有需要的人。他也曾叫提摩太照顧身體：「再不要照常喝水，可以稍微用點酒」（提前 5:23）。「不將世務纏身」說的是當兵的人不被分心，不是不顧家人——保羅自己說「人若不看顧親屬，就是背了真道」（提前 5:8）。把受苦本身當成目標，會把一封叫人剛強的信，講成叫人燒壞的信。</p>"],["成功神學（信心夠就不會受苦）","","<p>另一個極端認為信心夠的人就不會受苦，受苦表示禱告不夠、信心有問題；神要他的兒女健康、富足、順利。它也有經文的影子：主確實「從這一切苦難中」把保羅救出來（3:11），也「從獅子口裡」救了他（4:17）。這派的優點是相信神是好的，相信禱告有用。</p><p><strong>難處：</strong>提摩太後書是寫在牢裡的，寫信的人快要被處死；他若信心不夠，全新約就沒有信心夠的人了。保羅明說受逼迫是敬虔生活的常態（3:12），而 4:18 的「救」不是免死，是進天國——他知道自己離世的時候到了（4:6），卻仍說「主必救我」。成功神學會讓正在受苦的人在苦上再加一層羞恥，正是 1:8「不要以……為恥」要拿掉的東西。本講義不採用（回指希伯來書立場四）。</p>"],["一切不順都是逼迫說（逼迫的泛化）","","<p>這是講台上常見的滑坡：既然「凡立志在基督耶穌裡敬虔度日的也都要受逼迫」（3:12），那麼家人反對、同事不喜歡、婚姻衝突、被老闆罵，甚至被配偶打，都是「為主受逼迫」，都該默默忍耐、背起十字架。這派的優點是讓受苦的人覺得自己的苦有意義，不是白受的。</p><p><strong>難處：</strong>3:12 有條件——是「在基督耶穌裡敬虔度日」帶來的逼迫，不是一切的不順。彼得也分得很清楚：「你們中間卻不可有人因為殺人、偷竊、作惡、好管閒事而受苦」（彼前 4:15）。自己犯錯的後果、過勞壓垮的身體、被虐待的關係，都不是 2:3 說的苦。更危險的是，這個讀法會叫受害者為了「背十字架」留在不安全的地方；而保羅自己是會逃的——「用筐子把他從城牆上縋下去」（徒 9:25），在以哥念遇到危險，「就逃往呂高尼的路司得、特庇兩個城和周圍地方去」（徒 14:6）。主耶穌也說：「有人在這城裡逼迫你們，就逃到那城裡去」（太 10:23）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：①擔當為福音的苦——「不要以給我們的主作見證為恥」（1:8）；但不可把一切的苦都叫作「為主受苦」：自己犯錯的後果、過勞的身體、被虐待的關係，都不是 2:3 說的苦。②不美化受苦本身——保羅要外衣、要書、要同伴（4:11--13），他是一個有需要的人。③「同受」是關鍵——教會的責任是一起受，不是看著一個人受。</strong></p><p>「同受苦難」這個命令，不只是叫提摩太加入保羅的苦，也是叫教會不要讓任何一個人獨自受苦：「你們各人的重擔要互相擔當」（加 6:2）。阿尼色弗就是這樣的人——「因他屢次使我暢快，不以我的鎖鍊為恥」（1:16）。受苦的人可以憂愁、可以求助、可以休息；主耶穌自己對累壞的門徒說：「你們來，同我暗暗地到曠野地方去歇一歇」（可 6:31）。</p><p><strong>人身安全受威脅時，先保護生命、依法求助。</strong>被暴力、虐待、性侵、霸凌的人，離開危險、尋求法律與專業協助，不違背「同受苦難」；保羅在 3:11 是被主「救出來」的，他也用羅馬公民的身分保護自己：「人是羅馬人，又沒有定罪，你們就鞭打他，有這個例嗎？」（徒 22:25）。</p><p>321 的落點：捨己——為耶穌、為別人、不為自己。<strong>捨己是把自己倒出來給主</strong>（4:6「我現在被澆奠」——澆奠是獻給神的），<strong>不是讓別人把你榨乾。</strong>倒給主的人，最後說的是「那美好的仗我已經打過了」（4:7）；被榨乾的人，最後只剩下怨。</p>"],["【四】這件事該不該影響你的信心","","<p>受苦的神學有許多派別，苦難從哪裡來、神為甚麼允許，這些討論不該動搖你的信心；保羅在牢裡也沒有給提摩太一套解釋，他給的是一位主：「主都把我救出來了」（3:11），「惟有主站在我旁邊，加給我力量」（4:17）。</p><p>但有兩件事該問：<strong>我在為福音受苦的時候，是一個人扛，還是讓弟兄姊妹與我「同」受？</strong><strong>我把甚麼苦叫作「為主受苦」——它真的是為福音，還是我該離開、該求助、該休息的苦？</strong>受苦的人不必羞恥：「然而我不以為恥；因為知道我所信的是誰」（1:12）。不以為恥的根據，不是我多勇敢，是我知道他是誰。</p>"]],"con":[],"say":"本講義的全卷立場：為福音受的苦要擔當，而且是「同」受——教會一起受，不讓人獨自扛；但不是一切的苦都叫為主受苦——犯錯的後果、過勞、被虐待都不是 2:3 的苦，受虐不是背十字架。捨己是把自己倒給主，不是讓別人把你榨乾；人身安全受威脅時，先保護生命、依法求助。","care":"牧養底線：不用 2:3--4、4:5--6 稱讚一位正在過勞、失眠、婚姻快撐不住的同工「為主燒盡」；不用 3:12 叫被家暴、被霸凌、被性騷擾的人「忍下去就是背十字架」——那不是逼迫，是侵害，先陪他到安全的地方，必要時協助通報與就醫。席上會有長期病痛、照顧失智父母、被公司裁員的人，他們的苦不必硬貼上「為主」才算有意義；神在一切苦中都同在。也會有正在逃離危險、卻覺得自己「不夠屬靈」的人，要讓他聽見保羅也曾從城牆上被縋下去。不要說「你受苦是因為信心不夠」「休息就是偷懶」「為了見證你要留下來」。"},{"id":"ISS00_3","t":"堅忍與救恩的確據：「我們若不認他，他也必不認我們」是甚麼意思？","r":"2:11--13；2:19；4:18","ch":[],"why":"三、三讀並陳（聖徒恆忍／真實背道的可能／警告是保守的工具）；「不認」與「失信」是兩個字；確據掛在「他不能背乎自己」——沿用希伯來書講義對 6:4--6、10:26--39 的處理（來 ISS00_3），本卷補新。2:11--13 是全卷的樞紐，也是華人教會最常引發得救焦慮的經文之一：軟弱的信徒聽到「他也必不認我們」就失眠，刻意離開信仰的人卻拿「他仍是可信的」當擋箭牌。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「有可信的話說：我們若與基督同死，也必與他同活；我們若能忍耐，也必和他一同作王。我們若不認他，他也必不認我們；我們縱然失信，他仍是可信的，因為他不能背乎自己」（2:11--13）。前兩行是我們的路——同死、同活、忍耐、作王；後兩行是兩種失敗——不認、失信；最後一行把整首詩從「我要忠心」翻轉成「他是可信的」。</p><p>原文有一個細節：2:12 的「不認」是 ἀρνησόμεθα（SBLGNT 作將來式，RP 作現在式），主那邊的回應是 ἀρνήσεται；2:13 的「失信」卻是另一個字 ἀπιστοῦμεν，主那邊是「他仍是可信的」（πιστὸς μένει）。和合本 2:12 的「能」字是小字，原文只是「若忍耐」。<strong>經文問的是：2:12b 的「不認」指的是誰、怎樣的不認？2:13 的「失信」又是甚麼？一個跌倒的信徒，聽到這四行該害怕，還是該得安慰？</strong></p>"],["改革宗・聖徒恆忍說","","<p>認為 2:12b 指的是最終、全然的背棄——一個人到底否認基督，顯明他從未真正屬於基督：「他們從我們中間出去，卻不是屬我們的」（約壹 2:19）。真正蒙揀選的人，神的信實保證他們最終不會全然離棄：「誰也不能從我手裡把他們奪去」（約 10:28）。2:13 正是這個保證——我們縱然軟弱失信，他仍保守。這派的優點是把確據牢牢放在神的手裡，給跌倒的信徒很大的安慰。</p><p><strong>難處：</strong>若講得不小心，會讓人回頭懷疑自己「到底有沒有真的得救」——一個正在掙扎的人，可能把自己的每一次跌倒都當成「從未屬主」的證據，反而更焦慮。它也要誠實面對：2:12b 的警告是寫給教會裡的人看的，不只是寫給「從來不是信徒的人」；警告若對讀信的人毫無關係，保羅何必寫它？</p>"],["阿民念／衛斯理宗・真實背道可能說","","<p>認為真實的信徒有可能最終離棄基督、失落救恩；2:12b 是一個真實的可能，不只是假設。神信實於他的話——包括他的應許，也包括他的警告；2:13 的「他仍是可信的」，意思是他說「必不認」就必不認。希伯來書的警告也這樣讀：「若是離棄道理，就不能叫他們重新懊悔了」（來 6:6）。這派的優點是嚴肅看待警告，不讓人把恩典當成放縱的許可。</p><p><strong>難處：</strong>若 2:13 只是「他也會照樣懲罰失信的人」，這一行就跟 2:12b 說同一件事，整首詩的翻轉就不見了——原文刻意換了字，2:13 的對比是「我們失信」與「他可信」，不是「我們失信、他也失信」。而且這個讀法若在講台上講不好，會讓軟弱的信徒活在「我還有沒有救恩」的恐懼裡，這正是 1:7「神賜給我們，不是膽怯的心」要拿掉的東西。</p>"],["警告是保守的工具說","","<p>部分福音派學者提出第三條路：警告是真實的，不是嚇人的假設；但神正是藉著警告保守他的人。就像路邊懸崖的告示牌，它的目的不是讓人掉下去，是讓人不掉下去。確據與警告並行，不是互相抵消——真正屬主的人，會因著警告回頭，而回頭本身就是神保守的記號。希伯來書也是這樣收尾的：「我們卻不是退後入沉淪的那等人，乃是有信心以致靈魂得救的人」（來 10:39）。</p><p><strong>難處：</strong>這個讀法在神學上比較細，需要講台花時間解釋，否則會眾只記得「警告是真的」，或只記得「反正神會保守」。它也沒有正面回答「一個人到底會不會失落救恩」這個問題，而是把焦點從推測轉到回應——對想要一個明確答案的人來說，這可能不夠。</p>"],["賞賜說（2:12b 指失去與主同作王的賞賜）","","<p>另有一種讀法認為：這首詩講的是賞賜，不是救恩——2:12a 說「也必和他一同作王」，那麼 2:12b 的「不認我們」就是在審判台前不承認這人配得同作王的獎賞，得救的身分不受影響。這派的優點是把 2:12 放在「作王」的上下文裡讀，也減輕了得救的焦慮。</p><p><strong>難處：</strong>主耶穌說同樣的話時，對象是一個人的整體歸屬，不只是獎賞：「凡在人面前不認我的，我在我天上的父面前也必不認他」（太 10:33）；2:12b 很可能正是回響這句話。把「不認」縮成「少了獎賞」，會讓刻意、長期離棄信仰的人以為代價不大，正好落入本講義要防備的另一端：拿 2:13 當擋箭牌。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用希伯來書立場三，陳列三讀（聖徒恆忍、真實背道的可能、警告是保守的工具），不在本卷裁判宗派之爭。講台落點有兩個：</strong></p><p>①<strong>「不認」與「失信」是兩個不同的字。</strong>2:12 的 ἀρνησόμεθα 是有意的、持續的否認——這使我們想起主說「凡在人面前不認我的」（太 10:33）；2:13 的 ἀπιστοῦμεν 是軟弱、不信實、跌倒。<strong>但要誠實：</strong>福音書記彼得三次不認主，用的正是同一個動詞 ἠρνήσατο——「彼得在眾人面前卻不承認」（太 26:70），「彼得又不承認」（太 26:72）。所以分別不只在用字，<strong>更在最後的方向</strong>：彼得不認主之後回頭了。主早就為他禱告：「但我已經為你祈求，叫你不至於失了信心。你回頭以後，要堅固你的弟兄」（路 22:32）；「回頭」（ἐπιστρέψας）是主預先替他留好的路。2:12 說的，是到底不回頭的否認。</p><p>②<strong>確據掛在 2:13 的末句：「因為他不能背乎自己」（2:13）。</strong>確據不在我抓得多緊，在他是誰。這和保羅在 1:12 說的是同一件事——「深信他能保全我所交付他的，直到那日」（1:12）；也和 2:19 神堅固的根基上的印記同一件事：是主認識誰是他的人，不是人先把自己認出來。4:18 保羅自己這樣作結：「主必救我脫離諸般的凶惡，也必救我進他的天國」（4:18）。</p><p><strong>牧養底線：不讓正在軟弱中的人聽完更絕望；也不讓刻意離棄信仰的人拿 2:13 當擋箭牌。</strong>對前者，講彼得的回頭與 2:13；對後者，講 2:12 與太 10:33，誠實而溫柔地請他回頭。</p>"],["【四】這件事該不該影響你的信心","","<p>聖徒恆忍與背道可能之爭，兩千年來最愛主的人也沒有完全談攏；這個宗派之爭不該動搖你的信心，持不同看法的，都是一同仰望那位可信之主的弟兄姊妹。</p><p>但有一件事該問：<strong>我現在的方向，是在回頭，還是在離開？</strong>一個會為自己的跌倒難過、還想回到主面前的人，那份難過本身就是主還在拉他的記號——「壓傷的蘆葦，他不折斷；將殘的燈火，他不吹滅」（太 12:20）。你的信心可能很軟弱，但你得救的根據不是你的信心有多強，是「他仍是可信的」（2:13）。</p>"]],"con":[],"say":"本講義的全卷立場：沿用希伯來書立場三，2:11--13 三讀並陳（聖徒恆忍／真實背道的可能／警告是保守的工具）；「不認」與「失信」是兩個字，彼得也曾不認主，分別更在最後的方向——他回頭了（路 22:32）；確據掛在「因為他不能背乎自己」——不在我抓得多緊，在他是誰。","care":"牧養底線：席上會有因為一次跌倒、一段離開教會的日子、一個反覆犯的罪，而懷疑自己「已經沒有救恩」、整夜睡不著的人；不要用 2:12 加重他的恐懼，帶他看彼得的回頭與 2:13 的末句，並陪他回到群體裡。也會有刻意、長期離棄信仰、卻說「反正神是可信的」的人；不要用 2:13 安慰他，誠實地把 2:12 與太 10:33 擺在他面前，同時讓他知道門還開著。得救焦慮若伴隨強迫性的反覆認罪、失眠或無望感，會後單獨關心，必要時協助尋求專業協助；不要說「你一定沒有真的得救」。"},{"id":"ISS00_4","t":"聖經的默示與權威：「神所默示」是甚麼意思？","r":"3:14--17；2:15","ch":[],"why":"四、θεόπνευστος 神所呼出的；文法兩讀並陳；福音派對聖經權威的共同立場，不在本卷裁判細部定義；默示的目的是叫屬神的人得以完全——本講義的全卷立場之四（本卷新立）。3:16 是全套 321 聖經講義「聖經是我的準則」最直接的根據，也是教會史上爭論最多的經文之一：有人用它分門，有人用它打人，也有人因為聽到「聖經有錯」的說法而動搖。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，叫屬神的人得以完全，預備行各樣的善事」（3:16--17）。「神所默示的」原文是 θεόπνευστος，新約只出現這一次，字面是「神所呼出的」——這使我們想起神造人時「將生氣吹在他鼻孔裡」（創 2:7）：聖經是神呼出來的話。</p><p>這一節有三個問題。①<strong>文法</strong>：πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος 沒有動詞，可以讀成「聖經都是神所默示的，〔也〕都是有益的」（和合本正文），也可以讀成「凡神所默示的聖經，都是有益的」（和合本註腳）。②<strong>範圍</strong>：保羅說的「聖經」指甚麼？直接上下文是「並且知道你是從小明白聖經」（3:15）——提摩太從小讀的舊約。③<strong>性質</strong>：「默示」到甚麼程度？每一個字都沒有錯嗎？<strong>經文問的是：聖經的權威從哪裡來？它是用來做甚麼的？</strong></p>"],["文法兩讀（和合本正文／註腳）","","<p>第一讀「聖經都是神所默示的，也都是有益的」：θεόπνευστος 與 ὠφέλιμος 用「和」連在一起，兩個形容詞並列作述語，多數譯本採這個讀法。它的優點是直截了當地宣告全部聖經出於神。第二讀「凡神所默示的聖經，都是有益的」：把 θεόπνευστος 當作修飾語，重點落在「有益」。它的優點是文法上也通，而且緊接 3:15，強調聖經的用處。</p><p><strong>難處：</strong>第一讀要解釋為甚麼保羅要特別說「有益」；第二讀則常被誤解成「有些聖經不是神所默示的」——但在保羅的語境裡，沒有一部「不是神所默示的聖經」可以拿來對比，「凡……的聖經」說的仍是全部。<strong>兩讀都承認聖經出於神，</strong>差別在強調點，不在聖經的權威；本講義在 gram 並陳，不在講台上辯論。</p>"],["完全無誤說","","<p>許多福音派教會與神學院的立場：聖經在原稿中，凡它所肯定的，無論信仰、倫理、歷史或自然的事，都沒有錯誤。理由是：神是真實的，他所呼出的話也必然真實；主耶穌說「你們錯了；因為不明白聖經，也不曉得神的大能」（太 22:29），把錯誤歸給人對聖經的誤解，不歸給聖經。這派的優點是把聖經的權威放得很高，給教會一個穩固的根基。</p><p><strong>難處：</strong>無誤說需要一連串細緻的說明：原稿已經不存在、抄本有異文、古代的記述方式（約數、不按時間排序、現象語言）不能用現代的標準要求。若沒有這些說明，會眾很容易以為「只要找到一個難解之處，整本聖經就倒了」，信心反而變得脆弱；若把細部定義當成信仰的門檻，也容易把同樣敬畏聖經的弟兄姊妹排除在外。</p>"],["有限無誤說（在信仰與生活的事上無謬）","","<p>另一些福音派學者主張：聖經在它要教導的事上——救恩、信仰與生活——完全可信、不會叫人錯；至於附帶提及的歷史或自然細節，要按當時的寫作方式理解，不必當成無誤論所要保護的範圍。他們的根據正是 3:15--17：聖經的目的是「使你因信基督耶穌，有得救的智慧」（3:15），是「叫屬神的人得以完全」（3:17）。這派的優點是緊扣經文自己說的目的。</p><p><strong>難處：</strong>「信仰的事」與「附帶的事」的界線不容易劃；聖經的救恩是落在歷史裡的——基督「從死裡復活」（2:8）是一件歷史事件，不能只當作信仰的象徵。界線劃得太寬，聖經的權威就容易被一點一點削減，最後變成由讀者決定哪些可以信。</p>"],["「聖經成為神的話」說（新正統）","","<p>二十世紀有一派神學主張：聖經是人對神啟示的見證，本身是人的文字，當聖靈藉著它向人說話的時候，它「成為」神的話。這派的優點是看重聖靈的光照，提醒讀經的人不是在研究一本古書，是在聆聽一位活的神；也誠實面對聖經的人性面。</p><p><strong>難處：</strong>3:16 說聖經「是」神所默示的，不是「會成為」；默示是聖經本身的性質，不取決於讀者此刻有沒有被感動。彼得也說：「因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來」（彼後 1:21）——聖靈的工作在寫的時候，不只在讀的時候。若權威取決於讀者的經驗，聖經就不能再督責、扶正讀的人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：站在福音派對聖經權威的共同立場——聖經全部是神所呼出的話，是信仰與生活最終的準則；無誤論各家的細部定義並陳，不在本卷裁判，也不拿這個分歧作定罪、分門的標準。</strong>「聖經」直接上下文是提摩太從小明白的舊約（3:15）；新約自己已把使徒的書信與「別的經書」並列——「如強解別的經書一樣」（彼後 3:16），也把主的話與申命記並稱為經（這使我們想起提前 5:18）。</p><p><strong>四個用處，兩個說「甚麼是對的」，兩個「把人扶正」：</strong>教訓、督責（ἐλεγμόν）告訴人甚麼是真理、哪裡偏了；使人歸正（ἐπανόρθωσιν，重新扶直）、教導人學義，把人扶起來、帶著走。目的是「叫屬神的人得以完全，預備行各樣的善事」（3:17）——「完全」（ἄρτιος）是合用、齊備，「預備」（ἐξηρτισμένος）是裝備齊全。<strong>聖經不是審判別人的法典，是先把讀的人自己扶正的工具。</strong></p><p>所以 3:16 要和 2:15 一起讀：「按著正意分解真理的道」（2:15）——ὀρθοτομοῦντα 是直直地切開，先把自己切直；也要和 2:24--25 一起讀：「只要溫溫和和地待眾人」（2:24），「用溫柔勸戒那抵擋的人」（2:25）。321 的落點：聖經是我的準則——不是拿來量別人的尺，是我每天站上去的地基。</p>"],["【四】這件事該不該影響你的信心","","<p>文法兩讀、無誤論的細部定義，不該動搖你的信心；這些討論發生在「怎樣描述聖經的權威」的層次，參與討論的福音派弟兄姊妹都同樣敬畏聖經、順服聖經。如果你在網路上讀到「聖經有矛盾」而不安，可以帶著問題來問，像庇哩亞人那樣「天天考查聖經，要曉得這道是與不是」（徒 17:11）。</p><p>但有一件事該問：<strong>我讀聖經，是被它扶正，還是拿它去扶正別人？</strong>提摩太在亂世中站得住，不是因為他贏了每一場辯論，是因為「你是從小明白聖經」（3:15），而那聖經叫他認識了一個人——「因信基督耶穌，有得救的智慧」（3:15）。聖經最終要帶你到的，是基督自己。</p>"]],"con":[],"say":"本講義的全卷立場：聖經全部是神所呼出的話（θεόπνευστος），是信仰與生活最終的準則；文法兩讀並陳，兩讀都承認聖經出於神；站在福音派對聖經權威的共同立場，不在本卷裁判無誤論的細部定義，不以此分門。默示的目的是叫屬神的人得以完全——聖經先把讀的人自己扶正。","care":"牧養底線：不在講台、小組、網路群組裡拿 3:16 一節一節地定罪別人，更不拿無誤論的細部定義判斷誰是真信徒；四個用處有兩個是扶正，2:24--25 要求的是溫柔。席上會有在大學課堂或網路上聽到「聖經有錯」而動搖的年輕人，不要說「問這種問題就是不信」，陪他一起查考；也會有曾經被人用經文打過、一翻開聖經就害怕的人，要讓他知道聖經是先把我們扶起來的，不是把我們打倒的。不要說「你不接受某一套定義就是不信聖經」。"},{"id":"ISS00_5","t":"傳承：四代門徒與屬靈父母兒女——信仰怎樣一代一代傳下去？","r":"1:2；1:5；2:2；3:14--15","ch":[],"why":"五、傳承有家庭與屬靈父子兩條線；家庭信仰是祝福不是得救的條件；屬靈父母不是屬靈主人；傳承不等於複製——本講義的全卷立場之五（本卷新立）。提摩太後書是一封交棒的信：外祖母、母親、保羅、提摩太、忠心的人、別人，一條線傳下去。可是這條線在華人教會裡常被用壞：第一代信徒覺得自己次等，兒女不信主的父母自責，「屬靈父親」變成控制人的權柄，門徒訓練變成複製一個模子。","pos":[["【一】經文問的是甚麼","","<p>保羅寫信「給我親愛的兒子提摩太」（1:2），開頭就說：「這信是先在你外祖母羅以和你母親友妮基心裡的，我深信也在你的心裡」（1:5）；第三章又說：「並且知道你是從小明白聖經」（3:15）。第二章給了一條四代的線：「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人」（2:2）——保羅、提摩太、忠心的人、別人。</p><p>先讓經文自己說四件事。①<strong>傳承有兩條線</strong>：家庭（1:5；3:15）與屬靈父子（1:2；2:2）。②<strong>交託的對象是「忠心」的人</strong>，「能教導別人」是第二個條件。③<strong>傳承的內容是「在許多見證人面前」聽見的</strong>——公開、可檢驗，不是秘傳。④<strong>傳承要經過受苦</strong>：2:3「你要和我同受苦難」緊接在 2:2 之後。<strong>經文問的是：信仰可以「教」出來嗎？誰有資格帶人？沒有基督徒家庭的人怎麼辦？屬靈父母的權柄到哪裡為止？</strong></p>"],["家庭承傳說（信仰主要靠家庭傳遞）","","<p>認為神的恩典常沿著家庭的線流下去，基督徒父母有責任從小教導兒女；羅以、友妮基到提摩太就是榜樣，改革宗的盟約神學也特別看重信徒家庭。這派的優點是看重家庭的屬靈責任，提醒父母：孩子「從小明白聖經」（3:15）不是偶然，是有人教。</p><p><strong>難處：</strong>若把家庭信仰講成得救的條件或「正統」的記號，第一代信徒就成了次等的人；而提摩太自己的家也不完整——「是信主之猶太婦人的兒子，他父親卻是希臘人」（徒 16:1）。更根本的是，信仰不能遺傳：「這等人不是從血氣生的，不是從情慾生的，也不是從人意生的，乃是從神生的」（約 1:13）。家庭承傳說若講過頭，也會讓兒女不信主的父母活在自責裡。</p>"],["屬靈遮蓋說（屬靈父親對兒子有權柄，兒子要順服）","","<p>一些教會與事工運動強調「屬靈父親」的權柄：保羅稱提摩太「我兒」，所以屬靈兒子要順服屬靈父親的指示，在婚姻、職業、奉獻、去留上聽從他的「遮蓋」。這派的優點是重視屬靈關係的親密與委身，也回應了今天許多年輕人沒有人帶、沒有榜樣可跟的真實需要。</p><p><strong>難處：</strong>保羅雖然叫提摩太「我兒」，卻叫他自己去分辨：「因為你知道是跟誰學的」（3:14）——提摩太被要求的是檢驗老師的生命（3:10），不是盲目服從。主耶穌說得更直接：「也不要稱呼地上的人為父，因為只有一位是你們的父，就是在天上的父」（太 23:9）；「你們都是弟兄」（太 23:8）。屬靈父母若變成屬靈主人，控制婚姻、財務與人際，就已經是屬靈虐待（長老、權柄與屬靈虐待回指彼得前書立場五）。</p>"],["個人主義說（信仰是個人與神之間的事）","","<p>走到另一端的人認為：每一個人都可以直接讀經、直接向神禱告，不需要屬靈父母，也不需要被誰「帶」；傳承、門訓、師徒關係，都有控制的危險。這派的優點是守住了每個信徒直接到神面前的自由，也誠實面對了「屬靈父親」被濫用的歷史。</p><p><strong>難處：</strong>提摩太後書整卷都在反駁這種孤立：保羅要人陪、要提摩太來，叫他「同那清心禱告主的人追求公義、信德、仁愛、和平」（2:22）；信仰的內容也是「在許多見證人面前」領受的（2:2），不是一個人關起門來想出來的。沒有人帶的信仰容易走偏，2:17--18 的許米乃、腓理徒正是自己說了算的人。因為有人濫用權柄就拒絕一切屬靈關係，並不能保護人。</p>"],["制度傳承說（傳承靠職分與按手的統緒）","","<p>有些傳統把 2:2 與 1:6「藉我按手所給你的恩賜」讀成職分的統緒：使徒按立提摩太，提摩太再按立下一代，真理的保存靠這條不斷的按手之線。這派的優點是看重秩序與可追溯的教導，提醒教會真道不是誰都可以自封的（按手回指提摩太前書講義第 4 章）。</p><p><strong>難處：</strong>2:2 交託的對象條件是「忠心」，不是職銜；本卷幾乎沒有提到教會職分，保羅關心的是交出去的內容（「所教訓的」）與接棒的人的品格，不是一條按手的鏈子本身。而且在亞細亞，聽過保羅教導的眾人也離棄了他（1:15），底馬是同工也離開了（4:10）——傳承的保證不在制度，在忠心與神的保守。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：傳承有家庭與屬靈父子兩條線，兩條都真實；並且有三條界線——</strong></p><p>①<strong>家庭信仰是祝福，不是得救的條件。</strong>沒有基督徒家庭的人不是次等的：提摩太的父親是希臘人，他的家也不完整；他還有另一條線——保羅「因信主作我真兒子的提摩太」（提前 1:2）。兒女還沒有信主的父母，也不必把一切歸咎自己：信仰「乃是從神生的」（約 1:13），父母的責任是播種與禱告。</p><p>②<strong>屬靈父母不是屬靈主人。</strong>保羅叫提摩太「我兒」，也叫他自己去分辨——「因為你知道是跟誰學的」（3:14）。保羅回想的是提摩太「待我像兒子待父親一樣」（腓 2:22），而不是兒子對主人的服從；他在別處也說自己「如同母親乳養自己的孩子」（帖前 2:7）。屬靈父母的權柄只到愛與榜樣為止。</p><p>③<strong>傳承不等於複製。</strong>提摩太不必變成保羅：保羅剛強果決，提摩太年輕、有眼淚（1:4）、可能天性怯懦；保羅沒有叫他換一個性格，叫他「將神藉我按手所給你的恩賜再如火挑旺起來」（1:6）——挑旺的是神給他的那一份。傳承的目標是「直等到基督成形在你們心裡」（加 4:19），不是我的樣子成形在你心裡。</p><p>321 的落點（先讓經文講完，321 才在末端認出它）：「235」的 3——屬靈父母兒女；八大步驟的「繁殖」。<strong>一個人的事工能活多久，看他交出去了沒有。</strong>但 2:2 不是「繁殖」的定義，1:2 也不是「3」的定義；交棒的根據是 1:12 那位能保全所交付之物的主，不是我們的系統。</p>"],["【四】這件事該不該影響你的信心","","<p>家庭承傳與個人信仰孰重、屬靈父親的權柄多大、按手的統緒是否必要，這些討論不該動搖你的信心；你是第一代信徒也好，第五代也好，你得救的根據都一樣——「神救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典」（1:9）。</p><p>但有兩件事該問：<strong>我手上的棒，交出去了沒有？</strong>不必是講台，可以是一個孩子、一位同事、一個小組裡的新朋友。<strong>我帶人的時候，是把他帶到我面前，還是帶到主面前？</strong>保羅交給提摩太的最後一句話不是「記得我」，是「願主與你的靈同在」（4:22）。</p>"]],"con":[],"say":"本講義的全卷立場：傳承有家庭（1:5；3:15）與屬靈父子（1:2；2:2）兩條線；家庭信仰是祝福，不是得救的條件，第一代信徒不是次等；屬靈父母不是屬靈主人——保羅叫提摩太「我兒」，也叫他自己分辨；傳承不等於複製——提摩太不必變成保羅。","care":"牧養底線：席上會有全家只有自己信主、在家族聚會裡被當外人的第一代信徒，也有兒女離開教會、夜夜為此流淚自責的父母；不要說「你的家沒有屬靈根基，所以比較難」「兒女不信是父母不夠屬靈」，帶他們看提摩太不完整的家與保羅這條屬靈父親的線。也會有被「屬靈父親」「屬靈遮蓋」控制婚姻、工作與奉獻的人；不要說「離開就是背叛遮蓋」，先讓他說，必要時協助他找可信任的屬靈長輩與專業協助。帶門徒的同工也要提醒自己：不要把人帶成自己的影子。"},{"id":"ISS00_6","t":"寫作年代：教牧書信三卷誰先誰後？與第二次羅馬監禁有甚麼關係？","r":"1:15--17；4:9--21","ch":[],"why":"六、約主後 64–67 年；提摩太前書、提多書在前，提摩太後書最後；與使徒行傳末章的接合並陳。讀者常會問：使徒行傳停在保羅在羅馬租房傳道，提摩太後書卻說他被捆綁像犯人、知道自己快要死了——中間發生了甚麼？把年代與先後講清楚，會眾才讀得出這封信的時間感：這是一個走到終點的人寫的。","pos":[["【一】經文問的是甚麼","","<p>提摩太後書透露了幾個時間的線索：保羅在羅馬被囚（1:17），已經過了一次庭（4:16）；最近走過特羅亞，把外衣留在那裡（4:13）；「特羅非摩病了，我就留他在米利都」（4:20）；以拉都留在哥林多（4:20）；他要提摩太「趕緊在冬天以前」來（4:21）。</p><p>問題是：使徒行傳裡的保羅，經過米利都時是去耶路撒冷，特羅非摩那時沒有留下，而是跟他到了耶路撒冷（徒 21:29）；使徒行傳最後停在「保羅在自己所租的房子裡住了足足兩年」（徒 28:30）。<strong>經文問的是：提摩太後書寫在甚麼時候？它和提摩太前書、提多書誰先誰後？能不能排進使徒行傳的時間表？</strong></p>"],["獲釋後再度被捕說（約主後 64–67 年）","","<p>多數接受保羅為作者的學者採這個讀法：保羅在徒 28 的兩年軟禁之後獲釋（約主後 62 年），又去了以弗所、馬其頓、克里特等地——這時寫了提摩太前書與提多書；後來在尼祿逼迫期間（主後 64 年羅馬大火之後）再度被捕，押回羅馬，在殉道前寫了提摩太後書。保羅在腓立比書中確實期待獲釋：「但我靠著主自信我也必快去」（腓 2:24）。</p><p><strong>難處：</strong>獲釋這件事沒有寫在使徒行傳裡，是從教牧書信的行程與教父的記載推出來的；第二次被捕的時間與原因也沒有直接的史料。這個讀法的好處是能容納 4:13、20 的行程細節，但年代只能說「約」，不能說「確定」。</p>"],["寫於使徒行傳期間說","","<p>少數學者嘗試把教牧書信排進使徒行傳的時間表裡，例如把提摩太後書放在徒 28 的羅馬軟禁期間，或甚至放在該撒利亞的監禁期間（徒 24--26）。這派的優點是不需要假設一次使徒行傳沒有記載的獲釋，可以直接用使徒行傳的框架讀信。</p><p><strong>難處：</strong>4:20 的特羅非摩留在米利都，和徒 21:29 他跟到耶路撒冷不合；徒 28 那時保羅「放膽傳講……並沒有人禁止」（徒 28:31），與 2:9「被捆綁，像犯人一樣」、4:6「我離世的時候到了」的光景差別太大。要把這些細節硬排進使徒行傳，需要的推測比第二次監禁說更多。</p>"],["託名說的晚期年代（主後 100 年前後）","","<p>主張託名的學者把教牧書信三卷放在一世紀末到二世紀初，認為信中的假教訓與教會處境屬於較晚的時代，提摩太後書則是仿照遺言文體、紀念保羅殉道的作品。這派的優點是不必處理保羅行程的排列問題。</p><p><strong>難處：</strong>本卷的細節非常具體、非常私人，對一世紀末的讀者沒有實際用處；而且提摩太後書沒有發展完整的教會組織，所謂「較晚的處境」在這一卷最看不出來。作者問題本講義已沿用提摩太前書立場一處理（見 ISS00_1），這裡只並陳年代的看法。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：提摩太後書約寫於主後 64–67 年，保羅第二次在羅馬被囚、殉道前不久；教牧書信三卷的次序是提摩太前書、提多書在前，提摩太後書最後；與使徒行傳末章的接合，並陳獲釋說與使徒行傳期間說。</strong></p><p>這個次序讓兩卷提摩太書讀成一句話的兩半：提摩太前書是父親在路上寫的，「我指望快到你那裡去」（提前 3:14）；提摩太後書是父親在牢裡寫的，「你要趕緊地到我這裡來」（4:9）。前一封說「你要保守所託付你的」（提前 6:20），這一封說「所信的道我已經守住了」（4:7）——守住、打完、交棒。</p><p>使徒行傳停在「並沒有人禁止」（徒 28:31），提摩太後書補上了另一句：「然而神的道卻不被捆綁」（2:9）。保羅被捆綁了，福音沒有。</p>"],["【四】這件事該不該影響你的信心","","<p>確切的年份、保羅獲釋過沒有、三卷書的先後，不該動搖你的信心；這些是讀信的時間表，不是信的內容。</p><p>但有一件事該問：<strong>如果我知道自己的時間不多了，我會把甚麼交出去？</strong>保羅在最後的幾個月裡，不是在整理自己的名聲，是在交棒、在要人、在為離棄他的人禱告——「但願這罪不歸與他們」（4:16）。時間是主給的，終點也有主在等：「從此以後，有公義的冠冕為我存留」（4:8）。</p>"]],"con":[],"say":"本講義的全卷立場：提摩太後書約寫於主後 64–67 年，保羅第二次羅馬監禁、殉道前不久；提摩太前書、提多書在前，提摩太後書最後；與使徒行傳末章的接合並陳獲釋說與使徒行傳期間說。保羅被捆綁了，神的道卻不被捆綁。","care":"席上會有喜歡排年表的弟兄，也有一聽到「學者推測」就覺得聖經不可靠的人；對前者，提醒他年表是幫助讀信的地圖，不要讓它取代信的內容；對後者，讓他看見「推測」是誠實地承認史料有限，不是聖經出了問題。講到保羅生命的最後幾年時，席上可能有剛得知自己病重、時間不多的人；不要把終點講成悲劇，也不要說「你還年輕不用想這些」，帶他看 4:8 為他存留的冠冕。"},{"id":"ISS00_7","t":"「保羅的最後一封信」——這個傳統的根據是甚麼？","r":"4:6--8；4:16--18","ch":[],"why":"七、4:6 被澆奠、離世的時候到了；早期教會傳統說保羅在尼祿年間殉道；本卷的口吻是遺言，不是悲壯。「最後一封信」這個稱呼讓提摩太後書在會眾心裡有特別的份量，但它的根據是甚麼，多數人沒有想過；而一封遺書最容易被講成悲壯的英雄故事，叫人沉重，不叫人有盼望。這一題要把根據擺出來，也把口吻定下來。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「我現在被澆奠，我離世的時候到了」（4:6）；接著回顧一生：「那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了」（4:7）。「被澆奠」原文 σπένδομαι，是把酒倒在祭物上的奠祭——這使我們想起民 28:7 的奠祭，保羅自己在腓立比書也用過：「我若被澆奠在其上，也是喜樂」（腓 2:17）。「離世」（ἀναλύσεώς）原本是拔營、解纜，船要開走了。</p><p>可是同一封信裡，他也說主「從獅子口裡」救了他（4:17），還要提摩太帶外衣、書和皮卷來（4:13）。<strong>經文問的是：保羅是確知自己快要死了，還是只是作最壞的打算？「最後一封信」的說法根據在哪裡？這封信的口吻是甚麼？</strong></p>"],["傳統說（尼祿年間在羅馬殉道，本卷是最後一封）","","<p>早期教會的記載相當一致：一世紀末羅馬的革利免提到保羅在列位掌權者面前作見證後離世；二世紀以後的教父與四世紀的教會史家都記載保羅在尼祿年間於羅馬被斬首。加上 4:6 的「離世的時候到了」、4:8 的「從此以後」，教會傳統一致把這封信當作保羅最後的書信。這派的優點是同時有經文內證與教會外證。</p><p><strong>難處：</strong>早期的記載多半簡短，細節（例如斬首的地點）出自較晚的傳統；新約本身沒有記載保羅的死。而且 4:13 要書要皮卷、4:21 要提摩太冬天以前來，顯示他仍預期還有一段日子——「最後一封」是根據信的內容與傳統的合理判斷，不是經文直接的宣告。</p>"],["作最壞打算說（保羅不確定自己的結局）","","<p>有些註釋家指出：保羅過去也幾次以為自己要死了，後來卻被救出來——腓立比書裡他說「我正在兩難之間，情願離世與基督同在，因為這是好得無比的」（腓 1:23），結果獲釋；4:17 他也說主「從獅子口裡」救了他。所以 4:6 可能是他對局勢的判斷，不一定是確知。這派的優點是不把保羅讀成先知式的預言自己死期，保留了他作為一個人的真實。</p><p><strong>難處：</strong>4:6--8 的口吻與腓立比書不同：腓立比書是「兩難」，這裡是「到了」；腓立比書說「我既然這樣深信，就知道仍要住在世間」（腓 1:25），這裡說「從此以後，有公義的冠冕為我存留」（4:8）。保羅在這封信裡沒有再提獲釋的盼望，只提天國：「也必救我進他的天國」（4:18）。</p>"],["遺言文體說（仿照告別演說的文學形式）","","<p>部分學者注意到提摩太後書有古代「遺言」文體的特徵：臨終者回顧一生、預告將來的危險（3:1--5）、囑咐繼承人（4:1--5）、交代身後事（4:9--21）。舊約的雅各、摩西、大衛都有這類臨終的話，保羅在米利都對以弗所長老的告別也是：「如今我曉得，你們以後都不得再見我的面了」（徒 20:25）。這派的優點是幫助我們讀懂這封信的結構與語氣。</p><p><strong>難處：</strong>主張託名的學者常用「遺言文體」來說明這封信是後人的文學創作；但一個真正臨終的人，用他熟悉的方式寫遺言，再自然不過。文體的特徵說明了信「怎麼寫」，不能證明信「是誰寫的」；而 4:13 的外衣與皮卷，也不是文學套路會寫的東西。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採教會傳統——提摩太後書是保羅最後的一封信，寫於尼祿年間在羅馬殉道前不久；根據是 4:6--8 的內證與早期教會一致的外證，並陳「作最壞打算說」，承認這是合理判斷而非經文直接宣告。</strong></p><p><strong>這封遺書的口吻是盼望，不是悲壯。</strong>保羅回顧一生，用的三個比喻都是完成式：仗打過了、路跑盡了、道守住了（4:7）；他看見的不是刑場，是冠冕——「不但賜給我，也賜給凡愛慕他顯現的人」（4:8）。4:8 的冠冕（στέφανος）是競賽得勝者的花冠，不是王冠；得勝的定義不是贏得多，是守得住、跑得完。</p><p>而且這封信的最後一個高峰不是保羅自己：被眾人離棄之後，他寫的是「惟有主站在我旁邊」（4:17），然後是全卷唯一的頌讚：「願榮耀歸給他，直到永永遠遠。阿們」（4:18）。一個快要被處死的人，最後一句是頌讚——這是全卷最深的改變觀點：他說的「救」不是免死，是進天國。</p>"],["【四】這件事該不該影響你的信心","","<p>這封信是不是保羅的「最後」一封、他確不確知自己的死期，不該動搖你的信心；這些是傳統與推論，信的內容不會因此改變。</p><p>但有一件事該問：<strong>當我想到自己的終點，是害怕，還是有一位主在那裡等？</strong>保羅不是不怕冷、不怕孤單——他要外衣，也要人；但他知道終點有誰：「按著公義審判的主到了那日要賜給我的」（4:8）。讀完這封遺書，你應該更有盼望，不是更沉重。</p>"]],"con":[],"say":"本講義的全卷立場：提摩太後書是保羅最後的一封信，寫於尼祿年間在羅馬殉道前不久——根據是 4:6--8 的內證與早期教會的外證，是合理判斷，不是經文直接宣告。這封遺書的口吻是盼望，不是悲壯：冠冕在前面，主站在旁邊，最後一句是頌讚。","care":"席上會有剛失去至親、正在安寧病房陪伴家人、或自己面對重病的人；講「最後一封信」時，不要把死亡講得浪漫，也不要催促他們立刻「喜樂地面對」——保羅也要外衣、也要人陪。陪他哀傷，再帶他看 4:8 與 4:18 的盼望。也不要用 4:7 叫已經精疲力竭的服事者「打完美好的仗才可以停」；仗是主陪他打完的（4:17），不是靠意志力撐完的。"},{"id":"ISS00_8","t":"提摩太是誰？是一個年輕、怯懦、身體軟弱的傳道人嗎？","r":"1:5--7；2:22；3:15","ch":[],"why":"八、父親是希臘人，外祖母與母親是猶太信徒（徒 16:1）；保羅的屬靈兒子；天性可能怯懦——神使用的不是天生勇敢的人。收信人是誰，決定了這封信讀起來的溫度：寫給一位剛強的將軍，和寫給一位會流淚、身體不好、被人小看的年輕傳道人，是兩封不同的信。這一題也直接關係到紅線一：不用 1:7 叫膽怯的人自責。","pos":[["【一】經文問的是甚麼","","<p>新約給提摩太的畫像散在各處：他是路司得人，「是信主之猶太婦人的兒子，他父親卻是希臘人」（徒 16:1）；保羅第二次宣教時帶他同去（徒 16:3），此後成為保羅最親近的同工——「他興旺福音，與我同勞，待我像兒子待父親一樣」（腓 2:22）。他被人小看年輕：「不可叫人小看你年輕」（提前 4:12）；身體不好：「因你胃口不清，屢次患病」（提前 5:23）；會流淚：「記念你的眼淚」（1:4）。</p><p>然後是那一句：「因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心」（1:7）。保羅也曾吩咐哥林多教會好好接待他，免得他懼怕（這使我們想起林前 16:10）。<strong>經文問的是：提摩太是不是天性怯懦？1:7 是對他個人的責備，還是對所有信徒的提醒？</strong></p>"],["天性怯懦說","","<p>許多註釋家從這些線索畫出一個敏感、內向、容易退縮的年輕人：保羅要他「將神藉我按手所給你的恩賜再如火挑旺起來」（1:6），要他「不要以給我們的主作見證為恥」（1:8），又在哥林多前書要教會讓他不懼怕。這派的優點是讓提摩太成為一個真實的人，也讓許多膽小的信徒在他身上看見自己。</p><p><strong>難處：</strong>「天性怯懦」是從幾處經文推出來的人物畫像，經文沒有直接說他「天性」如何；1:7 用的是「我們」，保羅把自己也放進去。若講成「提摩太是個膽小鬼」，會把一位忠心多年、被保羅一再差派去處理難題的同工講小了——保羅說「因為我沒有別人與我同心」（腓 2:20），說的正是他。</p>"],["處境壓力說","","<p>另一些學者認為，提摩太不一定天性膽小，而是處境太重：年輕、在以弗所面對比他年長的長老與假師傅，屬靈父親在牢裡快要被處死，亞細亞的人都離棄了保羅（1:15）——任何人在這樣的壓力下都會退縮。1:7 因此不是性格診斷，而是對一切處在壓力下的信徒的提醒。這派的優點是不給提摩太貼標籤。</p><p><strong>難處：</strong>這派可能把經文中個人化的語氣講淡了：保羅「記念你的眼淚」（1:4）、一再提醒他不要以為恥，顯然是對這一位特定的人說話。兩派其實可以並存——一個本來就敏感的人，放在極重的處境裡，正是提摩太此刻的光景。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：提摩太是保羅的屬靈兒子，路司得人，父親是希臘人，母親與外祖母是猶太信徒；年輕、身體軟弱、會流淚，天性可能怯懦（並陳處境壓力說）。神使用的不是天生勇敢的人。</strong></p><p>1:7 要讀對：<strong>「賜給」</strong>是關鍵字——剛強、仁愛、謹守的心是神所賜的，是恩典，不是考試；「剛強」原文是 δυνάμεως，就是「能力」，和 1:8「按神的能力」、4:17「加給我力量」同一條線。保羅沒有叫提摩太換一個性格，他叫他把神已經給的「再如火挑旺起來」（1:6）——炭還在，只是蒙了灰。</p><p>提摩太的家也不完整，他的身體也不好，他可能也怕；但他是忠心的，而保羅最後想見的人就是他。這封信最後的焦點，也不在提摩太有沒有變勇敢，而在那位「站在我旁邊，加給我力量」（4:17）的主。</p>"],["【四】這件事該不該影響你的信心","","<p>提摩太的性格到底如何，學者的人物畫像不該動搖你的信心；這些是推論，不是信的重點。</p><p>但有一件事該問：<strong>我是不是以為神只用勇敢的人？</strong>如果你也是會怕、會哭、身體不好、被人小看的人，提摩太後書就是寫給你的。神沒有等提摩太變勇敢才用他；神賜給他一顆心，然後陪他。「我兒啊，你要在基督耶穌的恩典上剛強起來」（2:1）——剛強的源頭是恩典，不是性格。</p>"]],"con":[],"say":"本講義的全卷立場：提摩太是路司得人，父親是希臘人，母親與外祖母是猶太信徒（徒 16:1）；保羅的屬靈兒子；年輕、身體軟弱、會流淚，天性可能怯懦（並陳處境壓力說）。神使用的不是天生勇敢的人；1:7 的心是神所賜的，是恩典，不是考試。","care":"牧養底線：席上會有焦慮症、恐慌症、憂鬱症、創傷後壓力的弟兄姊妹，也有天性內向、一上台就發抖的同工；不要用 1:7 說「你膽怯就是沒有信心」，也不要說「多禱告就不用吃藥」——1:7 是聖靈所賜的心，不是拿來考人的試卷。必要的醫療與輔導，與禱告並行。也不要把提摩太講成「後來變勇敢」的勵志故事，讓會眾聽見：神用的是一個會怕的人，而且一路陪著他。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:12；2:13；4:17--18","ch":[],"why":"九、宗派之爭不該；但「在被離棄的時候，我還知道我所信的是誰嗎」該——惟有主站在我旁邊。提摩太後書只有四章，卻碰到救恩確據（2:11--13）、聖經默示（3:16）、受苦的界線、屬靈權柄與傳承，還有作者、年代、最後一封信的種種討論。一位認真讀完議題頁的信徒，很可能會問：這麼多不確定，我還能確定甚麼？這一題要把全卷的爭議放回正確的位置。","pos":[["【一】經文問的是甚麼","","<p>保羅在這封信裡兩次提醒提摩太不要陷在言語的爭辯裡：「不可為言語爭辯；這是沒有益處的，只能敗壞聽見的人」（2:14）；「惟有那愚拙無學問的辯論，總要棄絕，因為知道這等事是起爭競的」（2:23）。但他也要提摩太「按著正意分解真理的道」（2:15），「務要傳道……用百般的忍耐、各樣的教訓責備人，警戒人，勸勉人」（4:2）。</p><p>同時，保羅在信裡放了幾件他自己確知的事：「因為知道我所信的是誰」（1:12）；「我們縱然失信，他仍是可信的」（2:13）；「惟有主站在我旁邊，加給我力量」（4:17）。<strong>經文問的是：面對這卷書裡的種種爭議，一個信徒該怎樣自處？問問題是不是不信？有甚麼是不會因爭議而動搖的？</strong></p>"],["爭議證明聖經不可靠","","<p>這是懷疑者常有的推論：連作者是誰學者都在爭，2:12 到底能不能失去救恩教會也說不一致，3:16 的「默示」連文法都有兩種讀法——可見聖經只是人的作品，不值得全然信靠。這派的優點是誠實，它不假裝問題不存在，也逼著教會不能只用「信就對了」回答。</p><p><strong>難處：</strong>這些爭議幾乎全部發生在「怎樣理解」的層次，不在「耶穌是誰、他作成了甚麼」的層次。主張聖徒恆忍的和主張背道可能的，都同意「我們若與基督同死，也必與他同活」（2:11）；對默示文法讀法不同的，都承認聖經出於神。爭議多，表示這卷書被認真讀了兩千年，不表示它不可信。</p>"],["問問題就是不信（只要信，不要問）","","<p>這是教會裡常見的反應：這些爭議會絆倒人，最好不要在教會裡講，信徒只要單純地信就好；保羅自己也說「不可為言語爭辯」（2:14）。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們信心不是靠學問得來的。</p><p><strong>難處：</strong>保羅禁止的是「愚拙無學問的辯論」（2:23）——為爭勝而爭、只會起爭競的辯論，不是誠實的提問；他自己要提摩太「按著正意分解真理的道」（2:15），那需要思考。庇哩亞人也被稱讚「天天考查聖經，要曉得這道是與不是」（徒 17:11）。不准問的信心最脆弱——一旦在別處聽見這些問題，就會以為教會一直在隱瞞甚麼。</p>"],["分層看待（根基與枝節）","","<p>主張分清楚哪些是根基、哪些是枝節：在根基上站穩的人，可以帶著謙卑與好奇面對枝節上的爭議。保羅在這封信裡也作了這樣的分層——他要提摩太守住「那純正話語的規模」（1:13），同時對抵擋的人「用溫柔勸戒」（2:25）。這派的優點是既不迴避問題，也不讓問題動搖根基。</p><p><strong>難處：</strong>甚麼是根基、甚麼是枝節，本身有時也有爭議；有些人把自己宗派的立場都放進「根基」，有些人把重要的事都推到「枝節」。所以分層需要謙卑，也需要回到經文本身與歷代教會共同的信仰告白，不是由某一位講員說了算。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。</strong>全卷的爭議，本講義都已經在 ISS00_1–8 交代：作者與最後一封信的處境（ISS00_1）、受苦的界線（ISS00_2）、救恩的確據（ISS00_3）、聖經的默示（ISS00_4）、傳承（ISS00_5）、年代（ISS00_6）、最後一封信的傳統（ISS00_7）、提摩太是誰（ISS00_8）。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。</p><p>但有幾件事，全卷沒有任何一個爭議動搖過：<strong>神「救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典」（1:9）；基督「已經把死廢去，藉著福音，將不能壞的生命彰顯出來」（1:10）；「你要記念耶穌基督乃是大衛的後裔，他從死裡復活」（2:8）；「我們縱然失信，他仍是可信的，因為他不能背乎自己」（2:13）；「主必救我脫離諸般的凶惡，也必救我進他的天國」（4:18）。</strong>這是提摩太後書的根基，也是本講義全卷的根基。</p>"],["【四】這件事該不該影響你的信心","","<p>宗派之爭不該影響你的信心。問問題不是不信；在問題面前轉身離開，才是保羅擔心的。</p><p>但有一件事該影響你：<strong>在被離棄的時候，我還知道我所信的是誰嗎？</strong>保羅寫這封信的時候，「凡在亞細亞的人都離棄我」（1:15），初次申訴時「竟都離棄我」（4:16）；他沒有把所有神學問題都答完，他知道的是一個人：「因為知道我所信的是誰」（1:12）。眾人都走了，「惟有主站在我旁邊，加給我力量」（4:17）——這不是爭議，是一個被離棄的人在牢裡親身經歷的事。</p>"]],"con":[],"say":"本講義的全卷立場：提摩太後書的爭議都發生在「怎樣理解」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。神按恩典救了我們，基督已經把死廢去、從死裡復活，他仍是可信的，必救我們進他的天國；這些沒有一個爭議動搖過。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也有一聽到「學者有爭論」就不安的長輩，還有曾經在救恩確據、屬靈權柄或受苦的問題上被教會傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要用一堆答案堵住他，先陪他；對第二種人，指給他看 1:12 與 2:13；對第三種人，讓他知道傷他的是人錯用了經文，不是那位站在他旁邊的主（4:17）。疑惑若伴隨長期失眠或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:5「無偽之信……先在你外祖母……母親心裡」——信心可以「傳下去」嗎？沒有基督徒家庭的人怎麼辦？","r":"1:5；1:2；3:15；徒 16:1--3","ch":[1],"why":"華人教會很愛講「三代信主」，見證會上常聽到「我們家是第幾代基督徒」。這是美好的恩典，卻也讓兩種人默默受傷：家裡只有自己一個人信主、過年還要面對祭祖壓力的第一代信徒，以及兒女已經離開信仰、在教會裡不敢開口的父母。1:5 是這一題最常被引用的經文，必須讀清楚它說了甚麼、沒有說甚麼。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「想到你心裡無偽之信，這信是先在你外祖母羅以和你母親友妮基心裡的，我深信也在你的心裡」（1:5）。「先在」原文 ἐνῴκησεν（enōkēsen），是「住進去」，與 1:14 聖靈「住在」我們裡面同一個字根。問題是：信心是一種可以由家庭傳遞的遺產嗎？基督徒家庭的孩子是不是「本來就在裡面」？而提摩太的父親是希臘人（徒 16:1），他的家其實並不完整，這又告訴我們甚麼？</p>"],["盟約家庭說：信徒的兒女在神的盟約之內","","<p>改革宗與許多重視嬰兒洗禮的傳統認為，神的應許是給信徒「和你們的兒女」的；信徒的家是一個盟約群體，孩子從小在敬拜、讀經、禱告中長大，信心藉著家庭的教導被栽培起來。1:5 的三代與 3:15「從小明白聖經」，正是這種家庭信仰的寫照。這一說看重父母的責任，也讓孩子知道自己從小就被神的家接納。</p><p><strong>難處：</strong>若講得不小心，會讓人以為生在基督徒家庭就自動得救，忽略每一個人都要親自悔改相信；也容易讓沒有這種背景的人覺得自己是「外來的」。而且盟約家庭的孩子照樣會離開信仰，這時父母很容易把一切歸咎於自己。</p>"],["個人重生說：神沒有孫子，每一代都要親自信","","<p>許多福音派、浸信會傳統強調：信心不能遺傳，「不是從血氣生的，不是從情慾生的，也不是從人意生的，乃是從神生的」（約 1:13）。1:5 說信「住進」提摩太裡面，是聖靈的工作，不是家族的資產。這一說保護了第一代信徒，也提醒基督徒家庭的孩子：父母的信不能替你得救。</p><p><strong>難處：</strong>若只強調個人，會把家庭的栽培講得無足輕重，好像父母做甚麼都不重要，也可能讓在教會長大、沒有戲劇性「決志經歷」的孩子懷疑自己的信是不是真的。保羅明明感謝羅以與友妮基，家庭的栽培是真實的恩典。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：家庭信仰是祝福，不是得救的條件；信是「住進去」的，不是遺傳的。</strong>羅以與友妮基做的，是讓信先住在自己裡面，再把聖經一點一點放進孩子心裡；叫信住進提摩太裡面的，是神。</p><p>這一章同時有兩條傳承的線：1:5 的家庭，與 1:2「我親愛的兒子」的屬靈父子——他們沒有血緣，一樣真實。提摩太的父親是希臘人，他的家也不完整，神照樣使用他。所以第一代信徒不是次等，兒女未信的父母也不必自責。傳承的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你是家裡第一個信主的，你不是輸在起跑點；你可能正是你家的「羅以」——一個新傳承的開始。神也會在教會裡給你屬靈的父母，正像他給了提摩太一個保羅。</p><p>如果你的孩子還沒有信主，經文沒有要你為他的選擇負全責。你能做的，是讓信繼續住在你裡面，繼續愛他、為他禱告；住進他裡面的工作，交給那位當年也住進提摩太裡面的神。</p>"]],"con":[],"say":"本講義的立場：家庭信仰是祝福，不是得救的條件；信是住進去的，不是遺傳的。提摩太的家並不完整，屬靈父子這條線同樣真實，第一代信徒不是次等，兒女未信的父母也不必自責。本講義的全卷立場見 ISS00_5。","care":"會眾席上有家裡只有自己一個人信主、過年要面對祭祖與冷言冷語的第一代信徒，也有孩子已經不來聚會、每個主日坐在後排默默流淚的父母。不要在講台上炫耀「我們家幾代都是基督徒」，也不要說「孩子不信，是父母沒做好」。請刻意為第一代信徒找屬靈的長輩，也陪伴兒女未信的父母繼續盼望——他們需要的是同伴，不是檢討。"},{"id":"ISS01_2","t":"1:6「藉我按手所給你的恩賜」——按手會傳遞恩賜嗎？","r":"1:6；提前 4:14；提前 5:22","ch":[1],"why":"按手在不同教會有很不一樣的意義：有的是按立聖職的聖禮，有的是差派與祝福的儀式，有的聚會則把按手當成「傳遞恩膏」的高峰，甚至有人追著某位講員要被按手。1:6 說恩賜是「藉我按手」給的，提前 4:14 又說是「眾長老按手」，這一題需要讀清楚，免得會眾追逐一雙手，忘了賜恩賜的神。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「為此我提醒你，使你將神藉我按手所給你的恩賜再如火挑旺起來」（1:6）。提摩太前書卻說：「你不要輕忽所得的恩賜，就是從前藉著預言、在眾長老按手的時候賜給你的」（提前 4:14）。問題是：按手本身是否傳遞了甚麼？恩賜是從保羅的手、還是從長老們的手來的？兩處經文怎樣合看？今天的按手又該怎樣理解？</p>"],["聖禮說：按手是神施恩的有效記號","","<p>天主教、東正教與部分聖公會傳統認為，按立聖職是一項聖禮，按手不只是象徵，神確實藉著這個記號賜下職分所需的恩典；有的傳統更把這按手與使徒統緒連在一起。1:6 的「藉」（διὰ）似乎表示按手是神施恩的管道。這一說看重神在有形記號中的真實作為，也提醒我們按立是嚴肅的事，不是一個典禮而已。</p><p><strong>難處：</strong>新約沒有把按手明定為聖禮，也沒有說這種按手的能力要沿著某一條統緒一代一代傳下去；若過度強調管道，容易讓人以為恩賜屬於某一個職位或某一雙手，而不是屬於那位隨己意分給各人的神。</p>"],["象徵認可說：按手是禱告、交託與公開的承認","","<p>多數更正教的讀法認為，按手是在眾人面前的禱告、差派與認可：「於是禁食禱告，按手在他們頭上，就打發他們去了」（徒 13:3）。恩賜是神所給的，按手是教會承認這份恩賜、把人交託給神。1:6 的「我按手」與提前 4:14 的「眾長老按手」可以是同一場按立——保羅與長老們一起按手。這一說守住了「恩賜是神的」。</p><p><strong>難處：</strong>若把按手只講成一個象徵，可能低估了經文的語氣——保羅確實說恩賜是「藉」按手給的；也可能讓按立變成一個例行程序，不再敬畏地禱告、不再嚴肅地察驗，忘了保羅叫提摩太「給人行按手的禮，不可急促」（提前 5:22）。</p>"],["能力傳遞說：被大能的人按手，就得著他的恩膏","","<p>部分靈恩聚會把按手講成「傳遞恩膏」：讓某位有能力的僕人按手，人就會得著醫治、說預言或特別的恩賜；他們引徒 19:6 保羅按手後聖靈降臨為證。這一說提醒我們，神確實在禱告與按手中作工，教會不必害怕聖靈的作為。</p><p><strong>難處：</strong>使徒行傳裡想用錢買按手能力的西門被嚴厲責備（徒 8:18--20），可見按手的能力從來不屬於人；把按手講成能量傳遞，會讓人追逐某一雙「有能力的手」，也讓按手的人取得不屬於他的權柄與影響力，甚至被用來控制人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：恩賜是「神」所給的；按手是在禱告中把人交託給神、公開承認神的呼召，神確實藉著這個交託作工，但能力不在那雙手上。</strong>1:6 的「我」與提前 4:14 的「眾長老」合看，是保羅與長老們一同按手；按手是團隊的、公開的，不是私傳的。</p><p>對本章更重要的，是保羅的用意：他提醒提摩太，那恩賜「在你裡面」，沒有被收回。按手不是要人去找下一雙手，是要人記得：神早已把恩賜放在你裡面了，炭還在，只是蒙了灰。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各傳統對按手的理解不同，卻都承認恩賜出於神、教會要敬畏地為人禱告差派。</p><p>如果你曾經被一個有名的講員按手，卻沒有甚麼特別的感覺，你沒有被漏掉；如果你從來沒有被按手，神也沒有少給你。可以問的是：神放在我裡面的那份恩賜是甚麼？它被甚麼灰蓋住了？誰可以陪我把它撥開？</p>"]],"con":[],"say":"本講義的立場：恩賜是神所給的；按手是在禱告中把人交託給神、公開承認神的呼召，神藉這交託作工，但能力不在人的手上。1:6 與提前 4:14 合看，是保羅與眾長老一同按手。","care":"會眾席上可能有曾在聚會裡被推倒、被按手卻「沒有感覺」而自覺屬靈次等的人，也可能有被某位領袖以「我按手在你身上」為由長期控制的人。不要說「你沒有得著，是你不夠敞開」，也不要嘲笑別人的按手經驗。幫助他們把眼光從一雙手移到賜恩的神身上，對曾被控制的人，肯定他可以離開、可以求助。"},{"id":"ISS01_3","t":"1:7「不是膽怯的心」——基督徒有焦慮、恐懼、憂鬱，是不屬靈嗎？","r":"1:7；1:4；太 26:38","ch":[1],"why":"1:7 是最常被抄在卡片上的經文之一，也是最常被拿來責備人的經文之一。正在焦慮症、恐慌症、憂鬱症、創傷裡掙扎的弟兄姊妹，常聽到「神賜的不是膽怯的心，你怕就是沒信心」，於是把病藏起來、偷偷停藥、不敢求助。這一題關係到人的身心安全，必須講清楚。","pos":[["【一】經文問的是甚麼","","<p>「因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心」（1:7）。「膽怯」原文 δειλίας（deilias），新約只此一次，是畏縮、退避；「謹守」σωφρονισμοῦ（sōphronismou）也只此一次，指壓力下仍能清明。另有一個解經問題：這裡的「心」原文是 πνεῦμα（pneuma），指的是聖靈本身，還是聖靈在人裡面造成的心志？而更切身的問題是：一個基督徒若長期焦慮、恐懼或憂鬱，是否代表他沒有領受這份恩賜、信心有問題？</p>"],["屬靈根源說：恐懼是信心的反面，要用屬靈方法對付","","<p>有些教導把 1:7 讀成「懼怕的靈」，認為焦慮、恐懼主要是屬靈問題，甚至是邪靈的攪擾；解決之道是認罪、宣告經文、斥責懼怕的靈、加強禱告。這一說看見了一件真實的事：人的心思確實會被謊言綑綁，屬靈的爭戰與神的話也確實能帶來釋放；主在船上也問過門徒「為甚麼膽怯呢」（太 8:26）。</p><p><strong>難處：</strong>它把複雜的身心狀況簡化成單一的屬靈原因，很容易讓病人自責、停藥、延誤治療；保羅自己「記念你的眼淚」（1:4），在別處也說過連活命的指望都絕了，聖經從不把情緒低落一律當成罪。而 1:7 的主詞是神、動詞是「賜」，它是一句恩典的話，不是一張檢查人信心的考卷。</p>"],["整全關懷說：人是身、心、靈的整體，恩典也經由醫療臨到","","<p>這一說認為，焦慮、憂鬱可能同時有身體、心理、處境與屬靈的成分；1:7 宣告神所賜的心，但領受這份剛強常常是一個過程，需要醫生、藥物、輔導與群體的陪伴。主耶穌在客西馬尼園也說「我心裡甚是憂傷，幾乎要死」（太 26:38），憂傷本身不是罪。這一說保護了病人，也讓教會成為安全的地方。</p><p><strong>難處：</strong>若只談醫療，可能讓人覺得信仰對情緒毫無話可說，忽略了神的話、禱告、敬拜與群體在醫治中真實的力量；也可能讓人把一切退縮都歸給「我的狀況」，不再尋求神所賜的剛強。整全，是兩邊都要。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：1:7 是神「所賜」的心，是恩典，不是考試；有焦慮、恐懼、憂鬱、創傷的弟兄姊妹，不是不屬靈，也不是沒有信心。</strong>禱告與就醫不是二選一；神所賜的剛強、仁愛、謹守，常常正是藉著醫生、藥物、輔導與弟兄姊妹的陪伴臨到。</p><p>至於 πνεῦμα 指聖靈還是心志，兩讀都可以成立，而且彼此相連：聖靈住在我們裡面（1:14），結出剛強、仁愛、謹守的心。這封信的收信人提摩太，正是一個年輕、可能怯懦、身體軟弱的人（提摩太是誰的全卷立場見 ISS00_8）——神使用的，不是天生勇敢的人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你正在服藥、看輔導，你沒有背叛 1:7；你正在領受神用許多管道賜下的剛強。寫這句話的人手上戴著鍊子、身邊的人一個一個走了，他說的是「神賜給我們」——連他自己也需要這句話。</p><p>你可以帶著害怕來到神面前，不必先把害怕處理好。剛強不是不再害怕，是在害怕裡仍有一位賜力量的神，也有人陪你。如果你有傷害自己的念頭，請立刻告訴身邊的人、聯絡醫療或危機專線。</p>"]],"con":[],"say":"本講義的立場：1:7 是神所賜的心，是恩典不是考試；焦慮、恐懼、憂鬱、創傷不等於沒有信心，禱告與就醫不是二選一。本講義的全卷立場見 ISS00_8、ISS00_9。","care":"會眾席上一定有正在服用抗焦慮或抗憂鬱藥物的人，有恐慌發作時連聚會都坐不住的人，也有因創傷而怕人、怕群體的人。不要說「你就是信心不夠」「多禱告就好了」「把藥停了才是信靠神」。先聽，再陪；鼓勵他繼續就醫，必要時協助轉介專業輔導；若聽見自傷或輕生的念頭，不要獨自處理，立即連結醫療與危機資源，並讓可信任的家人知道。"},{"id":"ISS01_4","t":"1:9「萬古之先，在基督耶穌裡賜給我們」——揀選與預定是甚麼意思？","r":"1:9；弗 1:4；羅 8:29--30","ch":[1],"why":"「萬古之先」是新約裡最常被拿來討論揀選與預定的經文之一。有人因此陷入焦慮，怕自己不在揀選之內；有人推出宿命論，覺得傳福音、禱告都不必了；也有教會為此爭執甚至分裂。這一題要把大問題放回本卷全卷立場與前卷講義，並看見保羅在牢裡提起它的用意。","pos":[["【一】經文問的是甚麼","","<p>「神救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典；這恩典是萬古之先，在基督耶穌裡賜給我們的」（1:9）。「萬古之先」原文是 πρὸ χρόνων αἰωνίων（pro chronōn aiōniōn），「在永世的年代以前」。問題是：神在時間開始以前揀選的是誰？是揀選個人、還是揀選「在基督裡」的群體？揀選是根據甚麼？而保羅在一封叫人剛強的遺書裡提起它，用意是甚麼？</p>"],["無條件揀選說：神按他的旨意揀選個人","","<p>改革宗傳統認為，神在創世以前按自己的旨意與恩典揀選了要得救的人，不是因為預見人的行為或信心；1:9 明說「不是按我們的行為，乃是按他的旨意和恩典」，弗 1:4 也說神「從創立世界以前，在基督裡揀選了我們」。這一說高舉恩典的主權，也給受苦的人極大的確據：救恩的起點不在我身上。</p><p><strong>難處：</strong>若講得不小心，會引起「我是不是被揀選的」焦慮，或推出「反正都定好了」的宿命論；也很難回答人的責任與神的公義的問題。而經文自己從來不叫人去猜誰被揀選，而是叫人回應呼召、彼此勸勉。</p>"],["預知或群體揀選說：神在基督裡揀選，人憑信心進入","","<p>阿民念與衛斯理宗傳統認為，神是根據他預先所知道的信心揀選人（羅 8:29「他預先所知道的人」）；也有學者強調揀選的焦點是「在基督裡」——神揀選了基督，凡在基督裡的人就在這揀選之內。這一說守住了人的回應與神普世的愛，也讓福音的邀請保持真誠。</p><p><strong>難處：</strong>若把揀選講成「神看見誰會信就選誰」，揀選最後似乎落在人的決定上，與 1:9「不是按我們的行為」的語氣有張力；群體揀選說也需要回答個人怎樣進入那個群體，仍然繞回恩典與回應的關係。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：揀選與預定的大題沿用以弗所書立場二，不在本章另立說法。</strong>本章只多一筆：保羅提起萬古之先的恩典，不是在上神學課，是一個坐牢、受苦、快要死的人，在地牢的牆上看見一扇窗——恩典比他的軟弱古老，比羅馬的判決古老，比死亡古老（1:10）。</p><p>所以 1:9 在本章的功能是安慰，不是考題：它叫人安息，不叫人自我檢查到發慌；它叫人回應，不叫人袖手——同一段保羅正叫提摩太「與我為福音同受苦難」（1:8）。爭議與信心的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。改革宗與阿民念的弟兄姊妹爭論了幾百年，雙方都承認：救恩全然出於恩典，不是按我們的行為；凡到基督這裡來的，他「總不丟棄」（約 6:37）。</p><p>如果你常懷疑自己是不是被揀選，不要往自己裡面找證據，往基督身上看：恩典是「在基督耶穌裡」賜給我們的。你可以問的不是「我是不是被選上了」，而是「我今天要不要回應他」。</p>"]],"con":[],"say":"本講義的立場：揀選與預定的大題回指以弗所書立場二；1:9 在本章是給受苦者的安慰——恩典比我們的軟弱古老，不是按我們的行為；它叫人安息與回應，不叫人焦慮或袖手。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有長期懷疑自己得救、為「我是不是被揀選」失眠的人，也可能有因為這個題目在前一間教會被排擠的人。不要用揀選嚇人，也不要嘲笑另一個傳統的弟兄姊妹。陪焦慮的人把眼睛從自己身上移到基督身上，讀 1:9 與約 6:37；若焦慮已影響睡眠與生活，也鼓勵他尋求輔導。"},{"id":"ISS01_5","t":"1:10「他已經把死廢去」——那基督徒為甚麼還會死？","r":"1:10；來 2:14--15；帖前 4:13--14","ch":[1],"why":"每一場基督徒的葬禮都在問這個問題。有人因此懷疑經文，有人聽過「有信心就不會病、不會早死」的教導，在家人過世後更添罪疚；也有人覺得基督徒在喪禮上不該哭。1:10 是全新約對死亡最大膽的宣告之一，寫的人正在等自己的死刑。","pos":[["【一】經文問的是甚麼","","<p>「他已經把死廢去，藉著福音，將不能壞的生命彰顯出來」（1:10）。「廢去」原文 καταργήσαντος（katargēsantos），是不定過去式——一件已經完成的事；字義是「使失效」，不是「使消失」。希伯來書說主「特要藉著死敗壞那掌死權的」（來 2:14），用的是同一個字。問題是：死既然已經被廢去，為甚麼基督徒照樣生病、照樣死？「已經」到底已經到甚麼程度？</p>"],["已然未然說：死已失效，最後才全然毀滅","","<p>多數解經家認為，基督藉著死與復活，已經決定性地擊敗了死亡：死不再能把信徒留住，不再是最後的話；但死亡作為一個事件，要到基督再來、身體復活時才被全然毀滅。所以基督徒照樣會死，卻是「在耶穌裡睡了」（帖前 4:14），像被拔了毒牙的蛇——會咬、會痛，卻留不住人。這一說同時尊重經文的「已經」與經驗中的「還沒」。</p><p><strong>難處：</strong>「已然未然」對正在病床邊、葬禮上的人，有時聽起來太抽象、太冷靜；若只講神學架構，可能錯過了哀傷本身需要被陪伴。這一說需要講台以外的眼淚與擁抱來補足。</p>"],["現世全然得勝說：有信心的人可以勝過疾病與早死","","<p>部分成功神學與信心運動的教導認為，既然死已被廢去、病也在十字架上被擔當，真有信心的基督徒今生就可以勝過疾病與早逝；病不好、早死，表示信心或宣告不夠。這一說看重神的大能，也鼓勵人勇敢禱告、期待神的作為，神今天確實醫治人。</p><p><strong>難處：</strong>寫下 1:10 的保羅自己正在等死刑，他說「我離世的時候到了」（4:6）；提摩太也屢次患病（提前 5:23）。這一說會讓病人拒絕治療、讓喪親者自責「是我禱告不夠」，也會把神的作為綁在人的信心表現上。它把「已然」講成「全然」，等於提早宣布了只有主再來才會成就的事。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：死已經被廢去——失效了、留不住信徒了；但死亡要到主再來時才被全然毀滅。基督徒照樣會病、會死，也照樣可以哭。</strong>主耶穌在拉撒路墳前也哭了（約 11:35），哭與盼望可以同時存在；保羅說的是不要憂傷「像那些沒有指望的人一樣」（帖前 4:13），不是不要憂傷。</p><p>成功神學回指希伯來書立場四；主再來回指帖撒羅尼迦前書立場二。本章多出來的那一筆是：一個等著被處死的人，說死已經被廢去——他不是說自己不會死，是說死不能把他留住。這也預備了 4:18「救我進他的天國」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你所愛的人離世，不是因為你信得不夠，也不是神的應許落空；死亡還在發生，正說明我們活在「已經」與「還沒」之間。</p><p>可以抓住的是：對在基督裡的人，死不再是一扇關上的門，是一條通道；福音已經把「不能壞的生命」照亮了。你可以帶著眼淚抓住這句話，不必先把眼淚擦乾。</p>"]],"con":[],"say":"本講義的立場：死已經被廢去——失效、留不住信徒；死亡要到主再來時才全然毀滅，所以基督徒照樣會病、會死，也可以哭。成功神學回指希伯來書立場四；主再來回指帖撒羅尼迦前書立場二；本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有剛失去父母、配偶或孩子的人，有正在接受癌症治療的人，也有曾被告知「是你信心不夠，他才走」而一直放不下的人。不要在喪禮上說「不要哭，他去了好地方」，也不要說「再多一點信心就好了」。陪他哭，陪他記得逝者，再在合適的時候和他一起讀 1:10——死留不住在基督裡的人。"},{"id":"ISS01_6","t":"1:12「我所交付他的」——是保羅交給神的，還是神交給保羅的？","r":"1:12；1:14；提前 6:20","ch":[1],"why":"和合本譯作「我所交付他的」，卻在旁邊註明「或譯：他所交託我的」。兩種讀法會改變這一節的焦點：一個講神保守我的生命，一個講神保守福音。這是本章最重要的經文，也是本章的章題，講台上必須知道兩讀，並且知道為甚麼兩讀都通往同一個安慰。","pos":[["【一】經文問的是甚麼","","<p>原文 τὴν παραθήκην μου（tēn parathēkēn mou），字面是「我的寄存物」；παραθήκη 是交給別人保管的貴重物品。「我的」可以指「我交出去的」，也可以指「交給我的」。1:14 說「從前所交託你的善道」（τὴν καλὴν παραθήκην），提前 6:20 說「你要保守所託付你的」，用的都是同一個字，而且明顯是神交給人的福音。問題是：1:12 該跟著 1:14 讀，還是另有所指？</p>"],["保羅交給神說：保羅把自己的生命與將來交給神","","<p>和合本與許多譯本採這一讀：保羅快要被處死，他把自己的生命、靈魂、事奉的果效，都存放在神那裡，深信神「能保全」直到那日。這一讀與上下文的「我也受這些苦難」（1:12）很貼近——一個面對死亡的人說：我交出去的，交對人了。它也最直接安慰受苦的信徒：你交給神的，不會失落。</p><p><strong>難處：</strong>同一個字在 1:14 與提前 6:20 都明顯指神交給人的福音；若 1:12 指的是另一樣東西，同一段裡就出現兩種不同的 παραθήκη。而且「我的」在希臘文裡較自然地讀成「我所擁有、所受託的」，不一定是「我交出去的」。</p>"],["神交給保羅說：神把福音託付保羅，神自己保守它","","<p>和合本註腳「或譯：他所交託我的」採這一讀：寄存物就是福音，是神交託保羅的；保羅雖然要死了，神能保守這福音直到那日。這一讀與 1:14「從前所交託你的善道，你要……牢牢地守著」形成完美的對稱：神能保全（φυλάξαι），你要守著（φύλαξον），同一個動詞。它也正好說明為甚麼保羅不擔心福音會隨他而死。</p><p><strong>難處：</strong>若只讀成福音，可能淡化了這一節在受苦處境中個人的溫度——保羅確實是在談自己的苦難與將來；而且神既然把福音託付人去守，又說神自己保守，兩者的分工需要再說明，否則聽起來人的責任好像不見了。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：講台照和合本「我所交付他的」，gram 並陳兩讀；兩讀有一個共同點——最後保管的，是神。</strong>保羅交給神的生命，神保全；神交給保羅的福音，神也保全。1:12 與 1:14 合看：保全的力量在神，守著的責任給人，守的力量又是住在裡面的聖靈給的。</p><p>本講義不在講台上為兩讀爭勝，也不拿這一節作為「一次得救永遠得救」或相反立場的論據；救恩確據的全卷立場見 ISS00_3。對本章最要緊的是那個「誰」：不是我抓住他，是他保全我。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你讀成哪一種，這一節都在說同一位神：他能保全。你交給他的，他不會弄丟；他交給你的，他也不會讓它因你的軟弱而失落。</p><p>你可以問自己兩個問題：我有沒有把我的生命、我最放不下的人，交給他保管？他交給我的那份福音與恩賜，我是靠自己的意志在守，還是靠住在我裡面的聖靈？</p>"]],"con":[],"say":"本講義的立場：講台照和合本「我所交付他的」，並陳和合本註腳「他所交託我的」；兩讀共同的落點是最後保管的是神。1:12 與 1:14 合看：神能保全，人要靠聖靈守著。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有在病床上、在臨終關懷裡把一生交給神的人，也可能有覺得自己守不住信仰、怕最後會失落的軟弱者。不要把這一節講成「你要抓緊，否則會失去」，也不要讓譯本的爭論蓋過它的安慰。陪他們讀 1:12，讓他們把最放不下的交出去，知道接手的那一位能保全直到那日。"},{"id":"ISS01_7","t":"1:8、12、16「不以為恥」——華人的面子文化與為福音受羞辱，該怎麼看？","r":"1:8；1:12；1:16；羅 1:16","ch":[1],"why":"「以為恥」在本章出現三次，正好碰到華人最敏感的一根神經：面子。華人基督徒常在家族、職場、同學會裡因信仰被取笑、被說「信洋教」，於是有人把信仰收起來，有人反過來以衝撞證明自己不以為恥。這一題要分辨：甚麼是不以福音為恥，甚麼只是文化衝突或個人態度的問題。","pos":[["【一】經文問的是甚麼","","<p>「你不要以給我們的主作見證為恥，也不要以我這為主被囚的為恥」（1:8）；「然而我不以為恥」（1:12）；阿尼色弗「不以我的鎖鍊為恥」（1:16）。原文 ἐπαισχύνομαι（epaischynomai）三次把整章綁在一起。在一世紀的羅馬，和一個被定罪的囚犯站在一起，是要付面子、甚至付安全的代價。問題是：今天在重視面子、家族與和諧的華人處境裡，「不以為恥」具體是甚麼樣子？面子文化本身是敵人嗎？</p>"],["文化敏感說：尊重面子與和諧，用關係贏得人","","<p>這一說認為，面子與孝道是華人文化中神所允許的美好部分，傳福音要顧及對方的面子、尊重長輩、維持關係，不必硬碰硬；保羅也說他向甚麼樣的人就作甚麼樣的人（這使我們想起林前 9:22）。這一說避免了不必要的衝突，也讓許多家人因為基督徒的好品格而願意接近福音。</p><p><strong>難處：</strong>若一切以和諧為先，很容易變成永遠不開口——飯局上不禱告、問起時含糊帶過、在家族裡隱藏信仰多年，把怕丟臉叫作智慧。1:8 叫提摩太不要以「主」與「被囚的保羅」為恥，正是因為顧面子會讓人悄悄把主收起來。</p>"],["對抗說：面子是偶像，要勇敢打破","","<p>這一說認為，面子文化是福音最大的攔阻之一，基督徒要勇敢宣告信仰，不怕得罪人，拒絕參與一切可能妥協的家族儀式，甚至以被嘲笑為榮。它看見了 1:8 的嚴肅：主說凡把他和他的道當作可恥的，人子降臨的時候也要把那人當作可恥的（這使我們想起可 8:38）。</p><p><strong>難處：</strong>若把一切衝突都當成「不以為恥」的勳章，容易把粗魯、不尊重長輩、不顧關係誤認為勇敢，讓人因為我們的態度而不是因為福音被冒犯；也會把家人正常的擔心、文化的差異一律叫作逼迫。1:7 的剛強，是和仁愛、謹守連在一起的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：不以為恥的祕訣不是性格強硬，而是「因為知道我所信的是誰」（1:12）——焦點換了，羞恥就失去了掌控力。</strong>面子文化不是敵人，但面子不能坐上審判的位置；最後打分的是「那日」的主。不以為恥，是在關係裡溫和、清楚地承認自己屬基督，而不是製造衝突來證明自己。</p><p>本章也提醒：不以為恥不只是對福音，也是對受苦的肢體——阿尼色弗不以保羅的鎖鍊為恥。受苦、羞恥與「為主受苦」的界線，全卷立場見 ISS00_2；受苦的四種分辨回指彼得前書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經在某個場合把信仰收起來，你不是第一個——提摩太需要這封信，正因為他也可能退縮。這一章不是要定你的罪，是要把你的眼睛移到那位「已經把死廢去」的主身上。</p><p>主自己「輕看羞辱，忍受了十字架的苦難」（來 12:2）；他不以我們為恥，我們也就可以慢慢學會不以他為恥。下一次，從一句平常的真話開始。</p>"]],"con":[],"say":"本講義的立場：不以為恥的祕訣是「知道我所信的是誰」，不是性格強硬；面子文化不是敵人，但不能坐上審判的位置。在關係裡溫和、清楚地承認屬基督，不以製造衝突證明自己。本講義的全卷立場見 ISS00_2。","care":"會眾席上有在家族裡被說「信洋教」「不孝」的人，有因信仰在職場被邊緣化的人，也有多年來把信仰藏起來、心裡一直很愧疚的人。不要在講台上嘲笑「不敢承認的膽小鬼」，也不要鼓勵人在家族聚會上衝撞長輩。幫助他們先在一個小場合說一句真話，並在小組裡分享、彼此代禱——不以為恥，是一群人一起學的。"},{"id":"ISS01_8","t":"1:15「凡在亞細亞的人都離棄我」——事奉中被離棄、被背叛，怎麼走過來？","r":"1:15；4:10；4:16--17","ch":[1],"why":"教會分裂、同工出走、帶過的小組散掉、被信任的人在背後說話——這些事幾乎每一位服事者都經歷過，卻很少在講台上被誠實地談。1:15 讓我們看見連使徒也被離棄；但這一節也很容易被拿來影射離開的人。這一題要同時保護被離棄的人，與離開的人。","pos":[["【一】經文問的是甚麼","","<p>「凡在亞細亞的人都離棄我，這是你知道的，其中有腓吉路和黑摩其尼」（1:15）。「離棄」原文 ἀπεστράφησάν（apestraphēsan），是把臉轉開。「凡在亞細亞的人」不必讀成每一個人——下一節的阿尼色弗就是例外；這是痛到用「全部」來說的說法。腓吉路與黑摩其尼在新約只出現這一次。問題是：被離棄的服事者該怎樣看待這件事？該怎樣看待離開的人？</p>"],["省察歸責說：人走了，先檢討自己","","<p>這一說認為，當同工或會友離開，領袖首先要謙卑省察：是不是我的帶領出了問題、是不是我傷了人？這種態度可貴，因為許多離開確實和領袖的轄制、冷漠或錯誤有關；拒絕省察，只會讓同樣的事一再發生。</p><p><strong>難處：</strong>若把一切離開都算在被離棄者身上，就違背了經文——保羅被離棄，不是因為他失敗，而是因為他被捆綁、跟他沾上關係太危險。一刀切的自責，會把已經受傷的牧者、組長壓垮，甚至讓他從此不敢再投入任何人。</p>"],["忠奸分明說：離開的人就是背叛","","<p>這一說把離開的人看作不忠、屬靈退後甚至背道，引 1:15 與 4:10 底馬「貪愛現今的世界」為證，提醒會眾要對主忠心、不要輕易離開。它看見了一件真實的事：確實有人因為怕苦、愛世界而離開福音的工作。</p><p><strong>難處：</strong>保羅寫下兩個名字，沒有咒罵、沒有解釋；我們對他們一無所知，不能把今天任何一個人套上去。而且今天有人離開，是因為在教會裡受了傷、被屬靈虐待，或只是搬家、換了適合的群體。把一切離開都叫作背叛，會讓留下的人活在恐懼裡，也讓離開的人再也不會回頭。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：被離棄是真的，會痛，連使徒也躲不過；不必假裝不痛，也不必認定全是自己的失敗，更不在講台上影射、點名離開的人。</strong>保羅的作法是：誠實地說出來，不咒罵；然後記得那個沒有離開的阿尼色弗；最後，在 4:16 又一次眾人離棄之後，說「但願這罪不歸與他們」，接著是「惟有主站在我旁邊」（4:17）。</p><p>越往下走，主越近。這是全卷地勢的規律。受苦與被離棄的全卷立場見 ISS00_2；4:10 底馬與 4:11 馬可的回轉，在第 4 章議題頁處理。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。人會轉過臉去，主不會。主耶穌被捉拿的那一夜，「門徒都離開他，逃走了」（可 14:50），他說的是：「其實我不是獨自一人，因為有父與我同在」（約 16:32）。</p><p>如果你正被離棄，允許自己哭，找一兩個可以說真話的人；也留意神差來的阿尼色弗。如果你是離開的那一位，門也還開著——4:11 的馬可就是一個被請回來的人。</p>"]],"con":[],"say":"本講義的立場：被離棄是真的痛，不必假裝，也不必全歸咎自己；不在講台上影射或點名離開的人，也不把一切離開都叫作背叛。保羅的路是誠實、不咒罵、記得阿尼色弗、仰望站在旁邊的主。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有經歷過教會分裂、至今不敢再投入的牧者與同工，有帶過的小組全散了、覺得自己很失敗的組長，也可能有剛從別的教會受傷離開、坐在後排觀望的人。不要說「離開的人都是不忠的」，也不要說「人走了一定是你的問題」。對被離棄的人，給他時間哀傷，必要時找輔導陪伴；對離開過的人，讓他知道這裡的門是開的。"},{"id":"ISS01_9","t":"1:16--18「願主使他在那日得主的憐憫」——阿尼色弗已經過世了嗎？可以為死人禱告嗎？","r":"1:16--18；4:19","ch":[1],"why":"保羅為阿尼色弗「一家」祝福，又為他本人「在那日」求憐憫，4:19 問候的也是「阿尼色弗一家的人」。這讓許多人推想阿尼色弗已經過世，而這段經文也成了天主教、東正教支持為亡者禱告的經文之一。華人教會常遇到家人過世、清明掃墓、追思禮拜時「可不可以為過世的人禱告」的牧養問題，這一題不能迴避。","pos":[["【一】經文問的是甚麼","","<p>「願主憐憫阿尼色弗一家的人」（1:16）；「願主使他在那日得主的憐憫」（1:18）。兩句都是祈願語氣 δῴη（dōē）。4:19 又說「問百基拉、亞居拉，和阿尼色弗一家的人安」，沒有問候阿尼色弗本人。問題有兩層：第一，阿尼色弗此時是否已經過世？第二，若已過世，1:18 能不能作為為亡者禱告的根據？經文沒有明說，我們只能從線索推敲。</p>"],["已故並可為亡者禱告說","","<p>天主教與東正教的傳統讀法：阿尼色弗很可能已經過世（只問候他一家、為他「在那日」求憐憫），保羅為一位過世的弟兄祈求末日的憐憫，表示為亡者禱告是合宜的；這也與早期教會在墓前紀念、代求的習慣相合，天主教另引次經瑪加伯下 12 章為證。這一說表達了教會跨越死亡的團契，也安慰了喪親的人。</p><p><strong>難處：</strong>經文並沒有說阿尼色弗已經死了，這只是推論；即使他已過世，一句祈願也撐不起一整套關於亡者狀態、煉獄或代禱果效的教義。更正教認為，人死後的審判在於他生前是否在基督裡，代禱不能改變它。</p>"],["已故但只是祝願說","","<p>許多更正教學者也認為阿尼色弗可能已經過世，但保羅在 1:18 說的只是一句真誠的祝願——像我們在追思禮拜上說「願主記念他」——而不是對他死後命運的代求，也不構成為亡者禱告的教導。這一說承認經文的線索，同時不越過經文去建立教義。</p><p><strong>難處：</strong>「祝願」與「禱告」的界線很難劃清——保羅明明是對主說話；若說可以「祝願」卻不可以「禱告」，對喪親的人來說可能像是文字遊戲。這一說需要更細緻地說明我們在追思時對主說的話是甚麼。</p>"],["仍在世說：阿尼色弗只是不在家","","<p>另一些解經家認為，阿尼色弗很可能還活著，只是此時仍在羅馬或旅途中，所以保羅問候他一家；1:18 的「那日」是保羅一貫的末日視野（1:12 也說「直到那日」），不需要預設他已經死了。這一說最貼近經文實際說出的內容。</p><p><strong>難處：</strong>若他還活著，為甚麼保羅單單問候他的家，卻不問候他本人？這一說也只是推論，不能因此斷定這段經文和為亡者禱告完全無關；用它來嘲笑別的傳統，同樣越過了經文。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：阿尼色弗此時是否已經過世，經文沒有明說；本講義並陳各說，不在本章裁判，也不以這一節建立或否定為亡者禱告的教義。</strong>可以確定的是：人的結局在主的憐憫裡；我們可以在追思中感謝神、把逝者交在主的憐憫中，並為留下的家人禱告。</p><p>本章真正要我們看見的，是阿尼色弗這個人：在離棄的亞細亞，有一個不轉過臉去的人；他在羅馬「殷勤地找我，並且找著了」（1:17），保羅願他在那日也「找著」憐憫。爭議與信心的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。天主教、東正教與更正教在這一題上看法不同，卻都相信那位「已經把死廢去」的主（1:10），都把逝者交在他的憐憫裡。</p><p>如果你剛失去一位親人，你可以在主面前說出你的思念與感謝，也可以把他交給那位滿有憐憫的主。更重要的是，今天還活著的人裡，有誰需要你像阿尼色弗一樣去找他？</p>"]],"con":[],"say":"本講義的立場：阿尼色弗此時是否已經過世，經文沒有明說；本講義並陳各說，不以這一節建立或否定為亡者禱告的教義。我們把逝者交在主的憐憫裡，並為留下的家人禱告。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有剛喪親、很想為過世的父母「做點甚麼」的人，有從天主教或民間信仰背景信主、對祭拜與追思充滿掙扎的人，也有家人未信主就過世、心裡極度不安的人。不要在他們面前說「你家人已經沒救了」，也不要嘲笑別的傳統。陪他們在主面前說出思念，把逝者交在主的憐憫裡；把注意力也帶到身邊還活著、需要被找著的人。"},{"id":"ISS02_1","t":"2:2 四代傳承——今日的門徒訓練怎樣做？「忠心」比「恩賜」重要嗎？","r":"2:2；1:5；3:14--15","ch":[2],"why":"2:2 常被當成門徒訓練的總綱：一節裡有保羅、提摩太、忠心的人、別人四代。今天的教會有各種門訓系統、倍增策略、一對一課程，也常在挑選同工時爭論：要找最有恩賜的，還是最忠心的？這一題關係到教會怎樣交棒，也關係到被帶的人會被當成接班人，還是被當成業績。","pos":[["【一】經文問的是甚麼","","<p>「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人」（2:2）。παράθου（parathou）是「寄放、託付」，與 1:12、14 的「所託付的」同字根：交出去的是神寄放的道，不是保羅個人的事工。條件有兩個：πιστοῖς（pistois）忠心的、ἱκανοὶ（hikanoi）能夠教導的。問題是：這一節是在給一套門訓「制度」，還是在講一個託付的「方向」？兩個條件哪一個在前？</p>"],["制度說：2:2 是門徒倍增的藍圖","","<p>許多門訓運動把 2:2 讀成一套可以複製的系統：每一個被帶的人都要在一定期間內再帶出下一代，形成倍增。這一說的長處是認真對待「別人」這一代——保羅確實要棒繼續往下傳，不是停在提摩太身上；它也提醒教會不要只養觀眾。</p><p><strong>難處：</strong>經文沒有給期限、人數或課程，保羅說的是「所聽見」的道與「忠心」的人；把一節託付讀成業績公式，容易把人當成數字，也容易讓帶領人以倍增速度衡量屬靈，與 2:2 先講忠心的次序不合。</p>"],["品格優先說：先忠心，再能教導","","<p>另一些解經家強調次序：保羅先說 πιστοῖς（pistois）忠心，才說 ἱκανοὶ（hikanoi）能教導。在同工離棄、假教訓擴散的處境裡（1:15；2:17），最危險的不是講得不好，而是講得很好卻把道改了。所以挑選接棒的人，先看他能不能把所領受的原樣守住、交出去。</p><p><strong>難處：</strong>這一說若講過頭，會把恩賜看成次要，甚至懷疑有恩賜的人；可是經文兩個條件都要，「能教導別人」也是真實的要求。只看忠心不看能力，教會可能把重擔放在一個不適合教導的人身上，傷了他，也傷了會眾。</p>"],["關係說：傳承是生命對生命","","<p>還有人注意到這一節的前文是「我兒啊」（2:1），又說「在許多見證人面前」：傳承發生在父子般的關係裡，也發生在群體公開的見證中。門訓不是一門課，是一段同行的生命；提摩太從外祖母、母親（1:5）和保羅身上領受的，都是活出來的信。</p><p><strong>難處：</strong>過度強調個人關係，可能讓門訓變成依附某一位屬靈父母，甚至演變成控制；也可能讓沒有「屬靈父親」的人覺得自己缺了一塊。保羅特別說「許多見證人面前」，正是要讓傳承是公開的、可被檢驗的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在品格優先、關係為本，但不排斥制度：2:2 是一個託付的方向，不是一套倍增的公式。</strong>次序是先忠心、再能教導；交出去的是「所聽見」的道，不是帶領人的影子；傳承在公開的群體裡發生，不在一個人私下的權力裡。</p><p>教會可以有課程與系統，那是工具；工具的目的是叫更多人把主的道活出來、交下去。321 所說的繁殖只在末端認出這件事，不是 2:2 的定義。傳承的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：福音是一代一代交下來的，每一個信徒都在這條線上，也都可以把所領受的交給別人。爭的是方法與次序。</p><p>對你今天最重要的問題很簡單：誰把這棒交給你？你身邊有沒有一個人，是你可以陪他走一段的？你不必先成為一位老師，只要先成為一個忠心的人。</p>"]],"con":[],"say":"本講義的立場：2:2 是託付的方向，不是倍增的公式；先忠心、再能教導，交出去的是主的道，不是自己的影子。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有人在某個門訓系統裡被當成業績、被要求每季交出「下一代」，累了想退出又怕被說不忠心；也有人從來沒有被誰帶過，覺得自己是沒有屬靈父母的孤兒。不要用倍增的數字衡量人。先聽他在傳承裡受過的傷，再告訴他：主是把棒交給你的那一位，你可以從陪一個人開始。"},{"id":"ISS02_2","t":"2:4「不將世務纏身」——傳道人可以帶職事奉嗎？「全職」才是最屬靈的嗎？","r":"2:3--4；徒 18:3；提前 5:8；提前 5:18","ch":[2],"why":"「不將世務纏身」常被用來說明傳道人應當全職，甚至被延伸成「全職事奉才是最高的呼召」，帶職事奉的人、在職場作見證的人因此覺得自己矮一截。另一方面，也有人用這一節叫同工放下家庭與正職。這一題關係到華人教會裡為數眾多的帶職傳道與職場信徒，也關係到牧者家庭的健康。","pos":[["【一】經文問的是甚麼","","<p>「凡在軍中當兵的，不將世務纏身，好叫那招他當兵的人喜悅」（2:4）。ἐμπλέκεται（empleketai）是「纏進去」，βίου（biou）指日常生計，πραγματείαις（pragmateiais）指營生與買賣。當時的現役兵不可另外經商、替人管產業。問題是：保羅說的是「不可有其他職業」，還是「不可被纏住」？這是一條給傳道人的職業規定，還是一個給所有信徒的心志原則？</p>"],["全職優先說：專職傳道是 2:4 的要求","","<p>有人把 2:4 讀成：蒙召專職傳道的人，不應再有世上的職業，好全心投入；並以使徒說「我們要專心以祈禱、傳道為事」（徒 6:4）為佐證。這一說的長處是承認教導與牧養需要時間與專注，也支持教會合理地供養同工，正如經上說「工人得工價是應當的」（提前 5:18）。</p><p><strong>難處：</strong>保羅自己就不是這樣——他與亞居拉同業，「製造帳棚為業」（徒 18:3），又說「我這兩隻手常供給我和同人的需用」（徒 20:34）。若 2:4 是職業禁令，保羅先違反了它。再推一步把全職講成「最屬靈」，就把一個兵役的比喻變成了屬靈的等級。</p>"],["心志說：問題是被誰纏住、討誰喜悅","","<p>另一些解經家認為比喻的重點在「纏」與「喜悅」：兵可以有家、有生活，但不可被別的主人綁住到聽不見號角。所以 2:4 適用於每一位信徒——無論全職或帶職，問題都是：我現在討誰的喜悅？</p><p><strong>難處：</strong>這一說若講得太寬，可能忽略教會確實需要一些人專心投入教導與牧養；也可能讓「我只是心裡不纏」成為推託的理由，對甚麼承擔都不肯放手。比喻畢竟是寫給提摩太這位傳道者的，有它特定的處境。</p>"],["呼召多元說：全職與帶職各按時期與處境","","<p>還有一說主張：全職與帶職都是呼召，各按時期與處境而定。保羅在哥林多帶職做工，在別的時期接受教會的供給；同一個人在不同階段可以有不同的安排。重點是順服那招他當兵的主，而不是某一種形式。</p><p><strong>難處：</strong>這一說最貼近保羅的實際，但需要很好的群體分辨，否則容易變成各人隨意；而且教會若沒有供養全職同工的意願，「帶職也很好」可能成為不照顧同工的藉口。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在心志說與呼召多元說之間：2:4 的處境是羅馬現役兵的規定；原則是不被纏住、好叫那招他當兵的喜悅。</strong>全職不是比較屬靈，帶職也不是半個兵；兩種都可以是精兵，也都可能被纏住。</p><p>同時本講義明確地說：「不將世務纏身」不等於不顧家人、不可以有正職、不可以休息（紅線三）。保羅要外衣、要書、要同伴（4:11--13），他是一個有需要的人。受苦與捨己的界線，本講義的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：兵只有一位主，事奉的動機是討他喜悅。爭的只是這個原則落在職業安排上的樣子。</p><p>如果你週間上班、週末事奉，你不必覺得自己欠了神一份全職；如果你是全職同工，你也不必用燒盡自己來證明甚麼。問同一個問題就好：這一週，是甚麼纏住了我，讓我聽不見主？</p>"]],"con":[],"say":"本講義的立場：2:4 說的是不被纏住，不是禁止正職；全職與帶職都可以是精兵，不將世務纏身也不等於不顧家人、不可休息。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有帶職多年的傳道人，常被人問「你甚麼時候才全職？」；也有全職同工的配偶與孩子，長年被「為主擺上」的話壓著，不敢說家裡已經撐不下去。不要再用 2:4 叫人放下家人。先問一問同工的家人過得好不好，並具體地幫他安排休息。"},{"id":"ISS02_3","t":"2:5--6「按規矩」「先得糧食」——為了賞賜而事奉錯了嗎？","r":"2:5--6；4:8；腓 3:14","ch":[2],"why":"保羅用比武的冠冕、農夫的糧食來勸提摩太，聽起來像是用賞賜鼓勵事奉。有人因此擔心：為了得賞賜而事奉，是不是動機不純？也有人反過來把「先得糧食」講成傳道人理當先享受豐盛，甚至與成功神學接上。這一題關係到我們怎樣面對事奉的動機，也關係到教會怎樣對待同工的需要。","pos":[["【一】經文問的是甚麼","","<p>「人若在場上比武，非按規矩，就不能得冠冕」（2:5）；「勞力的農夫理當先得糧食」（2:6）。νομίμως（nomimōs）是「合乎規則地」；στεφανοῦται（stephanoutai）的字根是競賽者的花冠；πρῶτον（prōton）放在前面：先分得果實的是他。問題是：賞賜在這裡是事奉的動機、事奉的結果，還是兩者都是？「先得糧食」說的是物質的供應，還是屬靈的餵養？</p>"],["純動機說：賞賜只是附帶的","","<p>有人認為真正的愛不求回報，事奉應當單單為了愛主；賞賜是神的恩典附帶給的，不應該成為動機。這一說的長處是保護事奉不變成交易，也提醒人警惕「為了被看見」的服事。</p><p><strong>難處：</strong>這一說與經文的語氣不合——保羅自己用賞賜鼓勵人，說「向著標竿直跑，要得神在基督耶穌裡從上面召我來得的獎賞」（腓 3:14），也在 4:8 說有公義的冠冕為他存留。新約並不以盼望賞賜為羞恥；把盼望一律當成不純，會讓人懷疑自己的每一個動機。</p>"],["賞賜動機說：盼望賞賜是正當的","","<p>另一些解經家認為，賞賜是正當而合乎聖經的動機：神親自應許，信徒也可以盼望；「先得糧食」說的是勞力的人理當先享受所種的果子，包括教會應當合理地供應同工的生活，與提前 5:17--18 相合。</p><p><strong>難處：</strong>若沒有清楚界定賞賜是甚麼，這一說很容易被成功神學接收：「先得糧食」被講成傳道人理當先富足、奉獻越多福分越大。經文的上下文是受苦（2:3）、捆綁（2:9）、同死（2:11），不是今生的豐盛。</p>"],["恩典獎賞說：獎賞不是工價","","<p>還有一說把兩者合起來：賞賜不是工價，而是恩典裡的獎賞——競賽者的花冠不是買來的，農夫的果子也是神叫它生長的。人可以盼望，卻不是在跟神做交易；最大的賞賜是主自己，冠冕是賜給「凡愛慕他顯現的人」（4:8）。</p><p><strong>難處：</strong>這一說在講台上需要講得很細，否則聽起來像是左右逢源；也必須回答一個實際的問題：教會到底應該怎樣具體地供應同工的生活？只講屬靈的果子，同工的實際需要可能被忽略。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在恩典獎賞說：盼望冠冕與糧食不是錯的動機，賞賜是恩典裡的獎賞，不是工價，更不是今生富足的保證。</strong>「按規矩」的規矩是這條路自己的規矩：先同死、才同活（2:11）；「先得糧食」首先是做工的人先被所傳的道餵養，也包括教會合理地照顧同工的生活。</p><p>本講義不接受把 2:6 講成成功神學的應許；成功神學的討論回指希伯來書立場四，受苦的界線見全卷立場 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神不虧欠人，忠心的服事在主裡不是徒然的；爭的只是賞賜在動機裡佔多重的位置。</p><p>你不必因為心裡盼望主說一聲「好」，就覺得自己不夠純。也請你檢查：如果今生甚麼都沒有得著，你還願意跑嗎？兩個答案都可以帶到主面前，他是那位先餵飽農夫的主。</p>"]],"con":[],"say":"本講義的立場：盼望冠冕不是錯，賞賜是恩典裡的獎賞，不是工價，也不是今生富足的保證；「先得糧食」是做工的人先被道餵飽，教會也該合理照顧同工。成功神學回指希伯來書立場四；本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有服事多年卻甚麼都沒得著的同工，聽到「賞賜」只覺得心酸；也有人被成功神學傷過，奉獻了很多，家裡卻更困難。不要承諾任何今生的回報。陪他們把委屈說出來，提醒他們主看見每一份擺上，也具體地問教會：我們有沒有好好照顧做工的人？"},{"id":"ISS02_4","t":"2:10「為選民凡事忍耐」——選民是誰？","r":"2:10；2:19；弗 1:4","ch":[2],"why":"保羅說「我為選民凡事忍耐」。「選民」在華人教會常引發揀選與預定的爭論：如果已經揀選好了，傳福音還有甚麼用？也有人用這兩個字暗中猜測誰在名單上、誰不在。這一題關係到傳福音的動力，也關係到為不信的家人禱告多年的人能不能繼續盼望。","pos":[["【一】經文問的是甚麼","","<p>「所以，我為選民凡事忍耐，叫他們也可以得著那在基督耶穌裡的救恩和永遠的榮耀」（2:10）。ἐκλεκτούς（eklektous）是「被揀選的人」。問題有兩層：這裡的「選民」指已經信主的人，還是也包括將來要信的人？既然是神所揀選的，保羅為甚麼還要「凡事忍耐」，好叫他們也可以得著？</p>"],["改革宗：無條件的揀選","","<p>改革宗傳統認為「選民」是神在創世以前所揀選的人，包括還沒有信主的；正因為神已經揀選，保羅的忍耐與傳揚不會徒然——神使用傳福音的人，把他的選民召進來。這一說的長處是給傳福音的人極大的確信：結果在神手裡，不在我們的口才。</p><p><strong>難處：</strong>若講得不小心，會讓人去猜誰是、誰不是選民，甚至因此放棄某些人；也必須回答一個牧養上的問題：一個掙扎的信徒怎樣知道自己是神所揀選的？</p>"],["阿民念與衛斯理宗：在基督裡揀選信的人","","<p>阿民念與衛斯理宗傳統認為，揀選是神在基督裡揀選「信他的人」，神預知誰會回應；或把揀選看成群體性的——神揀選了一群在基督裡的子民，人藉著信加入。這一說的長處是保護人的回應與責任，也解釋了保羅為甚麼要為人忍耐、勸人相信。</p><p><strong>難處：</strong>2:10 的語氣是「為選民」，好像神已經認得他們，保羅的忍耐是為了讓他們得著；若揀選只是預知人的決定，「選民」這個詞的份量就被減輕了。這一說也需要說明 2:25「或者神給他們悔改的心」——悔改是神的禮物。</p>"],["牧養讀法：揀選叫人忍耐，不叫人猜名單","","<p>還有不少解經家不在這裡裁判兩大傳統，而是注意保羅自己的用法：揀選從不叫他停止傳揚，反而叫他「凡事忍耐」；揀選在保羅口中是安慰受苦者、激勵傳福音的真理，不是讓人猜名單的工具。神的主權與人的責任在經文裡同時成立。</p><p><strong>難處：</strong>這一說在理論上留下張力，喜歡系統完整的人會覺得沒有回答問題；它也需要小心，不要把「張力」變成不必思考的藉口。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義在 2:10 採牧養讀法：「選民」是神所揀選、在基督裡的人；揀選的真理在保羅身上產生的是忍耐與傳揚，不是猜名單。</strong>「主認識誰是他的人」（2:19）——名單在主手裡，不在我們手裡。</p><p>揀選與預定的細部爭論，本講義回指以弗所書立場二，不在本章另立說法；講台上不用「選民」宣判任何人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各傳統都同意：得救是神的恩典，不是人的功勞；傳福音是信徒的託付；神是信實的。爭的是神的主權與人的回應怎樣配合。</p><p>如果你正在為一位家人禱告多年，2:10 給你的不是一個問號，而是一個榜樣：保羅為了還沒得著的人凡事忍耐。你也可以繼續忍耐、繼續愛、繼續禱告，把結果交給認識他的主。</p>"]],"con":[],"say":"本講義的立場：2:10 的揀選叫保羅為人忍耐、繼續傳揚，不是讓人猜誰在名單上；名單在主手裡。揀選與預定回指以弗所書立場二；爭議與信心，本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有人深夜焦慮：「我是不是選民？」也有父母為不信的兒女禱告到絕望，聽到「揀選」就怕孩子不在名單
