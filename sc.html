上。不要說「可能他不是選民」。陪焦慮的人讀 2:19 與 2:13，陪父母繼續禱告；告訴他們，神的揀選從來不叫人停止愛人。"},{"id":"ISS02_5","t":"2:12「我們若不認他，他也必不認我們」——基督徒會失去救恩嗎？","r":"2:11--12；2:13；來 6:4--6","ch":[2],"why":"「我們若不認他，他也必不認我們」是全卷最令人不安的一行。在華人教會，有人因此長年活在得救的焦慮裡，怕自己某一次的軟弱就是「不認主」；也有人為了安慰，乾脆把這一行講得沒有份量。這一題直接觸到救恩的確據，必須三讀並陳，也必須讀到 2:13。","pos":[["【一】經文問的是甚麼","","<p>這是「可信的話」第三行。ἀρνησόμεθα（arnēsometha）是將來式（RP 作現在式），「若我們將來不認」；主耶穌也說「凡在人面前不認我的，我在我天上的父面前也必不認他」（太 10:33）。問題是：真正重生的人，有沒有可能最終這樣「不認」主，以致被主不認？彼得三次不認主，用的正是同一個字（太 26:70、72），那他又怎麼說？</p>"],["改革宗：聖徒恆忍","","<p>改革宗傳統認為真正被神重生的人，必蒙神保守到底（約 10:28；腓 1:6）；2:12 的「不認」指一種最終、全然的背棄，這樣的人顯明他從來不是真正屬主的人。這一說的長處是把救恩牢牢放在神的手裡，給軟弱的人極大的安慰。</p><p><strong>難處：</strong>若講得不小心，警告會變得像是說給「別人」聽的，失去它對每一個讀者的份量；也可能讓一個曾經跌倒的人懷疑自己「從來沒有真正信過」，反而增加焦慮。</p>"],["阿民念與衛斯理宗：真實離棄的可能","","<p>阿民念與衛斯理宗傳統認為，警告是真實的可能：一個真實的信徒若持續、刻意地離棄基督，有可能最終失落；所以聖經才一再呼籲忍耐（2:12 上半）與存信心到底。這一說的長處是嚴肅對待警告的經文，也不讓人把恩典當成放縱的藉口。</p><p><strong>難處：</strong>這一說若講在敏感的人身上，很容易變成「我是不是已經失落了」的長期恐懼；而且必須面對 2:13 的末句——「他不能背乎自己」，以及新約許多神保守到底的應許。</p>"],["警告是保守的工具","","<p>第三種讀法認為，警告與應許都是真的，而且彼此配合：神正是藉著真實的警告，保守他的人不走向那一條路。就像山路邊的護欄是真的，它的作用不是叫人掉下去，而是叫人不掉下去。希伯來書講義對 6:4--6、10:26--39 也採這個讀法。</p><p><strong>難處：</strong>這一說被批評在邏輯上「兩邊都要」；它也不直接回答「如果真有人刻意到底不回頭會怎樣」，講台需要誠實地承認這個張力。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀並陳，講台採「警告是保守的工具」（沿用希伯來書講義立場三）：2:12 的「不認」是有意的、持續的、到底不回頭的否認；2:13 的「失信」（ἀπιστοῦμεν）是軟弱、不信實。</strong>要誠實：彼得不認主用的也是同一個字，所以分別不只在用字，更在最後的方向——彼得被主找回來了，「你回頭以後，要堅固你的弟兄」（路 22:32）。</p><p>講 2:12 必講 2:13；確據掛在「因為他不能背乎自己」。不製造得救焦慮，也不讓刻意離棄的人拿 2:13 當擋箭牌。本講義的全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題該讓你嚴肅，不該讓你驚慌。三種讀法都同意：刻意、持續地轉身離開基督是極其嚴重的；軟弱回頭的人，主必不丟棄（約 6:37）。</p><p>如果你今天會為這一行經文擔心，這份擔心本身就說明你還在乎他——刻意不認主的人，通常不會為此失眠。把眼睛移到下一行：「我們縱然失信，他仍是可信的」（2:13）。</p>"]],"con":[],"say":"本講義的立場：2:12 的警告是真的，2:13 的應許也是真的；「不認」指到底不回頭的否認，軟弱的「失信」遇見的是他的可信。講 2:12 必講 2:13。本講義的全卷立場見 ISS00_3。","care":"會眾席上一定有人帶著得救的焦慮來：可能是一位有強迫思想的弟兄、一位曾經在逼迫中低頭的長輩、一位跌倒後不敢回教會的年輕人。不要對他說「你可能已經不得救了」，也不要輕描淡寫說「沒事」。陪他讀 2:13 與路 22:32，必要時轉介輔導；對刻意離開的人，溫柔而誠實地呼喚他回來。"},{"id":"ISS02_6","t":"2:13「我們縱然失信，他仍是可信的」——與 2:12 怎樣同時成立？","r":"2:13；2:12；羅 3:3--4","ch":[2],"why":"2:12 說「他也必不認我們」，2:13 卻說「他仍是可信的」。兩行緊挨著，一行像警告，一行像保證，許多人讀到這裡就糊塗了：神到底會不會不認我？「他仍是可信的」是說他信實地保守我們，還是信實地執行他說過的審判？這一題是全卷樞紐，也是講台最容易兩邊講歪的地方。","pos":[["【一】經文問的是甚麼","","<p>「我們縱然失信，他仍是可信的，因為他不能背乎自己」（2:13）。ἀπιστοῦμεν（apistoumen）是「不信實、失信」；πιστὸς（pistos）μένει（menei）是「仍然是可信的」；ἀρνήσασθαι ἑαυτὸν οὐ δύναται 是「他不能否認自己」。問題是：神的「可信」在這裡是指他對我們的恩典信實（保守），還是指他對自己的話信實（包括 2:12 的審判）？兩行怎麼同時成立？</p>"],["恩典說：2:13 是應許的高峰","","<p>許多解經家認為 2:13 打破了前三行的對稱：前三行都是「若我們……他也……」，第四行卻不是「若我們失信，他也失信」，而是「他仍是可信的」。這一行是恩典的高峰：人的軟弱無法廢掉神的信實，正如保羅問：「難道他們的不信就廢掉神的信嗎？」（羅 3:3）</p><p><strong>難處：</strong>若單講這一行，會把 2:12 的警告抵消掉，好像怎樣都不影響；而且要說明「失信」與「不認」的分別在哪裡，否則前後兩行就互相矛盾。</p>"],["審判說：2:13 延續 2:12 的警告","","<p>另一些解經家認為 2:13 延續 2:12 的警告：神「可信」，是說他對自己的話信實——他說過不認那不認他的人，他就必照著做，因為他「不能背乎自己」。這一說的長處是保持四行詩的嚴肅，不讓恩典變得廉價。</p><p><strong>難處：</strong>這一說很難解釋為甚麼保羅換了字（從「不認」換成「失信」），也很難解釋「仍是」（μένει）溫暖的語氣；若照這一讀，2:13 對軟弱的人幾乎沒有安慰，與全章叫提摩太在恩典上剛強的方向不合。</p>"],["兩面說：神的可信同時是保守與公義","","<p>還有一說認為兩者不必二選一：神對自己信實，所以他的應許與警告都算數；正因為他不能背乎自己，他對軟弱失信的人不放手（他應許過要保守），對到底不回頭否認他的人也不勉強（他尊重人最後的方向）。關鍵在 2:12 與 2:13 的分別：一個是方向的轉身，一個是路上的跌倒。</p><p><strong>難處：</strong>這一說需要很小心地區分「方向」與「跌倒」，而這個分別在實際生命中不總是清楚；講台若不誠實地承認彼得也用了「不認」的字，就會把分別講得太乾淨。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在兩面說，講台落點在安慰：2:13 是可信的話的最後一行，也是全卷樞紐——它把整卷書從「我要忠心」翻轉成「他是可信的」。</strong>「不認」（2:12）與「失信」（2:13）是兩個字，但分別不只在用字，更在最後的方向：彼得用了「不認」的字，卻被主找回來了。</p><p>確據不掛在我的紀錄上，掛在「他不能背乎自己」上。本講義的全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題正是要穩住你的信心。各說都同意：神是信實的，他不會改變；人的軟弱不能改變他的本性。</p><p>如果你覺得自己最近守得很差，不要從自己的表現開始找確據；從這一句開始：「他不能背乎自己」。全能的神有一件事做不到，就是放下他自己說過的話。</p>"]],"con":[],"say":"本講義的立場：2:12 的警告與 2:13 的應許同時成立；分別在最後的方向，確據掛在「因為他不能背乎自己」。本講義的全卷立場見 ISS00_3。","care":"會眾席上有人會把 2:13 當成最後一根稻草，也有人可能把它當成不必回頭的藉口。對前者，慢慢陪他念這一節，不急著解決他所有的疑問；對後者，不要只給安慰，要溫柔而清楚地告訴他：同一首詩的第三行也是說給他聽的，主正在等他回頭。"},{"id":"ISS02_7","t":"2:15「按著正意分解真理的道」——斷章取義、靈意解經與今日的讀經方法怎樣分辨？","r":"2:15；3:16；彼後 3:16","ch":[2],"why":"2:15 是華人教會講台與查經班最常引用的經文之一。可是「按著正意分解」到底是甚麼方法？有人把它當成「分段式解經」或時代論分配的根據；有人主張只能照字面；也有人熱愛靈意解經，覺得字字都有屬靈的含意。網路時代人人都能剪出一節經文，這一題關係到每一位讀經的人。","pos":[["【一】經文問的是甚麼","","<p>「你當竭力在神面前得蒙喜悅，作無愧的工人，按著正意分解真理的道」（2:15）。ὀρθοτομοῦντα（orthotomounta）新約只此一次，字面是「直直地切開」，七十士譯本用它說「修直道路」。問題是：這一個字是在規定某一種解經方法，還是在描述一種對待真道的態度？它和上下文的言語爭辯（2:14）、世俗的虛談（2:16）有甚麼關係？</p>"],["方法說：正確地劃分聖經","","<p>有些傳統把 2:15 讀成一種具體的解經方法：把聖經正確地「劃分」成不同的時期或主題（例如時代論的分配），各歸其位，就不會混亂。這一說的長處是重視整本聖經的結構，提醒讀者不要把給某一群人的話隨意套在別人身上。</p><p><strong>難處：</strong>ὀρθοτομοῦντα 的字義重點是「直」，不是「分割成段」；「分解」是中文譯詞的色彩。把一個特定的系統讀進這一個字，等於讓系統替經文說話。</p>"],["文法歷史說：照作者原意讀","","<p>另一些人強調文法歷史解經：照作者原意、文法與歷史處境讀經，反對靈意解經的任意聯想。這一說的長處是保護經文不被讀者的想像綁架，也最能防止斷章取義。</p><p><strong>難處：</strong>若只停在字面與歷史，可能忽略新約作者自己也常在舊約中看見基督（例如 2:19 引用民 16:5），讀經也可能變成冷冰冰的學問，失去「得救的智慧」（3:15）這個目的。</p>"],["態度與生命說：先把自己切直","","<p>還有解經家認為這一節首先不是方法論，而是工人的品格：在言語爭辯與虛談擴散的處境裡，提摩太要直直地帶著真道往前走，不繞彎、不偏離、不為贏而歪曲。而且句子的受詞是「你自己」——先要在神面前被驗過，才談得上切道。</p><p><strong>難處：</strong>這一說若講得太虛，會讓人以為只要心正，方法就不重要；可是上下文確實有具體的錯誤（2:18），分辨真偽需要真實的讀經功夫。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在態度與生命說，並以文法歷史解經為基本功：「按著正意分解」是先把自己切直，再直直地帶著真道往前走，不是某一套系統的專利，更不是拿經文去切別人。</strong>靈意與預表只在新約作者自己作過連結的地方講滿；其餘只說「這使我們想起」。</p><p>斷章取義、把經文剪成武器，都是 2:15 的反面；讀經方法與默示論細部定義的分歧，不作分門的標準。本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：聖經是神的道，讀的人要敬畏、要用心、要按真理而不按私意。爭的是方法的細節。</p><p>你不必先學會一整套解經學才能讀經。從一個簡單的問題開始：這段經文在它原來的地方說甚麼？然後再問：它今天先要把我哪裡扶正？</p>"]],"con":[],"say":"本講義的立場：按著正意分解是先把自己切直、照作者原意讀經，不是某一套系統的專利，更不是拿經文切別人；方法上的分歧不作分門的標準。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有人被一節斷章取義的經文傷過——被說「你生病是因為有罪」、被說「你離過婚就不能事奉」；也有人在網路上看了太多互相攻擊的解經影片，越看越不敢讀經。不要再貼一節經文給他。陪他讀整段，讓他看見經文的上下文，也讓他知道讀經可以從安靜聽主開始。"},{"id":"ISS02_8","t":"2:18「復活的事已過」——今天的「現在就要全然得勝」教導錯在哪裡？","r":"2:17--18；2:11；林前 15:12","ch":[2],"why":"許米乃和腓理徒說「復活的事已過」，敗壞了好些人的信心。這聽起來像是古代的怪說法，可是它的今日版本到處都是：信了主就不該再生病、不該再軟弱、現在就要全然得勝、全然富足；做不到就是信心不夠。這一題關係到病床邊、牢房裡、喪禮上的人能不能保住盼望。","pos":[["【一】經文問的是甚麼","","<p>「他們偏離了真道，說復活的事已過，就敗壞好些人的信心」（2:18）。ἠστόχησαν（ēstochēsan）是「射偏了、沒中靶」；ἀνάστασιν ἤδη γεγονέναι 是「復活已經發生了」。問題是：他們說的「復活已過」是甚麼意思？為甚麼一個聽起來很屬靈的說法，會像「毒瘡」（γάγγραινα，2:17）一樣敗壞人的信心？今天哪些教導與它同類？</p>"],["屬靈化說：把復活全講成已經發生的","","<p>許多解經家認為許米乃把復活全然屬靈化：信徒受洗時已經與基督一同復活（這使我們想起西 2:12；弗 2:6），所以不再有將來身體的復活。這一說有經文的線索——保羅確實說過我們已經與基督一同復活——他們是把真理的一半當成了全部。</p><p><strong>難處：</strong>我們無法完全重建許米乃的教導，只能從保羅的一句話推測；而且這一說若講得太快，可能讓會眾連「已經與基督一同復活」的真理也不敢講了。</p>"],["希臘二元論說：輕看身體","","<p>另一些學者認為背後是希臘思想對身體的輕看：身體是靈魂的監牢，得救就是靈魂脫離身體，所以不需要也不期待身體復活。哥林多教會也有人否認死人復活（林前 15:12）。這一說的長處是解釋了為甚麼這類教導常同時輕看身體的道德。</p><p><strong>難處：</strong>以弗所的處境與哥林多不完全相同；把各地的錯誤都歸成同一種哲學，可能簡化了歷史。</p>"],["過度實現的末世論：今日版本","","<p>還有解經家用「過度實現的末世論」來描述：把將來才完全的應許全部拉到現在——現在就全然得勝、全然醫治、全然富足。今天一些教導說信徒不該再生病、不該再有眼淚，正是同一個方向。這一說的長處是把古代的錯誤接到今天的講台上。</p><p><strong>難處：</strong>這個標籤若用得太廣，可能把一切宣講神今天作為（醫治、得勝、豐盛）的人都打成許米乃；神今天確實醫治、確實施恩，問題不在相信神今天作工，而在否認「還沒有」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：許米乃的錯在把「已經」講成「全部」，取消了「還沒有」。</strong>保羅的盼望是「也必與他同活」（2:11）——將來式，所以今天可以忍耐；他自己就在鎖鍊裡。神今天醫治、施恩是真的，但身體的復活與完全的得勝在主再來的那一天。</p><p>講台可以清楚指出錯誤的說法，但不給今天的講員貼「許米乃」的標籤；主再來回指帖撒羅尼迦前書立場二，受苦的界線見全卷立場 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題會保護你的信心。如果有人告訴你，你還在病、還在哭，就是信心不夠，你可以知道：這正是保羅說會敗壞人信心的那一類話。</p><p>你的盼望不在今天甚麼都好了，而在那一位已經從死裡復活的主（2:8），他必叫我們與他同活。在那一天以前，眼淚是被允許的。</p>"]],"con":[],"say":"本講義的立場：「復活的事已過」錯在把將來的完全拉到今天，今天的「現在就要全然得勝」與它同類；神今天施恩是真的，但不把還在受苦的人定罪為信心不夠。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有長期病痛的人、剛失去家人的人、在逼迫或監禁中的弟兄姊妹的家屬，他們曾被人說「你信心不夠才會這樣」。不要再加一句責備。陪他們哭，告訴他們保羅也是在鎖鍊裡等候復活；必要時幫他們求醫、求助，那與信心不衝突。"},{"id":"ISS02_9","t":"2:20--21「人若自潔，脫離卑賤的事」——要與有錯的信徒分開嗎？分離與合一的界線在哪裡？","r":"2:20--22；2:24--25；加 6:1","ch":[2],"why":"華人教會的分裂史裡，2:20--21 常被引用：「我們要自潔，所以要從那個宗派、那間教會、那些人分出來。」也有人反過來說：教會只要合一，甚麼錯都可以包容。這一題關係到教會怎樣面對錯誤教導、怎樣對待跌倒的弟兄，也關係到許多曾經被「切割」過的人。","pos":[["【一】經文問的是甚麼","","<p>「人若自潔，脫離卑賤的事，就必作貴重的器皿，成為聖潔，合乎主用，預備行各樣的善事」（2:21）。ἐκκαθάρῃ ἑαυτὸν（ekkatharē heauton）是「潔淨自己」；ἀπὸ τούτων（apo toutōn）是「脫離這些」——「這些」指的是甚麼：卑賤的器皿（人），還是 2:16--18 的虛談與錯誤（事）？這決定了 2:21 是叫人分離，還是叫人自省。</p>"],["分離說：與錯誤的教師及其跟隨者分開","","<p>有些傳統把「這些」讀成卑賤的器皿，也就是錯誤的教師與跟隨他們的人；所以 2:21 要求信徒與他們分開，保持教會的純潔。這一說的長處是嚴肅對待錯誤教導的破壞力——毒瘡會擴散（2:17），教會不能毫無界線。</p><p><strong>難處：</strong>同一段經文緊接著說主的僕人不可爭競，要「用溫柔勸戒那抵擋的人」（2:25），目標是他們悔改；若 2:21 是要斷絕往來，就很難再勸戒。這一讀在歷史上也常被用來為分裂找理由。</p>"],["自潔說：先脫離不義的事","","<p>另一些解經家認為「這些」指錯誤的言論與不義的事（2:16--19「離開不義」），和合本譯作「卑賤的事」也是這個方向。重點是「自」潔：先處理自己身上的虛談、私慾與爭競，才成為合乎主用的器皿。這一說的長處是緊扣 2:19、2:22 的上下文。</p><p><strong>難處：</strong>若完全不談界線，教會可能對明顯的錯誤教導、持續的惡行沒有任何處理；新約別處也確實有暫時不相交往的管教（帖後 3:14），目的是叫人自覺羞愧、回轉。</p>"],["區分層次說：對己、對錯誤教師、對跌倒的人","","<p>還有一說主張區分層次：對自己，是徹底的自潔；對在福音根基上偏離、又持續擴散錯誤的教師，教會要有清楚的界線，不給他講台；對一般有錯、跌倒、意見不同的弟兄姊妹，是「用溫柔的心把他挽回過來」（加 6:1）。分離是最後的手段，目的永遠是回轉。</p><p><strong>難處：</strong>這一說需要很好的屬靈分辨與群體程序：誰來判斷「根基上偏離」？若沒有公正的過程，層次區分可能變成掌權者的工具。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在自潔說，並承認區分層次的必要：2:21 首先要脫離的是「事」，不是隔離「人」；方向是先把自己洗乾淨。</strong>對擴散錯誤教導的人，教會可以有界線，但目的仍是「或者神給他們悔改的心」（2:25）；對跌倒的弟兄姊妹，是用溫柔的心挽回。</p><p>貴重不是天生的材料：馬可曾經半路離開，後來保羅說他「在傳道的事上於我有益處」（4:11）。爭議與信心，本講義的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神的家要聖潔，也要有愛；錯誤要處理，人要被挽回。爭的是界線畫在哪裡。</p><p>如果你曾經被教會「切割」過，或你曾經切割過別人，2:21 都邀請你回到同一個起點：先讓主潔淨我自己。器皿的價值不在材料，而在被誰使用。</p>"]],"con":[],"say":"本講義的立場：2:21 要脫離的是不義的「事」，不是隔離有錯的「人」；先自潔，對擴散錯誤的人有界線，對跌倒的人用溫柔挽回。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有被前一間教會公開切割、被說成「卑賤的器皿」的人，也有離婚、跌倒後被眾人迴避的弟兄姊妹。不要用這節經文再把他們推遠一次。先問他過得好不好，請他吃一頓飯；如果他身上真有需要處理的事，私下、溫柔地陪他面對。"},{"id":"ISS03_1","t":"3:1「末世」是甚麼時候？是今天嗎？","r":"3:1；1:10；來 1:2；約壹 2:18；太 24:36","ch":[3],"why":"「末世」大概是華人教會最常被拿來製造緊張的一個詞：每逢戰爭、瘟疫、地震、天象，就有人把 3:1 配上新聞頭條，排出時間表，甚至叫人辭職、賣房、囤糧。另一端的人則乾脆不提末世，好像這只是嚇人的舊話。這一題關係到會眾怎樣看待自己活著的這段時間：是恐慌地等，還是清醒地活。","pos":[["【一】經文問的是甚麼","","<p>「你該知道，末世必有危險的日子來到。」（3:1）ἐν ἐσχάταις ἡμέραις（en eschatais hēmerais）是舊約先知的用語，指神要成就應許的那段時候。ἐνστήσονται（enstēsontai）是將來式，好像在說遙遠的事；可是到了 3:5，保羅用現在式命令提摩太「躲開」這等人，3:6 又說「正是這等人」。問題是：保羅說的末世，是主再來前最後的一小段，還是從基督第一次來就已經開始？</p>"],["已經開始說：末世從基督第一次顯現延伸到他再來","","<p>多數改革宗與福音派解經家注意到，新約一致把「末後的日子」接在基督身上：彼得在五旬節說「在末後的日子」（徒 2:17）就是當天；希伯來書說神「就在這末世藉著他兒子曉諭我們」（來 1:2）；約翰說「如今是末時了」（約壹 2:18）。所以 3:1 的將來式，在提摩太的以弗所已經發生了。這一說的長處是貼近上下文，也叫每一代都認真警醒。</p><p><strong>難處：</strong>若講得太平，容易把末世講成「一直都這樣」，失去了新約對主再來那種真實的期待與緊迫感；聖經確實也說有一個「那日子」（太 24:36）要來，不是只有一段沒有終點的時間。</p>"],["最後時期說：3:1 特指主再來前一段格外艱難的時期","","<p>時代論與部分前千禧年派的解經家認為，3:1 雖然在提摩太時代已有影子，但完全的應驗是在主再來之前的一段特定時期，那時人的敗壞會達到高峰；他們常把 3:1--5 與太 24 章、帖後 2 章並讀。這一說提醒教會：歷史有方向，不是無止盡的循環，主再來之前的日子確實會越來越難。</p><p><strong>難處：</strong>這一說最容易滑向算日子：一旦相信有一段「最後時期」，人就忍不住要判斷「是不是現在」。而 3:5 的現在式命令清楚表明，保羅要提摩太面對的就是他自己的時代，不是兩千年後的人。</p>"],["歷代應驗說：每一個世代都會在自己的時候經歷 3:1","","<p>也有解經家採取比較牧養的讀法：3:1--5 像一份「人性在末世的氣象報告」，每一代教會都會在自己的時候遇到它；它不是用來辨認日期，而是用來辨認人心。這一說能幫助會眾把經文落在今天，同時不必把某一年絕對化。</p><p><strong>難處：</strong>若只講「每一代都有」，經文的終末方向會被稀釋成一般道德教訓；保羅寫的不只是人性常態，而是在基督已來、還要再來中間這段時間的特質，這個終末框架不能拿掉。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已經開始說為主：末世從基督第一次顯現（1:10）就開始了，一直延伸到他再來；3:1 不是日曆，是一個要「一直知道著」的命令（γίνωσκε 現在式）。</strong>同時保留主再來的真實盼望與緊迫：那日子必來，只是「沒有人知道」。</p><p>所以本講義不在講台上排時間表，也不說某一年、某一件事就是應驗；只說：這是每一代都要警醒的日子。主再來的相關爭議，回指帖撒羅尼迦前書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：主必再來，日子會艱難，信徒要警醒；分歧只在 3:1 指的範圍有多寬。沒有任何一說叫人恐慌、囤積或放棄日常的責任。</p><p>保羅寫這一節給提摩太，不是要嚇他，是在交棒之前先告訴他：路上不會平順，你不必驚訝。被提醒過的人遇到風浪，不會以為自己走錯了路。末世論的功用是預備，不是恐嚇。</p>"]],"con":[],"say":"本講義的立場：3:1 的末世從基督第一次顯現就開始了，一直延伸到他再來；我們不算日子、不排時間表，只說這是每一代都要警醒的日子。主再來的爭議回指帖撒羅尼迦前書立場二；爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有被末世預言嚇壞的人：有人因此失眠，有長輩把積蓄捐出去，有年輕人覺得讀書工作都沒有意義。也可能有曾經跟著某個時間表、結果落空而對信仰灰心的人。不要嘲笑他們；陪他們回到 3:1 的「要知道」——知道之後要做的，是好好過今天、愛身邊的人，而不是追新聞。"},{"id":"ISS03_2","t":"3:2--4 末世人品的清單——今天的世界比從前更壞嗎？","r":"3:2--4；3:13；羅 1:29--31","ch":[3],"why":"3:2--4 的十八項清單讀起來很像晚間新聞，所以常被拿來證明「這個世代墮落到極點了」，也常被貼在年輕人、某些族群、某個政治陣營或某個宗派身上。另一方面，也有人覺得歷史一直在進步，這張清單太悲觀。這一題關係到教會怎樣看自己的時代，更關係到我們讀這張清單時，眼睛是往外看，還是往內看。","pos":[["【一】經文問的是甚麼","","<p>「因為那時，人要專顧自己，貪愛錢財，自誇，狂傲」（3:2）。清單用「愛」開頭：φίλαυτοι（philautoi）「愛自己」、φιλάργυροι（philargyroi）「愛錢」；用「愛」收尾：φιλήδονοι μᾶλλον ἢ φιλόθεοι（philēdonoi mallon ē philotheoi）「愛宴樂勝過愛神」。問題是：這張清單是在預告世界會一代比一代壞，還是在描寫一個每個時代都會出現的病根？它說的是教會外面的人，還是教會裡面的人？</p>"],["越來越壞說：歷史在走下坡，末後的日子道德會一代不如一代","","<p>有些解經家把 3:1--5 與 3:13「越久越惡」並讀，認為保羅描寫的是一條下坡的線：越接近主再來，人的敗壞越深。這一說看重聖經對歷史方向的嚴肅判斷，也提醒教會不要天真地以為社會進步就等於人心變好。</p><p><strong>難處：</strong>3:13 說的是「作惡的和迷惑人的」越久越惡，不是全人類一代比一代壞；而且每一代人幾乎都覺得自己的時代最壞，這種比較很難驗證，又最容易變成「我們這一代比較好、年輕人比較壞」的標籤。</p>"],["人性常態說：清單描寫的是墮落人性的本相，每一代都一樣","","<p>另一些解經家指出，這張清單和羅 1:29--31 外邦人的罪非常相似，ἔσονται γὰρ οἱ ἄνθρωποι（esontai gar hoi anthrōpoi）帶冠詞，說的是「人」的一般寫照。末世的特點不是人突然變壞，而是在基督已來之後，人心的真相被照得更清楚。這一說能防止人把清單往某一代身上貼。</p><p><strong>難處：</strong>若只說「人一直都這樣」，清單的末世框架就被拿掉了；保羅明明說這是「末世」「危險的日子」的特徵，而且 3:5 立刻指出，這些人帶著敬虔的外貌，不是一般的社會現象。</p>"],["教會內部說：清單的重點是教會裡只剩外貌的人","","<p>還有解經家強調 3:5：「有敬虔的外貌，卻背了敬虔的實意」——清單上的人不在教會外面，就在教會裡面，而且 3:6--9 接著描寫的是在家庭聚會裡活動的假師傅。所以這張清單首先是給教會照的鏡子，不是給社會看的診斷書。</p><p><strong>難處：</strong>這一說若講得太窄，會忽略清單和羅 1 章的相似，好像只有教會裡才有這些問題；也容易變成在教會裡找「誰是那種人」，把一面鏡子又變成了一支指人的手指。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義不從 3:2--4 判斷今天的世界比從前更壞或更好；這張清單描寫的是末世裡人心的方向——愛錯了對象，而且它首先出現在有敬虔外貌的人身上（3:5）。</strong>清單第一項「專顧自己」是全新約對「有己」最直接的描述，所以讀它的第一步，是先對準講台與座位上的自己。</p><p>本講義不把這張清單貼在任何人群、世代、宗派、政治立場或講員身上（鐵律四）。它的反面在 3:17：屬神的人，中心不再是自己，是神。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：人心的病根是愛錯了對象，神的話能把人扶正。至於世界是不是一代比一代壞，聖經沒有要我們去量，也量不準。</p><p>對你最重要的不是判斷這個世代，而是問：這十八項裡，哪一項今天在我身上？讀到這裡覺得心痛的人，離主近；讀到這裡只想到別人的人，要小心了。</p>"]],"con":[],"say":"本講義的立場：3:2--4 的清單描寫末世裡人心愛錯了對象的方向，不是用來證明哪一代比較壞；它首先是有敬虔外貌的人要照的鏡子，第一項「專顧自己」先對準講台與座位上的自己，不貼在任何人群身上。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有被貼過標籤的人：被長輩說「你們這一代就是專顧自己」的年輕人，被說成「末世的跡象」的某個族群或某種政治立場的弟兄姊妹。也可能有讀完清單覺得自己全中、陷入自責的敏感的人。不要用清單量人；陪自責的人看見 3:15 的「因信基督耶穌」，清單不是判決書，是叫人回到主面前的地圖。"},{"id":"ISS03_3","t":"3:5「有敬虔的外貌……這等人你要躲開」——怎樣分辨？會不會變成論斷？","r":"3:5；2:25；太 7:1；帖後 3:14--15","ch":[3],"why":"「這等人你要躲開」是教會分裂時最常被引用的經文之一：有人用它要求會眾和離開的同工斷絕往來，有人用它切割家人，也有人拿它來給不同意見的弟兄姊妹定罪。可是主也說「你們不要論斷人」（太 7:1）。這一題關係到教會怎樣分辨，又不把分辨變成黑名單。","pos":[["【一】經文問的是甚麼","","<p>「有敬虔的外貌，卻背了敬虔的實意；這等人你要躲開。」（3:5）μόρφωσιν（morphōsin）是外形、模子，δύναμιν（dynamin）是能力；ἠρνημένοι（ērnēmenoi）是完成式，長期否認、已經定型的狀態；ἀποτρέπου（apotrepou）是現在式命令，「一直轉身避開」。問題是：要躲開的是誰？躲開到甚麼程度？由誰來判斷？</p>"],["嚴格分離說：躲開就是斷絕往來，是教會紀律的一部分","","<p>有些傳統把 3:5 與多 3:10「分門結黨的人，警戒過一兩次，就要棄絕他」並讀，認為對長期敵擋真道、散布錯謬的人，教會要有明確的界線，不讓他繼續在會眾中影響人。這一說看重保護羊群，也提醒教會：包容不等於不設防。</p><p><strong>難處：</strong>這一說最容易被擴大使用：把一次的跌倒、一次的意見不合、甚至只是離開教會的人，都當成「這等人」；而且常常由個人而不是由教會按程序來判斷，結果變成以屬靈語言包裝的排擠。</p>"],["不跟從說：躲開是不被他們牽著走，不是公開羞辱或斷絕一切關係","","<p>另一些解經家注意 ἀποτρέπου 的語氣：是「轉身避開」，重點在不跟從、不被影響，正如 3:6 那些被擄的人缺少的就是這份分辨。保羅在別處也說「不和他交往」，接著卻說「但不要以他為仇人，要勸他如弟兄」（帖後 3:15）。這一說同時保住分辨與愛：不跟從他的教訓，卻仍然盼望他回轉。</p><p><strong>難處：</strong>這一說若講得太軟，可能讓教會面對真正有破壞力的人時不敢設界線，讓脆弱的初信者繼續暴露在錯謬的影響下；不跟從需要具體的作法，不能只是一種心態。</p>"],["自我省察優先說：這面鏡子第一個照的是讀的人自己","","<p>也有解經家強調 3:5 在清單之後：清單第一項是「專顧自己」，而有外貌、沒有能力的危險，每一個信徒都有。所以這一節首先是自我檢查——我是不是只剩下聚會、詩歌、屬靈詞彙，卻不讓神碰我的錢、我的口、我的驕傲？</p><p><strong>難處：</strong>若只談自省，保羅給提摩太的實際命令會被抹掉；提摩太確實要面對具體的人，教會也確實需要分辨。自省不能取代牧者保護羊群的責任。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的讀法是：先自省，再分辨；分辨看的是長期否認敬虔能力的方向，不是一次的跌倒或意見不合；躲開是不跟從、不被牽著走，不是公開羞辱，也不是由個人列黑名單。</strong></p><p>真正需要設界線的情況，由教會按程序、帶著眼淚處理；同時記得保羅在上一章說的「用溫柔勸戒那抵擋的人」（2:25），盼望神給他們悔改的心。長老與屬靈權柄的相關爭議回指彼得前書立場五。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：敬虔的外貌不能代替敬虔的能力，教會需要分辨，論斷與分辨不同。爭的只是躲開的範圍與程序。</p><p>對你最要緊的問題不是「誰是那種人」，而是「我是不是只剩下外貌」。外貌可以靠自己撐，實意只能靠住在裡面的聖靈（1:14）；一個天天回到主面前的人，不會只剩下殼。</p>"]],"con":[],"say":"本講義的立場：3:5 先是一面照自己的鏡子，再是分辨的方向；躲開是不跟從、不被牽著走，不是黑名單，也不是公開羞辱；需要設界線時由教會按程序、帶著盼望對方回轉的心處理。長老與屬靈權柄回指彼得前書立場五。","care":"會眾席上可能有曾經被教會「躲開」的人：離開教會後被昔日的弟兄姊妹封鎖、在群組裡被暗指為「有外貌沒實意」的人；也可能有因為家人信仰不同而被勸「切割」的人。不要在講台上影射任何人。陪受傷的人分辨：被人躲開，不等於被神棄絕；也陪他看見，自己今天也可以不躲開那個傷過他的人，只是不再跟從。"},{"id":"ISS03_4","t":"3:6--7「無知婦女」——又是在貶低女性嗎？","r":"3:6--7；提前 2:11；3:8；3:13","ch":[3],"why":"「牢籠無知婦女」是新約裡最容易讓女性讀者難受的一句話之一，也常被誤用來說「女人比較容易被騙，所以不適合教導」。另一方面，批評聖經的人也拿這一節證明保羅輕看女性。這一題關係到教會怎樣對待熱心學道的姊妹，也關係到我們讀經時，是看見經文真正指出的問題，還是把自己的偏見讀進去。","pos":[["【一】經文問的是甚麼","","<p>「那偷進人家、牢籠無知婦女的，正是這等人。這些婦女擔負罪惡，被各樣的私慾引誘，常常學習，終久不能明白真道。」（3:6--7）γυναικάρια（gynaikaria）是 γυνή（gynē）的指小詞，帶輕看的口氣；可是兩個被動分詞說她們是「被罪堆滿」「被私慾牽著走」的。問題是：保羅的口氣是針對所有女人，還是描寫一群特定的、被利用的人？他責備的對象到底是誰？</p>"],["性別偏見說：這一節反映古代的父權觀念","","<p>部分批判學者認為，指小詞 γυναικάρια 顯出作者對女性的輕視，與當時希臘羅馬文化認為女性輕信、情緒化的刻板印象一致；他們常把它和提前 2 章並看，認為教牧書信整體對女性採取限制的態度。這一說誠實面對了經文用字裡的輕看口氣，不假裝這一節讀起來不刺耳。</p><p><strong>難處：</strong>這一說忽略了上下文：保羅責備的主角是「偷進人家」的人，下一節敵擋摩西的雅尼和佯庇是男人，3:13「他欺哄人，也被人欺哄」也不分男女；而且同一位保羅叫女人「沉靜學道」（提前 2:11），在當時是給女性受教育的機會。</p>"],["處境說：問題出在以弗所特定的社會處境","","<p>不少福音派解經家指出，第一世紀以弗所的女性多半沒有受教育的機會，白天留在家中，而當時的教會在家裡聚會，假師傅不必上台，只要進得了門；保羅描寫的是這種處境下被利用的一群人。這一說解釋了保羅為甚麼特別提到婦女，也說明他的對策為甚麼是讓她們好好學道。</p><p><strong>難處：</strong>處境的重建有一部分是推論，學界對以弗所女性的實際狀況仍有討論；若把一切都推給處境，也可能錯過經文對今天每一個讀者——不論男女——的直接警告。</p>"],["屬靈狀態說：重點在「私慾」與「學而不明」，不在性別","","<p>也有解經家把焦點放在兩個被動分詞與 3:7 的對比：πάντοτε μανθάνοντα（pantote manthanonta）「常常學習」對 μηδέποτε（mēdepote）「從不到達」。這是一種屬靈狀態：罪疚一直壓著、私慾一直牽著、學習成了逃避悔改的方法。這種狀態，男女都可能有。</p><p><strong>難處：</strong>這一說若完全不提性別，等於繞過經文確實寫了「婦女」這個事實；讀者仍然需要知道保羅為甚麼這樣寫，而不是只把這一節改寫成一般的道德教訓。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義合併處境說與屬靈狀態說：保羅描寫的是在以弗所特定處境下被假師傅利用的一群人；他指出的病根是「被各樣的私慾引誘」與「常常學習，終久不能明白真道」——這兩樣男女都可能有，問題從來不在性別。</strong></p><p>保羅責備的是鑽進門的人，對被擄的人帶著憐憫；他給的對策是讓女人學道（提前 2:11；提摩太前書講義第 2 章）。性別與事奉的相關爭議，回指提摩太前書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：這一節不是在說女人天生比男人笨，經文本身也指出男人同樣會敵擋真道、欺哄人也被人欺哄。爭的是保羅的用字反映多少當時的文化。</p><p>主耶穌讓馬利亞「在耶穌腳前坐著聽他的道」（路 10:39），也讓一群婦女跟隨他、供給他。一個認真學道的姊妹，在主眼中不是「無知婦女」，是門徒。</p>"]],"con":[],"say":"本講義的立場：3:6--7 指出的問題是被私慾引誘、學了卻不讓真理碰到心，男女都可能；保羅責備的是偷進人家的人，對被擄的人帶著憐憫，他的對策是讓女人學道。性別與事奉回指提摩太前書立場二。","care":"會眾席上的姊妹，可能有人曾經被說「女人比較容易被騙」而被擋在教導的服事之外，也可能有人真的曾被錯謬的教導牽著走，現在很羞愧。不要用這一節開玩笑。陪後一種人看見：她是被擄的，不是笨的；主今天仍然要她坐下來好好學，並且帶她到達真道。"},{"id":"ISS03_5","t":"3:8 雅尼和佯庇是誰？保羅可以引用聖經以外的傳統嗎？","r":"3:8--9；出 7:11；出 7:22；猶 14","ch":[3],"why":"出埃及記只說法老召來「博士和術士」，沒有記下名字；保羅卻叫得出「雅尼和佯庇」。有人因此說保羅引用了偽經，所以那些書也有權威；也有人反過來說聖經混雜了傳說，不可靠。這一題關係到會眾怎樣理解正典的界線，以及聖經作者使用聖經以外的材料時，我們該怎樣讀。","pos":[["【一】經文問的是甚麼","","<p>「從前雅尼和佯庇怎樣敵擋摩西，這等人也怎樣敵擋真道。」（3:8）出 7:11、22 只說術士「用邪術照樣而行」。Ἰάννης καὶ Ἰαμβρῆς（Iannēs kai Iambrēs）這兩個名字出自猶太傳統：亞蘭文意譯本、死海古卷的文獻、後來的拉比著作，連一些希臘羅馬作家也知道。問題是：保羅提這兩個名字，是在確認一段歷史細節，還是只是借用讀者熟悉的稱呼？</p>"],["通稱借用說：保羅用的是當時人人知道的名字","","<p>多數解經家認為，保羅用這兩個名字，就像我們今天說「法老的術士」一樣，是借用讀者熟悉的稱呼來指那一群人；他要說的是聖經自己記下的事實：有人在摩西面前用模仿來敵擋神的作為，最後失敗了。猶大書提到以諾的預言也是類似的作法：使徒借用讀者熟悉的材料，不等於為整套傳統背書。</p><p><strong>難處：</strong>這一說需要回答一個問題：既然在默示的經文裡寫出這兩個名字，這兩個名字本身是否也因此被確認為真？把它說成「只是借用」，有些讀者會覺得是在迴避。</p>"],["默示確認說：保羅寫出這兩個名字，就確認了它們的真實性","","<p>有些持守嚴格無誤論的解經家認為，聖靈默示保羅寫下這兩個名字，表示這兩個名字就是那兩位術士的真實名字，猶太傳統在這一點上保存了正確的歷史。這一說看重經文每一個細節的可靠性，也提醒我們不要輕易把經文的內容當成修辭。</p><p><strong>難處：</strong>這一說只能延伸到名字本身，不能延伸到相關的整套傳說；可是講台上一旦說「保羅確認了」，會眾很容易以為那些講雅尼、佯庇的書也是神的話，正典的界線反而模糊了。</p>"],["偽經權威說／聖經不可靠說：從同一個現象推出兩個相反的結論","","<p>有一些人從這一節推出：既然保羅引用了聖經以外的傳統，那些傳統或偽經也應該有聖經一樣的權威；另一些人則推出相反的結論：既然聖經裡混雜了傳說，聖經就和其他古代文獻一樣，不必當真。兩者都注意到了一個真實的現象：聖經作者確實使用了他們文化裡的材料。</p><p><strong>難處：</strong>兩者都把「引用」等同於「全盤背書」。引用一句話或一個名字，不等於承認整本書是正典；保羅在雅典也引過希臘詩人的話，沒有人因此把那些詩當作聖經。兩個結論都超過了經文所說的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採通稱借用說：保羅用的是一個當時人人知道的名字，說的仍是聖經自己記下的事實；本講義把這兩個名字當作傳統的稱呼，不從它們推演任何教義，也不據此為任何聖經以外的書背書。</strong></p><p>這一段真正的信息在 3:9：「然而他們不能再這樣敵擋」——模仿的終究被吞掉（出埃及記講義第 7 章）。聖經的默示與權威，本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：出埃及記記下的事件是真的，術士用模仿敵擋摩西，最後承認「這是神的手段」（出 8:19）。爭的只是兩個名字的來源和地位。</p><p>神的話從來不怕被放在它的文化裡讀；它借用當時的語言，說出永遠的真理。你不必知道術士叫甚麼名字，也能看見那一位讓亞倫的杖吞了他們的杖的神。</p>"]],"con":[],"say":"本講義的立場：雅尼和佯庇是猶太傳統裡的名字，保羅借用讀者熟悉的稱呼，說的是出埃及記記下的事實；引用不等於為整套傳統背書，本講義不據此推演教義。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有在網路上讀到「聖經抄襲傳說」而信心動搖的年輕人，也可能有沉迷各種偽經、秘傳、以為越冷門越屬靈的人。不要嘲笑前者的疑問，也不要羞辱後者的好奇。陪他們看見：神的話不怕被查考，真正要緊的是這段經文要我們在模仿真理的聲音中站穩。"},{"id":"ISS03_6","t":"3:12「凡立志……敬虔度日的也都要受逼迫」——沒有受逼迫是不夠敬虔嗎？甚麼不算逼迫？","r":"3:10--12；徒 14:19；彼前 2:20；彼前 4:15--16；太 10:23","ch":[3],"why":"這一節在兩個方向上都被誤用：有人用它懷疑自己「日子太平安，是不是不夠敬虔」，甚至故意製造衝突；也有人把一切不順、被批評、家庭衝突，甚至被家暴，都叫作「為主受逼迫」，結果不肯檢討，或被勸留在危險中。這一題直接關係到會眾的心理健康與人身安全，必須講清楚。","pos":[["【一】經文問的是甚麼","","<p>「不但如此，凡立志在基督耶穌裡敬虔度日的也都要受逼迫。」（3:12）διωχθήσονται（diōchthēsontai）是將來式被動：逼迫會臨到，不是叫人去找。主語有嚴格的限定：θέλοντες（thelontes）立志、εὐσεβῶς（eusebōs）敬虔地、ἐν Χριστῷ Ἰησοῦ（en Christō Iēsou）在基督耶穌裡。前一節保羅剛說「主都把我救出來了」（3:11）。問題是：「都要」是每一個人必經的指標嗎？甚麼樣的苦才算這裡的逼迫？</p>"],["普遍指標說：真信徒必然經歷外在的逼迫","","<p>有些傳道人從「凡……也都要」推論：每一個真正敬虔的人都一定會經歷明顯的逼迫；若一個人的信仰生活從來沒有代價，可能是他的敬虔還不夠真。這一說提醒舒適環境裡的信徒：福音本來就與世界衝突，信仰不是保險。</p><p><strong>難處：</strong>這一說把一個陳述句當成了量尺，結果讓平安的人自疑、好鬥的人自義；保羅自己也說「若是能行，總要盡力與眾人和睦」（羅 12:18），逼迫是忠心的副產品，不是要追求的勳章。</p>"],["廣義逼迫說：逼迫的形式與強度因時因地而不同","","<p>多數解經家認為，3:12 說的是一個必然的趨勢：在基督裡敬虔地活，必然與世界的方向衝突，但表現的形式差別很大——有人坐牢、殉道，有人被嘲笑、被排擠、升遷受阻、在家族裡被誤會。這一說能讓不同處境的信徒都在經文裡找到自己，也不要求每個人的苦都一樣重。</p><p><strong>難處：</strong>這一說若沒有界線，「逼迫」會被擴大到一切不舒服的經驗；被批評可能是因為自己真的錯了，彼得說「你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？」（彼前 2:20）。</p>"],["條件分辨說：先看條件，再看是不是逼迫","","<p>也有解經家把重點放在 3:12 的條件上：只有因為「在基督耶穌裡敬虔度日」而來的苦，才是這裡說的逼迫。因自己的錯、因性格衝突、因不智的作法而來的苦，不是逼迫；被家人虐待、被配偶施暴，也不是十字架，而是需要被制止的罪。這一說能防止人用屬靈語言包裝自己的問題，也保護受害者。</p><p><strong>難處：</strong>現實中動機往往混雜，一件事可能同時有信仰的因素和自己的錯；條件分辨需要智慧和群體的陪伴，不能變成一張只讓人自我懷疑的檢查表。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採廣義逼迫說，並加上條件分辨：3:12 是陳述，不是命令；它說忠心的人不要以為受苦就是走錯了路，但不是一切的苦都叫為主受苦，也不是沒有受逼迫就不夠敬虔。</strong></p><p>保羅在 3:11 是被「救出來」的，也曾經逃離（徒 9:25；14:6）；主說「有人在這城裡逼迫你們，就逃到那城裡去」（太 10:23）。人身安全受威脅時，先保護生命、依法求助，這和忠心一點都不衝突。本講義的全卷立場見 ISS00_2；受苦的四種分辨回指彼得前書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：福音與世界的方向不同，跟從主會有代價；主也會把人從苦難中救出來。爭的只是逼迫的範圍與量法。</p><p>如果你正在為主受苦，不要以為自己被神忘了，你正走在主走過的路上；如果你的日子平安，也不必懷疑自己，感謝神，好好在基督裡活；如果你正在受傷害，那不是你該背的十字架——請找人幫忙。</p>"]],"con":[],"say":"本講義的立場：3:12 是陳述不是命令，條件是「在基督耶穌裡敬虔度日」；不是一切的苦都叫為主受苦，沒有受逼迫也不等於不夠敬虔，被虐待更不是十字架。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有正在家中受暴力或威脅、卻被勸「這是你的十字架」的人；也可能有因信主被家族排擠、真的在受苦的人；還有一直懷疑自己「太平安是不是不屬靈」的人。不要在講台上說「被打也要忍」。陪受害者確認安全、聯絡專業與法律的幫助；陪真正為主受苦的人，讓他知道主會救他出來，教會也會站在他旁邊。"},{"id":"ISS03_7","t":"3:15「從小明白聖經」——兒童的信仰教育與主日學該怎麼看？","r":"3:14--15；1:5；申 6:7；弗 6:4；徒 16:1","ch":[3],"why":"提摩太「從小明白聖經」，常被用來推動兒童主日學、家庭祭壇、親子讀經；這是美好的。可是同一節也常讓第一代信徒覺得自己「起跑就輸了」，讓兒女不信主的父母自責「是我沒教好」，也引出一個今天常聽到的問題：從小教孩子信仰，算不算灌輸？這一題關係到教會怎樣看待家庭、兒童與信仰的傳承。","pos":[["【一】經文問的是甚麼","","<p>「並且知道你是從小明白聖經，這聖經能使你因信基督耶穌，有得救的智慧。」（3:15）ἀπὸ βρέφους（apo brephous）的 βρέφος 是吃奶的嬰孩；3:14 的「跟誰學的」τίνων（tinōn）是複數，最自然的讀法是外祖母羅以、母親友妮基（1:5），和屬靈父親保羅。問題是：兒童的信仰教育由誰負責？從小教導與孩子自己的信心是甚麼關係？沒有這樣背景的人，又該怎樣看自己？</p>"],["家庭主責說：父母是孩子信仰的第一位老師","","<p>許多改革宗與福音派傳統強調，神把教導兒女的責任首先交給家庭：「也要殷勤教訓你的兒女。無論你坐在家裡，行在路上，躺下，起來，都要談論」（申 6:7）；「只要照著主的教訓和警戒養育他們」（弗 6:4）。主日學是幫助，不能代替家庭。提摩太的外祖母和母親正是這樣的榜樣。</p><p><strong>難處：</strong>這一說若講得太絕對，會讓單親、跨信仰婚姻、父母還沒信主的孩子無處安放；提摩太的父親是希臘人（徒 16:1），他的家本來就不完整。也容易讓兒女離開信仰的父母，把一切都算在自己頭上。</p>"],["教會群體說：信仰的傳承是整個屬靈家庭的責任","","<p>另一些人強調 τίνων 是複數：提摩太的信仰不只從家裡來，也從保羅、從路司得和以哥念的弟兄們（徒 16:2）來。所以主日學、兒童事工、屬靈父母的陪伴，不是家庭的替代品，而是神的家一起承擔的責任；對沒有信主父母的孩子，教會更是他們的家。</p><p><strong>難處：</strong>這一說若變成「交給主日學就好」，父母會把信仰教育外包出去，孩子一星期在教會一小時，其餘時間在家裡看不見信仰怎樣活；群體不能取代家裡日常的身教。</p>"],["自主選擇說：不應從小灌輸，等孩子長大自己選","","<p>今天也有人認為，從小教孩子聖經是一種灌輸，應該讓孩子長大後在各種信仰中自己選擇。這一說注意到一個真實的危險：用恐嚇、羞辱或強迫的方式教信仰，確實會傷害孩子，也常讓孩子長大後遠離信仰。</p><p><strong>難處：</strong>沒有一個家庭是價值中立的，不教也是一種教；而且 3:15 說聖經的目的是「因信基督耶穌」得救——信心本來就不能被強迫，從小明白聖經是給孩子一張地圖，不是替他走路。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的讀法是：家庭與教會一起承擔兒童的信仰教育，家庭是第一個場所，屬靈家庭同樣真實；家庭信仰是祝福，不是得救的條件——每一個人都是自己「因信基督耶穌」得救的。</strong></p><p>本講義不用 3:15 讓沒有基督徒家庭的人覺得次等，也不讓兒女不信主的父母自責；教導的方式是溫柔的、活出來的，不是恐嚇的。傳承與屬靈父母兒女，本講義的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：孩子需要有人帶他認識聖經，信心最後是神在人心裡的工作。爭的是責任怎樣分配、方法怎樣拿捏。</p><p>如果你是家裡第一代信主的人，你不是次等的：你可以成為你家的「羅以」。如果你的兒女還沒有信主，你的禱告沒有白費；信心不是父母可以替兒女決定的，但神可以繼續在他心裡工作。</p>"]],"con":[],"say":"本講義的立場：家庭與教會一起承擔兒童的信仰教育，從小明白聖經是祝福，不是得救的條件；第一代信徒不是次等，兒女不信主的父母不必自責。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有家裡只有他一個人信主的弟兄姊妹，聽到「從小明白聖經」就覺得自己缺了一塊；也可能有兒女離開教會、夜裡偷偷流淚的父母；還有在信仰家庭裡被強迫、被恐嚇長大而受傷的成年人。不要用這一節比較誰的根基深。陪第一代信徒找到屬靈的家人，陪父母繼續禱告，也陪受過傷的人重新認識溫柔的神。"},{"id":"ISS03_8","t":"3:16「聖經都是神所默示的」——無誤論、有限無誤論；翻譯本也是默示的嗎？","r":"3:16；彼後 1:21；約 10:35","ch":[3],"why":"3:16 是基督教聖經論最核心的經文。教會之間對「默示」與「無誤」的細部定義有不同說法，有人以此作為分辨真假信徒的標準；也有華人教會只承認某一個譯本才是「神的話」。這一題關係到會眾怎樣尊重聖經，也關係到教會會不會因為定義之爭而分裂。","pos":[["【一】經文問的是甚麼","","<p>「聖經都是神所默示的」（3:16）。θεόπνευστος（theopneustos）新約只此一次，字面是「神所呼出的」。這一節沒有動詞，所以有兩種文法讀法：和合本讀作「聖經都是神所默示的，〔也〕都是有益的」，和合本註腳作「或譯：凡神所默示的聖經」。問題是：默示保證了甚麼？保證到多細？翻譯出來的聖經也算神所默示的嗎？</p>"],["全然無誤說：原稿在所肯定的一切事上都沒有錯誤","","<p>許多福音派學者（如 1978 年《芝加哥聖經無誤宣言》）認為，既然聖經是神所呼出的，而神不能說謊，那麼原稿在它所肯定的一切事上，包括歷史與自然的陳述，都沒有錯誤；主耶穌也說「經上的話是不能廢的」（約 10:35）。這一說的長處是對聖經權威有清楚而一致的委身，也保護教會不隨意挑揀經文。</p><p><strong>難處：</strong>這一說需要大量的定義與限定（只限原稿、按作者意圖與文體解讀、允許約數與現象語言），對一般會眾來說不容易掌握；而且原稿今天已不存在，這一說也必須依靠經文鑑別學來支持。</p>"],["有限無誤說：聖經在信仰與生活上完全可靠","","<p>另一些福音派學者認為，聖經的目的是「使你因信基督耶穌，有得救的智慧」（3:15），並「叫屬神的人得以完全」（3:17），所以聖經在救恩、信仰與生活的教導上完全無誤、完全有權威；至於附帶的歷史、科學細節，則按當時的表達方式理解。這一說看重 3:15--17 自己說出的目的，也試圖回應經文中難解的細節。</p><p><strong>難處：</strong>這一說很難劃清「信仰教導」與「附帶細節」的界線，因為聖經的信仰正是建立在歷史事件上，例如基督的復活；界線一旦交給讀者自己畫，聖經權威可能逐漸被削弱。</p>"],["譯本默示說：某一個譯本也是神特別默示的","","<p>有些群體認為某一個譯本（英語世界的欽定本、華人教會的和合本）有特別的地位，甚至主張只有它才是完全的神的話。這一說出自對神話語的尊重與對信仰群體的忠誠，也真實反映了一個譯本在幾代人心中的分量。</p><p><strong>難處：</strong>默示指的是神藉著原作者所呼出的話；保羅和提摩太讀的舊約多半是希臘文譯本，他們並沒有因此說只有某一個譯本才算數。把譯本絕對化，會讓用其他語言、其他譯本讀經的弟兄姊妹覺得自己手上的不是真聖經。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在福音派對聖經權威的共同立場：聖經是神所呼出的，是信仰與生活最終的權威；不在本卷裁判無誤論的細部定義，不拿這個分歧作分門的標準。兩種文法讀法都承認聖經出於神。</strong></p><p>翻譯本忠實地傳達了神的話，所以有權威，但每一個譯本都可以被原文校正；本講義講台照和合本，原文照 SBLGNT。默示的目的是 3:17「叫屬神的人得以完全」。本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：聖經出於神、有權威、能使人得救、能把人扶正；爭的是「無誤」這個詞要定義到多細，以及譯本的地位。</p><p>你不必先解決所有的定義，才能聽神說話。主耶穌復活以後「開他們的心竅，使他們能明白聖經」（路 24:45）——今天你打開手上那一本，同一位主仍然在說話。</p>"]],"con":[],"say":"本講義的立場：聖經是神所呼出的，是信仰與生活最終的權威；本講義站在福音派的共同立場，不裁判無誤論的細部定義，也不拿它分門；忠實的譯本有權威，並可被原文校正。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有讀到聖經難解之處、正在懷疑的大學生，也可能有因為用了另一個譯本而被批評的弟兄姊妹，還有曾經在教會的聖經論爭吵中受傷而離開的人。不要給疑問貼上「信心不夠」的標籤，也不要拿定義去拷問人。陪他們從 3:17 開始：先讓這本書扶正自己，再慢慢處理困難的問題。"},{"id":"ISS03_9","t":"3:16「聖經」指甚麼？只有舊約，還是也包括新約？","r":"3:15--17；彼後 3:16；提前 5:18；路 10:7","ch":[3],"why":"提摩太「從小明白」的聖經，顯然是舊約；那麼 3:16 能不能用來說新約也是神所默示的？有人據此說新約的權威沒有經文根據；也有人在講台上直接把 3:16 套在整本六十六卷上，沒有交代中間的推理。這一題關係到教會對新約權威的信心，也關係到我們引用經文時的誠實。","pos":[["【一】經文問的是甚麼","","<p>「並且知道你是從小明白聖經」（3:15）用的是 ἱερὰ γράμματα（hiera grammata）「神聖的文字」；3:16 用的是 πᾶσα γραφὴ（pasa graphē）「一切的經文」。提摩太從嬰孩時所讀的，只可能是舊約。問題是：保羅說「聖經都是神所默示的」時，他的視野只限於舊約，還是已經包括了正在形成的新約文字？</p>"],["嚴格舊約說：3:16 只指舊約","","<p>有些解經家認為，從上下文看，3:15 的「聖經」就是舊約，3:16 接著說的也是同一批經文；保羅寫這封信時，新約大部分書卷還沒有被收集成冊，更不可能被稱為「聖經」。這一說的長處是忠於歷史處境，不把後來的正典觀念讀進保羅的話裡。</p><p><strong>難處：</strong>這一說若停在這裡，會讓人以為新約的權威在新約裡沒有根據；而且它忽略了 πᾶσα γραφὴ 的用語比 3:15 的 ἱερὰ γράμματα 更寬，保羅可能有意說得更廣。</p>"],["已含新約說：保羅的時代已經把部分新約文字視為「經」","","<p>另一些解經家指出，提前 5:18 說「因為經上說」，把申命記和主耶穌的話「工人得工價是應當的」（路 10:7）並列；彼得把保羅的信和「別的經書」並列（彼後 3:16）。可見在使徒時代，主的話和使徒的著作已經被視為與舊約同等的「經」。所以 3:16 的「一切經文」可以包括當時已經存在的部分新約文字。</p><p><strong>難處：</strong>提前 5:18 引的話，也可能是引自口傳的主的話，而不是已經成書的路加福音；從這兩處推到 3:16 的直接所指，仍然是推論，不能說得太滿。</p>"],["原則延伸說：原意是舊約，原則涵蓋整本正典","","<p>也有解經家採取兩層的讀法：3:16 的直接所指是提摩太手上的舊約；但保羅說的是「凡」神所呼出的經文都有益，而新約自己已經把使徒的著作與「別的經書」並列，所以這個原則自然延伸到教會後來承認的新約正典。這一說同時誠實面對歷史處境，也保住新約的權威。</p><p><strong>難處：</strong>這一說需要另外處理正典形成的歷史，不能只靠 3:16 一節；講台上若省略中間的推理，直接說「3:16 證明了六十六卷都是默示的」，就跳過了一步。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採原則延伸說：3:16 的直接上下文是提摩太從小明白的舊約（3:15）；新約自己已經把使徒的書信與「別的經書」並列（彼後 3:16），所以「凡神所呼出的經文都有益」的原則，涵蓋整本正典。</strong></p><p>本講義在講台上誠實地交代這兩步，不把 3:16 當成一節就解決正典問題的證據。聖經的默示與權威，本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：舊約是神所默示的，新約在使徒時代就被看為有同樣的權威，教會歷代也承認這兩部分。爭的只是 3:16 這一節直接指到哪裡。</p><p>更奇妙的是：保羅說這些話時，他自己正在寫的這封信，後來也成了你手上的聖經。一個在牢裡等死的人留下的最後幾頁，今天仍然在扶正讀它的人——這本書比寫它的人活得更長。</p>"]],"con":[],"say":"本講義的立場：3:16 的直接所指是提摩太從小明白的舊約，新約自己已把使徒的書信與別的經書並列，所以神所呼出的經文都有益這個原則涵蓋整本正典；講台上要交代這兩步。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有在網路上讀到「新約是後來教會投票決定的」而不安的年輕人，也可能有長期只讀新約、覺得舊約與自己無關的弟兄姊妹。不要用一句「3:16 說的」把問題壓下去。陪疑問的人看見正典的歷史並不可怕，也陪只讀新約的人回到提摩太從小讀的那一部分，那裡同樣指著基督。"},{"id":"ISS04_1","t":"4:1「將來審判活人死人」——基督徒也要受審判嗎？","r":"4:1；4:8；林後 5:10；羅 8:1；約 5:24","ch":[4],"why":"保羅在最後一封信裡，用「將來審判活人死人」的主作囑咐的見證人。會眾常常在這裡卡住：既然「在基督耶穌裡的就不定罪了」，為甚麼又說「我們眾人必要在基督臺前顯露出來」？有人因此一輩子活在怕被審判的焦慮裡，也有人把審判看成與自己無關的事。這一題關乎救恩的確據，也關乎今天怎樣活。","pos":[["【一】經文問的是甚麼","","<p>4:1 保羅「在神面前，並在將來審判活人死人的基督耶穌面前」囑咐提摩太；「審判活人死人」原文 κρίνειν ζῶντας καὶ νεκρούς，是早期教會認信的語言。4:8 他又說「按著公義審判的主到了那日要賜給我」冠冕——同一位審判者，在保羅身上要做的是賜冠冕。問題是：信徒也要站在這位審判者面前嗎？如果要，審的是甚麼——救恩，還是工作？這和「不至於定罪，是已經出死入生了」（約 5:24）怎樣同時成立？</p>"],["一場審判說：所有人同站在最後的審判裡，信徒在其中被宣告無罪","","<p>許多改革宗與歷史教會的讀法：聖經說到末日只有一場普世的審判，信徒與不信的人同站在基督面前；信徒在那裡被公開宣告無罪，他的行為作為真信心的果子被顯明出來（林後 5:10「或善或惡受報」）。這一說看重審判的公開與公義，也提醒信徒：恩典不是放縱的理由。</p><p><strong>難處：</strong>若講台只講「我們都要受審」，不同時講「如今，那些在基督耶穌裡的就不定罪了」（羅 8:1），敏感的信徒很容易把審判聽成考試，活在得救的焦慮裡；而且「行為顯明信心」的分寸，若拿捏不好，會滑向靠行為得救。</p>"],["兩種審判說：基督臺前只論賞賜，不論救恩","","<p>許多福音派與時代論的讀法：信徒的救恩問題已經在十字架上解決，信徒要站的「基督臺前」只是交帳與領賞的地方，審的是工作，不是身分；不信的人另有一場定罪的審判。4:8 保羅期待的正是領取冠冕的那一天。這一說把確據講得很清楚，也讓信徒能「愛慕他顯現」，而不是害怕他顯現。</p><p><strong>難處：</strong>經文是否把審判的場次、時程分得這麼細，各家看法不一，常常牽涉整套末世時序；而且若把基督臺前講成只是「領獎典禮」，容易把審判看輕，好像怎麼活都不太要緊，這也不是林後 5:10 的語氣。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：信徒要站在基督面前交帳，這是真的；但信徒不會被定罪，這也是真的。</strong>審判的場次與時序，本講義不在本章裁判，兩說都承認同一件事：救恩的根基是基督，不是我們的表現；交帳是真實的，所以今天的生活有重量。</p><p>對本章最要緊的，是那位審判者是誰：4:8 稱他為「按著公義審判的主」，他要做的是「賜」。保羅能「愛慕他顯現」，是因為那位審判者就是為他死、在法庭上站在他旁邊的主（4:17）。救恩確據的全卷立場見 ISS00_3；主再來回指帖撒羅尼迦前書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該動搖你的確據，卻可以改變你的方向。你若在基督裡，審判你的那一位，正是替你受審的那一位；你不必害怕他顯現，可以像 4:8 說的「愛慕他顯現」。</p><p>你若發現自己一想到審判就喘不過氣，那不是更屬靈，而是需要重新聽一次福音；你若發現自己從來不想這件事，也許可以問：如果他今天顯現，我最想給他看的是甚麼？爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：信徒要站在基督面前交帳，卻不會被定罪；審判的場次與時序各家並陳，本章不裁判。那位審判者，就是在法庭上站在保羅旁邊的主。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有從小被「審判」嚇大的人，有強迫性地懷疑自己有沒有得救的人，也有剛失去家人、擔心親人結局的人。不要用審判製造恐懼，也不要說「反正都得救了，怎麼活都可以」。先讓他聽見羅 8:1，再陪他讀 4:8 的「賜」；若他的焦慮已經影響睡眠與生活，陪他尋求輔導與醫療的協助。"},{"id":"ISS04_2","t":"4:2「無論得時不得時」——傳福音可以不顧場合、不顧關係嗎？","r":"4:2；2:24--25；西 4:6；彼前 3:15","ch":[4],"why":"「無論得時不得時」常被拿來支持一種傳福音的方式：在喪禮上逼人決志、在家族聚會上當眾責備、在職場上不看對象地宣講。另一面，也有人以「時機不對」為理由，一輩子沒有開口。這一題要把經文的分寸找回來，讓膽怯的人敢開口，讓衝動的人學會溫柔。","pos":[["【一】經文問的是甚麼","","<p>4:2「務要傳道，無論得時不得時，總要專心」，原文 κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως：「傳道」是傳令官宣讀王命的字，「得時不得時」是兩個字根相同、意思相反的副詞並排——方便的時候、不方便的時候。同一節接著說要用「百般的忍耐、各樣的教訓」；同一封信也說「主的僕人不可爭競，只要溫溫和和地待眾人」（2:24）。問題是：「不得時」是指不管對方的處境，還是指不管自己方不方便？</p>"],["勇敢宣講說：真理不等人，任何場合都要說","","<p>這一說看重 4:2 的急迫：時候要到，人要厭煩純正的道理（4:3），所以傳道的人不能等氣氛好才開口。它提醒我們，福音本身就會冒犯人，不能因為怕得罪人就永遠不說；許多人信主，正是因為有人在不方便的時候仍然開口。這一說對太習慣沉默的信徒，是一記真實的提醒。</p><p><strong>難處：</strong>若把「不得時」解成不必顧場合、不必顧關係，就違背了同一節的「百般的忍耐」與 2:24 的溫和；在別人最脆弱的時刻強行宣講，常常讓人記住的不是福音，而是被冒犯的感覺，甚至把人推得更遠。</p>"],["關係優先說：先活出見證，等對方問了再說","","<p>這一說看重關係與生活的見證：「有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人」（彼前 3:15）。它主張先建立信任，在對方願意聽的時候才談信仰，認為這樣的福音更能被聽見，也更尊重人。這一說保護了許多華人家庭的關係，也讓信徒的生活和言語一致。</p><p><strong>難處：</strong>若「等時機」變成永遠不開口，4:2 的「不得時」就被取消了；有些人一輩子等不到「對方先問」，有些機會過了就不再來（保羅自己寫「在冬天以前」）。關係很重要，但關係不能成為不忠心的理由。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：「無論得時不得時」是不看氣氛決定忠心，不是不看人決定方式。</strong>忠心不因為自己方不方便而改變，方式卻要看對方的處境：喪禮上先陪伴，婚宴上先祝福，病床邊先禱告；該開口的時候，用「百般的忍耐」與「溫溫和和」開口。</p><p>4:2 首先是對牧者的講台說的——講台不能因為會眾愛聽甚麼就改講甚麼；應用到個人談道，就是不因為怕尷尬而永遠不說，也不因為急著傳而傷了人。爭議與信心的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你是一個很怕開口的人，你不必因此覺得自己是不及格的基督徒；4:17 說「惟有主站在我旁邊，加給我力量，使福音被我盡都傳明」，傳明福音的力量是主加給的，不是你天生的膽量。</p><p>如果你曾經在不合適的場合傷了人，也不必一直自責；可以回去道歉，再用溫柔重新開始。福音不是一場一次定輸贏的辯論，是一位主長長的等待。</p>"]],"con":[],"say":"本講義的立場：「無論得時不得時」是不看氣氛決定忠心，不是不看人決定方式；該說的要說，用百般的忍耐與溫柔說。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有家人曾在喪禮或家族聚會上被基督徒「強迫傳福音」而受傷、至今對信仰反感的人，也有因為不敢開口而覺得自己很失敗的人。不要說「你不傳就是不愛主」，也不要把粗魯說成勇敢；陪膽怯的人從一句簡單的見證開始，陪衝動的人學習先聽、先陪伴。"},{"id":"ISS04_3","t":"4:3--4「耳朵發癢……增添好些師傅」——網路講員、屬靈消費主義與講台，怎樣分辨？","r":"4:3--4；3:1--5；徒 17:11","ch":[4],"why":"今天的信徒可以在一個晚上聽十位不同講員的信息，挑自己喜歡的、跳過不想聽的。4:3--4 很容易被拿來批評某些網路講員、某種神學或某個世代，講台也很容易借此攻擊別的教會。可是保羅描述的，首先是聽的人的心。這一題要分辨：甚麼是健康的多元學習，甚麼是耳朵發癢。","pos":[["【一】經文問的是甚麼","","<p>4:3「人必厭煩純正的道理，耳朵發癢，就隨從自己的情慾增添好些師傅」；「耳朵發癢」原文 κνηθόμενοι，新約只此一次，是搔癢、想被搔的意思。主詞是聽的人：他們不是不聽道，而是很愛聽，只是按著「自己的情慾」挑選、堆積師傅，最後「掩耳不聽真道，偏向荒渺的言語」（4:4）。問題是：這是對某一個時代的預言，還是每個時代人心的寫照？今天怎樣分辨？</p>"],["時代診斷說：4:3 說的正是今天的網路講員與成功神學","","<p>這一說認為 4:3 的「時候要到」在今天特別明顯：演算法只推送你愛聽的，成功神學、心靈雞湯式的講道大行其道，信徒像逛商場一樣挑講員。它提醒講台不可為了流量迎合聽眾，也提醒信徒要有分辨的能力。這一說確實看見了媒體環境帶來的新試探。</p><p><strong>難處：</strong>一旦把 4:3 指認成某一位講員、某一間教會、某一種神學或某一個世代，就跨過了鐵律四：經文成了攻擊別人的武器，而且講這話的人自己也在一個平台上說話。保羅沒有叫提摩太點名誰的耳朵在癢，他說的是「你卻要凡事謹慎」（4:5）。</p>"],["人心常態說：每個世代都有發癢的耳朵，先照自己","","<p>這一說認為 4:3 描述的是人心的常態：從以色列人要先知「說柔和的話」，到哥林多教會「我是屬保羅的、我是屬亞波羅的」，每個時代都有人按喜好挑師傅。所以這面鏡子要先照自己：我聽道，是為了被改變，還是為了被搔到癢處？這一說保護講台不變成審判台，也把責任放回每個聽道的人身上。</p><p><strong>難處：</strong>若只說「每個時代都一樣」，可能讓人不再分辨，好像甚麼教導都只是口味不同；4:3 明明說到「純正的道理」與「荒渺的言語」的分別，分辨是必要的，只是對準的是內容，不是貼在人身上。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：4:3--4 先是一面鏡子，再是一把尺。</strong>鏡子先照聽道的自己：我會不會只挑舒服的聽？尺用來量內容，不用來貼人：一篇信息是否把人帶回基督與聖經的全貌，是否只講祝福不講悔改，是否把講員放在主的前面。</p><p>本講義不把 4:3 貼在任何講員、教會、宗派、世代或政治立場上；網路上的好信息是恩典，可以像庇哩亞人那樣「天天考查聖經」（徒 17:11）。純正道理與聖經權威的全卷立場見 ISS00_4；末世的時序回指帖撒羅尼迦前書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聽很多講員不是罪，在網路上找到餵養你的信息也不是罪；要問的是，你聽完之後，是更像基督，還是更會挑剔。</p><p>如果你發現自己越聽越多、越來越不願意在一間教會裡被認識、被提醒，也許可以試著少聽一點、多讀一點經，回到一個可以彼此相愛、彼此勸戒的群體。主說話，常常不是透過最好聽的那一位，而是透過那一句你最不想聽的。</p>"]],"con":[],"say":"本講義的立場：4:3--4 先照自己，再量內容，不貼在任何講員、教會或世代身上；分辨看的是信息是否把人帶回基督與聖經。本講義的全卷立場見 ISS00_4。","care":"會眾席上有靠網路講道度過低谷、甚至因此信主的人，也有被某位網路講員誤導、正在混亂中的人，還有在本地教會受過傷、只敢在線上聽道的人。不要嘲笑他們「耳朵發癢」，也不要在講台上點名任何講員。先聽他為甚麼離不開那些信息，再陪他回到經文本身，慢慢找到一個可以被認識、被看顧的群體。"},{"id":"ISS04_4","t":"4:5「做傳道的工夫」——傳福音是少數人的恩賜，還是每個人的責任？","r":"4:5；弗 4:11；徒 21:8；彼前 3:15","ch":[4],"why":"教會裡常聽到兩種聲音：「我沒有傳福音的恩賜，交給有恩賜的人吧」，以及「每個基督徒都要傳福音，不傳就是不順服」。前者讓許多人一輩子不開口，後者讓許多內向、軟弱的人背上沉重的罪疚。4:5 的「傳道的工夫」正好站在這兩種聲音中間。","pos":[["【一】經文問的是甚麼","","<p>4:5「做傳道的工夫」原文 ἔργον ποίησον εὐαγγελιστοῦ，直譯是「做傳福音者的工」；εὐαγγελιστοῦ 在新約只出現三次：徒 21:8 稱腓利為「傳福音的」，弗 4:11 列在恩賜之中，以及這裡。保羅對提摩太說這話——一位不一定以傳福音見長的牧者。問題是：傳福音是某些人的特別恩賜與職分，還是每個信徒都要做的事？如果兩者都是，怎樣分？</p>"],["恩賜職分說：傳福音的是一種特別的恩賜","","<p>這一說根據弗 4:11：神「所賜的，有使徒，有先知，有傳福音的，有牧師和教師」，傳福音的是一種被賜下的恩賜，就像腓利那樣。教會應當辨認、栽培、差派有這種恩賜的人，而不是要求每個人都做同樣的事。這一說尊重肢體的不同，也讓有傳福音恩賜的人被看見、被支持。</p><p><strong>難處：</strong>若止於「那是少數人的恩賜」，多數信徒就容易把傳福音完全外包；而且 4:5 恰恰是對提摩太說的——就算這不是你最強的恩賜，「做傳福音者的工」仍然是你的工作。</p>"],["全民皆兵說：每個信徒都是傳福音的人","","<p>這一說看重大使命是給所有門徒的，也引彼前 3:15「有人問你們心中盼望的緣由，就要常作準備」。既然每個信徒都有一位救主，就都有一個故事可以說；4:5 的命令，也可以延伸到每一個人。這一說喚醒了許多教會從觀眾變成見證人。</p><p><strong>難處：</strong>若把每個人都要求成「腓利」，用同一種方法、同一種數字衡量，內向的、軟弱的、正在病中或照顧家人的弟兄姊妹，就會覺得自己永遠不及格；福音的責任被講成績效，就失去了福音的味道。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：兩說都對一半——有人被賜下傳福音的恩賜，也每個信徒都是見證人。</strong>4:5 首先是對牧者說的：牧養不能只顧羊圈裡的，也要記得圈外的；應用到每個信徒，是「常作準備」，在自己的位置上用自己的方式為主作見證，而不是人人都做同一種事工。</p><p>教會一方面辨認、差派有傳福音恩賜的人，一方面裝備每個人說出自己的見證。一個人的見證能走多遠，也看他是否交出去、帶出下一個人——傳承的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若從來沒有帶過人信主，不代表你不屬於主；你若天生內向、說話不流利，主也不是要你變成另一個人。4:17 說福音是「被我」傳明——主可以藉著一張卡片、一頓飯、一句真誠的「我為你禱告」。</p><p>可以問自己的，不是「我有沒有那個恩賜」，而是「主放在我身邊的那一兩個人，知不知道我為甚麼盼望」。</p>"]],"con":[],"say":"本講義的立場：有人被賜下傳福音的恩賜，每個信徒也都是見證人；4:5 先對牧者說，應用到每個人是在自己的位置上常作準備。本講義的全卷立場見 ISS00_5。","care":"會眾席上有因為「沒有帶人信主」被比較、被點名而羞愧的人，也有身體軟弱、照顧家人、根本沒有餘力的人。不要用人數衡量屬靈，也不要說「你不傳福音，血要歸到你身上」來嚇人。陪他從身邊的一個人、一句見證開始，讓他知道傳明福音的力量是主加給的。"},{"id":"ISS04_5","t":"4:6「我現在被澆奠」——殉道、委身與「燃燒自己」的界線在哪裡？","r":"4:6；腓 2:17；民 28:7；2:3--4；4:13","ch":[4],"why":"「被澆奠」是全卷最動人的一個畫面，也最容易被拿來美化過勞：有人用它要求同工不休息、不顧家，有人用它把自己的燒盡說成屬靈。另一面，也有人因為害怕過勞，把一切委身與犧牲都看成不健康。這一題要把澆奠的方向找回來：倒給誰？誰來看顧那個杯？","pos":[["【一】經文問的是甚麼","","<p>4:6「我現在被澆奠，我離世的時候到了」；σπένδομαι 是獻奠祭的字，這使我們想起民 28:7 每日燔祭要加上的奠祭，也想起保羅在腓 2:17 說「我若被澆奠在其上，也是喜樂」。ἀναλύσεώς 是「解纜、拔營」。保羅說的是自己即將殉道。問題是：這一節可以延伸成一般信徒的委身嗎？如果可以，委身與過勞、犧牲與被剝削的界線在哪裡？</p>"],["全然擺上說：澆奠是委身的最高樣式，今天的人太愛惜自己","","<p>這一說看重奠祭「一滴不留」的畫面：保羅把一生倒在祭壇上，基督徒的委身也不該打折扣。它提醒一個太講求舒適、太保護自己的世代：跟隨基督本來就有代價，許多宣教士與殉道者正是這樣把自己倒出來，福音才傳到我們這裡。這一說對溫吞的信仰是一個真實的挑戰。</p><p><strong>難處：</strong>4:6 是一位將被處死的使徒對自己處境的描述，不是給教會排班的原則；若用它要求同工不休息、不顧家，就把「倒給主」偷換成「倒給事工」，甚至倒給某一位領袖的期望。保羅自己在同一章要外衣、要書、要同伴（4:11--13）。</p>"],["自我照顧說：先照顧好自己，才能長久服事","","<p>這一說看重身心的界線：耶穌也叫門徒「同我暗暗地到曠野地方去歇一歇」（可 6:31），保羅把生病的特羅非摩留下休養（4:20）。過勞會毀掉身體、婚姻與信仰，許多傳道人倒下不是因為逼迫，而是因為沒有人叫他停。這一說保護了許多瀕臨燒盡的人。</p><p><strong>難處：</strong>若「照顧自己」變成最高原則，任何代價都被看成不健康，就讀不懂保羅與歷代為主受苦的人；有些擺上本來就會痛，有些呼召本來就有風險。界線是為了走得長，不是為了不走。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：澆奠是把自己倒給主，不是讓人把你榨乾。</strong>倒給主的人，主會看顧那個杯子；所以真正的委身裡有休息、有家人、有醫生、有同伴，這些不是委身打折，而是保羅自己活出來的樣子。</p><p>分辨的問題有三個：我是倒給主，還是倒給人的期待與自己的成就感？這份擺上是「同」受的（有團隊、有輪替），還是一個人扛？我的家人是一起獻上，還是被迫犧牲？受苦與「為主受苦」界線的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你已經累到不想再信，請先聽這一句：你的疲憊不是信心失敗，停下來也不是背叛主。那位叫門徒去歇一歇的主，今天也這樣對你說。</p><p>如果你是一位很怕付代價的人，也可以誠實地問：主有沒有在某一件事上，邀請我倒出一點點？澆奠不是從殉道開始的，常常從今天一件不被看見的小事開始。</p>"]],"con":[],"say":"本講義的立場：澆奠是把自己倒給主，不是讓人把你榨乾；真正的委身裡有休息、有家人、有同伴。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有已經燒盡、卻不敢說的傳道人與同工，有為了配偶的「事奉」長期獨自撐家的人，也有因病退下、覺得自己不再有用的人。不要說「為主累死是光榮」「休息就是不夠愛主」；陪他們分辨倒給誰，必要時協助安排休假、輪替與專業的身心協助，也記得問候他們的家人。"},{"id":"ISS04_6","t":"4:8「公義的冠冕」——天上的賞賜有等級嗎？","r":"4:7--8；林前 3:12--15；林前 9:25；啟 4:10","ch":[4],"why":"「天上的冠冕有大小嗎？」是會眾常問、也常被誤用的題目：有人用它激勵事奉，有人用它比較屬靈，也有人因此覺得自己「頂多只能得救，沒有冠冕」。4:8 偏偏說這冠冕「也賜給凡愛慕他顯現的人」。這一題要讓人看見賞賜的盼望，卻不讓它變成天上的排行榜。","pos":[["【一】經文問的是甚麼","","<p>4:8「有公義的冠冕為我存留，就是按著公義審判的主到了那日要賜給我的；不但賜給我，也賜給凡愛慕他顯現的人」。στέφανος 是競賽得勝者頭上的花冠，不是王冠；「公義的冠冕」可以讀成「因公義而得的冠冕」，也可以讀成「冠冕就是公義本身」。問題是：新約說到的各種冠冕與賞賜，是給不同信徒不同等級的獎賞，還是描述同一份救恩的完成？</p>"],["賞賜等級說：天上有不同的賞賜，按忠心分配","","<p>這一說根據林前 3:12--15：各人的工程要被火試驗，存得住的要得賞賜，被燒了的要受虧損，自己卻要得救；加上主的比喻裡有「管五座城」「管十座城」的分別，新約也提到不同名稱的冠冕。這一說讓人看見今生的忠心有永恆的份量，也成為許多聖徒在苦難中堅持的動力。</p><p><strong>難處：</strong>若把賞賜講成可以計算的等級，事奉很容易變成累積點數，信徒之間也會比較誰的冠冕大；而且 4:8 強調的偏偏是同一頂冠冕「也賜給凡愛慕他顯現的人」，不是使徒專用。</p>"],["同一冠冕說：冠冕就是救恩的完成，人人同得","","<p>這一說認為「公義的冠冕」「生命的冠冕」「榮耀的冠冕」都是同一份救恩從不同角度的描述：被稱義的人最後被完全成義，就是他頭上的冠冕；4:8 把它給「凡愛慕他顯現的人」，正說明這是所有真信徒共同的盼望。這一說保護了恩典的白白，也讓默默無聞的信徒知道自己有份。</p><p><strong>難處：</strong>若把一切賞賜都收成「得救」，林前 3 的「得賞賜」與「受虧損」就不容易解釋；主的比喻確實說到不同的託付與不同的交帳，完全抹平也可能讓人覺得今生怎樣活都一樣。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：今生的忠心在永恆裡有份量，這是真的；但 4:8 的冠冕是給「凡愛慕他顯現的人」，不是業績排行。</strong>賞賜的細節，本講義不在本章裁判；可以確定的是，賞賜的標準是忠心，不是規模，賜冠冕的是「按著公義審判的主」，不是人的掌聲。</p><p>啟 4:10 那二十四位長老「又把他們的冠冕放在寶座前」——冠冕最後的去處，是放回主的腳前。成功神學的全卷回指見希伯來書立場四；爭議與信心的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若一生在小地方默默服事，4:8 那一句「也賜給凡愛慕他顯現的人」就是寫給你的；主不是問你比隔壁跑得快不快，而是問你愛不愛他的顯現、你那一段有沒有跑完。</p><p>你若發現自己事奉的動力越來越像在累積點數，也可以回到 4:18 保羅最後的一句：「願榮耀歸給他」。冠冕的意義，不在戴多大，在於放到誰的腳前。</p>"]],"con":[],"say":"本講義的立場：今生的忠心在永恆裡有份量，但 4:8 的冠冕賜給凡愛慕主顯現的人，標準是忠心不是規模；賞賜的細節不在本章裁判。本講義的全卷立場見 ISS00_9；成功神學回指希伯來書立場四。","care":"會眾席上有因為事奉不起眼而覺得自己在天上「沒有份」的長輩，也有被用「冠冕」激勵到過勞的同工，還有從小被比較、在天國也怕被比較的人。不要在講台上排名冠冕大小，也不要用冠冕作為多奉獻、多擺上的籌碼；陪他們看見那頂花冠是為愛慕主的人存留的。"},{"id":"ISS04_7","t":"4:10「底馬貪愛現今的世界」——怎樣看待離開事奉、離開教會的人？","r":"4:9--10；西 4:14；門 24；1:15","ch":[4],"why":"幾乎每一間教會都有「底馬」：一起開始的同工忽然不來了，小組長辭職了，一個家庭轉去別的教會。講台很容易用 4:10 給他們定性，會友也很容易私下論斷。可是經文對底馬說得很少，保羅對眾人的離棄卻說「但願這罪不歸與他們」。這一題關乎我們怎樣對待離開的人，也關乎離開過的人能不能回來。","pos":[["【一】經文問的是甚麼","","<p>4:10「因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」；ἀγαπήσας τὸν νῦν αἰῶνα（貪愛現今的世界）的「愛」字，與 4:8「凡愛慕他顯現的」ἠγαπηκόσι 是同一個字——兩種愛、兩個方向。底馬曾是同工：「所親愛的醫生路加和底馬問你們安」（西 4:14），門 24 也把他列在同工裡。問題是：底馬是離棄了信仰，還是離開了艱難的事奉與坐牢的保羅？我們可以從這一節判斷他的結局嗎？</p>"],["背道說：底馬離開的是信仰本身","","<p>這一說看重「貪愛現今的世界」的份量：新約多次把愛世界與愛神對立，底馬的離開不只是換工作，而是心轉向了今生；他和 1:15 亞細亞離棄保羅的人、2:17--18 偏離真道的人，同屬本卷「離棄」的那一條線。這一說嚴肅地提醒：曾經是同工，不等於會走到終點。</p><p><strong>難處：</strong>經文只說底馬「離棄我」，沒有說他離棄主，也沒有說他最後的結局；把他定為背道者，是在經文沉默的地方下判決，而且很容易被搬到今天任何一個離開教會的人身上。</p>"],["離開崗位說：底馬離開的是艱難的事奉與危險","","<p>這一說認為，在保羅被當作重犯關押的時候，留在他身邊是有生命危險的；底馬回到帖撒羅尼迦，可能是怕了、累了，選擇了比較安全的生活，經文沒有說他放棄信仰。這一說讓人看見軟弱與背道的不同，也給今天離開服事的人留下回來的空間。</p><p><strong>難處：</strong>若把底馬講得太輕，「貪愛現今的世界」這句嚴肅的話就被沖淡了；保羅寫下這句是帶著痛的，而且「愛」的方向確實是信仰的核心問題，不能只當成一次職涯選擇。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：經文沒有告訴我們底馬的結局，本講義不判斷；4:10 是一面鏡子，不是一張判決書。</strong>兩種愛的對照先照自己：我的心今天是愛慕他顯現，還是貪愛現今的世界？</p><p>同一張名單上，有人從「留下」走到「離開」（底馬），也有人從「被拒絕」走到「有益處」（馬可）——名單還沒有寫完。對離開的人，教會的姿態是 4:16「但願這罪不歸與他們」，並且把門開著。堅忍與救恩確據的全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你曾經是那個離開的人，請記得：保羅沒有在信裡詛咒底馬，主也沒有把你的名字從他的手中拿走。門還開著，馬可就是從那扇門回來的。</p><p>如果你是被留下的那一個，你的痛是真的；保羅也痛，所以他寫了下來。但你可以把那一份痛交給主，不必替主判決離開的人。被離棄的時候，「惟有主站在我旁邊」（4:17）。</p>"]],"con":[],"say":"本講義的立場：經文沒有說底馬的結局，本講義不判斷；4:10 先照自己的愛往哪裡去，對離開的人說「但願這罪不歸與他們」，並把門開著。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能坐著剛回來的「底馬」，也坐著被離開的人傷透的同工，還有正在想要不要離開的人。不要在講台上影射任何人，不要說「他就是貪愛世界」；先問離開的人發生了甚麼事，他可能是被傷害才走的。陪被留下的人把痛說出來、交給主，也陪想回來的人找到一條不被羞辱的路。"},{"id":"ISS04_8","t":"4:11「要把馬可帶來」——破裂的同工關係可以修復嗎？","r":"4:11；徒 15:37--39；西 4:10；門 24","ch":[4],"why":"教會裡最痛的傷，常常不是外面的逼迫，而是同工之間的決裂：一起開拓的人分道揚鑣，彼此不再說話，甚至帶走一群人。4:11 是全卷最有盼望的一行——保羅請人把當年他拒絕的馬可帶來。可是這一行也容易被拿來逼人和好。這一題要問：修復是可能的嗎？怎樣的修復是健康的？","pos":[["【一】經文問的是甚麼","","<p>徒 15 保羅「因為馬可從前在旁非利亞離開他們，不和他們同去做工，就以為不可帶他去」，結果「二人起了爭論，甚至彼此分開」（徒 15:39）。十幾年後，西 4:10 叫教會接待馬可，門 24 稱他為同工；到了 4:11，保羅說「要把馬可帶來，因為他在傳道的事上於我有益處」。εὔχρηστος（有益處）與 2:21「合乎主用」同字根。問題是：這段修復是怎麼發生的？今天破裂的同工關係，也都應該、也都能這樣修復嗎？</p>"],["完全復合說：基督徒的關係都應該和好如初","","<p>這一說看重福音的和好：神在基督裡叫我們與他和好，也叫我們彼此和好；保羅與馬可、保羅與巴拿巴最後都被提到時帶著尊重，說明使徒之間的爭論可以過去。它鼓勵信徒不要讓舊傷成為永遠的牆，主動走出修復的一步。這一說對許多多年不說話的同工，是一個真實的呼召。</p><p><strong>難處：</strong>若把「和好如初」當成每一段關係的必然要求，就會忽略傷害的嚴重程度與安全；有些破裂涉及欺騙、控制或虐待，饒恕可以發生，信任與同工卻不一定能、也不一定該立即恢復。逼人和好，等於叫受傷的人再受一次傷。</p>"],["各走各路說：分開也可以是神的帶領","","<p>這一說看重徒 15 分開之後的結果：巴拿巴帶馬可往塞浦路斯，保羅帶西拉走遍敘利亞、基利家，福音反而傳得更廣。它主張同工之間的分開不一定是失敗，不必勉強在一起；彼此祝福、各自忠心，也是一種成熟。這一說讓許多因為「沒有和好」而自責的人得著釋放。</p><p><strong>難處：</strong>若把「分開也是神的帶領」當成不必修復的理由，就讀漏了 4:11；保羅與馬可並沒有停在徒 15，他們的故事最後走到「於我有益處」。分開可以是一個段落，卻不一定是結局。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：破裂的同工關係可以修復，但修復是兩邊都被主改變的結果，不是一方被要求的表演。</strong>馬可改變了，從半途離開的人變成有益處的人；保羅也改變了，願意承認當年拒絕的人如今是他需要的——謙卑帶動謙卑。</p><p>饒恕、和好與恢復同工是三件事，可以有先後，也可以有界線；有傷害或虐待的地方，安全先於和好。修復之後，也需要有人願意繞路去接人，像被託付「帶馬可來」的提摩太；需要時也可以請可信任的第三方陪同。屬靈父母兒女與傳承的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你和某位同工至今無法和好，不代表你的信仰失敗；保羅與馬可之間也隔了十幾年。你可以先把那段關係交給主，求他改變你自己的那一半。</p><p>如果你就是那個曾經被拒絕的「馬可」，請記得：主可以把半途回家的人帶回到旁邊來，你的過去不是你的結局。如果你是那個「保羅」，也許你可以是先寫那封信的人。</p>"]],"con":[],"say":"本講義的立場：破裂的同工關係可以修復，但那是雙方被主改變的結果；饒恕、和好、恢復同工可以有先後與界線，有傷害的地方安全先於和好。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有與前同工、前教會決裂多年的人，有被要求「快點原諒、回來同工」而再度受傷的人，也有因為曾經半途退出而一直覺得自己不配的人。不要說「你不和好就是不屬靈」，也不要替別人安排和好的時程；陪他把傷說出來，分辨饒恕與信任的不同，必要時請可信任的第三方陪同。"},{"id":"ISS04_9","t":"4:14「主必照他所行的報應他」——受了傷害，可以向神求報應嗎？","r":"4:14--16；詩 62:12；羅 12:19；徒 7:60","ch":[4],"why":"被人深深傷害的人，常常會問：我可以求神為我伸冤嗎？我心裡的怒氣是罪嗎？4:14 看起來像保羅在求神懲罰亞歷山大，4:16 他卻又說「但願這罪不歸與他們」。這一題若講錯，一邊會叫受害者壓抑憤怒、假裝沒事，另一邊會讓人被苦毒困住，把禱告變成詛咒。","pos":[["【一】經文問的是甚麼","","<p>4:14「銅匠亞歷山大多多地害我；主必照他所行的報應他」。SBLGNT 作 ἀποδώσει，是將來式直述句，陳述主將來必做的事；RP 作 ἀποδῴη，是願望式，讀起來比較像一句祈願，而不是一句陳述。和合本跟從前者。這一句使我們想起詩 62:12「你照著各人所行的報應他」。兩節之後，保羅對離棄他的眾人說「但願這罪不歸與他們」（4:16），λογισθείη 是記帳的字。問題是：信徒可以把傷害交給神審判嗎？那和饒恕是否衝突？</p>"],["呼求伸冤說：受害者可以向神陳明冤屈、求他施行公義","","<p>這一說看重詩篇裡大量的哀歌與呼求：受欺壓的人向神說出憤怒、求神按公義施行審判，本身就是一種信心——把報應交給神，而不是自己動手。羅 12:19 也說「伸冤在我，我必報應」。這一說保護受害者真實的情緒，也承認神是公義的審判者，惡不會被當作沒有發生。</p><p><strong>難處：</strong>若停在呼求伸冤，禱告很容易滑向詛咒，心裡一直等著看對方遭殃，苦毒就在那裡扎根；新約也記得主說「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44），保羅自己在 4:16 也走得比 4:14 更遠。</p>"],["只能饒恕說：基督徒只該饒恕，不該有報應的念頭","","<p>這一說看重司提反與主耶穌的榜樣：司提反臨死說「主啊，不要將這罪歸於他們」（徒 7:60），主在十字架上為釘他的人求赦免；4:16 正是保羅學會了這一句。這一說提醒信徒：福音的終點是赦免，不是清算。</p><p><strong>難處：</strong>若把饒恕講成「不可以生氣」「不可以提公義」，受害者就被要求壓下真實的傷，加害者也可能拿「你要饒恕」作擋箭牌，逃避應負的責任；保羅在 4:15 仍然叫提摩太「你也要防備他」，饒恕不等於不防備、不求助。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：4:14 不是咒詛，是把報應交給主；4:16 是在交託之後，再往前走一步的祈願。</strong>受傷的人可以向神說出憤怒與冤屈，神承接得住；但不在禱告裡詛咒人，也不親手討帳。交給主的意思是：判決不在我手裡，我也不必背著這本帳簿過日子。</p><p>同時，交託不等於天真：4:15「你也要防備他」——保護自己、拉開距離、依法求助、讓教會與社會的公義程序運作，都不違背饒恕。受苦與「為主受苦」界線的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你心裡對傷害你的人有怒氣，不代表你不屬靈；保羅也被「多多地害」過，他沒有假裝沒事。你可以把那份怒氣原原本本地帶到主面前，他是按著公義審判的主。</p><p>如果你還說不出 4:16 那一句，也不必勉強；先說 4:14 那一句——「主會處理」，然後讓他慢慢改變你。那個當年替人看守衣裳的掃羅，最後也說出了司提反的禱告；主有時間。</p>"]],"con":[],"say":"本講義的立場：4:14 不是咒詛，是把報應交給主；4:16 是交託之後的赦免祈願。受傷的人可以向神說出冤屈，同時保護自己、依法求助。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有被家暴、被性侵、被詐騙、被前任領袖傷害的人，他們最怕聽到的是「你要趕快饒恕」。不要逼受害者立刻說出 4:16，也不要鼓勵人在禱告裡詛咒對方；先相信他、保護他，協助他求助與通報，再陪他慢慢把那本帳簿交給主。饒恕是一段路，不是一個講台上要求的動作。"}],"terrain":{"points":[[0.75,68,5,"這信是先在你外祖母羅以和你母親友妮基心裡的",null],[1.139,92,12,"因為知道我所信的是誰","top"],[1.306,18,15,"凡在亞細亞的人都離棄我","bot"],[1.827,40,9,"然而神的道卻不被捆綁",null],[1.981,94,13,"我們縱然失信，他仍是可信的","top"],[2.135,20,17,"他們的話如同毒瘡，越爛越大","bot"],[2.765,10,5,"有敬虔的外貌，卻背了敬虔的實意","bot"],[3.412,96,16,"聖經都是神所默示的","top"],[3.614,16,3,"耳朵發癢","bot"],[3.795,97,7,"那美好的仗我已經打過了",null],[4.205,22,16,"沒有人前來幫助，竟都離棄我","bot"],[4.25,98,17,"惟有主站在我旁邊，加給我力量","top"]]},"tracks":[{"gk":"κακοπαθέω／συγκακοπαθέω ＋ διωγμός／διώκω","tr":"kakopatheō / synkakopatheō + diōgmos / diōkō","gl":"受苦難、同受苦難、逼迫、追求","code":"G4777","root":"κακοπαθέω——忍受苦難（κακός「惡」＋πάθος「受」）；συγκακοπαθέω——一同受苦難（新約只有提後 1:8、2:3 兩次，保羅自己造的字很可能就是這一個）；πάσχω、πάθημα——受苦、苦難；διωγμός——逼迫；διώκω——追趕：同一個動詞，被人追趕叫「受逼迫」，自己追趕叫「追求」","ins":"全卷的苦難字從一開始就是「同」受的。第一站，保羅邀請兒子進來：「總要按神的能力，與我為福音同受苦難」（1:8）——συγκακοπαθέω，一起受；而且苦有對象，是「為福音」，力量有來源，是「神的能力」。1:12 保羅自己先站出來：「為這緣故，我也受這些苦難。然而我不以為恥」。2:3 同一個字第二次出現，加上一個畫面：「你要和我同受苦難，好像基督耶穌的精兵」。2:9 是谷底：「我為這福音受苦難，甚至被捆綁，像犯人一樣」——可是同一節下半句說，神的道不被捆綁。2:22 是第一個翻轉：διώκω 這個動詞在這裡不是「被追趕」，是「去追趕」——「追求公義、信德、仁愛、和平」；受逼迫的人，自己也有一個要追的方向。3:11 是第二個翻轉，苦難裡有拯救：「我所忍受是何等的逼迫；但從這一切苦難中，主都把我救出來了」。3:12 把例外變成常態：「凡立志在基督耶穌裡敬虔度日的也都要受逼迫」——受苦不是失敗的記號，但條件是「在基督耶穌裡敬虔度日」，不是一切不順都算。最後一站，棒子交到兒子手上：「你卻要凡事謹慎，忍受苦難」（4:5）。從「與我同受」到「你要忍受」，中間隔著一個要被澆奠的父親——苦難是一起擔的，也是一代傳一代擔的；擔得起，是因為神的能力，不是因為人硬撐。","stops":[["1:8","總要按神的能力，與我為福音同受苦難","top"],["1:12","為這緣故，我也受這些苦難。然而我不以為恥",""],["2:3","你要和我同受苦難，好像基督耶穌的精兵","top"],["2:9","我為這福音受苦難，甚至被捆綁，像犯人一樣","bot"],["2:22","同那清心禱告主的人追求公義、信德、仁愛、和平",""],["3:11","我所忍受是何等的逼迫；但從這一切苦難中，主都把我救出來了","top"],["3:12","凡立志在基督耶穌裡敬虔度日的也都要受逼迫",""],["4:5","你卻要凡事謹慎，忍受苦難","top"]]},{"gk":"δύναμις／δυνατός／ἐνδυναμόω ＋ δύναμαι","tr":"dynamis / dynatos / endynamoō + dynamai","gl":"能力、剛強、加給力量、能","code":"G1411","root":"δύναμις——能力；δυνατός——有能力的；ἐνδυναμόω——在裡面加力、使剛強；δύναμαι——能夠。提摩太後書的「能力」從聖靈所賜的心開始，在「外貌」那裡翻轉，最後落在站在旁邊的主身上","ins":"第一站，能力是神所賜的一顆心：「乃是剛強、仁愛、謹守的心」（1:7）——和合本的「剛強」原文就是 δύναμις；膽怯不是提摩太的身分，剛強才是。1:8 能力有主人：「總要按神的能力」；1:12 能力有對象：「也深信他能保全我所交付他的，直到那日」——能保全的是他，不是我。2:1 能力有位置：「你要在基督耶穌的恩典上剛強起來」——ἐνδυναμοῦ 是被動式，是被加力，不是自己用力。2:13 是一個奇妙的「不能」：「因為他不能背乎自己」——全能的神有一件事做不到，就是不忠於他自己；我們的確據就掛在這個「不能」上。3:5 是第一個翻轉，谷底：「有敬虔的外貌，卻背了敬虔的實意」——「實意」原文就是能力；有形狀，沒有力量。3:7 再一個「不能」：「常常學習，終久不能明白真道」。3:15 能力回到一本書上：「這聖經能使你因信基督耶穌，有得救的智慧」。最後一站，眾人離棄之後：「惟有主站在我旁邊，加給我力量」（4:17）——ἐνεδυνάμωσέν，與 2:1 是同一個字。保羅叫兒子在恩典上被加力，他自己在最後一次申訴中，被站在旁邊的主加了力。剛強不在我裡面，在那一位站在旁邊的主身上。","stops":[["1:7","乃是剛強、仁愛、謹守的心","top"],["1:8","總要按神的能力",""],["1:12","也深信他能保全我所交付他的，直到那日",""],["2:1","你要在基督耶穌的恩典上剛強起來","top"],["2:13","因為他不能背乎自己",""],["3:5","有敬虔的外貌，卻背了敬虔的實意","bot"],["3:7","常常學習，終久不能明白真道","bot"],["3:15","這聖經能使你因信基督耶穌，有得救的智慧",""],["4:17","惟有主站在我旁邊，加給我力量","top"]]},{"gk":"πίστις／πιστός ↔ ἀπιστέω ＋ πιστεύω","tr":"pistis / pistos ↔ apisteō + pisteuō","gl":"信、信心、忠心、可信、失信、信德","code":"G4102","root":"πίστις——信、信心、所信的道；πιστός——忠心的、可信的；ἀπιστέω——失信、不信；πιστεύω——相信。同一個字根，在人身上叫「信心」與「忠心」，在神身上叫「可信」","ins":"信，在提摩太後書是一代傳一代的東西。第一站：「想到你心裡無偽之信」（1:5）——無偽，沒有戴面具。1:12 信有一個對象：「因為知道我所信的是誰」——保羅說的不是「我知道我信甚麼」，是「我信的是誰」。1:13 信是一種守法：「要用在基督耶穌裡的信心和愛心，常常守著」。2:2 是第一個轉向：同一個字根從「信心」變成「忠心」——「也要交託那忠心能教導別人的人」；交棒的第一個條件不是口才，是可靠。2:11「有可信的話說」，接著一首詩，2:13 是全卷的樞紐，也是這條線最大的翻轉：「我們縱然失信，他仍是可信的」——人的 ἀπιστέω 撞上神的 πιστός，最後站著的是神。2:18 有人「就敗壞好些人的信心」；2:22 年輕人要「追求公義、信德、仁愛、和平」；3:8 雅尼佯庇一類的人「在真道上是可廢棄的」——和合本「真道」原文是「那信」。3:15 信有一個入口：「這聖經能使你因信基督耶穌，有得救的智慧」。終點在 4:7：「所信的道我已經守住了」——τὴν πίστιν τετήρηκα。一個老人能說「我守住了」，是因為他在 2:13 早就知道，真正守住的是那一位不能背乎自己的主。","stops":[["1:5","想到你心裡無偽之信",""],["1:12","因為知道我所信的是誰","top"],["1:13","要用在基督耶穌裡的信心和愛心，常常守著",""],["2:2","也要交託那忠心能教導別人的人","top"],["2:11","有可信的話說",""],["2:13","我們縱然失信，他仍是可信的","top"],["2:18","就敗壞好些人的信心","bot"],["2:22","追求公義、信德、仁愛、和平",""],["3:8","在真道上是可廢棄的","bot"],["3:15","這聖經能使你因信基督耶穌，有得救的智慧",""],["4:7","所信的道我已經守住了","top"]]},{"gk":"λόγος ＋ εὐαγγέλιον ＋ κηρύσσω／κήρυγμα","tr":"logos + euangelion + kēryssō / kērygma","gl":"道、話、福音、傳道、傳明","code":"G3056","root":"λόγος——話、道；εὐαγγέλιον——福音（好消息）；κηρύσσω——當傳令官那樣大聲宣告；κήρυγμα——所宣告的信息；εὐαγγελιστής——傳福音的。傳道的人會被捆綁，道卻不被捆綁","ins":"第一站，福音要人付代價：「與我為福音同受苦難」（1:8）。1:10 說明為甚麼值得：「藉著福音，將不能壞的生命彰顯出來」——福音不是一套道理，是把死廢去的那一位顯明出來。1:13 福音有一個形狀：「你從我聽的那純正話語的規模」——ὑποτύπωσιν，一張草圖、一個模子。2:8「正合乎我所傳的福音」——內容是一個人：從死裡復活的耶穌基督。2:9 是第一個翻轉：「然而神的道卻不被捆綁」——傳道的人戴著鍊子，道沒有。2:15 道要被「按著正意分解」；2:17 是谷底，另一種話也在傳：「他們的話如同毒瘡，越爛越大」——話也會像壞疽一樣擴散。4:2 是全卷最直接的命令：「務要傳道」——κήρυξον，像傳令官一樣喊出來，而且「無論得時不得時」。4:5「做傳道的工夫」，把好消息帶給人是每一天的工。4:15 銅匠亞歷山大「極力敵擋了我們的話」。最後一站在法庭上：「使福音被我盡都傳明」（4:17）——一個被告，把被審判的地方變成了講台。人可以敵擋，可以離棄，可以把傳道的人關起來；福音卻在最不可能的地方被傳明了。","stops":[["1:8","與我為福音同受苦難",""],["1:10","藉著福音，將不能壞的生命彰顯出來","top"],["1:13","你從我聽的那純正話語的規模",""],["2:8","正合乎我所傳的福音",""],["2:9","然而神的道卻不被捆綁","top"],["2:15","按著正意分解真理的道",""],["2:17","他們的話如同毒瘡，越爛越大","bot"],["4:2","務要傳道","top"],["4:5","做傳道的工夫",""],["4:15","因為他極力敵擋了我們的話","bot"],["4:17","使福音被我盡都傳明","top"]]},{"gk":"οἶδα／γινώσκω ＋ ἐπίγνωσις","tr":"oida / ginōskō + epignōsis","gl":"知道、認識、明白","code":"G1492","root":"οἶδα——知道（確知）；γινώσκω——認識、知道（經驗中認得）；ἐπίγνωσις——真知、完全的認識。提摩太後書的「知道」有兩個方向：我知道我所信的是誰；主認識誰是他的人","ins":"第一站是全卷最多人背的一句：「因為知道我所信的是誰」（1:12）——οἶδα，確知；保羅確知的不是一套教義，是一個人。1:15「這是你知道的」，知道的是一件痛事：亞細亞的人都離棄了；1:18「是你明明知道的」，知道的是一件暖事：阿尼色弗怎樣服事。2:19 是全卷最大的翻轉：主語換了——「主認識誰是他的人」（Ἔγνω κύριος，引民數記 16:5）；比「我知道他」更穩的，是「他認識我」。2:23 知道要化成分辨：「因為知道這等事是起爭競的」；2:25 盼望抵擋的人「可以明白真道」——ἐπίγνωσιν，真正認識。3:1「你該知道，末世必有危險的日子來到」——知道是為了警醒，不是為了算日子。3:7 是谷底：「常常學習，終久不能明白真道」——資訊很多，認識沒有。3:14 知道「跟誰」學：「因為你知道是跟誰學的」——信仰是從人傳到人的；3:15 知道「學甚麼」：「並且知道你是從小明白聖經」。從 1:12 到 3:15，這條線告訴提摩太：亂世裡最大的安全感有三層——你知道你所信的是誰；他認識你；你知道你是從誰、從哪一本書學來的。","stops":[["1:12","因為知道我所信的是誰","top"],["1:15","這是你知道的",""],["1:18","是你明明知道的",""],["2:19","主認識誰是他的人","top"],["2:23","因為知道這等事是起爭競的",""],["2:25","可以明白真道",""],["3:1","你該知道，末世必有危險的日子來到",""],["3:7","常常學習，終久不能明白真道","bot"],["3:14","因為你知道是跟誰學的","top"],["3:15","並且知道你是從小明白聖經","top"]]}],"lesson":{"1":{"no":1,"vol":"《321提摩太後書講義》第一課·提摩太後書第一章","title":"我不以為恥；因為知道我所信的是誰——餘燼、面子、寄存","chars":4946,"min":60,"deep":8,"dchars":1822,"tchars":1448,"blocks":[["h","一、別倒，底下還是紅的"],["p","弟兄姊妹平安。中秋節的隔天早上，社區中庭還留著昨晚烤肉的味道。一位年輕的爸爸拎著垃圾袋去收烤爐，炭盆裡一片灰白，摸上去也不太燙，他就要整盆倒進袋子。管理員伯伯從警衛室衝出來喊：「別倒！底下還是紅的。」伯伯拿鐵夾把灰撥開，底下果然一層暗紅，湊近吹一口氣，火星就跳起來了。伯伯說，前年有一戶就是這樣把垃圾袋燒穿的。看起來熄了，和真的熄了，是兩回事。"],["p","提摩太後書第一章，就是一封「別倒」的信。寫信的人是保羅，這時他在羅馬「被捆綁，像犯人一樣」（2:9），知道自己離世的時候到了；這是他最後一封信。收信的提摩太在以弗所，年輕、身體軟弱，大概天性也不是勇敢的人；屬靈的父親入了監，亞細亞的同工一個一個轉身離開。一個這樣的年輕人，很可能正準備把自己整盆倒掉：我不是這塊料，我退下來吧。"],["p","保羅沒有一開口就下命令。他先寫：「寫信給我親愛的兒子提摩太。」（1:2）再寫：「記念你的眼淚，晝夜切切地想要見你，好叫我滿心快樂。」（1:4）然後他寫到提摩太的家：「想到你心裡無偽之信，這信是先在你外祖母羅以和你母親友妮基心裡的，我深信也在你的心裡。」（1:5）請留意最後那半句。保羅還沒有指出兒子的軟弱，先指出兒子身上已經有的東西。這就是伯伯那一句：底下還是紅的。"],["p","全卷四章可以用四個字記：火、兵、經、冠，是一個人的一生由內而外。第一章是火：裡面要先有火，才談得上吃苦、交棒、打完那美好的仗。這一課用三個詞走完第一章：餘燼、面子、寄存。灰底下的火，一張怕丟的臉，和一件交給可靠的那一位保管的東西。"],["d",["我是家裡第一個信主的，讀到 1:5 三代的信，總覺得自己的根基比別人淺，這樣想對嗎？","不對，而且提摩太自己就是反例。使徒行傳介紹他是「信主之猶太婦人的兒子，他父親卻是希臘人」（徒 16:1），他的家在信仰上是分開的。所謂三代的信，是兩個女人在一個不完整的家裡撐起來的。保羅又叫他「我親愛的兒子」，兩人沒有血緣，這是第二條一樣真實的傳承線。1:5 的「先在」原文是住進去，和 1:14 聖靈「住在」我們裡面同一個字根：叫信住進人裡面的是神，不是家譜。家庭信仰是祝福，不是得救或成熟的條件。實際的做法是：這一週說出一位你願意請他作你屬靈長輩的人，主動約他喝一次咖啡；你也可能正是你家第一代的「羅以」。全卷立場見 ISS00_5。"]],["h","二、餘燼：點火的是神，撥灰的是你"],["p","「為此我提醒你，使你將神藉我按手所給你的恩賜再如火挑旺起來。」（1:6）這一節裡有三雙手。第一雙是神的手：恩賜是「神……所給你的」，點火的始終是他。第二雙是保羅和眾長老的手：提摩太前書講義第 4 章講過，提前 4:14 記著眾長老一同按手，那是教會當眾的認可與交託，不是一個人把能力傳給另一個人。第三雙才是提摩太自己的手：撥灰。撥灰是你的本分，點火是神的作為；而你撥灰的時候也不是一個人，叫你守得住的聖靈就住在裡面（1:14）。"],["p","灰是怎麼來的？很少是因為犯了甚麼大罪，多半是日子積出來的：連續幾年的服事沒有人接手，一次被誤會沒有說開，一個帶了很久的人忽然不來了，再加上睡不夠、身體病。灰不是罪名，是燒過的證據；有灰，表示這盆炭曾經熱熱地燒過。對付灰，不是換一盆新炭，是把原來的撥開。"],["p","想一位姊妹。她教了十二年兒童主日學，教到最後一年，班上只剩三個孩子，同工一個一個調走，有一個主日她站在空教室裡，覺得自己甚麼都不是了。第二年她就坐到最後一排，散會第一個走。如果有人那時對她說「你冷淡了」，那是把她整盆倒掉；保羅會說的是：你裡面的東西沒有被收回，只是蓋了一層灰。撥灰的第一個動作，也許只是有一個人走到最後一排，坐在她旁邊，問她這十二年記得哪一個孩子。"],["p","接著保羅說明火的性情：「因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。」（1:7）還是用烤爐來想。剛強是火力，原文就是「能力」；仁愛是火的用處，炭火是用來烤東西給人吃的，不是用來燒房子的；謹守是爐子的邊，叫火在風裡也不亂竄。只有火力沒有仁愛，會變成霸道；只有仁愛沒有謹守，會被人牽著走；只有謹守，就甚麼都不敢做。神把三樣一起給。"],["p","這一節最需要小心教。主詞是神，動詞是「賜」，這是一句關於恩典的話，不是一份考卷，不可以拿來量人夠不夠勇敢。如果你正在焦慮、恐懼、憂鬱或創傷裡，你不必在這節經文前面多背一個罪名。保羅說的是「賜給我們」，寫這一句的人自己也戴著鍊子、也被人離棄，他和提摩太一樣需要領受。神所賜的剛強，常常正是藉著醫生、藥物、輔導和弟兄姊妹的陪伴臨到；禱告和就醫不是二選一。"],["d",["我在吃抗焦慮的藥，每週看輔導，讀到 1:7 就很自責，是不是我信心不夠？","不是。請再讀一次這一節的主詞和動詞：神賜給我們。這是一句恩典的話，不是一張考卷；保羅沒有說會怕的人沒有信心，他說的是神給了甚麼。寫這句話的人自己記念兒子的眼淚（1:4），在別處也承認過被壓太重、連活命的指望都絕了。主耶穌在客西馬尼也說「我心裡甚是憂傷，幾乎要死」（太 26:38）。神所賜的剛強，常常正是藉著醫生、藥物、輔導和弟兄姊妹的陪伴臨到你，所以請不要因為這一節自行停藥，有任何調整都先和醫生商量。若你有傷害自己的念頭，請今天就告訴一位信得過的人，並尋求專業協助。"]],["d",["1:6 說恩賜是藉保羅按手給的，那我是不是該去找有恩膏的人為我按手？","這一節最容易被誤用。先看保羅自己怎麼說：是「神……所給你的恩賜」，給的是神。提前 4:14 記同一件事，說是「在眾長老按手的時候」，所以這不是保羅一個人的手，是教會一同按手。按手在新約是禱告、交託與公開的認可：教會當眾承認神在這個人身上的呼召，把他交在神手裡。它不是能量傳遞，手不是電線。因此不必到處打聽哪一位講員的手比較有能力；更要小心「我為你按手，你就屬我遮蓋」這一類說法，那是把交託變成綁人。你若覺得神在呼召你，該做的是和你的牧者、長執一起禱告分辨，讓教會用正常的方式認可與差派。全卷相關議題見本章議題頁。"]],["h","三、面子：跟一個戴鎖鍊的人站在一起"],["p","「你不要以給我們的主作見證為恥，也不要以我這為主被囚的為恥；總要按神的能力，與我為福音同受苦難。」（1:8）「以為恥」這個字，這一章出現三次，剛好排成一堂課：1:8 是一個命令，不要以為恥；1:12 是一個榜樣，保羅說「我不以為恥」；1:16 是一個活出來的人，阿尼色弗「不以我的鎖鍊為恥」。命令、榜樣、活出來，聖經自己就把這一課教完了。"],["p","華人最懂這個字，我們叫它丟臉。皮肉的苦咬咬牙還過得去，臉丟了，人就抬不起頭。提摩太的難處很具體：跟一個被定罪的犯人站在一起，在以弗所是會被人指指點點的。保羅的藥方有兩味。第一味是「同」：「同受苦難」原文前面多了一個「同」字，他沒有叫兒子一個人去扛。第二味是「按神的能力」，就是上一節那個「剛強」，同一個字在這裡兌現了。"],["p","也要劃一條界線。這裡說的是「為福音」的苦，不是一切的苦都叫為主受苦。自己犯錯的後果、過勞拖垮的身體、在家裡被打被欺負，都不是這一節說的苦；人身安全受威脅時先保護生命、依法求助，不是不屬靈。保羅自己就被門徒「用筐子把他從城牆上縋下去」（徒 9:25），逃過一命。"],["p","保羅寫到受苦，筆鋒一轉就寫到萬古之先：「神救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典」（1:9）。羞恥最怕的是被人看穿；這一節先把底牌掀開：我們本來就不是靠表現站在這裡的。然後是：「他已經把死廢去，藉著福音，將不能壞的生命彰顯出來。」（1:10）寫這句的人正在等自己的死刑。連死都失了效力，別人的眼光還能拿走甚麼？"],["p","所以 1:12 那一句才站得住。不以為恥，靠的不是勇氣，是認識。保羅說的是「知道我所信的是誰」，是「誰」，不是「甚麼」。論證可以被駁倒，一個人認識另一個人三十年，是駁不倒的。不以為恥的祕訣，不在自己膽子大，在焦點換了。"],["p","這一點可以在生活裡試。公司聚餐，你低頭禱告了一下，同事笑著問：「你還真的信那個喔？」如果你手上只有一套道理，你會開始緊張：我答得出來嗎？我會不會被問倒？如果你認識的是一個人，你可以很平常地說：「是啊，他幫我走過很多事。」不必贏這一場辯論，只要不把他藏起來。焦點在自己，人會怕；焦點在別人的眼光，人會羞；焦點落在主身上，人就站得住。"],["d",["1:10 說基督已經把死廢去，那為甚麼基督徒還是會生病、會死？","「廢去」原文 καταργέω 不是叫死亡消失，是叫它失去效力。希伯來書說主「藉著死敗壞那掌死權的」（來 2:14），用的是同一個字。像被拔了毒牙的蛇，還會叫人痛，卻留不住人了。寫這句話的保羅正在等自己的死刑，他沒有說自己不會死，他說他知道死以後的事：「將不能壞的生命彰顯出來」。所以基督徒照樣會生病、會老、會離世，教會也照樣陪伴喪家流淚；實際一點說：這一週如果你身邊有人正在陪家人走最後一程，不必急著對他講道理，去陪他坐一個下午，必要時幫他問清楚安寧照顧的資源。"]],["h","四、原文亮光：撥、存、透"],["p","第一個字是 ἀναζωπυρεῖν（anazōpyrein），和合本譯「再如火挑旺起來」，新約只出現這一次。主日講章已經講過它是爐邊的字；這一課要多看一筆文法：它是現在式不定詞，說的是持續的動作。不是一年一次的復興特會把火燒旺就好，是常常撥、天天撥。烤過肉的人都知道，炭火要一直照顧，隔一陣子翻一翻、搧一搧。屬靈的火也是這樣，靠的不是一次大的感動，是一個小而固定的節奏。"],["p","第二組字是 τὴν παραθήκην μου（tēn parathēkēn mou），「我所交付他的」。παραθήκη 是寄存的字：出遠門以前，把最貴重的東西交給一個信得過的人保管。和合本讀成保羅交給神的，註腳說「或譯：他所交託我的」，就是神交給保羅的福音。兩讀講台上不必爭，因為兩讀都落在同一件事上：最後保管的是神。更妙的是動詞。1:12 說他能 φυλάξαι（phylaxai），保全；1:14 叫提摩太 φύλαξον（phylaxon），守著。同一個字。神把要守的交給人，又把守的力量也給人：「從前所交託你的善道，你要靠著那住在我們裡面的聖靈牢牢地守著。」（1:14）守住不靠咬牙，靠住在裡面的那一位。"],["p","這裡還藏著一條線。1:14「住在」我們裡面的 ἐνοικοῦντος（enoikountos），和 1:5 信「先在」外祖母心裡的 ἐνῴκησεν（enōkēsen），是同一個字根，「住進去」。信住進一個人裡面，聖靈也住進一個人裡面。一個家裡沒有外祖母、也沒有母親禱告的人，同樣有那一位住進來。"],["p","第三組字是一對反義的動作。1:15「凡在亞細亞的人都離棄我」，「離棄」是 ἀπεστράφησάν（apestraphēsan），把臉轉開：在街上遇見了，眼睛看向別處。1:16 阿尼色弗「屢次使我暢快」，「暢快」是 ἀνέψυξεν（anepsyxen），讓人再透一口氣，像悶熱的牢房裡忽然吹進一陣風。別人把臉轉開，他把身子轉過來；而且是「殷勤地找我，並且找著了」（1:17）。保羅寫下兩個離開的名字，沒有咒罵、沒有解釋；講台和小組也不拿這兩個名字去影射今天任何一個離開的人。我們學的是阿尼色弗。"],["d",["1:12「我所交付他的」到底是保羅交給神的，還是神交給保羅的？","兩種讀法都有好理由。和合本讀成保羅交給神的：他把自己的生命、事工和將來寄存在神那裡。和合本小字註腳說「或譯：他所交託我的」，指神交給保羅的福音；1:14 和提前 6:20 用的是同一個字。本講義講台照和合本，兩讀並陳。重要的是兩讀的交集：最後保管的是神。保羅快死了，福音卻不會跟著死；棒子一棒一棒換手，保管的那一位從來沒有換過人。所以你可以兩樣都做：今天晚上把你最放不下的一件事、一個人，用一句禱告交給他；明天早上把他交給你的那一段福音，好好講給一個人聽。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 1:7 去量人：你會焦慮、會怕、在吃藥看輔導，就表示你信心不夠。這是錯的。1:7 的主詞是神，動詞是賜；拿恩典當考卷，會叫人把病藏起來、偷偷停藥。"],["p","第二個偏差，是反過來把 1:7 講成成功學：相信自己、敢衝敢要就是剛強。這也不是經文的意思。剛強是神「賜給我們」的，而且和仁愛、謹守綁在一起；沒有仁愛的剛強只是霸道。"],["p","第三個偏差，是把 1:6 的按手講成傳功：找一位有恩膏的人按手，就得著他的能力，從此屬他遮蓋。經文說得清楚，給恩賜的是神；按手是禱告、交託與認可，不是一個人把能力傳給另一個人。"],["p","第四個偏差，是用 1:5 叫第一代信徒覺得自己根基淺，或叫兒女不信主的父母自責。這不是保羅的意思。提摩太的父親是希臘人，他的家也不完整；保羅叫他「親愛的兒子」，那是另一條一樣真實的傳承線。"],["p","第五個偏差，是把 1:15 當成講台上的暗箭，影射哪一位離開教會的同工就是今天的腓吉路；或者把 1:8 講成一切的苦都是為主受苦，叫受欺負的人忍著不走。兩樣都錯了。前者違背保羅自己的沉默，後者忘了這裡說的是「為福音」的苦。"],["d",["我帶過的同工離開了，還在外面說教會的不是，小組裡可以談他嗎？","可以談你的痛，不要談他的名字。保羅寫 1:15 的時候，痛到用「凡在亞細亞的人」來說，可是他只寫了兩個名字，沒有咒罵、沒有解釋，然後就轉去寫阿尼色弗。我們對腓吉路和黑摩其尼一無所知，也不知道他們後來的路。小組裡可以說：我被離棄了，我很難過，我開始懷疑自己。不要說：某某就是今天的腓吉路。前者是把傷交給主，後者會在小組裡種下另一道傷。也請記得 4:11 保羅後來把曾經被他拒絕的馬可請回來：離開的故事不一定是結局。為他禱告一句，把審判留給主。全卷立場見 ISS00_2。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家裡只有我一個信主。過年回家，一桌親戚，祭祖的時候只有你站在旁邊；你讀到 1:5 的外祖母和母親，心裡一沉：我家沒有這一條線。也有作父母的，讀到同一節更痛：我的孩子到今天還不信，是不是我信得不夠真？請記得兩件事。提摩太的家並不完整，所謂三代的信，是兩個女人在一個分開的家裡一點一點撐起來的；而保羅是另一條線，沒有血緣，卻是「親愛的兒子」。友妮基能做的，是讓信住在自己裡面；叫信住進兒子裡面的，是神。教會能做的，是刻意為第一代信徒配一位屬靈的長輩，讓他的眼淚也有人記念。"],["p","第二個問題：家醜不可外揚。弟兄住進了精神科病房，姊妹失業躲在家裡，某一位老同工因為家裡出事不敢再來聚會；華人的第一個反應是藏，家人藏，自己也藏，教會常常是最後一個知道的。阿尼色弗的動詞值得記住：「殷勤地找我，並且找著了。」不是等人來求救，是去找。去找的人不帶道理，只帶一件外衣、一個便當、一句我來看你；不打聽細節，不拿去當代禱事項傳開。對方的面子要顧，對方的人更要顧。"],["h","七、活出321——從灰裡撥出來的火"],["p","經文先講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：不以為恥，他先走過。「他因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難」（來 12:2）。他也怕過，在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38），卻一步一步把自己交在父手裡。1:10 說的正是這一位，他進到死裡，把死廢去。我們跟的不是一個從不害怕的英雄。"],["p","聖經是我的準則：「你從我聽的那純正話語的規模，要用在基督耶穌裡的信心和愛心，常常守著。」（1:13）「規模」是一張草圖。提摩太不必變成保羅，但他講的福音要和保羅的是同一張草圖；而且要在信心和愛心裡守，對的話要用對的心拿著。"],["p","聖靈是我的引導：1:14 說守住靠的是「那住在我們裡面的聖靈」。撥灰是我的責任，火卻是他的；剛強、仁愛、謹守，也是他在人裡面慢慢結出來的。"],["p","讓耶穌作王：1:8 保羅稱自己是「為主被囚的」，原文是主的囚犯，不是羅馬的。羅馬捆得住他的手，作王的卻不是凱撒。1:12 又說「直到那日」：最後打分數的是他，不是今天飯桌上的那一排評審。"],["p","讓耶穌得著一切的榮耀：1:9「不是按我們的行為」，把功勞從人手上拿走；保羅在牢裡的第一句是「我感謝神」（1:3）。火燒旺了，也不是我們的火，榮耀歸給點火的那一位。"],["p","建立屬神的體系：讀完這一章才看得見，體系的生命線是傳承，不是組織。1:5 是家裡的一條線，1:2 是屬靈父子的一條線，1:16 阿尼色弗「一家」是一群彼此找著的人；321 在這裡認出 235 的「3」，屬靈父母兒女。國度321空中團契散在各國，更需要這樣一張彼此找著、彼此記念眼淚的網。"],["d",["我們是散在各國的線上團契，見不到面，要怎樣作彼此的阿尼色弗？","阿尼色弗有三個動作，線上都做得到。第一是「找」：他到了羅馬，殷勤地找。線上團契最容易的事就是讓一個人悄悄消失，頭像還在，人不見了。請每一個小組列一張名單，凡是連續三週沒有出現的，指定一位組員私下傳訊、打一通語音，不是點名，是問候。第二是「使人暢快」：讓人再透一口氣。一段錄給他的禱告語音、一份寄到他家的小禮物、在他住院時請同城的弟兄姊妹去看一眼，都是那一陣風。第三是「不以鎖鍊為恥」：對方若在病中、在低谷、在被人議論的時候，不要因為怕尷尬就不聯絡。關心不等於打聽，對方不想說的不追問。"]],["h","八、四種心，誰的灰最厚"],["p","驕傲型的心，最難承認自己的火小了。聚會照來、服事照做，嘴上說很好，其實心裡冷了很久。請你聽保羅怎樣對兒子說話：他沒有罵，他說底下還是紅的。承認有灰，不丟臉；假裝沒有灰，火才會真的熄。"],["p","恐懼型的心，天性怯懦、說話會發抖，一聽到「剛強」就以為自己不合格。神使用的不是天生勇敢的人。1:7 不是叫你先變成另一種性格，是說那份剛強是「賜」的；如果你的害怕已經大到影響睡眠和生活，去看醫生，也是領受的一種方式。"],["p","羞恥型的心，最怕被人知道：家裡出的事、自己的病、信了主卻常常跌倒。請你聽 1:9：不是按我們的行為。你最怕被看穿的那一面，神在萬古之先就看見了，仍然召了你。"],["p","受傷型的心，也許正是被離棄的那一位：同工走了，一起禱告過的人把臉轉開。被離棄是真的，會痛，連使徒也躲不過；你不必假裝不痛，也不必認定全是你的失敗。保羅沒有咒罵，他把那兩個名字輕輕放下，然後把眼睛轉向那位從不轉臉的主。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:6--7，把「賜給我們」換成「賜給我」唸一次，說出今天最怕的一件事，然後求主賜你剛強、仁愛、謹守的心去面對它。"],["p","第二，訂一個撥灰的小節奏：每天固定十分鐘，同一個時間、同一個地方，讀一段經文、禱告一句，連續七天。不求大感動，只求不中斷。"],["p","第三，如果你已經疲憊、失眠或焦慮好幾個星期，這一週預約一次醫生或輔導，或告訴一位信得過的人；同時把一項讓你耗盡的服事，暫時請人接手。"],["p","第四，挑一個你平常把信仰收起來的場合，公司午飯、家族群組、同學聚會，不辯論、不講道，只說一句平常的真話；開口以前，在心裡唸一次「我知道我所信的是誰」。"],["p","第五，作一次阿尼色弗：說出一位住院、失業、退下服事或被人議論的人的名字，這一週去找他一次，帶一樣具體的東西去。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神賜給我的不是膽怯的心，乃是剛強、仁愛、謹守的心；這是恩典，不是考卷。"],["p","我宣告：我的灰底下還是紅的，神給我的恩賜沒有收回，我要常常把它挑旺起來。"],["p","我宣告：我不以給主作見證為恥，因為我知道我所信的是誰，他能保全我所交付他的，直到那日。"],["p","我宣告：我要靠著住在我裡面的聖靈守住所託付的，也要殷勤地去找那一位被人轉過臉去的人。"],["d",["我已經累到撐不住了，1:6 叫人把火挑旺，是不是要我再多接幾項服事？","不是。撥灰不等於加柴加到爐子塌。灰常常正是過勞積出來的，有時候撥開灰的第一步，是好好睡一覺、好好看一次病、把一項服事交出去。先知以利亞在羅騰樹下求死的時候，神沒有責備他，天使拍他說：「起來吃吧！」（王上 19:5）神先讓他吃、讓他睡。保羅在這封信裡也要外衣、要書、要同伴（4:9、4:11、4:13），他是一個有需要的人。實際的做法是：這一週列出你手上所有的服事，圈出一項最耗盡你、而且有人可以接手的，在主日以前找你的牧者或組長談，說出你需要休息多久。休息不是退後，是讓火有空氣。全卷立場見 ISS00_2。"]],["h","十、結語"],["p","第一章從眼淚開始，在一個找著了的人結束。一位將死的父親，對一個想把自己倒掉的兒子說：別倒，底下還是紅的。在火、兵、經、冠這一條路上，這一章是起點：裡面先要有火，而火是神點的。"],["p","這一課的焦點，不在提摩太夠不夠勇敢，也不在保羅有多堅強，焦點在保羅說的那一個「誰」。「然而我不以為恥；因為知道我所信的是誰，也深信他能保全我所交付他的，直到那日。」（1:12）不是我抓住他，是他保全我。到了這封信的最後，保羅還要寫：「惟有主站在我旁邊，加給我力量」（4:17）。在阿尼色弗找著他以前，主早就在那間牢房裡了。請你不要更佩服保羅，請你更認識保羅認識的那一位。"],["p","我們一起低頭禱告。點火的父神，謝謝你，在我們以為自己已經熄了的時候，你說底下還是紅的。求你親手撥開我們的灰，把剛強、仁愛、謹守的心再賜給我們；也賜給正在焦慮、憂鬱、病痛裡的弟兄姊妹好的醫生、好的陪伴和夠用的力量。求你叫我們不以你為恥，因為我們知道所信的是誰；求你保全我們交在你手裡的一切，直到那日。求你使我們作別人的阿尼色弗，去找那些被人轉過臉去的人。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰的火最旺，是讓每一個人誠實說出自己的灰、自己最怕丟的那張臉，並說出這一週要去找的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是餘燼、面子、寄存。席上可能有正在服藥、看輔導的弟兄姊妹，有家中只有自己信主的人，也有被同工離棄、想退下來的服事者，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：火是神點的，灰是日子積的；不以為恥的祕訣是認識那一位；守住靠住在裡面的聖靈，最後保管的是神。"],["n","1. ★ 開場的管理員伯伯喊「別倒，底下還是紅的」。你的生命裡有沒有一個人，在你想放棄的時候對你說過類似的話？他是誰、那時你幾歲？"],["n","2. ★★★ 請用自己的話說：1:6 裡神的手、教會的手、你自己的手，各做了甚麼？為甚麼說撥灰是你的責任，點火卻不是？"],["n","3. ★★ 1:7 的剛強、仁愛、謹守，如果只剩下其中一樣，會變成甚麼樣子？說一個你在職場或教會見過的例子，不必說名字。"],["n","4. ★★ 保羅說的是「知道我所信的是誰」，不是「甚麼」。這兩種認識，在你被人嘲笑或質疑信仰的時候，會帶出甚麼不同的反應？"],["m","帶領提醒：有人問按手、預定或為過世的人禱告，一句指向議題頁，不在組裡辯論；不要用 1:7 評論任何人的信心。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人誠實說出自己的灰、最怕丟的那張臉，並說出這一週要撥灰的第一個動作。"],["t","【看】看見自己"],["n","5. ★★★ 如果用炭盆來形容你現在的屬靈光景，是正旺、蓋著灰、還是只剩微微一點紅？那一層灰主要是從哪裡來的：疲倦、挫折、被誤會，還是身體的病？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:6--7 和 1:12 兩遍。哪一個詞讓你停下來：挑旺、賜給我們、知道是誰，還是保全？今天這個詞對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你最怕在哪一個場合被人知道你是基督徒，或最怕被人知道你現在的狀況？那一刻你怕的是哪一個人的眼光？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「我交給你的，你保全，直到那日。」並說出你要交出去的是哪一件事或哪一個人，不必說細節。右手邊的人只回一句「他能保全」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你撥灰的第一個動作：哪一天、幾點、在哪裡、做甚麼；若你已經累了很久，也寫下這一週要和誰談、要交出哪一項服事、要預約哪一位醫生或輔導。"],["m","帶領提醒：這一化可能碰到焦慮、憂鬱、創傷、長期無望感、甚至自傷的念頭，也可能碰到家庭傷害和被同工離棄的痛。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不用 1:7 責備任何人膽怯；禱告不取代必要的醫療與輔導，有人提到正在服藥，請肯定他繼續就醫。若有人透露傷害自己的念頭或仍在危險中，不在組裡處理，會後單獨關心，必要時協助他尋求專業協助。分享時不點名、不影射任何離開的人。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個撥灰的節奏、一句不以為恥的真話、一個要去找的人、一位要講給他聽的朋友。"],["n","10. ★★ 這一週你每天固定的十分鐘撥灰時間，是幾點、在哪裡？要讀哪一段經文？請右手邊的人週三傳訊問你一次。"],["n","11. ★ 說出一個你平常把信仰收起來的場合和在場的人，這一週你準備在那裡說的那一句平常的真話是甚麼？"],["n","12. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位住院、失業、退下服事、被人議論，或家中只有他一人信主的人。當場說出他的名字，說出這一週哪一天、用甚麼方式去找他，要帶甚麼去，並和他一起讀 1:7。"],["n","13. ★ 誰是曾經把你裡面的火挑旺起來的人？說出他的名字，和這一週你要傳給他的那一句感謝。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人看起來已經熄了，其實底下還是紅的，神給人的火不會隨便收回。第二句，有一個坐牢等死刑的人說他不覺得丟臉，因為他知道自己信的是誰。第三句，你最怕失去的東西，可以交給一位能保全它的神。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多禱告」這類答案；不在組裡評論任何離開的同工或任何一家的家務事。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週撥灰的第一個動作是甚麼，要去找的那一個人是誰。"],["p","然後彼此代禱，為三種人指名禱告：一位仍在就醫的焦慮或憂鬱中的弟兄姊妹；一位家中只有他信主的第一代信徒；一位被同工離棄、想退下來的服事者。"],["p","最後由組長慢慢讀一遍：「因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。」（1:7）"]]},"2":{"no":2,"vol":"《321提摩太後書講義》第二課·提摩太後書第二章","title":"我們縱然失信，他仍是可信的——加力、算數、切直","chars":5129,"min":60,"deep":8,"dchars":1853,"tchars":1278,"blocks":[["h","一、神還算我數嗎"],["p","弟兄姊妹平安。我跌倒過很多次了，神還算我數嗎？這個問題很少在聚會裡被大聲問出來，它通常在深夜出現。答應過主不再碰的東西，又碰了；說好每天讀經，一斷就是三個月；在同事面前被問到是不是基督徒，支支吾吾地岔開了話題。也有服事很多年的人，心裡藏著另一個版本：如果有一天我撐不下去，把手上的事全放下了，主還要我嗎？"],["p","提摩太大概也問過。他的屬靈父親在羅馬的牢裡，「被捆綁，像犯人一樣」（2:9）；亞細亞的人都離棄了；他年輕，可能天性怯懦，身體也不好，卻要一個人扛起以弗所。保羅寫給他的第二章，一連串都是「你要」：要剛強、要交託、要同受苦難、要竭力、要逃避、要追求。一個怯懦的人，越讀越覺得自己不夠格。可是就在這一章的正中間，保羅放了一首詩，詩的最後一行是：「我們縱然失信，他仍是可信的，因為他不能背乎自己。」（2:13）"],["p","所以這一課不先回答你夠不夠好，而是回答一個更根本的問題：這一場仗，到底是靠誰的忠心撐住的？全卷四章四個字：火、兵、經、冠。第一章是火，把蒙了灰的炭撥開；這一章是兵，被挑旺的人要上陣了。可是請先記住，同一章的末了，這個兵被改稱為主的僕人，而且「主的僕人不可爭競」（2:24）。基督的精兵打的仗，不是跟人打的。"],["p","這一課用三個詞走完第二章：加力、算數、切直。先被加力，才交得出棒；他算我數，跌倒的人才回得來；先把自己切直，才有資格對別人說真理。"],["d",["我同一個罪已經犯了很多次，每次都說最後一次，這樣算失信，還是已經算不認主了？","先說一件安慰的事：會為這件事難過的人，通常不是 2:12 說的那種人。那一行說的不認，是有意的、立場式的、到底不回頭的否認；一個還在掙扎、還在痛苦、還想回來的人，方向是朝著主的。彼得那一夜跌得很重，主卻說「你回頭以後」。可是也要誠實：一再重犯的罪不可以輕看，它會一點一點把人的心磨硬。實際上可以做三件事。第一，不要只對自己發誓，找一位信得過的弟兄姊妹說出來，讓他每週問你一次。第二，找出跌倒前的那一個時段和地點，先改那裡。第三，若牽涉成癮，例如賭博、酒精、色情，請同時尋求專業的協助，這不是信心不夠。全卷立場見 ISS00_3。"]],["h","二、先被加力，再把棒交出去"],["p","「我兒啊，你要在基督耶穌的恩典上剛強起來。」（2:1）騎電動機車的人都知道，電量剩下一格的時候，不是咬緊牙關多騎兩公里，是把車騎進換電站，把空的電池拿出來，換一顆滿的進去。「剛強起來」原文是現在式命令，而且多數解經家讀作被動：要一直被加上力量。保羅是對一個怯懦的年輕人說：力量不在你裡面，在基督耶穌的恩典裡，你要常常回到那裡去換。這不是考試，是一個地址。"],["p","被加力之後，才是交託：「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」（2:2）請看兩件事。第一，條件的次序：先是忠心，然後才是能教導。第二，「在許多見證人面前」：保羅交出去的不是一套私下傳授的祕訣，是公開的、可以被眾人檢驗的道。所以屬靈父親不是屬靈主人，提摩太不必變成保羅，忠心的人也不必變成提摩太。傳承不是複製一個我，是讓主的道活在另一個人身上。"],["p","接著三個畫面。第一個是兵：「你要和我同受苦難，好像基督耶穌的精兵。」（2:3）「同受苦難」在原文是一個字，字首就是「同」，這苦不是一個人扛的。然後是：「凡在軍中當兵的，不將世務纏身，好叫那招他當兵的人喜悅。」（2:4）「纏身」這個字，你看過口袋裡的耳機線就懂：沒有人去打結，放進口袋走一段路，拿出來就纏成一團。纏住人的常常不是壞事，是太多的好事，多到聽不見號角。不將世務纏身不等於不顧家，也不等於不可以有正職。保羅在前一封信說：「人若不看顧親屬，就是背了真道，比不信的人還不好」（提前 5:8）。問題不在你有沒有家、有沒有工作，是你現在要討誰的喜悅。"],["p","比武的人要按規矩，這條路的規矩是先同死，才同活。第三個畫面是農夫：「勞力的農夫理當先得糧食。」（2:6）講道的人先被道餵飽，帶人的人先被恩典滋潤。然後保羅沒有把比喻解釋到底，他說：「我所說的話，你要思想，因為凡事主必給你聰明。」（2:7）該說的說了，把空間留給主。"],["d",["2:4 說不將世務纏身，我是不是應該辭掉工作去全職事奉，才算真正的精兵？","不一定。2:4 的背景是羅馬的現役兵不可以另外經商、替人管產業，原則是好叫那招他當兵的人喜悅：問題是討誰喜悅，不是領誰的薪水。保羅自己有時接受供給，有時織帳棚，親手供給自己和同工的需用。全職和帶職是不同的呼召，各按時期與處境，沒有高低。分辨的時候可以問三個問題：我想辭職，是因為主清楚的呼召，還是因為想逃離眼前的工作？我的家人怎麼看，我們的生活怎樣負擔？教會的牧長和同行的人，有沒有看見同樣的方向？請和他們一起禱告，不要在一場感動的聚會之後當晚就遞辭呈。"]],["d",["我自己從來沒有被好好帶過，也不覺得自己能教導人，2:2 的交託要怎麼開始？","先看條件的次序：保羅先找的是忠心的人，然後才是能教導別人的人。所以你不必先成為很會講的人，才可以開始。把棒交到你手上的，未必是一位正式帶你的人，可能是一位長輩或一位陪你禱告的朋友，你已經被交託過了。開始的方法很小：這一季，找一位比你晚信主的人，每兩週見一次面或打一通視訊，一起讀一段經文，你只問兩個問題：這一段說了甚麼？你這一週要怎麼活？你不是他的屬靈主人，只是陪他走一段的人。有不懂的，就一起去問牧者，這本身就是一種教導。"]],["h","三、原文亮光：不認、失信、不能"],["p","精兵、比武、農夫，一個怯懦的人聽完，可能更怕了：我會掉棒。保羅知道，所以他叫提摩太抬頭：「你要記念耶穌基督乃是大衛的後裔，他從死裡復活」（2:8）。「記念」是現在式，不是想起一次，是一直放在眼前。受苦的人最容易記住自己的苦，保羅要他記住那一位已經復活、一直活著的主。然後一句：「然而神的道卻不被捆綁。」（2:9）鎖鍊和捆綁在原文是同一個字根：人被綁住了，道沒有。"],["p","就在這個最低的地方，保羅唱起一首詩，這是全卷要停下來的地方：「有可信的話說：我們若與基督同死，也必與他同活」（2:11）；「我們若能忍耐，也必和他一同作王。我們若不認他，他也必不認我們」（2:12）。前兩行是我們的路：同死是過去式，受洗歸入基督時已經發生了；同活是將來式，一定會發生。忍耐的盡頭，不是被遺忘，是同作王。後兩行，是兩種失敗。請記三個原文字。"],["p","第一個是 ἀρνησόμεθα（arnēsometha），不認。這是有意的、立場式的否認，是公開地說我不認識他；主自己說過：「凡在人面前不認我的，我在我天上的父面前也必不認他。」（太 10:33）而且這裡用的是將來式，眼光放在終點：問的不是某一刻的軟弱，是一個人最後站在哪裡。這是真的警告，不可以削掉。一個刻意、長期轉身離開主的人，這一行就是對他說的，他不能把下一行拿來當擋箭牌。"],["p","第二個是 ἀπιστοῦμεν（apistoumen），失信，是另一個字：不忠信、守不住、信不下去。可是我們要誠實：福音書記彼得在大祭司院子裡三次說「我不認得那個人」（太 26:72），用的正是第一個字。所以分別不只在字典，更在最後的方向。那一夜之前，主已經對彼得說：「你回頭以後，要堅固你的弟兄。」（路 22:32）不是「如果你回頭」，是「你回頭以後」。彼得跌得很重，可是他被找回來了。這首詩第三行說的，是到底不回頭的否認。"],["p","這兩行怎樣同時成立，教會歷史上有三種讀法：聖徒恆忍、真實離棄的可能、警告是保守的工具。本講義三讀並陳，這裡不辯論，只守一條規矩：讀完第三行，一定接著讀第四行。"],["p","第三個字是 οὐ δύναται（ou dynatai），不能。「我們縱然失信，他仍是可信的，因為他不能背乎自己。」（2:13）前三行是對稱的；到了第四行，對稱被打破了：我們失信，他卻仍是可信的。全能的神有一件事做不到：他不能背乎自己。這個「不能」，和 2:1「剛強起來」是同一個字根：神的能力，用在不放開他自己說過的話。回到開頭那個問題：神還算我數嗎？算不算數，不是看你的紀錄，是看他的話；他說過的話，沒有一句收回過。"],["d",["2:12 和 2:13 放在一起，基督徒到底會不會失去救恩？本講義站在哪裡？","這是教會歷史上很久的討論。改革宗讀成聖徒恆忍：2:12 指最終全然的背棄，真正屬神的人不會走到那一步。阿民念和衛斯理宗讀成：真實的信徒有可能最終離棄，警告是對信徒說的。第三種讀法說，警告是真的，神正是藉著警告保守他的人，確據與警告並行。本講義沿用希伯來書講義對 6 章、10 章的處理：三讀並陳，講台的落點掛在 2:13 末句「因為他不能背乎自己」。對正在軟弱中的人，我們指向他的可信；對刻意轉身的人，我們誠實地說出警告。這個分歧不應該成為分門的理由。全卷立場見 ISS00_3。"]],["d",["我有一位家人信主很多年，後來說他不信了，也不再去教會，2:12 是在說他嗎？","我們不能替任何人下結論，「主認識誰是他的人」（2:19），名單在主手裡，不在我們手裡。2:12 是一個真實的警告，但它說的是到底不回頭的否認，一個人的故事還沒有寫完以前，我們沒有看見結局。彼得在那一夜說「我不認得那個人」，可是主在那之前已經為他祈求。你能做的，是繼續為他禱告，繼續愛他，不要讓每一次見面都變成一場辯論。若他願意談，先聽他說：他是被教會傷過、被問題卡住，還是正在過另一種生活？也請不要自責，兒女或配偶的選擇，不是你的成績單。"]],["h","四、先把自己切直，再溫和地待人"],["p","詩唱完了，保羅轉到一個實際的問題：有人講錯了怎麼辦？「不可為言語爭辯；這是沒有益處的，只能敗壞聽見的人。」（2:14）「言語爭辯」原文是一個合成字，用字打仗。輸掉的是旁邊聽的人。所以保羅的第一個指示不是去辯倒誰，是使眾人回想這些事：把真的講清楚。"],["p","「你當竭力在神面前得蒙喜悅，作無愧的工人，按著正意分解真理的道。」（2:15）原文這一句的第一個受詞是「你自己」：在你切任何東西以前，先把你自己呈現給神，讓他驗。「按著正意分解」原文 ὀρθοτομοῦντα（orthotomounta），新約只有這一次，意思是直直地切開。布莊的老師傅下剪以前，先摸布紋，順著紋路一剪到底，衣服才穿得正；逆著紋路硬剪，越剪越歪。斷章取義、只挑自己喜歡的經句，就是逆著紋路剪。而這把剪刀第一個要量的，是拿剪刀的人。按著正意分解，是先把自己切直，不是拿經文去切別人。"],["p","錯誤不會因為我們不吵就自己消失：「他們的話如同毒瘡，越爛越大」（2:17），許米乃和腓理徒「說復活的事已過」（2:18）。可是下一節，保羅馬上立起一塊基石：「然而，神堅固的根基立住了」，上面有兩行印記。華人買房子，買賣契約上要蓋兩方印，一方是賣的，一方是買的。這塊基石也蓋了兩方印。第一方是神的：「主認識誰是他的人」（2:19），這就是算數，名單在主手裡，不在我們手裡；第二方是我的：「凡稱呼主名的人總要離開不義」（2:19），命令的對象是稱呼主名的人，就是我自己。有確據的人，不是因此放心犯罪，是因此有力量離開。"],["p","「人若自潔，脫離卑賤的事，就必作貴重的器皿，成為聖潔，合乎主用，預備行各樣的善事。」（2:21）請聽清楚，要脫離的是事，不是隔離人。「合乎主用」這個字，保羅在第四章用在馬可身上：「因為他在傳道的事上於我有益處」（4:11），那就是當年半路離開、保羅不肯再帶的人。然後是一逃一追：逃避少年的私慾，並且「同那清心禱告主的人追求公義、信德、仁愛、和平」（2:22）。請聽那個「同」，追求不是一個人的事。"],["p","最後，這一章回到兵：「然而主的僕人不可爭競，只要溫溫和和地待眾人」（2:24），而且要「用溫柔勸戒那抵擋的人；或者神給他們悔改的心」（2:25）。為甚麼？因為他們是被擄去的，要「可以醒悟，脫離他的網羅」（2:26）。「醒悟」原文是從酒醉中醒過來。你扶過喝醉的朋友嗎？你不會跟他辯論，你會先把他平安送回家，等他醒過來。那個「或者」也很要緊：我負責溫柔、忍耐、教導，悔改是神的禮物。可是溫和不等於任人欺壓，受了傷害說出來、求助，都不是爭競。"],["d",["2:15 說按著正意分解真理的道，一般信徒在家讀經，要怎樣練習不斷章取義？","可以從三個習慣開始。第一，讀一節以前，先讀前後各一段，問自己：這一段是誰寫給誰的、在甚麼處境裡？同一句話放回上下文，常常意思就不一樣了。第二，讓聖經解釋聖經：遇到難懂的經文，先找本書其他地方怎麼說，再找其他書卷，最後才看自己的感覺。第三，先問這一段要怎樣把我切直，再問它對別人說甚麼。實際的做法是：這一週讀 2:14--26，每天寫下一句這段經文在說甚麼，和一句它在說我甚麼。讀到想拿去教訓別人的地方，先停下來問：這一句我自己做到了嗎？遇到想不通的，帶到小組或請教牧者。"]],["d",["2:21 說人若自潔，脫離卑賤的事，是不是要跟有錯的信徒或離開的同工斷絕來往？","不是。和合本譯作「脫離卑賤的事」，已經選了一種讀法：要脫離的是事，不是隔離人。上下文也支持這樣讀：前面是世俗的虛談與錯誤的教導，後面緊接著要提摩太用溫柔勸戒那抵擋的人，不是叫他與人斷絕。所以第一步是先檢查自己：我手上有沒有該脫離的事？例如一個專門論斷人的群組、一個放不下的習慣。至於人，可以保持界線，不必參與他錯誤的事，卻不必把人關在門外。當然，若對方正在傷害你，保持距離、保護自己是對的。馬可曾經半路離開，後來卻成了於我有益處的人；拿這一節切割人，等於把神可能正在潔淨的器皿先摔碎。分離與合一的界線，議題頁另有處理。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是先講 321 的繁殖，再拿 2:2 當插圖，甚至把它講成一年帶幾個、幾年翻幾倍的業績公式。2:2 先是一位快要殉道的父親，把神寄放在他手裡的道交出去，條件是先忠心、後能教導；繁殖是傳承的果子，不是傳承的定義。"],["p","第二個偏差，是用 2:12 製造得救焦慮：你上次在同事面前不敢承認，主已經不認你了；講完第三行就停，不讀第四行。最常被這種講法壓垮的，偏偏是最怕得罪神、最不可能刻意離棄主的人。講 2:12，必講 2:13。"],["p","第三個偏差，是反過來拿 2:13 當擋箭牌，好像不管怎麼活，主都得收我，這是誤用；或者把兩行的分別全押在兩個希臘字上，說彼得只是失信、不算不認。彼得用的正是不認那個字，分別在最後的方向：回頭，還是到底不回頭。"],["p","第四個偏差，是用 2:3--4 的精兵美化過勞、犧牲家庭：你還想休息、還在顧家，就是被世務纏住了；或者把帶職事奉的弟兄姊妹講成半個兵。不將世務纏身說的是不被纏到聽不見號角，不是不顧家人，也不是不可以有正職。"],["p","第五個偏差，是拿 2:15 和 2:21 去切別人：在群組裡貼一節經文配一句你自己看，把意見不同的人切成異端；或者叫會眾跟有錯的人、離開的同工斷絕來往。按正意分解是先切直自己；要脫離的是事，不是人。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：沒有臉回來。在華人的教會裡，跌倒的人通常不是回來，而是消失。賭債被發現了、婚姻出了事，最先想到的是面子：大家都知道了，我怎麼還有臉坐在那裡？於是從不敢來變成不想來。2:13 正是給這樣的人的：他仍是可信的。彼得三次不認主以後，主沒有等他先把面子找回來，是主在海邊三次問他愛不愛他，然後說：「你餵養我的羊」（約 21:17）。小組能做的，是不問你為甚麼不來，只傳一句：我們還留著你的位子。若一個人是刻意離開，我們也溫柔地把 2:12 的警告講給他聽，這同樣是愛。"],["p","第二個問題：全職才算數嗎？華人信徒常有兩種壓力。一種在教會裡：週間上班、週末帶小組的弟兄，常被看成次一等的服事者，好像只有辭職全職才是真正的精兵。另一種在家裡：服事的父母一週跑好幾個聚會，孩子問爸爸你又要去教會喔，大人卻說這是為主擺上。2:4 的原則是好叫那招他當兵的人喜悅，問的是討誰喜悅，不是領誰的薪水；保羅自己織帳棚，也要外衣、要書、要同伴。帶職的人可以是完整的兵；照顧家人，本身就是事奉的一部分。"],["h","七、活出321——站在他的可信上面"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：2:8 叫受苦的人記念的，是那一位從死裡復活的主。他走過的路是先同死、後同活；他也是那一位在彼得失信之後，把羊交回彼得手上的主；我跟隨的不是一位只會給標準的教練。"],["p","聖經是我的準則：2:15 要我按著正意分解真理的道。準則先量我，再量我手上的事工；剪刀先順著布紋走過我自己。"],["p","聖靈是我的引導：2:7 說凡事主必給你聰明。保羅沒有把每個比喻都解釋到底，他相信主會親自教他的兒子；我讀經、帶人的時候，也把空間留給那一位住在我們裡面的聖靈。"],["p","讓耶穌作王：2:12 說我們若能忍耐，也必和他一同作王。作王是將來的事，今天是忍耐的事；今天要讓出的，是討誰喜悅的那個位置（2:4），和鑑定誰是真的那個位置（2:19）。"],["p","讓耶穌得著一切的榮耀：這一章的翻轉，是把讚美從我的忠心移到他的可信。被捆綁的人唱的詩，最後一行的主詞是他，不是我們，榮耀也該歸給他。"],["p","建立屬神的體系：讀完 2:2 和 2:19 才看得見，體系的生命線是傳承，不是組織；地基是神堅固的根基，不是帶領人的魅力。國度321空中團契散在幾個國家，線上小組最容易變成一個人講、一群人看；2:2 問每一位小組長：誰是你正在陪、將來可以接手的忠心的人？到這裡，321 才認出它所說的繁殖：不是複製更多的我，是讓主的道在更多人身上活起來。"],["h","八、四種心，誰還算數"],["p","驕傲型的心，把自己的忠心當成根基：我讀經、我服事、我守得住；而且常常要贏，要別人承認我切得比較直。這一章請你看第四行，主詞不是你，是他；也請你看 2:24，基督的精兵打的仗不是跟人打的。"],["p","恐懼型的心，最怕掉棒：怕自己有一天守不住，怕交出去的棒被人搞砸，所以甚麼都不敢放手，也不敢開始。請你回到 2:1：力量不在你裡面，是被加上的；再讀 2:13：最後撐住這一場接力的，是那一位不能背乎自己的主。"],["p","羞恥型的心，覺得自己已經是瓦器裡最破的那一個：跌倒過、離開過、被人知道過。請你聽 2:21，決定貴重的不是材料，是有沒有被潔淨；馬可曾經是那個被認為沒有用的人，後來成了「於我有益處」的人。主認識你，主還算你的數。"],["p","受傷型的心，也許正是被一節經文切傷過的人：有人拿 2:12 嚇過你，有人拿精兵叫你不准休息，有人用不可爭競叫你閉嘴。那些都不是這一章的意思。你不必先原諒誰才算屬靈；那位不能背乎自己的主，也不會用他的話來壓碎你。若你仍在不安全的處境裡，先讓一位信得過的人陪你找到安全，必要時尋求專業的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上用三分鐘慢慢讀 2:11--13。讀到第三行停一下，誠實地問主：我心裡有沒有一個地方正在刻意轉身？讀到第四行，再對主說一句：我的忠心靠不住，我靠你的可信。"],["p","第二，每晚睡前寫下一件今天纏住你的事，旁邊標一個字：家、主或纏。週末只挑一個纏，下一週減掉一半；同時在行事曆上排一段真正的休息。"],["p","第三，在這一週約一位比你年輕或比你晚信主的人，吃一頓飯或打一通視訊，一起讀 2:1--7，只問他：這一段哪一句最像你現在的處境？"],["p","第四，傳一封訊息或打一通電話，謝謝當年把信仰交到你手上的那一個人，說出他哪一句話你到今天還記得。"],["p","第五，這一週在群組裡遇到想反駁的話，先等一個晚上再回；如果還要回，只寫一句溫和的話和一句真實的話，不貼標籤、不翻舊帳。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我縱然失信，他仍是可信的，因為他不能背乎自己；我的數，是他算的。"],["p","我宣告：我不靠自己生出力量，我天天回到基督耶穌的恩典裡被加力。"],["p","我宣告：主所交給我的，我不私藏；我要交託那忠心能教導別人的人，不是複製一個我。"],["p","我宣告：我先讓真理的道把我切直，我不與人爭競，我要溫溫和和地待眾人。"],["d",["群組裡有人一直轉貼錯誤的教導，2:24 說不可爭競，是不是我就只能甚麼都不說？","不是。保羅在同一章清楚地指出了錯誤，也要提摩太善於教導，用溫柔勸戒那抵擋的人；不可爭競是不為了贏而吵，不是不准說真話。實際上可以這樣做。第一，先私下說，不要在大群組裡公開指正，一對一的訊息比較不會變成一場戰爭。第二，只說一句溫和的話和一句真實的話，例如：這一段我讀到的意思不太一樣，可以一起看上下文嗎？然後附上經文。第三，對方不接受，就停在那裡，把悔改交給神，那個或者是神的工作。第四，若錯誤正在影響小組裡初信的人，請告訴組長或牧者，由他們來處理。說完以後，為他禱告。"]],["h","十、結語"],["p","第二章從一個怯懦的兒子開始，中間是一首在鎖鍊裡唱的詩。全卷火、兵、經、冠，這一章是兵：要上陣，要交棒，要吃苦；可是這個兵最後被叫作主的僕人，他的仗不是跟人打的，他站得住，也不是靠自己站。"],["p","這一課的焦點，不在我們夠不夠忠心、跌倒過幾次，也不在保羅在牢裡有多勇敢，焦點在那一位不能背乎自己的主。所以次序是：先被加力，「你要在基督耶穌的恩典上剛強起來」（2:1）；再把棒交出去，「也要交託那忠心能教導別人的人」（2:2）；而我們交得出、跑得下去，是因為「我們縱然失信，他仍是可信的，因為他不能背乎自己」（2:13）。第四章保羅會說：「惟有主站在我旁邊，加給我力量」（4:17），正是第一節那個字。請你不要更佩服保羅，請你更愛那一位站在保羅旁邊、也站在你旁邊的主。"],["p","我們一起低頭禱告。不能背乎自己的父神，謝謝你，在我們跌倒很多次以後，你仍然算我們的數。求你叫我們天天回到基督耶穌的恩典裡被加力，不將世務纏身，也不忽略家人；叫我們把所領受的交給忠心的人，不私藏，也不轄制。求你先用你的道把我們切直，叫我們溫溫和和地待人，把悔改的心交給你來賜。求你像找回彼得那樣，找回那些不敢回來的弟兄姊妹。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰最忠心，是讓每一個人說出一次沒有守住的經驗、一樣纏住自己的事，和這一週要交出去的一棒；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是加力、算數、切直。席上可能有懷疑自己還算不算數的人，也可能有被經文傷過的人；請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：力量是被加上的；他仍是可信的，所以跌倒的人回得來；按著正意分解是先把自己切直。"],["n","1. ★ 開場那個問題：我跌倒過很多次了，神還算我數嗎？你最近一次心裡冒出這個問題，是在甚麼時候、為了甚麼事？說一句就好。"],["n","2. ★★★ 請用自己的話說：2:12 的不認和 2:13 的失信差在哪裡？彼得不認主用的也是不認那個字，那麼真正的分別在甚麼地方？"],["n","3. ★★ 口袋裡的耳機線不是誰去打結的。說出一樣你生活裡本來是好事、卻慢慢纏住你的東西，它是怎麼纏上來的？"],["n","4. ★★ 2:2 的條件是先忠心、後能教導。在你的經驗裡，誰是一位忠心的人？他做了哪一件事，讓你看見他的忠心？"],["m","帶領提醒：有人想辯論基督徒會不會失去救恩，請一句指向議題頁與全卷立場，不在組裡辯論；不評論任何講員或宗派。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一次沒有守住的經驗，聽見他仍是可信的，並說出這一週的一步。"],["t","【看】看見自己"],["n","5. ★★★ 說出一次你覺得自己沒有守住的時候：在家裡、職場、服事上，還是在網路上？那一次之後，你離主近了一點，還是躲遠了一點？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:11--13 兩遍。在哪一行你停了下來？讀到「他仍是可信的」這幾個字，今天主對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你不敢相信他仍算你的數，卡在哪裡：怕自己是在找藉口、覺得沒有臉回來、被人用 2:12 嚇過，還是心裡真的有一個地方正在轉身？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：我的忠心靠不住，我靠他的可信。說完以後，右手邊的人只回一句：他不能背乎自己。不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要回到恩典裡被加力的一個時間和地點，例如星期幾早上幾點、在哪裡讀 2:1--13；也寫下你要減掉的那一樣纏住你的事。"],["m","帶領提醒：這一化可能碰到成癮、婚姻破裂、家庭傷害、長期無望感。不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」；不判斷任何人得救與否。會後單獨關心，必要時協助尋求專業協助。第七題之後留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一棒要交出去、一位要陪的人、一位要講給他聽的朋友。"],["n","10. ★★ 說出一位當年把信仰交到你手上的人，這一週星期幾、用甚麼方式謝謝他？你要告訴他哪一句話你到今天還記得？"],["n","11. ★★ 你現在負責的那一件服事或工作，有沒有一位可以一起做、半年後接手的人？說出他的名字，這一週哪一天邀他一起參與一次。"],["n","12. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位很久沒有來聚會、或懷疑自己還算不算數的人。當場說出他的名字，說出這一週哪一天你要傳給他一句話，不問他為甚麼不來，只陪他讀 2:13。"],["n","13. ★ 這一週在群組或家裡，你最可能和誰起爭競？說出那個場合，以及你要先等一個晚上、只回一句溫和又真實的話的做法。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我常常做不到自己答應的事，連對神也是。第二句，可是聖經說，我們縱然失信，他仍是可信的，因為他不能背乎自己。第三句，所以我信的不是自己有多可靠，是那一位說話算話的神。下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更忠心」這類答案；不在組裡評斷任何一位離開的人或群組裡的人。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要交出去的那一棒是甚麼。"],["p","然後彼此代禱，為三種人指名禱告：一位快要撐不下去的同工，求主加給他力量和真實的休息；一位跌倒而遠離聚會的人，求主找他回來；一位被經文傷過的人，求主醫治他。"],["p","最後由組長慢慢讀一遍：「我們縱然失信，他仍是可信的，因為他不能背乎自己。」（2:13）"]]},"3":{"no":3,"vol":"《321提摩太後書講義》第三課·提摩太後書第三章","title":"叫屬神的人得以完全——鏡子、石頭、夾板","chars":5101,"min":60,"deep":8,"dchars":1721,"tchars":1372,"blocks":[["h","一、聖經是拿來對付人的嗎？"],["p","弟兄姊妹平安。「聖經是拿來對付錯誤的人用的。」這句話很少有人真的說出口，可是我們常常這樣用聖經。家裡吵架吵到一半，有人翻出一節經文，把手機螢幕轉過去給對方看；群組裡有人轉發一段經文，底下只加一句：給某某人看看。還有一句話聽起來溫和得多，也常聽到：讀經就是要找到答案。該不該換工作，翻開聖經，找到一節像答案的話，就合上了。"],["p","這兩句話都不是全錯。可是請聽保羅自己怎麼說聖經的用處：「聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，叫屬神的人得以完全，預備行各樣的善事。」（3:16--17）四個用處裡，教訓和督責說甚麼是對的、哪裡錯了；使人歸正和教導人學義，是把人扶正、把人養大。四個裡面有兩個是扶正。目的不是叫錯的人閉嘴，也不只是給你一個答案，是叫屬神的人得以完全。第一個被這本書扶正的，是拿著它的那個人。"],["p","這句話不是在書房裡寫的。寫的人被捆綁在羅馬的牢裡，知道自己離世的時候到了；收信的是他在以弗所的屬靈兒子，年輕，可能天性膽小。全卷四個字：火、兵、經、冠。第一章把火挑旺，第二章學會吃苦、把棒交出去；第三章是經：路忽然暗下來的時候，父親留給兒子的不是一套策略，是一本書。這一章有全卷最低的谷，3:5 只剩外貌的敬虔；也有第三座山，3:16 神所默示的聖經。越往下走，主越近。"],["p","這一課用三樣東西走完第三章：一面鏡子、一塊石頭、一副夾板。鏡子是 3:1--9 那張清單，先照自己；石頭是 3:10--15 路司得的石頭，一個少年人在那裡看見了甚麼；夾板是 3:16--17，神怎樣用他的話，把歪掉的人扶直。"],["d",["3:1 說末世必有危險的日子來到，那是不是表示現在已經是最後的時候了？","新約說的末世，從基督第一次顯現就開始了：彼得在五旬節說那就是末後的日子，希伯來書說神在這末世藉著他兒子說話，約翰說如今是末時了。主一定會再來，日子也確實會艱難，可是主自己說那日子那時辰沒有人知道。所以本講義不排時間表，只說這是每一代都要警醒的日子。警醒不是追新聞、轉發預言，是好好過今天：該上的班照樣上，該和好的人今天就去和好。主再來的相關爭議，見帖撒羅尼迦前書立場二。"]],["h","二、鏡子：一張用「愛」開頭的清單"],["p","「你該知道，末世必有危險的日子來到。」（3:1）末世這兩個字很容易被拿去算日子。保羅沒有給提摩太一個年份，他給他一個命令：要知道，原文是現在式，要一直知道著。新約說，從基督第一次顯現（1:10），末後的日子就開始了；第一世紀的以弗所和今天的我們，站在同一段時間裡。所以這一課不說這就是今天，只說：這是每一代都要警醒的日子。"],["p","危險從哪裡來？保羅用「因為」解釋，答案不是政局，也不是天象，是人：「因為那時，人要專顧自己，貪愛錢財，自誇，狂傲，謗讟，違背父母，忘恩負義，心不聖潔」（3:2）。十八項讀起來像晚間新聞，很容易往外貼。可是請你先看它的頭尾：第一項是專顧自己，最後一項是「愛宴樂，不愛神」（3:4）。用愛開頭，用愛收尾；人不是不會愛，是愛錯了對象。"],["p","所以這張清單不是放大鏡，是一面鏡子。放大鏡拿來看別人的毛病，越看越大；鏡子只照得到站在它前面的那一個人。主耶穌說：「為甚麼看見你弟兄眼中有刺，卻不想自己眼中有樑木呢？」（太 7:3）你讀到哪一項停下來？不解怨，忘恩負義，還是愛宴樂？那一項，就是這面鏡子今天要給你看的。"],["p","「有敬虔的外貌，卻背了敬虔的實意；這等人你要躲開。」（3:5）原來清單上的人在教會裡面：會禱告，會聚會，會講屬靈的話。「實意」原文是能力，和 1:7 神所賜剛強的心是同一個字。外貌可以學、可以排練，能力學不來，只能從神那裡來。這是全卷最低的谷：裡面只剩一層殼。躲開是不跟著走、不被牽著走，不是發一份黑名單；而第一個要問的，仍然是：我是不是只剩外貌了？"],["p","「那偷進人家、牢籠無知婦女的，正是這等人。」（3:6）這一節不是看不起女性。保羅責備的是偷進人家的人；被擄的人有兩個難處：「被各樣的私慾引誘」（3:6），「常常學習，終久不能明白真道」（3:7）。這兩樣弟兄姊妹都會有，下一節敵擋摩西的兩個人就是男人。保羅在提摩太前書給的對策是「女人要沉靜學道」（提前 2:11），是讓她們好好學。學習沒有錯，錯在學習變成了不必悔改的理由。"],["p","然後保羅舉了一個舊約的例子：「從前雅尼和佯庇怎樣敵擋摩西，這等人也怎樣敵擋真道。」（3:8）出埃及記只說是法老的術士，名字是猶太傳統傳下來的，保羅用的是當時人人知道的稱呼。術士也能把杖變成蛇，可是「亞倫的杖吞了他們的杖」（出 7:12）。最難分辨的敵擋，常常是做一個很像的。可是「他們不能再這樣敵擋」（3:9）：模仿的有盡頭，真道不必靠提摩太去保護。"],["d",["3:5 說「這等人你要躲開」，那我是不是該跟教會裡看起來不夠屬靈的人保持距離？","不是這個意思。保羅說的是長期否認敬虔的能力、卻保留敬虔外貌的人，看的是一個人長期的方向，不是一次的跌倒、一段軟弱的日子，更不是意見和你不同。「躲開」是不跟從、不被他牽著走，不是公開羞辱、不是斷絕所有往來。同一位保羅在上一章說，主的僕人要用溫柔勸戒那抵擋的人，或者神給他們悔改的心。分辨時先問：他是在軟弱中掙扎，還是刻意拒絕神碰他？問我是不是只剩外貌，比問誰是那種人，安全得多，也有用得多。"]],["h","三、石頭：路司得的少年人看見了甚麼"],["p","「但你已經服從了我的教訓、品行、志向、信心、寬容、愛心、忍耐」（3:10）。前面九節講的都是他們，這裡一開口是「但你」。「服從」原文是緊緊跟在旁邊走：不是遠遠聽說，是貼身看過。這也是一張清單，和前面那十八項正好相對。"],["p","接著保羅點了三個地名：「以及我在安提阿、以哥念、路司得所遭遇的逼迫、苦難。」（3:11）路司得就是提摩太的家鄉。使徒行傳講義第 14 章講過那一天：「就用石頭打保羅，以為他是死了，便拖到城外。」（徒 14:19）請你把畫面停在那裡：城外的路邊，一個人倒在石頭堆裡，門徒圍著他；人群後面，也許站著一個十幾歲的少年。然後倒下去的人動了，站起來，又走回城裡。多年以後，那個少年收到一封信：你都看見了。"],["p","可是這一段的重點不在保羅多能忍。同一節的最後一句是：「但從這一切苦難中，主都把我救出來了。」（3:11）救出來是從裡面被拉出來，不是沒有進去。主救他的方法也不只一種：在以哥念，是叫他逃到路司得；在大馬士革，門徒「在夜間用筐子把他從城牆上縋下去」（徒 9:25）；在路司得，是在石頭底下活過來。提摩太該記得的，不是一位多勇敢的父親，是那一位一次又一次把父親救出來的主。"],["p","然後是一句很硬的話：「不但如此，凡立志在基督耶穌裡敬虔度日的也都要受逼迫。」（3:12）這是陳述，不是命令；逼迫會來，不是叫人去找。請聽清楚它的條件：在基督耶穌裡，敬虔度日。不是一切的不順都叫逼迫：被批評，可能是我真的做錯了。「你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？」（彼前 2:20）"],["p","還有一件事要說得很清楚：在家裡被打、被威脅、被控制，不是為主受逼迫，也不是你該背的十字架。你不必為了顯得屬靈而留在危險裡。主說：「有人在這城裡逼迫你們，就逃到那城裡去。」（太 10:23）人身安全受威脅的時候，先保護生命，找信得過的人陪你，依法求助，這跟忠心一點都不衝突。這一節也不是說日子平安的人不夠敬虔；它是說：你若因為在基督裡好好活著而被追趕，不要以為自己走錯了路。"],["p","外面不會自己變好，作惡的「必越久越惡，他欺哄人，也被人欺哄」（3:13）。所以保羅第二次說「但你」：「但你所學習的，所確信的，要存在心裡；因為你知道是跟誰學的」（3:14）。「誰」在原文是複數。一條線是家裡的外祖母和母親（1:5），從他還在吃奶的時候；另一條線，是路司得那個被石頭打過的屬靈父親。"],["p","請記得，提摩太的家也不完整：「他父親卻是希臘人。」（徒 16:1）家裡第一代信主的弟兄姊妹，你一點都不次等；屬靈父母這一條線，對你同樣真實。兒女還沒有信主的父母，也請不要因為這一節自責。保羅最後說：「這聖經能使你因信基督耶穌，有得救的智慧。」（3:15）前面那些人「不能」明白真道，這裡說聖經「能」，原文是同一個字。差別不在讀的人多聰明，在這本書指向誰。"],["d",["我的兒女從小上主日學，長大後卻不去教會了，是不是我當年沒有好好教？","請不要這樣定自己的罪。3:15 說提摩太從小明白聖經，這是一份祝福，不是一張保證書；家庭信仰是恩典，不是得救的條件。信心不是父母可以替兒女決定的：友妮基的丈夫在經文裡只留下希臘人這三個字，她一樣是一位忠心的母親。神沒有孫子，每一個人都要自己因信基督耶穌得救。你可以做的，是繼續做兒女的家人：照常關心他的工作和身體，找兩三位弟兄姊妹和你一起為他禱告；把門一直開著，讓他知道回來的時候，家裡有一盞燈。傳承的全卷立場見 ISS00_5。"]],["d",["我的配偶常常打罵我，還不准我去聚會，這是不是 3:12 說的、我應該忍受的逼迫？","不是。被打、被罵、被威脅、被控制，不是你該背的十字架，你也不必為了顯得屬靈而留在危險裡。3:12 的條件是在基督耶穌裡敬虔度日，它是陳述，不是叫受害的人忍下去的命令。保羅自己也逃過，主也說，有人在這城裡逼迫你們，就逃到那城裡去。可以這樣做：第一，若此刻有危險，先到安全的地方，打當地的緊急電話或家暴求助專線。第二，保存每一次受傷的日期、情況和照片，必要時就醫留下紀錄。第三，告訴一位信得過的牧者或弟兄姊妹，請他陪你找社工、法律和專業的協助。教會會陪你，你不是一個人。全卷立場見 ISS00_2。"]],["h","四、原文亮光：愛自己、重新扶直、裝備齊全"],["p","現在走上這一章的山頂。主日講台已經拆過「默示」那個字；這一課換三個字，把整章從頭串到尾：一個是病，一個是藥，一個是目的。"],["p","第一個字是病：φίλαυτοι（philautoi），3:2 清單的第一項，和合本譯「專顧自己」，原文就是愛自己，整本新約只出現這一次。這不是說不可以照顧自己，是中心換了。後面十七項幾乎都可以從它推出來：先愛自己，就會愛錢，因為錢保護那個自己；會自誇，因為那個自己需要被看見；最後一項 φιλήδονοι μᾶλλον ἢ φιλόθεοι（philēdonoi mallon ē philotheoi），愛享樂勝過愛神：不一定完全不愛神，只是有一樣東西排在他前面。這是全新約對「有己」最直接的一張素描。"],["p","第二個字是藥：ἐπανόρθωσιν（epanorthōsin），3:16 的「使人歸正」，字面是重新扶直。請想像骨科的一副夾板：醫生不會拿夾板打病人，他把斷骨對正、綁好，讓它在對的位置上長回去。督責像那張 X 光片，清清楚楚照出哪裡斷了；歸正是那副夾板，把人固定在可以癒合的位置；教導人學義，原文是養育孩子的字，像拆掉夾板以後每天的復健。三樣都是為了叫人好起來，沒有一樣是棍子。這個「直」和 2:15「按著正意分解真理的道」（2:15）同一個字根：先被扶直的，是拿著這本書的人。"],["p","第三個字是目的：ἐξηρτισμένος（exērtismenos），3:17 的「預備」，完成式被動分詞，已經被裝備齊全；它和「得以完全」的 ἄρτιος（artios）同一個字根。完全在這裡不是一百分、沒有缺點，是合用：一個人被裝備好了，可以出門去做事。這一章出現過專顧自己的人、心地壞了的人、作惡的人，最後一個是屬神的人。整章從愛自己的人開始，到屬神的人結束；把人從前者帶到後者的，就是這本書。"],["p","3:16 的文法有兩種讀法：和合本讀成聖經都是神所默示的，也都是有益的；和合本的註腳作凡神所默示的聖經。兩種讀法都承認聖經出於神。默示細部的定義，福音派弟兄姊妹之間有不同說法；本講義站在福音派對聖經權威的共同立場，不拿這些細節分門別類。這一課要你帶回家的是：這本書是神的話，所以它先要扶正你。"],["d",["3:16 說聖經是神所默示的，那我手上讀的中文譯本也是神所默示的嗎？","默示指的是神藉著原來的作者所呼出的話，也就是用希伯來文、亞蘭文、希臘文寫下的經文。忠實的翻譯把這些話帶到我們的語言裡，所以譯本有權威，你讀的時候神確實在向你說話；同時每一個譯本都可以被原文校正，和合本也有它的小字和不同讀法。所以不必把某一個譯本神聖化，也不必反過來說既然是翻譯，哪一句都不必認真。用英文、簡體字或其他譯本讀經的弟兄姊妹，手上拿的同樣是神的話。遇到關鍵的經文，可以對照兩三個譯本。默示論的細部爭議，本講義站在福音派的共同立場，全卷立場見 ISS00_4。"]],["d",["保羅寫 3:16 的時候只有舊約，為甚麼我們把新約也一起當作神的話？","保羅在這裡直接說的，確實是提摩太從小讀的舊約，也就是 3:15 那神聖的文字。可是新約自己已經往前走了一步。彼得提到保羅的信，說無學問、不堅固的人強解，如強解別的經書一樣，等於把保羅的書信和經書放在同一個架子上。保羅在提摩太前書也引了一句路加福音同樣記下的主耶穌的話，和申命記並列，稱為經上說。所以 3:16 的原則同樣適用在新約：凡神所默示的，都能教訓、督責、使人歸正、教導人學義。這一題的整理見本章議題頁，全卷立場見 ISS00_4。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 3:1 算日子：把某一年、某一場戰爭或某一次天災排成時間表，叫人恐慌。保羅給的是一個「要知道」的命令，不是一張日曆。"],["p","第二個偏差，是把 3:2--5 的清單貼成標籤：說的就是某個世代、宗派、陣營或講員。清單第一項是專顧自己，先對準講台和座位上的自己；把鏡子轉向別人，它就變成一支槍。"],["p","第三個偏差，是拿 3:6--7 看低姊妹，把她們講成比弟兄更好騙的一群人，因此不讓她們學。問題在私慾，在學而不悔改，弟兄姊妹都會；保羅的對策是讓女人好好學道。"],["p","第四個偏差，是把 3:12 反過來用：把一切不順、衝突、被批評都叫作為主受逼迫，好不必檢討自己；更嚴重的，是勸在家中受暴力的人為了背十字架繼續留在危險裡，這是錯的。也不要說沒有受逼迫就是不夠敬虔，3:12 是陳述，不是勳章。"],["p","第五個偏差，是拿 3:16 當棍子：吵架時翻出一節經文說聖經說的你還有甚麼話講，或把督責講成在群組裡點名。四個用處有兩個是扶正，目的是叫屬神的人得以完全；也不要把默示論的細部分歧當成分門的標準。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族群組裡的末世訊息。長輩轉發一支末世到了的影片，配上地震和戰爭的新聞，後面加一句趕快悔改。3:1 給的是第三條路：不嘲笑長輩的擔心，也不跟著轉發。可以私下回一句溫和的話：謝謝你提醒我要警醒，主說那日子沒有人知道，我們一起把今天過好。然後打一通電話問候他；被嚇著的人需要的是陪伴，不是辯論。"],["p","第二個問題：家裡第一代信主的人。過年回家，餐桌上只有你一個人在飯前低頭，親戚說你讀那本洋人的書，讀到連家裡的規矩都不要了。你覺得自己起跑就慢了一圈。3:14 的「誰」是複數，提摩太的父親是希臘人，他也是靠一條屬靈父親的線長大的。你可以找一位年長的弟兄姊妹作你屬靈的長輩，也可以從你開始，成為你家裡第一位羅以：在陪母親看醫生的候診室裡，把那本書活給家人看。"],["h","七、活出321——被扶直的人"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：主耶穌在曠野受試探，三次都回答經上記著說，「人活著，不是單靠食物，乃是靠神口裡所出的一切話」（太 4:4）。他用經文抵擋試探他的那一位，卻從來不用經文去壓碎壓傷的人。拿著聖經的人，照他的樣子拿。"],["p","聖經是我的準則：3:16--17 是這句話最直接的根據。讀完這一章我們可以說得更準：這把準則是先量我自己的。先讓它照出我的愛自己，再讓它把我扶直，最後差我去行善。"],["p","聖靈是我的引導：外貌靠自己撐得出來，敬虔的能力只能從神來。「要靠著那住在我們裡面的聖靈牢牢地守著」（1:14）；所學習的要存在心裡，存得住，靠的不是意志力。"],["p","讓耶穌作王：3:2 的清單，是王位被我坐走了的樣子，3:4 收在愛享樂勝過愛神。讓耶穌作王，是把中心的位置還給他；也是從審判官的椅子上下來，讓他的話先審判我。"],["p","讓耶穌得著一切的榮耀：3:11 的主詞是主，「主都把我救出來了」。提摩太記得的不是一位英雄父親，是一位救主；我們傳下去的見證，也要讓聽的人記得他，不是記得我們。"],["p","建立屬神的體系：3:10 的服從是貼身跟著走，3:14 的「誰」是複數，屬神的體系先是近距離的生命，不是遠距離的課程。國度321空中團契散在各國，群組和私訊就是今天的門；小組長要讓組員看得見自己的忍耐與愛心，陪羊一起讀經，不用恐嚇把羊關起來。"],["d",["我很想好好讀經，可是每次一讀就覺得乾、讀不下去，有沒有具體的方法？","先不要責備自己。3:14 說要把所學的存在心裡，存是住在裡面，不是一次吞下很多。可以試三個做法。第一，縮小份量：每天五到十節，同一段讀兩遍，第二遍讀出聲音。第二，帶著三個問題讀：神是怎樣的一位？它照出我哪裡？今天走哪一小步？第三，不要一個人讀：找一位弟兄姊妹，這一週讀同一段，約好星期幾傳一句讀到的話給對方。讀經乾的時候，也可以先禱告一句：主啊，請你親自向我說話。記得主說，給他作見證的就是這經，讀的時候去找他，就不會只剩功課。"]],["h","八、四種心，誰肯被扶直"],["p","驕傲型的心最愛 3:16 的督責：讀經時一直在想這段適合誰聽，手上的經文常常指著別人。請你把鏡子轉回來，從清單第一項讀起；被扶直的第一個人，應該是你。"],["p","恐懼型的心被 3:1 嚇住了：新聞一則接一則，群組裡一句末世到了，就整夜睡不著。保羅說要知道，不是要害怕；那位在安提阿、以哥念、路司得都把人救出來的主，今天也在。若焦慮已經影響睡眠和生活，看醫生、找輔導，和禱告並不衝突。"],["p","羞恥型的心讀到 3:15 就低下頭：我沒有外祖母，我起步太晚；或者讀到 3:7：上了那麼多課還是一樣，我大概就是那種人。提摩太的家也不完整；這本書能使你有得救的智慧，靠的是它指向的那一位，不是你的起點。"],["p","受傷型的心，曾經被人拿著經文定罪：甚至被教會裡的人指著一節經文說你不配；也可能有人用 3:12 叫你在危險裡繼續忍。那都不是這本書的用法，神的話是夾板，不是棍子。你不必先原諒才算屬靈；若你仍在危險之中，先讓一位信得過的人陪你找到安全，必要時尋求專業和法律的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 3:14--17 其中一節，讀完不先想這段適合誰聽，只問主一句：今天你要先扶直我哪裡？寫成一行，帶著出門。"],["p","第二，從 3:2--5 的清單裡挑一項你最不想承認的，抄在便條紙上，貼在你自己的桌前，不要貼在別人身上；七天每晚花三分鐘，回想它今天在哪一刻出現。"],["p","第三，在星期五以前，聯絡一位教你信仰的人，告訴他你一直記得他生命裡的哪一個片段；如果他已經不在了，就把這段話寫在你聖經的扉頁上。"],["p","第四，找一位你曾經拿經文指著他說話的家人或同工，用平常的口氣把話收回來，不必再補一節經文。"],["p","第五，這一週少轉發一則來源不明的末世訊息；把省下來的時間拿來讀一章經文，並約一位初信的人一起讀一段。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：聖經是神所默示的，我讓它先扶直我，再差我出去行善。"],["p","我宣告：那張清單是我的鏡子，不是我丟向別人的石頭。"],["p","我宣告：我知道是跟誰學的；就算家裡只有我一個人信主，我在神的家裡也不是次等的。"],["p","我宣告：從一切的苦難中，主都能把我救出來；我在基督裡敬虔度日，不必算日子，也不必害怕。"],["d",["我曾經拿經文指著配偶說話，現在想把話收回來，要怎麼開口才不會又吵起來？","這是很好的一步。挑一個兩個人都不累的時候，不要在吵架的現場，也不要用文字訊息談。開口可以很簡單：那天我拿那節經文指著你說話，我的口氣錯了，對不起。說到這裡就好，不要再補一節經文，也不要加上但是你也有錯。對方可能沒有馬上回應，請給他時間，不要逼他當場原諒你。接下來的一週，用行動讓他看見改變：同樣的事情再發生時，先停三秒，再用平常的口氣說話。若你們的關係裡有長期的暴力或威脅，這一題就不是重點，請先保護自己的安全，並找牧者和專業的人協助。"]],["h","十、結語"],["p","第三章從一張以愛自己開頭的清單開始，到屬神的人結束。火、兵、經、冠，這一章是經：外面的日子越來越亂，裡面的敬虔容易只剩一層殼，神卻在中間放了一本他親口呼出的書。鏡子先照出我，路司得的石頭讓我看見主怎樣把人救出來，夾板把我扶直。"],["p","這一課的焦點，不在我們會背多少經文、上過多少課，也不在保羅被石頭打了還站得起來，焦點在那一位整本書都在指著的主耶穌。他自己說：「你們查考聖經，因你們以為內中有永生；給我作見證的就是這經。」（約 5:39）讀完這一章，請不要更佩服保羅，也不要更會拿經文說別人；請你更愛那位用他的話把你扶起來的主。"],["p","我們一起低頭禱告。呼出聖經的父神，謝謝你在危險的日子裡，沒有給我們一張時間表，卻給了我們你自己的話。求你先用這面鏡子照我們，用你的話把我們歪掉的地方扶直，也叫我們拿著你的話的時候，手是溫柔的。求你看顧家裡只有一個人信主的弟兄姊妹，也安慰為兒女禱告的父母。求你保護正在危險中的人，讓他們找到安全和幫助。主啊，從一切的苦難中你都把人救出來；求你叫我們成為屬神的人，預備行各樣的善事。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰讀經讀得多，是讓每一個人照一次鏡子、說出一位教他信仰的人的名字，並說出這一週要被扶直的那一個地方；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是鏡子、石頭、夾板。席上可能有第一代信徒、兒女離開教會的父母，也可能有曾被人拿經文定罪、甚至正在家中受威脅的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜
