<title>321提摩太後書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"我不以為恥；因為知道我所信的是誰","sub":"火、恥、守","lv":"A","arc":"火","sec":[["1:1--5","想到你心裡無偽之信：眼淚、記念與三代的信"],["1:6--7","再如火挑旺起來：不是膽怯的心"],["1:8--12","然而我不以為恥：萬古之先的恩典"],["1:13--14","要靠著那住在我們裡面的聖靈牢牢地守著：純正話語的規模"],["1:15--18","不以我的鎖鍊為恥：離棄的與尋找的"]],"serm":{"pts":[["挑旺的火","1:3--7","「再如火挑旺起來」——在眼淚與記念之間，保羅提醒兒子：炭還在，只是蒙了灰；神所賜的不是膽怯的心，乃是剛強、仁愛、謹守的心"],["不以為恥","1:8--12","「因為知道我所信的是誰」——跟一個坐牢的人站在一起，要付面子的代價；不以為恥的祕訣不是自己勇敢，是認識那一位能保全我們的主"],["牢牢地守著","1:13--18","「要靠著那住在我們裡面的聖靈牢牢地守著」——亞細亞的人都離棄了，阿尼色弗卻殷勤地找；守住所託付的，靠的是內住的聖靈，不是意志力"]]},"q":"公司的午飯桌上，同事笑著問：「你還真的信那個喔？」你笑一笑，把話題岔開；過年回到老家，長輩當著一桌親戚說你信了洋教、連祖先都不拜，你低頭夾菜，一句話也沒說。\n或者是另一種時刻：你服事了好些年，帶過的人一個一個走了，有的轉去別的教會，有的連信仰都放下了；群組裡少了幾個名字，你心裡也少了一塊。夜裡你不敢承認，其實你已經很怕，也很累，裡面的火只剩下一層灰。\n這一章要問的是：當羞恥、恐懼和被離棄一起壓上來，你手上還剩下甚麼？是一套說得通的答案，還是一位你真正認識、而且正在保全你的主？","truth":"神賜給我們的，不是膽怯的心，乃是剛強、仁愛、謹守的心（1:7）；所以我們可以不以福音為恥——不是因為我們夠勇敢，是「因為知道我所信的是誰」（1:12）。\n我們守著所託付的，他保全我們所交付的；守得住，是靠著那住在我們裡面的聖靈（1:14），不是靠意志力。","mv":{"t":"然而我不以為恥；因為知道我所信的是誰，也深信他能保全我所交付他的，直到那日。","r":"提後1:12"},"card":["全卷四個字「火・兵・經・冠」，第一章是火：一個人的一生由內而外，最先要問的，是裡面還有沒有火。這封遺書從眼淚開始，從三代的信講到按手的恩賜，從不以為恥講到萬古之先的恩典，最後落在亞細亞的離棄與阿尼色弗的尋找。接力賽的起點在這裡：信是傳下來的，火是神點的，棒還在你手上。","這一章的主詞，越讀越是神。神把恩賜放在提摩太裡面，也把剛強、仁愛、謹守的心賜給我們（1:6–7）；神救了我們，以聖召召我們，不按我們的行為，按他萬古之先的旨意和恩典（1:9）；神在基督耶穌的顯現裡把死廢去，把不能壞的生命照亮出來（1:10）；神能保全人所交付他的，直到那日（1:12）；神差聖靈住在我們裡面，叫軟弱的人守得住（1:14）。人在這一章只做一件事：領受了，就不鬆手。","1:5 與 1:12 的「深信」，原文都是 πέπεισμαι（pepeismai），完成式：我被說服了，而且到今天還站在那裡。保羅先說「我深信也在你的心裡」，說的是對提摩太的把握；再說「也深信他能保全」，說的是對神的把握。這改變今天的讀法：保羅對一個會流淚、可能天性怯懦的年輕人有把握，不是因為提摩太表現好，是因為他的把握掛在神身上。你對一個軟弱的孩子、組員、學生的盼望，也可以這樣掛上去。","這一章照出一種很體面的膽怯。我們不是不信，只是在某些場合把信仰收起來：飯局上不低頭禱告，同事問起就說「還好啦，就是去走走」，家族群組裡從不提教會。我們管這叫低調、叫智慧，底下常常是怕丟臉。還有一種更安靜的：聚會照來、服事照做，心裡卻冷了很久，誰都不說，連自己也不敢承認。","全章最該被記住的，是 1:12 的那個「誰」。我們以為不以為恥，要先變得勇敢、口才好、答案齊全；保羅說的祕訣卻不在自己手上抓得多緊，而在他認識的那一位能保全多少。翻轉在這裡：下一次你又想把信仰收起來的時候，不必先問「我夠不夠勇敢」，先問「我認識的是誰」。羞恥量的是別人的眼光；那一位量的，是直到那日。","這一週，挑一個你平常會把信仰收起來的場合——公司的午飯、家族群組、同學會——不辯論，不講道，只說一句平常的真話，例如：「週末我去了教會，我們在讀一封坐牢的人寫的信。」開口以前，在心裡唸一次「我知道我所信的是誰」。回家以後寫兩行：那一刻我怕的是甚麼？那一刻主有沒有離開我？","最終整合：安養院三樓，靠窗的那一床，下午三點。\n他當了四十年牧師，帶過的人散在好幾個國家。現在他叫不出探訪者的名字，有時連自己的女兒也認不得。教會換了兩任牧師，記得來看他的人，一年比一年少。\n那天來的是一個中年人。三十年前，他是主日學裡最皮的那個孩子。他打了好幾通電話，跑了兩間安養院，才找到這一床。\n他坐下來，不知道該說甚麼，就翻開聖經唸：「然而我不以為恥；因為知道我所信的是誰——」\n老人忽然接下去，一個字都沒有錯：「也深信他能保全我所交付他的，直到那日。」\n名字忘了，日子忘了，講過的幾千篇道也忘了。這一句還在。\n不是他守住了這一句，是這一句守住了他。他自己抓不住的，有一位替他抓著。\n中年人在電梯裡哭了。他忽然明白，自己手上那根棒子，是從這雙已經握不穩湯匙的手裡交過來的。\n炭還在。信住進一個人裡面，連遺忘也搬不走它。\n而在他找到這張床以前，主早就坐在床邊了。"],"self":"這一章照出來的「有己」，是一張很在乎別人眼光的臉：信仰可以有，但不要讓我難堪；可以為主，但不要讓我丟臉。我們把膽怯包裝成智慧，把冷淡包裝成成熟，把怕被離棄包裝成「不想麻煩別人」。\n底下是同一件事：焦點在自己身上。焦點在自己，人就會怕；焦點在別人，人就會羞；這一章不是叫我們咬緊牙關變勇敢，而是叫我們把眼睛移開，移到那位能保全我們、直到那日的主身上。","t321":{"k":"耶穌是我的榜樣：不以為恥，耶穌先走過。他被掛在木頭上，是當時最羞恥的死法；希伯來書說他「因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難」（來 12:2）。他也被離棄過：門徒四散，他早就說「留下我獨自一人；其實我不是獨自一人，因為有父與我同在」（約 16:32）。他在客西馬尼園說「我心裡甚是憂傷，幾乎要死」（太 26:38），沒有假裝不怕，卻一步一步把自己交在父手裡。我們跟的不是一個從不害怕的英雄，是一位怕過、被離棄過、被羞辱過，仍然知道父是誰的主。","g":"讓耶穌作王：這一章要人讓出來的，是「評分席」。我們心裡常坐著一排評審——同事、長輩、親戚、網路上的陌生人——他們的眼光決定我們敢不敢開口、敢不敢承認自己是基督徒。保羅說「直到那日」：最後打分的是那一位，不是今天飯桌上的人。讓耶穌作王，是把那一排評審請下台，只留一個座位給他。第二個要讓出來的，是「我自己守住」的位置：守住信仰、守住所託付的，不靠我的意志力，靠住在裡面的聖靈。可以自己檢查：這一週，你最怕誰怎麼看你？那個人，現在坐在誰的位置上？","p":"建立屬神的體系：這一章有兩條傳承的線——1:5 外祖母和母親，1:2 屬靈的父親；經文講完，321 在末端認出 235 的「3」：屬靈父母兒女。所以教會要刻意為第一代信徒配上屬靈的長輩，讓沒有基督徒家庭的人也有人記念他的眼淚。第二，要有阿尼色弗「一家」：探訪不是牧師一個人的事，小組可以輪流記念住院的、坐牢的、住安養院的、從服事上退下來的人，正像「你們要記念被捆綁的人，好像與他們同受捆綁」（來 13:3）。第三，同工離開時要有一套溫柔的作法：好好道別、不在台上評論，讓留下的人和離開的人都不必帶著羞恥走。國度321空中團契散在各國，更需要這種彼此找著的網。"},"grp":["【一、破冰】小時候家裡用過炭爐、柴火或瓦斯爐嗎？你記得的那一次「火快熄了又被救回來」是甚麼場景？是誰把它救回來的？","【二、扎心】經文說：「你不要以給我們的主作見證為恥，也不要以我這為主被囚的為恥」（1:8）。說出最近一次你把信仰收起來的場合——在哪裡、對誰、當時說了甚麼或沒說甚麼。那一刻你最怕的是甚麼？","【三、福音】保羅說神救我們「不是按我們的行為，乃是按他的旨意和恩典」（1:9），而且「他能保全我所交付他的」（1:12）。說出一次你自己抓不住、卻發現是神抓著你的經歷：那時候你幾歲、發生了甚麼、是誰陪你走過來？","【四、行動】說出這一週你要做的一件事，二選一：在一個平常不提信仰的場合說一句真話（說出場合與對象）；或去找一個被別人轉過臉去的人——住院、失業、退下服事、被議論的——說出他的名字、哪一天去、帶甚麼去。","【五、代禱】為三種人指名禱告：一位正在焦慮、恐懼或憂鬱中、仍在就醫的弟兄姊妹，求主賜他剛強與謹守，也賜他好的醫生與陪伴；一位家中只有他一個人信主的第一代信徒，求主給他屬靈的父母；一位曾被同工離棄、正想退下來的服事者，求主差一個阿尼色弗找著他。"],"prac":{"main":"這一週，我不再問自己夠不夠勇敢，只問我認識的是誰；讓神把灰撥開，把我所交付的交給他保全。","items":["對神：每天早上讀 1:7 一次，把「神賜給我們」改成「神賜給我」，說出今天最怕的一件事，然後求他把剛強、仁愛、謹守的心賜給你面對它；每天晚上讀 1:12，說一句：「今天我交給你，你保全。」","對自己：這七天，每當你發現自己把信仰收起來——沒有禱告就動筷子、被問起時含糊帶過——就記下時間、地點、在場的人。週末讀一遍，不責備自己，只問：我怕的是哪一個人的眼光？那一刻，我忘了的是哪一位？","對人：寫一封短訊給一個曾經把你裡面的火挑旺起來的人——主日學老師、帶你信主的朋友、你的屬靈父母——說出他哪一句話、哪一個動作，至今還在你裡面。如果他已經年老或在安養院，這一週去看他一次。","對生活：如果你已經疲憊、睡不好、或焦慮好幾個星期，這一週預約一次醫生或輔導，或者告訴一位可信任的人；同時把一項讓你耗盡的服事暫時請人接手。撥開灰，有時候先是好好睡一覺、好好看一次病。","對使命：這一週在一個你平常會把信仰收起來的場合，說一句平常的真話；並在你的小組或團契裡提一個具體安排：為一位第一代信徒配一位屬靈長輩，或排一個輪流探訪住院、住安養院者的名單。"]},"safe":["① 用 1:7 對正在焦慮、恐懼、憂鬱、創傷裡掙扎的人說：「你會怕，就是沒有信心」「神賜的不是膽怯的心，你還在吃藥，表示你不信」。","1:7 的主詞是神，動詞是「賜」，是恩典，不是考卷；保羅自己「記念你的眼淚」（1:4），在別處也說過連活命的指望都絕了。把剛強講成責備，會讓人停藥、停止輔導、把病藏起來；禱告與就醫不是二選一，神所賜的剛強常常正是藉著醫生、藥物與陪伴臨到（紅線一；議題見 ISS01_3）。","檢驗標準：一位正在服藥、每週看輔導的弟兄姊妹聽完，是得著力量、願意繼續就醫，還是更羞愧、想偷偷把藥停掉？","② 反過來，把 1:7 講成自信心訓練或成功學：「相信自己，你本來就很強」「剛強就是敢衝、敢要、敢贏」。","1:7 的剛強是神「賜給我們」的，接下去是「按神的能力」（1:8），不是人的性格或意志；而且剛強和仁愛、謹守連在一起，沒有仁愛的剛強是霸道，沒有謹守的剛強是莽撞。把恩典講成勵志，會讓天性怯懦的人更覺得自己不合格。","檢驗標準：一位天性內向、說話會發抖的弟兄姊妹聽完，是覺得神也使用像他這樣的人，還是覺得自己要先變成另一種性格才配事奉？","③ 用 1:5 讓第一代信徒覺得自己次等：「信心要從小、從家庭裡培養，沒有基督徒家庭的人根基比較淺」「三代信主才算有屬靈的底子」。","提摩太自己的家並不完整——他的父親是希臘人（徒 16:1）；1:2 保羅叫他「我親愛的兒子」，他們沒有血緣，這是另一條一樣真實的傳承線。家庭信仰是祝福，不是得救或成熟的條件；信是「住進去」的，不是遺傳的（紅線八；全卷立場見 ISS00_5）。","檢驗標準：一位家裡只有他一個人信主、過年回家還要面對祭祖壓力的第一代信徒聽完，是覺得自己被接納、也有屬靈的家，還是覺得自己輸在起跑點？","④ 用 1:5 叫兒女不信主的父母自責：「孩子離開信仰，是因為父母信得不夠真」「你看友妮基，你為甚麼做不到？」。","友妮基能做的，是讓信住在自己裡面；叫信住進兒子裡面的，是神。經文只說信「先在」外祖母和母親心裡，沒有說這是父母可以保證的結果。把兒女的選擇全算在父母頭上，會讓已經在流淚的父母多背一層罪疚，也讓他們在教會裡不敢開口（紅線八）。","檢驗標準：一位孩子已經不來聚會多年的母親聽完，是更有盼望繼續為孩子禱告、繼續愛他，還是更覺得自己是一個失敗的基督徒？","⑤ 把 1:6 的按手講成傳功或魔術：「讓某某大能的僕人按手，你就會得著他的恩膏」；或用「我按手在你身上，你就屬我遮蓋」綁住人。","經文說得很清楚，是「神」藉按手所給的恩賜；提前 4:14 也記眾長老一起按手，這是禱告、交託與公開的認可，不是一個人把能力傳給另一個人。把按手講成能量傳遞，會讓人追逐「大能的手」，也讓按手的人取得不屬於他的權柄（議題見 ISS01_2）。","檢驗標準：會眾聽完，記得的是那位賜恩賜的神，還是開始打聽哪一位講員的手比較有能力？","⑥ 用 1:6「再如火挑旺起來」責備疲憊、過勞的服事者：「你的火冷了，就是你屬靈退後」「再多參加幾個聚會、多接幾項服事，火就會旺」。","保羅不是在罵一個沒有火的人，是在提醒一個有火的人：恩賜還「在你裡面」。灰常常來自疲倦、挫折與被離棄，灰不是罪名；對付過勞的灰，常常是休息、就醫、有人接手，而不是更多的工作。把倦怠講成冷淡，會把人推向燒盡。","檢驗標準：一位已經連續服事好幾年、最近失眠的同工聽完，是覺得可以停下來喘口氣、讓人幫忙，還是覺得自己必須再多做一點才算有火？","⑦ 把 1:8「與我為福音同受苦難」講成一切的苦都是為主受苦：「你在家裡被打、被罵，是在背十字架」「職場被霸凌是逼迫，要忍下去才有冠冕」。","1:8 說的是「為福音」的苦，而且是「同」受，不是一個人扛；自己犯錯的後果、過勞拖垮的身體、在關係裡被虐待，都不是這一節說的苦。保羅自己也曾從城牆上被縋下去逃命（徒 9:25）。叫受害者為了屬靈的理由留在危險裡，是把十字架變成枷鎖；人身安全受威脅時，先保護生命、依法求助（紅線九；全卷立場見 ISS00_2）。","檢驗標準：一位正在家暴或職場霸凌裡的弟兄姊妹聽完，是更知道神不要他留在侵害裡、可以求助，還是更覺得自己應該忍下去才算屬靈？","⑧ 把「不以為恥」講成不顧關係的強勢傳福音：「真基督徒就要在公司大聲傳講，不怕得罪人」「長輩反對，就是逼迫，不必理會」。","不以為恥的祕訣是「因為知道我所信的是誰」（1:12），不是嗓門大；1:7 的剛強同時是仁愛、謹守的心。把粗魯當勇敢，會讓人因為我們的態度而不是因為福音被冒犯；也會把家人正常的擔心、文化的差異一律叫作逼迫（全卷立場見 ISS00_2；議題見 ISS01_7）。","檢驗標準：會眾聽完，是更願意在關係裡溫和、清楚地承認自己是基督徒，還是更想找機會跟同事、長輩起衝突來證明自己不以為恥？","⑨ 用 1:9「萬古之先」製造揀選焦慮或宿命論：「你怎麼知道自己是被揀選的？」「反正一切都是預定的，傳不傳福音都一樣」。","保羅提萬古之先的恩典，是要一個坐牢、受苦的人知道：恩典比他的軟弱古老，「不是按我們的行為」（1:9）；這是安慰，不是考題，也不是不必回應的理由——同一章他正叫提摩太為福音同受苦難（揀選與預定回指以弗所書立場二；議題見 ISS01_4）。","檢驗標準：一位常常懷疑自己得救的弟兄姊妹聽完，是更安息在神的恩典裡，還是開始在自己身上找被揀選的證據、越找越怕？","⑩ 用 1:10「他已經把死廢去」說基督徒不該生病、不該死、不該哀傷：「真有信心的人病會好」「葬禮上哭，就是不信復活」。","「廢去」是使死失效，不是使死消失；寫這句話的保羅正在等自己的死刑。基督徒照樣生病、照樣死，也照樣可以哭——耶穌在拉撒路墳前也哭了。把這一節講成現世的保證，會讓病人拒絕治療，也讓喪親的人不敢流淚（成功神學回指希伯來書立場四；議題見 ISS01_5）。","檢驗標準：一位剛失去家人、在追思禮拜上哭不停的弟兄姊妹聽完，是覺得自己的眼淚和盼望可以同時存在，還是覺得哭就是信心不夠？","⑪ 把 1:12 講成「你要抓緊神」的意志力功課：「你若不夠堅定，就會失去所交付的」「守不住，就是你不夠努力」。","1:12 的重心是「他能保全」，1:14 的「守著」是「靠著那住在我們裡面的聖靈」；守的責任是真的，守的力量卻不在自己。把確據掛在自己的握力上，會讓軟弱中的人陷入得救焦慮，也讓剛強的人暗自驕傲（救恩確據的全卷立場見 ISS00_3；議題見 ISS01_6）。","檢驗標準：一位最近信心很軟弱、連禱告都很難的弟兄姊妹聽完，是知道有一位正在保全他，還是更怕自己一鬆手就完了？","⑫ 用 1:15「凡在亞細亞的人都離棄我」在講台上影射或點名離開教會的人：「最近離開我們的某某，就像腓吉路、黑摩其尼」「離開的人都是背叛」。","保羅寫下兩個名字，沒有咒罵、沒有解釋，只說「這是你知道的」；我們對這兩個人一無所知，更不可以把今天任何一個人套上去。講台一旦拿經文清算離開的人，留下的人學到的是恐懼，離開的人再也不會回頭；也要記得，有人離開是因為在教會受了傷（紅線七；議題見 ISS01_8）。","檢驗標準：如果那位剛離開的同工坐在後排聽完這一段，他是覺得門還開著，還是覺得自己被公開審判了？","⑬ 把被離棄的服事者講成一定是自己的錯，或反過來把他講成永遠的受害者：「同工都走了，一定是你不夠屬靈」；或「你被離棄，代表你最忠心」。","保羅被離棄，不是因為他失敗；但經文也沒有讓他停在自憐裡——下一節是阿尼色弗，全卷最後是「惟有主站在我旁邊」（4:17）。一刀切地歸罪，會把受傷的牧者壓垮；一刀切地自義，會讓人不再省察。被離棄是真的痛，需要被陪伴，也需要時間分辨。","檢驗標準：一位帶過的小組全散了的組長聽完，是覺得可以承認自己痛、也願意誠實省察，還是只剩下自責或只剩下怨恨？","⑭ 把 1:16–18 當成為亡者禱告的定案教義，或反過來嘲笑別的傳統：「保羅都為死人禱告了，你也要為過世的人求」；或「這種讀法就是異端」。","阿尼色弗此時是否已經過世，經文沒有明說；4:19 問候的是「阿尼色弗一家」，有人因此推想他已經不在了，也有人認為他只是在外地。一節祈願語氣撐不起一整套教義，也不該拿來嘲笑天主教、東正教的弟兄姊妹；本講義在議題頁並陳，不在講台裁判（議題見 ISS01_9）。","檢驗標準：一位剛喪親、很想為過世的父親做點甚麼的弟兄姊妹聽完，是得著安慰、知道可以把父親交在主的憐憫裡，還是被捲進一場教義爭論？","⑮ 用處境取消原則，或把處境硬搬：「這是寫給傳道人提摩太的，一般會友不必挑旺甚麼恩賜」；或「每一個基督徒都要讓牧師按手，才能得著恩賜」。","書信三問要走完：處境是一位在牢裡等死的屬靈父親，寫信給一個年輕、怯懦、被同工離棄的兒子；原則是神所賜的不是膽怯的心、知道所信的是誰、靠聖靈守住所託付的；今天這原則落在每一個累了、怕了、被離棄了、想退下來的人身上，不只牧者（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，能不能說出這一章在他自己的公司、家族、小組裡要改變甚麼，而不是只記得「這是寫給傳道人的」？","⑯ 把這一章講成保羅的英雄故事：「保羅坐牢都不怕，你這點羞辱算甚麼」「我們要學保羅的鋼鐵意志」，讓會眾更佩服保羅。","保羅自己說力量是「按神的能力」（1:8），他不以為恥是「因為知道我所信的是誰」（1:12），他守得住是靠聖靈；全卷最後他說的是「惟有主站在我旁邊」（4:17）。把焦點放在保羅的堅強，會把一封指向主的信講成勵志故事，也拿別人的苦去比下會眾的苦（鐵律七）。","檢驗標準：會眾聽完，是更佩服保羅，還是更認識那位在地牢裡站在保羅旁邊、今天也站在他們旁邊的主？"]},{"n":2,"t":"好像基督耶穌的精兵","sub":"兵、信、器","lv":"A","arc":"兵","sec":[["2:1--7","好像基督耶穌的精兵：剛強、交託、同受苦難"],["2:8--13","你要記念耶穌基督：可信的話"],["2:14--19","作無愧的工人：按著正意分解真理的道"],["2:20--26","合乎主用：貴重的器皿與主的僕人"]],"serm":{"pts":[["剛強與交託","2:1--7","「你要在基督耶穌的恩典上剛強起來」——精兵、比武的人、農夫三個畫面；先在恩典上剛強，再把所聽見的交託那忠心能教導別人的人"],["他仍是可信的","2:8--13","「我們縱然失信，他仍是可信的」——被捆綁的人說神的道不被捆綁；可信的話的最後一行，把整卷書從我要忠心翻轉成他是可信的"],["無愧的工人","2:14--26","「作無愧的工人，按著正意分解真理的道」——毒瘡越爛越大，神堅固的根基卻立住了；主的僕人不可爭競，只要溫溫和和地待眾人"]]},"q":"你也許是那個很久沒說出口的人：小組帶了八年，接棒的人一直沒有出現；週間上班、週末事奉，孩子問「爸爸你又要去教會喔」；心裡有一個不敢說的問題——如果有一天我撐不下去、放下了，主還要我嗎？\n你也許在另一個角落：在網路上看了太多互相攻擊的講道片段，越看越不知道該信誰；或是你曾經被一位很屬靈的人，用一節經文切得遍體鱗傷。\n這一章要問的是：一個被捆綁、快要殉道的人，怎麼叫一個年輕、怯懦的兒子去當兵？而當兵的人跑不動、守不住的時候，最後撐住這一切的，到底是誰的忠心？","truth":"力量不在我們裡面，在基督耶穌的恩典裡；在恩典上被加力的人，才交得出棒、受得起苦、溫和得下來。\n可信的話最後一行把全章翻過來：「我們縱然失信，他仍是可信的，因為他不能背乎自己」（2:13）——我的忠心，是站在他的可信上面。","mv":{"t":"我們縱然失信，他仍是可信的，因為他不能背乎自己。","r":"提後2:13"},"card":["在全卷「火・兵・經・冠」的路上，這一章是「兵」：第 1 章把炭上的灰撥開，這一章叫被挑旺的人穿上兵裝。可是同一章的末了，兵被改稱為「主的僕人」，而且「不可爭競」（2:24）。全章拎起來是一句話：在恩典上被加力的人，把棒交出去，跟著復活的主同受苦難；他打的仗不是跟人打的，他最後站得住，是因為那一位不能背乎自己。","這一章的主詞一再翻到神那一邊：恩典是在「基督耶穌」裡的（2:1）；「凡事主必給你聰明」（2:7）；耶穌基督是被叫起來、如今一直活著的那一位（2:8 ἐγηγερμένον，完成式被動分詞）；神的道不被捆綁（2:9）；他仍是可信的（2:13）；神堅固的根基立住了，「主認識誰是他的人」（2:19）；連抵擋的人回頭，也是「或者神給他們悔改的心」（2:25）。人在這一章裡會失信、會爭競、會被擄去；神在這一章裡一次也沒有鬆手。","2:4「不將世務纏身」，「纏身」原文 ἐμπλέκεται（empleketai），是腳被網纏進去、越掙越緊（彼後 2:20 同字）。保羅沒有說兵不可以有生活，他說的是不要被纏住。這改變今天的讀法：問題不是你有沒有正職、房貸、孩子的家長會，而是哪一樣已經纏到你聽不見號角——手機裡永遠回不完的訊息、放不下的副業、怕別人怎麼看。纏住人的，常常不是壞事，是太多的好事。","這一章照出兩種兵。一種是不肯當兵的：只要恩典的安慰，不要「同受苦難」，誰叫我交棒，我就說我還沒準備好。另一種是太會當兵的：把精兵讀成鬥士，在群組裡、同工會裡把每一個意見不同的人當成敵人，贏了辯論，輸了弟兄（2:23--24）。兩種人有同一個病根：還是自己在打仗，沒有讓那位招他當兵的作主。","「我們縱然失信，他仍是可信的」（2:13）。全章前面一路都是「你要」——剛強、交託、同受苦難、竭力、逃避、追求；到了這一行，主詞換成「他」。全章最該被記住的動作，是把眼睛從自己的忠心紀錄上移開。今晚你不必再數自己哪一天沒讀經、哪一次又發了脾氣；只要數一件事——他說過的話，有哪一句收回過？","這一週做一件事：打開行事曆，找出一樣「纏住」你的東西——不是家人，不是本分的工作，而是讓你聽不見主的那一格（深夜滑手機、多接的一份案子、一個放不下的爭論群組），在星期六以前減掉它；用省下來的時間，約一位比你年輕或比你晚信主的人吃一頓飯，問他：「你最近讀經讀到甚麼？」這是 2:2 最小的一步——先陪一個人，不是先開一個班。","最終整合：小學運動會，最後一項是大隊接力。\n第三棒的孩子跑到一半，棒子從手裡滑了出去，在跑道上滾了好遠。\n全場一陣驚呼。他愣在那裡，看著別班的人從身邊衝過去，眼淚一下子就掉下來。他以為一切都完了。\n他的老師站在跑道邊，沒有罵，只是指著地上的棒子喊：「撿起來！還沒完！」\n他跑回去撿起棒子，跑完自己那一段，把棒子交到第四棒手上。那一班沒有得名次，可是那天他記住了一件事：比賽沒有因為他掉棒就把他除名。\n「我們縱然失信，他仍是可信的，因為他不能背乎自己。」（2:13）\n我們的手會發抖，棒子會滑落，有時候還跑錯了方向；\n可是把棒子交給我們的那一位，一直站在跑道邊。他不是在等著記我們的錯，是在喊我們回來。\n「你要在基督耶穌的恩典上剛強起來。」（2:1）剛強不是從不掉棒，是撿起來，再跑，再交出去。"],"self":"這一章照出來的「有己」，是一個把自己的忠心當成根基的人：我讀經、我服事、我守得住，所以我安心；有一天守不住了，他就連神的臉也不敢再看。另一種有己，是把精兵當成身分：我要贏、我要對、我要別人承認我切得比較直，於是「按著正意分解」變成一把刀，切的是別人。\n這一章的出路不是更用力，而是先在恩典上被加力（2:1），先讓真理的道把自己切直，然後把棒交出去，把結果交給「或者神給他們悔改的心」（2:25）的那一位。","t321":{"k":"耶穌是我的榜樣：2:8 叫一個受苦的人「記念耶穌基督」，而且是那一位從死裡復活的。耶穌自己怎樣活出這一章？他也是一位把棒交出去的人：三年裡只帶一小群人，臨走前為他們禱告，說他保守了父所賜給他的人（約 17:12）；他沒有爭競——被捕那夜叫彼得收刀，被罵不還口。他更是那位「不能背乎自己」的：彼得三次不認他，他復活以後在海邊生了一堆炭火，三次問彼得愛不愛他，把羊交回給這個失信過的人（約 21:15--17）。我跟隨的不是一位只會給標準的教練，是一位在我失信之後，還把棒交回我手上的主。","g":"讓耶穌作王：2:12 說「我們若能忍耐，也必和他一同作王」——作王是將來的事，今天是忍耐的事；想跳過忍耐提早作王，就是 2:18「說復活的事已過」那一類的偏離。這一章要人讓出兩個位置。第一個是討誰喜悅的位置（2:4）：老闆、父母、會眾、網路上的按讚數，誰坐在那個位置上，誰就在纏住你。第二個是「鑑定誰是真的」的位置：「主認識誰是他的人」（2:19），判斷誰得救、誰是假的，不是我的工作；我的工作是「凡稱呼主名的人總要離開不義」——先從我自己離開。可以自己檢查：這一週，你最想讓誰對你點頭？","p":"建立屬神的體系：2:2 一節裡有四代人，可是保羅交出去的不是一張組織圖，是「所聽見」的道，而且是在「許多見證人面前」——傳承是公開的、可被檢驗的，不是一個人私下的權力。第一，體系的生命線是傳承，不是組織：國度321空中團契散在台灣、馬來西亞、新加坡、中國、紐西蘭，線上小組最容易變成「一個人講、一群人看」；2:2 要每一位小組長問：我身邊有沒有一位忠心的人，是我正在陪、將來可以接手的？第二，地基是「神堅固的根基」（2:19），不是帶領人的魅力。第三，「同那清心禱告主的人」（2:22）——追求是一群人一起的事。到這裡，321 才在末端認出它所說的繁殖：不是複製出更多的我，而是讓主的道在更多人身上活起來。"},"grp":["【一、破冰】你小時候跑過接力賽嗎？或在運動會上看過有人掉棒？那一次發生了甚麼？你那時候在跑道上、在旁邊加油，還是在看台上？","【二、扎心】經文說：「凡在軍中當兵的，不將世務纏身，好叫那招他當兵的人喜悅」（2:4）。打開你的手機或行事曆，說出這一週最纏住你的一件事（一個群組、一份加班、一個放不下的人）。它是讓你聽不見主的網，還是你本來就該好好負責的家人和工作？你用甚麼來分辨？","【三、福音】一起讀 2:13：「我們縱然失信，他仍是可信的，因為他不能背乎自己。」說出一次你覺得自己「沒有守住」的時候。如果主的可信不靠你的紀錄，你今天想對他說甚麼？這一句讓你更想放鬆，還是更想回到他身邊？為甚麼？","【四、行動】說出一個名字：這一季你可以陪的那一位（比你年輕的同事、組裡的新人、你的孩子）。這一週哪一天、在哪裡、用多久，你會和他一起讀一段經文？也說出一位把棒交到你手上的人，你哪一天要謝謝他。","【五、代禱】為三種人指名禱告：一位服事多年、快要撐不下去的同工，求主在恩典上加給他力量，也給他真實的休息；一位因為軟弱、跌倒而遠離聚會的人，求主像找回彼得那樣找他回來；一位在網路上或教會裡正陷在爭論、被論斷傷害的人，求主給雙方溫柔，也給「悔改的心」。"],"prac":{"main":"這一週，我先在恩典上被加力，再把一件所領受的交給一個人；跑不動的時候，我念：他仍是可信的。","items":["對神：每天早上用三分鐘，慢慢讀 2:11--13 四行詩。讀到第三行停一下，誠實地問主：我心裡有沒有一個地方正在刻意轉身？讀到第四行，再對主說一句：「我的忠心靠不住，我靠你的可信。」","對自己：這七天，每晚睡前寫下一件今天「纏住」你的事，旁邊標一個字：「家」（該負的責任）、「主」（為主做的）、「纏」（讓你聽不見主的）。週末看一遍，只挑一個「纏」，下週把它減掉一半；同時給自己排一段真正的休息——休息不是逃離戰場，是兵在整補。","對人：約一位比你年輕或比你晚信主的人，這一週吃一頓飯或打一通視訊，一起讀 2:1--7；不講課，只問他：「這一段哪一句最像你現在的處境？」再傳一封訊息或打一通電話，謝謝當年把信仰交到你手上的那個人。","對生活：這一週在網路或群組裡遇到想反駁的話，先等一個晚上再回；如果還要回，照 2:24--25 的樣子：一句溫和的話、一句真實的話，不貼標籤、不翻舊帳。在家裡起爭執時，先問對方「你最在意的是甚麼？」，再說自己的看法。","對使命：在你的小組或事工裡，具體寫下「誰是下一棒」：你現在負責的那一件事，有沒有一位可以一起做、半年後接手的人？這一週邀請他一起參與一次，並每天為他指名禱告；也為一位離開聚會的弟兄姊妹禱告，傳一句問候，不問「你為甚麼不來」。"]},"safe":["① 先講 321 的「繁殖」，再拿 2:2 的四代傳承當插圖：「保羅早就在教 321 繁殖了」；或把 2:2 講成門徒倍增的業績公式（一年帶幾個、幾年翻幾倍）。","2:2 先是一位被捆綁、快要殉道的父親，把神寄放在他手裡的「所聽見」的道交出去；條件的次序是先「忠心」、再「能教導別人」。321 只能在末端認出：繁殖是傳承的果子，不是傳承的定義（鐵律五）。把經文當理念的插圖，會眾記得的是一套方法，不是那位託付的主。","檢驗標準：講完 2:2，會眾記得的第一個畫面，是一張倍增的圖表，還是一位在牢裡把棒交出去、又把自己交給主的人？","② 用 2:2 的「忠心」把門徒訓練變成控制：「我是你的屬靈父親，你要絕對順服我、凡事向我報告，不聽我的就是不忠心。」","保羅叫提摩太「我兒」，可是提摩太不必變成保羅；交託是在「許多見證人面前」公開進行的，忠心的對象是主和他的道，不是帶領人本人。屬靈父母不是屬靈主人，傳承也不等於複製（議題見 ISS02_1；全卷立場見 ISS00_5）。","檢驗標準：一位被帶的人聽完，是更自由地愛主、也敢對帶他的人說「我不同意」，還是更怕得罪帶他的人？","③ 用 2:3--4 的精兵美化過勞、犧牲家庭：「好兵不將世務纏身，你還在顧家、還想休息，就是被世務纏住了」「要為主燒盡」。","「不將世務纏身」說的是不被纏到聽不見號角，不是不顧家人、不可以有正職；保羅自己「製造帳棚為業」（徒 18:3），也在前一封信說「人若不看顧親屬，就是背了真道」（提前 5:8，提摩太前書講義第 5 章）；他在第四章還要外衣、要書、要同伴——他是一個有需要的人。把精兵講成燒盡，牧者的家庭會先陣亡（全卷立場見 ISS00_2）。","檢驗標準：一位事奉多年、孩子已經不肯進教會的同工聽完，是更願意回家、安排休息，還是更覺得休息就是當逃兵？","④ 用 2:4 把帶職事奉的人講成次等：「全職才是真正的兵，帶職的只是半個兵」；或反過來把全職講成「不必工作、靠會眾養」的特權。","2:4 的處境是羅馬現役兵不可經商、替人管產業；原則是「好叫那招他當兵的人喜悅」——問題是討誰喜悅，不是領誰的薪水。保羅有時接受供給，有時「這兩隻手常供給我和同人的需用」（徒 20:34）；把處境當成原則硬搬，就造出了屬靈的階級（議題見 ISS02_2）。","檢驗標準：一位週間上班、週末帶小組的弟兄聽完，是更確信自己是完整的兵，還是覺得自己永遠矮一截？","⑤ 用 2:3「和我同受苦難」、2:9「被捆綁」把一切不順、衝突、被虐待都叫作為主受苦：「你被先生打、被主管霸凌，就是在和保羅同受苦難，要忍下去背十字架。」","保羅的苦是「為這福音」受的（2:9），而且是有同伴、一起受的；自己犯錯的後果、過勞拖垮的身體、家暴與霸凌，都不是這一節說的苦。保羅也曾在夜間被人用筐子從城牆上縋下去（徒 9:25），在 3:11 是被主救出來的——逃離危險不是不屬靈。人身安全受威脅時，先保護生命、依法求助（全卷立場見 ISS00_2；受苦的四種分辨回指彼得前書立場二）。","檢驗標準：一位正在受家暴的姊妹聽完，是更知道她可以離開危險、教會會陪她求助，還是更覺得留下來忍耐才是背十字架？","⑥ 用 2:6「先得糧食」替成功神學背書：「傳道人理當先享受豐盛，奉獻越多、福分越大」；或用 2:5「按規矩」把恩典講成律法：「規矩沒守滿，就得不到冠冕。」","「勞力的農夫理當先得糧食」說的是做工的人先被所種的餵養——講道的人先被道餵飽，也包括教會合理地照顧同工的生活；它不是發財的應許。「按規矩」的規矩是這條路自己的規矩：先同死、才同活（2:11）；冠冕是競賽者的花冠，是恩典裡的獎賞，不是買來的（議題見 ISS02_3；成功神學回指希伯來書立場四）。","檢驗標準：會眾聽完，是更渴慕被主的道餵飽、願意忠心地跑，還是開始計算自己該得多少回報？","⑦ 用 2:10「選民」宣判人：「他一直不信，可能就不是選民」；或把「選民」講成教會裡的屬靈階級，好像有一群人比別人更蒙揀選。","保羅「為選民凡事忍耐」，是為了「叫他們也可以得著」救恩——揀選在他身上產生的是忍耐與傳揚，不是猜誰在名單上；「主認識誰是他的人」（2:19），名單在主手裡，不在我們手裡（議題見 ISS02_4；揀選回指以弗所書立場二）。","檢驗標準：一位為不信的家人禱告多年的弟兄姊妹聽完，是更有理由繼續禱告、繼續傳，還是開始懷疑傳了也沒用？","⑧ 用 2:12「我們若不認他，他也必不認我們」製造得救焦慮：「你上次在同事面前不敢承認自己是基督徒，主已經不認你了」；講完第三行就停，不讀第四行。","2:12 的「不認」是有意的、持續的、到底不回頭的否認；軟弱、膽怯、一時沒站出來，2:13 稱為「失信」，而「他仍是可信的」。把一次的軟弱講成背道，會讓最敏感、最怕得罪神的人失去救恩的確據——偏偏他們最不可能刻意離棄主。講 2:12 必講 2:13（議題見 ISS02_5；全卷立場見 ISS00_3）。","檢驗標準：一位常常懷疑自己還算不算得救的弟兄姊妹聽完，是更把眼睛放在主的可信上，還是回家又多失眠一晚？","⑨ 拿 2:13 當擋箭牌，合理化刻意、長期的離棄信仰：「我們縱然失信，他仍是可信的，所以我怎樣活，主都得收我。」","2:13 的確據是真的，2:12 的警告也是真的；這首詩的第三行，正是說給刻意轉身、一直說「我不認識他」的人聽的，主耶穌自己說「凡在人面前不認我的，我在我天上的父面前也必不認他」（太 10:33）。確據是給軟弱回頭的人的枕頭，不是給刻意離開的人的通行證（議題見 ISS02_6；全卷立場見 ISS00_3）。","檢驗標準：一位正在刻意過雙重生活的人聽完，是聽見了主溫柔的呼喚與真實的警告，還是覺得自己找到一個不必回頭的理由？","⑩ 把「不認」與「失信」講成只是兩個希臘字的差別：「彼得那一夜只是失信，不是不認，所以 2:12 跟他無關。」","要誠實：福音書記彼得三次不認主，用的正是 2:12 同一個字 ἀρνέομαι（太 26:70、72）；分別不只在用字，更在最後的方向——主先為他祈求，說「你回頭以後，要堅固你的弟兄」（路 22:32），2:12 說的是到底不回頭的否認。把分別全押在字典上，講台會變成字詞的辯論，會眾也學不會真正的分辨：不是我跌得多重，是我最後轉向哪裡。","檢驗標準：會眾聽完，是更清楚自己最後要轉向主，還是只記得兩個希臘字、心裡照樣不踏實？","⑪ 用 2:15「按著正意分解真理的道」拿經文打人：在群組裡貼一節經文、配一句「你自己看」，把不同意見的人切成異端；或斷章取義，把一節經文從上下文抽出來替自己的立場背書。","ὀρθοτομοῦντα 是直直地切開，可是在切任何東西以前，先是「你自己」要在神面前被驗過；同一章就說主的僕人不可爭競，「用溫柔勸戒那抵擋的人」（2:25）。按正意分解是先把自己切直，不是拿經文去切別人；也不把讀經方法、默示論細部定義的分歧變成分門的標準（議題見 ISS02_7；全卷立場見 ISS00_4）。","檢驗標準：講完 2:15，會眾第一個想拿這節經文去量的人，是自己，還是那個在群組裡跟他吵架的人？","⑫ 用 2:17「毒瘡」在講台上點名或影射某一位講員、某一個宗派、某一位離開教會的人：「他就是今天的許米乃。」","保羅點名許米乃、腓理徒，是一位使徒在私信裡對他所託付的同工說明具體的錯誤；今天的講台把「毒瘡」貼在人身上，自己就成了 2:23 說的起爭競。可以清楚指出錯誤的說法，但不給人貼標籤，更不影射離開教會的人（紅線七）；同一章的方法是「或者神給他們悔改的心」（2:25）。","檢驗標準：會眾聽完，是更能分辨甚麼是錯誤的教導，還是只記住了一個可以拿來罵的名字？","⑬ 用 2:18 講出相反的錯：「真正屬靈的人現在就要全然得勝——不再生病、不再軟弱、不再有眼淚；你還在病、還在掙扎，就是信心不夠。」","這正是「復活的事已過」的今日版：把將來的完全拉到今天，病床上的人、牢裡的人、老去的人就沒有答案了。保羅的盼望是「也必與他同活」（2:11）——將來式，所以今天可以忍耐；他自己就是在鎖鍊裡寫這封信。神今天也醫治、也施恩，可是不把還在受苦的人定罪（議題見 ISS02_8）。","檢驗標準：一位長期病痛、禱告多年沒有好轉的弟兄姊妹聽完，是更有盼望地等候那必來的復活，還是更懷疑自己的信心出了問題？","⑭ 用 2:20--21「人若自潔，脫離卑賤的事」叫會眾和有錯的信徒、離開的同工斷絕來往：「不要跟那種人吃飯，免得被污染」；或把金器銀器、木器瓦器講成教會裡的等級。","經文要脫離的是「事」，不是隔離「人」；方向是先把自己洗乾淨。木器瓦器被潔淨了，就是貴重的器皿——馬可曾經半路離開，後來成了「於我有益處」的人（4:11）。拿這一節切割人，等於把神可能正在潔淨的器皿先摔碎（議題見 ISS02_9）。","檢驗標準：會眾聽完，是先檢查自己手上有沒有該脫離的事，還是開始列一張以後不跟誰來往的名單？","⑮ 用 2:24「主的僕人不可爭競」壓住提出問題或說出傷害的人：「你提出質疑就是爭競，不屬靈」；或把「溫溫和和」講成對錯誤教導、對欺壓不聞不問。","保羅在同一章清楚指出錯誤（2:17--18），也要提摩太「善於教導」、勸戒那抵擋的人；不可爭競是不為贏而吵，不是不准說真話。溫柔是讓對方有路回來，不是讓受傷的人閉嘴；有人在教會裡受了傷害，說出來、求助，都不是爭競（全卷立場見 ISS00_2）。","檢驗標準：一位被教會裡的人傷害、想說出來的弟兄姊妹聽完，是更知道可以溫和而清楚地說真話，還是更覺得開口就是不屬靈？","⑯ 把這一章講成保羅的英雄傳記：「看保羅多勇敢，戴著鎖鍊還在寫信，你也要像他一樣剛強。」","保羅自己叫提摩太「記念耶穌基督」（2:8），不是記念保羅；他在鎖鍊裡唱的詩，最後一行的主詞是「他」——他仍是可信的。焦點放在保羅身上，會眾得到的是一個偶像和一份壓力；講台要讓人記得的，是那位站在保羅旁邊、也站在他們旁邊的主（鐵律七）。","檢驗標準：會眾聽完，是更佩服保羅，還是更愛那位不能背乎自己的主耶穌？"]},{"n":3,"t":"聖經都是神所默示的","sub":"外、學、經","lv":"A","arc":"經","sec":[["3:1--5","末世必有危險的日子來到：有敬虔的外貌"],["3:6--9","常常學習，終久不能明白真道：雅尼和佯庇"],["3:10--13","但你已經服從了我的教訓：逼迫與拯救"],["3:14--17","聖經都是神所默示的：從小明白聖經"]],"serm":{"pts":[["危險的日子","3:1--9","「有敬虔的外貌，卻背了敬虔的實意」——末世的清單第一項是專顧自己；保羅不是叫人算日子，是叫人認出自己裡面的外貌與實意"],["跟誰學的","3:10--15","「因為你知道是跟誰學的」——逼迫、苦難、主都救出來；一個從小明白聖經的年輕人，知道信仰是從哪些人、哪一本書傳到他手裡"],["神所默示","3:16--17","「聖經都是神所默示的」——神呼出的話，於教訓、督責、使人歸正、教導人學義都是有益的；目的不是打倒人，是叫屬神的人得以完全"]]},"q":"你的手機裡，是不是也有一個群組，三天兩頭有人轉發：「末世到了，你們看看這個新聞。」你一邊滑，一邊心裡發緊；同一個晚上，你收藏了第三百支講道短片，卻還是沒有打那一通早該打給母親的電話。\n我們這一代從來不缺聖經的資訊：一個講座接一個講座，一個說法換一個說法，學得越多，心反而越亂、越硬。\n這一章要問的是：當外面的日子越來越亂，裡面的敬虔越來越像一層殼，你手上有沒有一個不會跟著搖的準則？那本你天天滑過的書，到底是拿來量別人的，還是神要先把你扶正的那一口氣？","truth":"末後的日子裡，人最大的危險不是時局，是愛錯了對象、只剩下敬虔的外貌；神在這樣的日子裡沒有給人一份時間表，卻給了一本他親口呼出的書——「聖經都是神所默示的」（3:16）。\n這本書能使人因信基督耶穌得救，也天天把讀它的人先扶正，叫屬神的人得以完全，預備行各樣的善事。","mv":{"t":"聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，叫屬神的人得以完全，預備行各樣的善事。","r":"提後3:16-17"},"card":["在全卷「火・兵・經・冠」的路上，這一章是「經」。第 1 章把裡面的火挑旺，第 2 章學會吃苦、交棒；到了第 3 章，路忽然暗下來：危險的日子、有敬虔外貌的人、偷進人家的師傅、越久越惡的騙子。全章拎起來就是一句話：亂世裡最危險的是那個以自己為中心的我，最可靠的是神呼出的話；所以不必算日子，也不必換準則，只要留在你所學習、所確信的那本書裡，讓它把你帶到基督耶穌面前。","這一章看起來滿是人的惡，主詞卻一再是神。主在安提阿、以哥念、路司得，從一切苦難中把保羅救出來（3:11）；神替假教訓劃了一條線，「他們不能再這樣敵擋」（3:9），他們的愚昧必顯露出來；神呼出了聖經（3:16），又藉著一位外祖母、一位母親、一位屬靈的父親，把這本書送到一個嬰孩手裡（3:15）；最後，是神用他的話把屬他的人裝備齊全，差他去行各樣的善事（3:17）。","3:14「你所學習的，所確信的」，「確信」原文 ἐπιστώθης（epistōthēs），被動語態，新約只此一次：被證實可信、被說服了。這改變今天的讀法：確信不是你在深夜裡拼命擠出來的一種感覺，是一次又一次被驗證過的落定——你看過那本書在一個人身上兌現，看過主怎樣把人從苦難裡救出來（3:11）。懷疑來襲的晚上，你不必重新發明信心，只要回想：我是被甚麼說服的？是被誰的生命說服的？","這一章照出一個「很屬靈」的我：禱告會上用詞最熟練，群組裡轉發最多經文，家裡卻對父母沒有耐性（3:2「違背父母」），對配偶的一句話記了三年（3:3「不解怨」）。這一章也照出一個「常常學習」的我（3:7）：課上了一門又一門，筆記寫滿一本又一本，偏偏那一件神早就指出來的事，一直沒有讓他碰。外貌越整齊，越容易把能力關在門外（3:5）。","「但你所學習的，所確信的，要存在心裡」（3:14）。「存在」原文 μένε（mene），現在式命令：一直住在裡面。在一個天天換台、每週都有新說法、新講員、新潮流的時代，全章最該被記住的動作，竟然是——留下來。不是固執，不是不再學；是不必追著每一陣風跑，因為你已經站在一本神呼出的書上，而這本書，一直指著同一位基督耶穌（3:15）。","這一週做一件事：想一想，你的信仰是「跟誰學的」（3:14）——帶你查經的組長、送你第一本聖經的同事、在醫院為你禱告的那位阿姨，或是今天還陪著你的屬靈父母。在星期五以前，寫一段話或打一通電話給他，說出他哪一個生命的片段被你近距離看見了（3:10），也問他一句：「你當年是怎樣讀聖經的？」如果那個人已經不在了，就把這段話寫在你的聖經扉頁上，並為一位你正在陪伴的人禱告。","最終整合：凌晨三點，醫院九樓的護理站。\n她是家裡第一個信主的人。手機上一則接一則的新聞，群組裡有人轉發：「末世到了，你們看看。」她把手機翻過去，蓋在桌上。\n七床的老先生戴著呼吸器。機器一下一下，把一口一口的氣送進他的胸口。她站在床邊看了很久：人活著，原來是靠一口不是自己的氣。\n休息的十分鐘，她打開那本邊角都翻軟了的聖經。是五年前帶她查經的那位阿姨送的，頁邊還有阿姨用鉛筆寫的小字。\n她沒有外祖母為她禱告，也沒有母親教她背經文；可是她知道，自己是跟誰學的。\n「但你所學習的，所確信的，要存在心裡；因為你知道是跟誰學的」（3:14）。\n再往下讀：「聖經都是神所默示的」（3:16）。神所呼出的。她抬起頭，看了一眼七床——一口，一口，沒有停。\n那天下午，她拿一節經文頂了同事一句，到現在心裡還是硬的。她讀到「使人歸正」，知道今晚這一口氣，要先吹進她自己的胸口。\n交班之前，她在本子上多寫了一行：早上去跟她說聲對不起。\n外面的日子還是危險的。可是她手上這本書，從頭到尾都在指著一位——「這聖經能使你因信基督耶穌，有得救的智慧」（3:15）。\n她合上書。七床的呼吸器還在響，一下，一下。\n那一口氣不是她的。是那一位，從來沒有停過。"],"self":"這一章照出來的「有己」，就是清單的第一項：φίλαυτοι，愛自己——不是照顧自己，是凡事繞著自己轉：聽道時想的是「這段很適合某某人聽」，讀經時找的是可以支持我立場的那一節，學習是為了多一樣可以拿出來的東西。\n有己最會躲在敬虔的外貌後面：聚會、詩歌、屬靈的詞彙都在，只是不讓神碰我的錢、我的口、我的驕傲；而這一章的出路，不是更用力地恨自己，是留在神呼出的話裡，讓它把我這個歪掉的中心，一次又一次扶回到神面前。","t321":{"k":"耶穌是我的榜樣：主耶穌自己就是一個「存在」經上的人。在曠野受試探，他三次回答的都是「經上記著說」，因為「人活著，不是單靠食物，乃是靠神口裡所出的一切話」（太 4:4）——他用經文抵擋魔鬼，卻從來不用它壓碎軟弱的人。在拿撒勒的會堂，他打開以賽亞書，念的是「被擄的得釋放」（路 4:18），正是 3:6 那些被擄的人最需要的消息。而當同一群人要把他推下山崖，經上說「他卻從他們中間直行，過去了」（路 4:30）——受逼迫的主也會離開危險；他走向十字架，是在父所定的時候，不是被人逼進去的。","g":"讓耶穌作王：這一章要人讓出三個位置。第一個是中心——3:2 清單從「愛自己」開始、3:4 以「愛宴樂，不愛神」收尾，整張清單就是王位被「我」坐走了的樣子；讓主作王，是把那個位子還給他。第二個是審判官的位子——聖經是神呼出的，不是我手上的武器；先讓它督責我、扶正我，才有資格用溫柔勸戒別人（2:25）。第三個是「新鮮感」的位子——3:7 常常學習、4:3 耳朵發癢，都是讓新說法作王；主作王的人，肯留在已經確信的話裡。可以自己檢查：這一週，我打開聖經，是為了被他說話，還是為了替自己說話？","p":"建立屬神的體系：3:14「你知道是跟誰學的」，原文的「誰」是複數——提摩太的信仰是好幾雙手接力傳到他手上的：外祖母、母親、在路司得被石頭打過的屬靈父親。所以屬神的體系，第一是近距離的生命，不是遠距離的課程：3:10 的「服從」是貼身跟著走，小組長的品行、志向、忍耐，要讓組員看得見。第二是看守門口：3:6 的假師傅是「偷進人家」的，國度321空中團契分散在台灣、馬來西亞、新加坡、中國、紐西蘭，群組與私訊就是今天的門，牧養的人要認得羊、陪羊一起讀經，而不是用恐嚇把羊關起來。第三是把第一代信徒接進家裡：讓年長的弟兄姊妹作他們屬靈的外祖母、母親，一起翻開那本書。"},"grp":["【一、破冰】你這一生擁有的第一本書是甚麼？是誰給你的？如果現在打開它，你覺得自己會想起甚麼人、甚麼味道？","【二、扎心】經文說：「常常學習，終久不能明白真道」（3:7）。說出一件你「學了很多、聽了很多」，卻一直沒有讓神碰的事——一段沒有和好的關係、一個沒有放下的習慣、一筆沒有理清的錢？如果這一週讓神碰它，第一個會被改變的是甚麼？","【三、福音】讀 3:11 與 3:15：「但從這一切苦難中，主都把我救出來了」，「這聖經能使你因信基督耶穌，有得救的智慧」。保羅的確據不在自己多能忍，聖經的目的也不在讓你變成很懂的人；兩節都把焦點放在主身上。回想一次主把你從某件事裡「救出來」的經歷——那一次，你是靠自己撐過去的，還是被他拉出來的？","【四、行動】說出你的信仰是「跟誰學的」（3:14）那一位的名字，以及這一週你要在哪一天、用甚麼方式向他道謝；再說出一位你曾經拿經文「指著他說」的人，這一週你打算在甚麼時候、用甚麼話，向他把口氣收回來。","【五、代禱】為三種人指名禱告：一位家裡只有他一個人信主的第一代信徒，求主給他屬靈的家人；一對兒女還沒有信主的父母，求主釋放他們的自責，讓他們安心交託；一位正被錯謬教導、恐嚇式末世信息牽著走的人，求主差溫柔的人陪他回到真道上。若組裡有人正在家中受暴力或威脅，也為他的安全禱告，並一起確認他可以求助的管道。"],"prac":{"main":"這一週，我不追著每一陣風跑；我留在神呼出的話裡，讓它先把我扶正，再差我去行一件善事。","items":["對神：每天早上慢慢讀 3:14--17 其中一節，讀完不急著想「這段適合誰聽」，只問主一句：「今天這一節，你要先扶正我哪裡？」把答案寫成一行，帶著它出門。","對自己：從 3:2--5 的清單裡挑一項你最不想承認的（例如「不解怨」「忘恩負義」「愛宴樂，不愛神」），這七天每晚花三分鐘回顧：今天它在哪一刻出現？是在家裡、公司，還是群組裡？週末把這張紀錄帶到主面前認罪。","對人：這一週聯絡一位教你信仰的人（屬靈父母、組長、帶你查經的人），說出他哪一個生命的片段你一直記得；也找一位你曾經拿經文指責過的家人或同工，用平常的口氣把話收回來，不必再補一節經文。","對生活：這一週少轉發一則「末世到了」或來源不明的屬靈訊息；轉發之前先問三件事：這是真的嗎？這叫人更愛主，還是更害怕？我自己查過聖經上下文了嗎？把省下來的時間，拿來讀一章經文。","對使命：在你的小組或團契裡，主動陪一位第一代信徒或初信的人，約好這一週一起讀一段經文——不是你講他聽，是一起讀、一起問「這段經文在講誰」；讓他知道，在神的家裡，他也有一條「跟誰學的」線。"]},"safe":["① 用 3:1 算日子：把某一年、某一場戰爭、某一次疫情或天象排成時間表，宣告「這就是末世的最後階段」，叫會眾恐慌、囤積或辭職。","保羅說的末世，從基督第一次顯現（1:10）就開始了，第一世紀的以弗所已經活在其中；主自己說那日子那時辰「沒有人知道」（太 24:36）。把警醒講成恐慌，會讓人失去判斷，也讓不信的人把福音當成笑話（議題見 ISS03_1；主再來回指帖撒羅尼迦前書立場二）。","檢驗標準：會眾聽完，是更清醒地過好今天、愛身邊的人，還是更焦慮地追新聞、轉發預言？","② 把 3:2--5 的清單或「末世人品」貼標籤：貼在年輕一代、某個宗派、某個政黨、某個國家或某位講員身上——「你看，說的就是他們。」","清單用冠詞說「人」，3:5 更說這些人有敬虔的外貌，就在教會裡面；第一項「專顧自己」先對準的是講台與座位上的自己（鐵律四）。把清單往外貼，會把一面鏡子變成一支槍，也把會眾分成兩邊（議題見 ISS03_2）。","檢驗標準：講完 3:2--5，會眾心裡浮現的第一張臉，是別人的，還是自己的？","③ 用 3:5「這等人你要躲開」作黑名單：點名某位離開的同工、某間教會、某位家人，叫會眾斷絕往來，或拿來切割不同意見的弟兄姊妹。","保羅給的是分辨方向——看長期否認敬虔的能力，不是看一次的跌倒或一次的意見不合；躲開是不跟從、不被牽著走，不是公開羞辱。同一位保羅在上一章說要「用溫柔勸戒那抵擋的人」（2:25），盼望神給他們悔改的心（議題見 ISS03_3）。","檢驗標準：會眾聽完，是更警醒自己有沒有只剩外貌，還是手上多了一份要躲開的名單？","④ 用 3:6--7「無知婦女」貶低女性：「姊妹比較容易被騙，所以不要讓她們教導、帶查經」，或拿來嘲笑熱心上課的姊妹。","保羅指出的問題是「被各樣的私慾引誘」「常常學習，終久不能明白真道」，這兩樣男女都可能；下一節敵擋摩西的雅尼、佯庇是男人。保羅給的對策是讓女人「沉靜學道」（提前 2:11），不是不讓她們學（議題見 ISS03_4；性別與事奉回指提摩太前書立場二）。","檢驗標準：一位正在認真學聖經的姊妹聽完，是更被鼓勵、更受尊重，還是覺得自己又被看低了一次？","⑤ 用 3:7 反對學習：「讀神學、上課都沒用，讀越多越不屬靈」；或反過來，把課程數、證書、讀經進度當成屬靈程度的指標。","3:7 責備的不是學習，是學了卻不讓真理碰到心裡的罪；保羅自己臨死還要那些書與皮卷（4:13），庇哩亞人「天天考查聖經」被稱讚（徒 17:11）。講成反智，會讓渴慕的人退縮；講成比課數，會讓人用學習逃避悔改。","檢驗標準：會眾聽完，是更願意學，也更願意讓學到的改變自己，還是只想多上一門課、或乾脆不學了？","⑥ 用 3:8 的雅尼和佯庇為一切猶太傳統、偽經或民間傳說背書：「保羅都引用了，所以那本書也是神的話」；或反過來說「保羅引用傳說，所以聖經不可靠」。","出 7:11 只說「術士」，名字出自猶太傳統；保羅用一個人人知道的名字，像我們說「法老的術士」，不等於為整套傳統背書，他說的仍是聖經自己記下的事實（議題見 ISS03_5；聖經的默示與權威見 ISS00_4）。","檢驗標準：會眾聽完，是更清楚聖經與傳統的界線，還是對正典的範圍更糊塗、更不安？","⑦ 用 3:12 把一切不順、衝突、被批評、甚至被打被虐待都叫作「為主受逼迫」，叫受害者「背起十字架」留在不安全的處境裡。","3:12 的條件是「在基督耶穌裡敬虔度日」——因自己的錯受苦不是逼迫（彼前 2:20），家暴更不是十字架；保羅在 3:11 是被「救出來」的，也曾經逃離（徒 9:25；14:6），主說「有人在這城裡逼迫你們，就逃到那城裡去」（太 10:23）。人身安全受威脅時先保護生命、依法求助（議題見 ISS03_6；全卷立場見 ISS00_2）。","檢驗標準：一位正在家中受威脅的弟兄姊妹聽完，是更知道他可以離開、可以求助、教會會陪他，還是更覺得留下來忍才是屬靈？","⑧ 用 3:12 反向定罪：「你沒有受逼迫，就是不夠敬虔」；或叫人故意挑釁、製造衝突，好證明自己屬靈。","3:12 是陳述，不是命令；逼迫是忠心的副產品，不是要去追求的勳章。保羅說「若是能行，總要盡力與眾人和睦」（羅 12:18），把受苦變成指標，會讓平安的人自疑，也讓好鬥的人自義（全卷立場見 ISS00_2；受苦的四種分辨回指彼得前書立場二）。","檢驗標準：會眾聽完，是更安心地在基督裡好好活、也不怕代價，還是開始去找人吵架、或懷疑自己日子太平安？","⑨ 用 3:15「從小明白聖經」讓第一代信徒覺得次等：「沒有基督徒家庭的人，根基就是比較淺」；或羨慕地說「有外祖母、母親傳下來的才是真正的傳承」。","提摩太的父親是希臘人（徒 16:1），他的家本來就不完整；3:14 的「誰」是複數，屬靈父親保羅這一條線同樣真實。神沒有孫子：每一個人都是自己「因信基督耶穌」得救的（3:15）（議題見 ISS03_7；全卷立場見 ISS00_5）。","檢驗標準：一位家裡只有他一個人信主的弟兄姊妹聽完，是覺得自己也被接進一個家，還是覺得自己起跑就輸了？","⑩ 用 3:15 讓兒女不信主的父母自責：「你從小沒有好好教他聖經，他現在才會離開」；或把主日學、兒童讀經講成保證兒女得救的配方。","家庭信仰是祝福，不是得救的條件；信心不能由父母替兒女決定，友妮基的丈夫在經文裡只留下「希臘人」這三個字。把兒女的選擇全算在父母頭上，會把一位為兒女禱告了二十年的母親壓垮（議題見 ISS03_7；全卷立場見 ISS00_5）。","檢驗標準：一位兒女離開教會的父親或母親聽完，是得著繼續禱告的盼望，還是又多背了一層罪疚？","⑪ 拿 3:16 打人：在家裡吵架、在同工會上爭論時翻出一節經文說「聖經說的，你還有甚麼話講」；或把「督責」講成公開羞辱、在群組裡點名。","四個用處裡有兩個是扶正（使人歸正、教導人學義），目的是 3:17「叫屬神的人得以完全」；保羅上一章剛說主的僕人「不可爭競，只要溫溫和和地待眾人」（2:24）。把直尺當棍子，傷的是人，也傷了聖經在那個人心中的名聲。","檢驗標準：聽你引經文的人，是覺得被扶起來、知道還有路可以回來，還是覺得被打倒、只想離開？","⑫ 把默示論的細部分歧當成分門的標準：「不用『無誤』這個詞的人就不是真信徒」；或在講台上嘲笑持守無誤論的人「不讀書、太死板」。","本講義站在福音派對聖經權威的共同立場，不在本卷裁判細部定義；兩種文法讀法都承認聖經出於神。把定義之爭變成定罪，正像 2:23 說的「愚拙無學問的辯論」，會把一家人吵散（議題見 ISS03_8、ISS03_9；全卷立場見 ISS00_4）。","檢驗標準：持不同默示論說法的兩位弟兄姊妹聽完，是都更敬重聖經、也更能彼此接納，還是覺得對方站到了門外？","⑬ 用 3:16 把某一個譯本神聖化：「只有和合本是神所默示的，讀別的譯本就是讀錯的聖經」；或反過來說「既然都是翻譯，所以哪一句都不必認真」。","默示指的是神藉著原作者所呼出的話；忠實的翻譯傳達了這話，所以有權威，但每一個譯本都可以被原文校正。把譯本絕對化，會叫說其他語言、用其他譯本的弟兄姊妹覺得自己手上的不是真聖經（議題見 ISS03_8）。","檢驗標準：一位用英文或簡體譯本讀經的弟兄姊妹聽完，是更有把握神也向他說話，還是懷疑自己讀的不算數？","⑭ 用處境取消原則：「3:16 說的『聖經』只是舊約，跟新約、跟今天的我們沒有關係」；或把處境硬搬：「3:6 說的是偷進人家，所以家庭聚會、線上小組都很危險。」","書信三問要走完：處境是提摩太手上的舊約與以弗所的家庭教會；原則是神呼出的話能使人得救、把人扶正，屬神的人要分辨、要存在所學的；今天的落點是手機裡的群組與私訊——原則照守，落點隨處境（議題見 ISS03_9；全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是知道這段經文今天在自己的手機、自己的小組裡怎樣活，還是只覺得那是兩千年前的事、或開始害怕所有聚會？","⑮ 先講 321「聖經是我的準則」，再拿 3:16--17 當口號的插圖；或把「準則」講成檢查別人的標準，用來排名誰比較屬靈。","保羅的次序是先有一本神呼出的書，先使人「因信基督耶穌」得救（3:15），再把屬神的人扶正、裝備；321 只能在末端認出它（鐵律五）。把經文當理念的插圖，會眾記得的是一句標語，不是那位整本書都在指著的主。","檢驗標準：講完 3:14--17，會眾記得的是一句口號，還是那位叫冷掉的心再熱起來的主耶穌？","⑯ 把 3:10--11 講成保羅的英雄故事：「保羅被石頭打還站起來，你們也要像他一樣咬牙撐下去」，叫疲倦的人加倍努力、不准軟弱。","3:11 的最後一句才是重點：「但從這一切苦難中，主都把我救出來了」；保羅有時靠逃走、有時靠門徒圍著、有時在石頭底下活過來，每一次被稱讚的都是那位救他的主。焦點放在保羅身上，會眾得到的是偶像和壓力，失去的是那位也要救他們的主（鐵律七）。","檢驗標準：會眾聽完，是更佩服保羅，還是更愛那位一次又一次把人從苦難裡救出來的主？"]},{"n":4,"t":"那美好的仗我已經打過了","sub":"道、仗、站","lv":"A","arc":"冠","sec":[["4:1--5","務要傳道：無論得時不得時"],["4:6--8","那美好的仗我已經打過了：公義的冠冕"],["4:9--15","你要趕緊地到我這裡來：離開的、留下的、被請回來的"],["4:16--18","惟有主站在我旁邊：願榮耀歸給他"],["4:19--22","願主與你的靈同在：冬天以前"]],"serm":{"pts":[["務要傳道","4:1--5","「務要傳道，無論得時不得時」——人的耳朵發癢，傳道的人卻要凡事謹慎、忍受苦難；囑咐的權柄來自那位將來審判活人死人的主"],["美好的仗","4:6--8","「那美好的仗我已經打過了」——被澆奠的人回頭看，仗打過了、路跑盡了、道守住了；往前看，有公義的冠冕為他存留，也為凡愛慕他顯現的人"],["惟有主","4:9--22","「惟有主站在我旁邊，加給我力量」——底馬走了，路加留下，馬可被請回來；眾人都離棄的時候主站在旁邊，最後的一句是願榮耀歸給他"]]},"q":"你有沒有過這樣的時刻：小組的客廳原本坐滿了人，現在只剩下你和另一位；一起開始服事的同工，有的搬走了，有的去了更熱鬧的地方，有一位連一聲再見都沒有說。你還在講，可是聽的人越來越少，有人說你講的太老、太硬，轉去聽更好聽的了。\n你不是不信了，你只是累了，也有一點怕：怕自己撐不到最後，怕到了交棒那一天，回頭一看，旁邊一個人都沒有。\n這一章要問的是：當旁邊的位置都空了，你還打得完這一場仗嗎？還是你一直沒有發現，那個位置其實從頭到尾都有一位站著？","truth":"保羅能說「那美好的仗我已經打過了」（4:7），是因為在眾人都離棄的那一刻，「惟有主站在我旁邊，加給我力量」（4:17）——先有主的同在，才有打完的仗。\n所以得勝不是贏得多，是守得住、跑得完；救不是免死，是被帶進他的天國；一個人一生最後的一句話，不是「我做到了」，是「願榮耀歸給他」。","mv":{"t":"惟有主站在我旁邊，加給我力量，使福音被我盡都傳明，叫外邦人都聽見；我也從獅子口裡被救出來。","r":"提後4:17"},"card":["全卷「火・兵・經・冠」走到最後一個字：冠。一個人的一生由內而外走完了——裡面的火挑旺了，外面的苦同受了、棒交出去了，亂世中有聖經作準則，現在走到終點，有一位主在等。這一章先囑咐接棒的人「務要傳道」，再讓交棒的人回頭說「打過了」，最後揭開這場仗為甚麼打得完：眾人都離棄的時候，主站在旁邊。","這一章的主詞，越到後面越是主。他要審判活人死人，也要顯現；他按著公義存留冠冕，不只給保羅，也給凡愛慕他顯現的人；他照各人所行的報應，人不必自己去討帳；他在空蕩蕩的法庭上站在旁邊，加給力量，叫福音被傳明；他從獅子口裡救人，也必救人進他的天國。保羅在這一章最後做的，只有一件事：把榮耀歸給他。","4:10 底馬「離棄我」、4:16 眾人「都離棄我」，原文是同一個動詞 ἐγκατέλιπεν——撇下、丟下不管。主在十字架上喊「為甚麼離棄我」（太 27:46），用的也是這個字；而「我總不撇下你，也不丟棄你」（來 13:5），「丟棄」還是這個字。這改變今天的讀法：被撇下的那一夜，你不是站在一個主不懂的地方。他被離棄過，所以他說「不丟棄」，不是一句安慰話，是一句他付過代價的話。","這一章照出一本帳簿。誰在我最需要的時候沒有來、誰在背後扯後腿、誰當年對不起我——我們心裡記得清清楚楚，連日期都記得。保羅也被眾人離棄、被亞歷山大多多地害，可是他把報應交給主（4:14），又說「但願這罪不歸與他們」（4:16）；「歸」原文 λογισθείη，正是記帳、算在誰名下的字。我們的有己，常常不是做了甚麼大惡，是一直捨不得把那本帳簿交出去。","全章最該被記住的一個動作，是 4:11「你來的時候，要把馬可帶來」。當年拒絕馬可的人，臨終最想見的人裡就有他；兩人的修復早在保羅第一次坐監時就開始了（西 4:10；門 24），如今保羅臨終指名要他，還說他「有益處」。翻轉在這裡：當年被判定「不可帶」的人，成了臨終最想見的人；而提摩太被託付在路上把他「帶上」——修復之後，還需要有人願意繞路去接。也許這一週，你不是保羅，也不是馬可，你是那個被託付「把他帶來」的人。","這一週做一件「冬天以前」的事。保羅寫「你要趕緊在冬天以前到我這裡來」（4:21），因為冬天一到，船就不開了。拿出手機，找一個你心裡有話、卻一直拖著沒說的人——一位曾經同工後來疏遠的人，或一位曾經屢次使你暢快的長輩——在這個主日以前打一通電話或約一頓飯，說一句具體的「謝謝你」，或一句「我們可以重新開始嗎」。有些話，過了這個冬天就來不及說了。","最終整合：一間小鎮教會，主日下午，交接禮拜結束前。\n四十年前，他從一張摺疊椅、七個人開始。今天坐在台下的，也差不多是七個人——有的搬走了，有的去了城裡更大的教會，有一位當年一起禱告的同工，連一張卡片都沒有寄來。\n年輕的傳道請他說幾句話。大家都以為，他會念那一句：「那美好的仗我已經打過了」（4:7）。\n他翻開那本邊角都捲起來的聖經，卻往後多翻了幾節。\n「我要先念這一句，」他說，「沒有這一句，我打不完。」\n「惟有主站在我旁邊，加給我力量」（4:17）。\n他說，四十年裡有好幾個晚上，他也回頭看過，椅子是空的。是那一位先站在旁邊，加給他力量，然後才有今天這一句：打過了，跑盡了，守住了。\n說完，他把那本舊聖經交到年輕傳道的手裡：「棒交給你了。站在我旁邊的那一位，也會站在你旁邊。」\n台下七個人一起站起來，念第十八節：「願榮耀歸給他，直到永永遠遠。阿們」（4:18）。\n先有主站在旁邊，才有打完的仗；仗打完了，最後一句不是「我做到了」，是「願榮耀歸給他」。\n冠冕還沒有戴上。可是那一個下午他已經知道：路的盡頭站著的，就是一路站在他旁邊的那一位。"],"self":"這一章照出來的「有己」，藏在兩種很屬靈的樣子裡。一種是想被記得：把「我已經打過了」聽成自己的履歷，數算做過多少、帶過多少人，暗暗盼望交接那一天有人替我念出來；另一種是想被搔到癢處：耳朵只找聽了舒服的話，一聽到扎心的就換台，連聽道都在服事自己。\n兩種樣子底下是同一件事——主角是我。這一章把主角換回來：仗是主陪著打完的，冠冕是主存留的，被離棄時站在旁邊的是主，最後一句是「願榮耀歸給他」。","t321":{"k":"耶穌是我的榜樣：保羅在法庭上回頭，一個人都沒有；耶穌早就走過這條路。被捉拿的前一夜，他對門徒說：「你們要分散，各歸自己的地方去，留下我獨自一人；其實我不是獨自一人，因為有父與我同在」（約 16:32）。被眾人離棄的時候，他看見父在旁邊；十字架上，他為釘他的人求「父啊！赦免他們」（路 23:34），最後說「成了」——他也是打完了、跑盡了。保羅臨終的三件事，原來是在學主：看見同在、說出赦免、把一生交上去。我們不是學一個咬牙硬撐的英雄，是跟著一位被離棄過、仍然看見父的主走。","g":"讓耶穌作王：這一章的王從頭到尾是那位要「審判活人死人」的主（4:1），他的國度是保羅最後要被救進去的地方（4:18）。這一章要人讓出來的位置有三個。審判官的位置——亞歷山大的帳交給「主必照他所行的報應他」（4:14），不在我手裡；評分者的位置——冠冕由「按著公義審判的主」賜下（4:8），不由人數、點閱或別人的掌聲評分；主角的位置——最後一句不是我的成就，是「願榮耀歸給他」。可以自己檢查：這一週，你心裡最想親手判決的是誰？最想被誰打分數？那兩張椅子，現在是誰坐著？","p":"建立屬神的體系：4:9--21 是一張分散各地的同工網：有人被差派（推基古往以弗所），有人留下照顧（路加），有人病了被留下休養（特羅非摩），有人被請回來（馬可），也有人離開了（底馬）。一個健康的屬神體系，先承認這些都會發生。第一，交接要有人接：提摩太要來羅馬，推基古被差往以弗所（很可能就是去接替他）——棒交出去，崗位也有人頂上。第二，要有一扇讓人回來的門：讓曾經離開的同工有路回來，不必一輩子背著「半途而廢」。第三，生病的、年老的、被留在米利都的，不是體系的損耗，是體系要看顧的人。國度321空中團契散在各國，也可以彼此寫那封「冬天以前」的信。"},"grp":["【一、破冰】天氣轉冷的時候，你最捨不得丟的是哪一件舊外套、舊毛毯或一樣舊東西？它是誰給你的，或陪你走過哪一段日子？","【二、扎心】經文說：「我初次申訴，沒有人前來幫助，竟都離棄我；但願這罪不歸與他們」（4:16）。說出一次你回頭看、身邊好像一個人都沒有的時候——是哪一年、在甚麼地方？那一筆帳，你今天還記在誰的名下？","【三、福音】「惟有主站在我旁邊，加給我力量」（4:17）。保羅不是先打完仗才得著主的同在，是主先站在旁邊，他才打得完。說出一次你以為自己撐不下去、事後才發現主一直在旁邊的經歷：那是甚麼時候？主藉著誰、哪一句經文、哪一件小事站在你旁邊？","【四、行動】說出這一週你要做的一件「冬天以前」的事：要聯絡的是誰（一位疏遠的同工、一位曾經幫過你的長輩、一位正在病中或獨居的肢體）、哪一天、用電話、訊息還是登門探訪？如果你心裡有一個「馬可」，說出你願意先踏出的那一小步，以及要請誰陪你一起去。","【五、代禱】為三種人指名禱告：一位在服事中被離棄、正想退下來的同工，求主站在他旁邊，也讓我們成為他的路加；一位像特羅非摩一樣病了、被留下休養的肢體，求主看顧他，也讓我們不忘記他；一位曾經與你或教會關係破裂的人，求主賜雙方謙卑，開一條回來的路。"],"prac":{"main":"這一週，我記得主站在我旁邊；在冬天以前把該說的話說出來，把那本帳簿交給主。","items":["對神：每天早上讀 4:17 一次，說出今天你最怕一個人面對的那件事，然後說：「主，你站在我旁邊。」晚上讀 4:18，用一句話把今天的榮耀歸給他——不是等處境變好，是在今天的處境裡。","對自己：拿一張紙，把心裡那本帳簿寫下來：誰沒有來、誰傷了你、誰離開了。每寫一個名字，就在旁邊寫上「交給主」，把判決交出去；做得到的，再為他禱告 4:16 那一句。如果那個人仍在傷害你，同時寫下你要怎樣保護自己、向誰求助。","對人：這一週聯絡一位「馬可」或一位「阿尼色弗」——一位曾經疏遠的同工，或一位曾經屢次使你暢快的人。打一通電話、寫一張卡片，說出具體的感謝或道歉；如果你認識一位想回來卻不敢回來的人，可以像提摩太一樣，做那個繞路去接他的人。","對生活：保羅在牢裡要外衣、要書、要同伴。這一週照顧自己的身體與心思：天冷添衣、按時睡覺、讀一本好書、和一位朋友吃一頓飯；若你正在病中或疲憊，像特羅非摩一樣留下來休養，不必有罪疚感。","對使命：在你的小組或團契裡，找出一位可以接棒的人，這一週約他一起做一件你正在做的服事——帶查經、探訪、帶禱告——讓他在旁邊看、在旁邊做；也為一位在異地被捆綁或受逼迫的傳道人每天指名禱告。"]},"safe":["① 把 4:9--21 講成 321 五重職份的插圖：「路加是牧者、推基古是使徒、馬可是傳福音的……保羅的團隊證明了 321 的五重職份」，把一張臨終的名單排成一張組織圖。","經文裡沒有一個人被標上職份；這張名單講的是離開的、留下的、病了被留下的、被請回來的，最後是「惟有主站在我旁邊」。先讓名單自己說完，321 的團隊與傳承才在末端認出它；把人名硬套上職份，會把一封遺書講成一場理念宣導（鐵律五）。","檢驗標準：你講完 4:9--21，會眾記得的是那位站在旁邊的主和被請回來的馬可，還是一張 321 職份對照表？","② 用 4:6「我現在被澆奠」美化過勞：「真正愛主的人就要燒到最後一滴」「休息就是不夠委身」「家人要體諒你為主擺上」。","澆奠是把自己倒給主，不是讓人把你榨乾；寫這一節的人，同一章裡要外衣取暖、要書來讀、要同伴來陪（4:11--13），還把生病的特羅非摩留下休養（4:20）；保羅在提摩太前書也說，不看顧自己家裡的人是背了真道（提前 5:8）。把過勞叫作澆奠，會讓已經燒盡的同工更不敢停，也讓他的家庭為「事奉」付上不該付的代價（紅線三；全卷立場見 ISS00_2）。","檢驗標準：一位連續幾個月睡不好、配偶已經在哭的同工聽完，是更敢休息、求助、把重擔分出去，還是更覺得停下來就是不愛主？","③ 把 4:3「耳朵發癢」貼上標籤：「說的就是某某網路講員」「那間大教會就是增添好些師傅」「這一代年輕人就是耳朵發癢」，或藉此推算末世已到。","4:3 是一面鏡子，不是一張通緝令；保羅叫提摩太「你卻要」（4:5）做好自己的事，沒有叫他點名別人。把經文貼在某個人、某個教會、某個世代或某種立場上，講台就成了攻擊的平台，聽的人也學會先審判別人、不照自己（紅線四；鐵律四）。","檢驗標準：會眾聽完，第一個想到的是「我的耳朵會不會癢」，還是一張要提防的名單？","④ 用 4:10 的底馬影射離開教會的人：「某某就是今天的底馬，貪愛世界才離開」，或在講台上暗示哪一位前同工、哪一個家庭的名字。","經文只說底馬「離棄我」，沒有說他的結局；保羅對眾人的離棄說的是「但願這罪不歸與他們」（4:16）。離開的原因有千百種，其中有人是被傷害才走的；用底馬點名，會讓還在猶豫要不要回來的人，再也不敢回來（紅線七；議題見 ISS04_7）。","檢驗標準：一位曾經離開服事、這個主日才第一次回來坐在後排的弟兄姊妹聽完，是覺得門還開著，還是覺得自己就是那個被點名的底馬？","⑤ 把 4:14 讀成咒詛，或拿它鼓勵會眾為仇敵禱告「願他遭報」：「保羅都求主報應亞歷山大了，我們也可以」。","4:14 的「報應」是將來式直述句——主必照他所行的；保羅是把報應交給主，不是求主出手；兩節之後他說「但願這罪不歸與他們」（4:16）。把交託講成咒詛，會讓受傷的人被苦毒困住；反過來，也不可叫人假裝沒有受傷，4:15 保羅照樣叫提摩太「要防備他」（紅線七；議題見 ISS04_9）。","檢驗標準：一位被同事或前任傷得很深的人聽完，是把那筆帳交給主、同時知道可以保護自己，還是帶著一份「神會替我出氣」的期待回家？","⑥ 把一切的反對、批評、衝突都叫作「為主受逼迫」：「有人反對你的意見，就是亞歷山大在敵擋福音」「你在家裡被打罵，是為主背十字架」。","保羅受的苦，是為福音「被捆綁，像犯人一樣」；就是這樣，他也申訴、求助、叫人帶外衣來，也記得自己「從獅子口裡被救出來」（4:17）。把自己的固執說成受逼迫，會拒絕一切提醒；把被虐待說成背十字架，會讓受害的人留在危險裡。人身安全受威脅時，先保護生命、依法求助（紅線九；全卷立場見 ISS00_2）。","檢驗標準：一位在家裡長期被打罵的姊妹聽完，是知道神不要她留在侵害裡、可以求助，還是覺得忍下去才是屬靈的苦難？","⑦ 用處境取消原則，或把處境硬搬：「這是使徒臨死的特別囑咐，跟我們這些一般信徒無關」；或反過來，要每個會友都過一個牢房裡的使徒的生活。","書信三問要走完：處境是一位被捆綁、快要殉道的父親，對一位年輕、可能天性怯懦、要獨自扛起以弗所的兒子說話；原則是傳道要忠心、苦難要同受、報應交給主、主站在旁邊；今天落在累了想退下的服事者、被離棄的同工、病床邊與交接的那一天。","檢驗標準：會眾聽完，能不能說出這一章在他自己的小組、職場、家庭裡要改變的一件事，而不是只記得一個勇敢的老人？","⑧ 用 4:2「無論得時不得時」合理化不顧場合：在喪禮上逼家屬決志、在同事的婚宴上大聲責備人，還說「保羅叫我們不看場合」。","「不得時」是不看氣氛決定忠心，不是不看人決定方式；同一封信說「主的僕人不可爭競，只要溫溫和和地待眾人」（2:24），4:2 的責備旁邊也放著「百般的忍耐」。不顧關係的傳福音，常常把人推得更遠（議題見 ISS04_2）。","檢驗標準：會眾聽完，是更願意在合適的時候溫柔地開口，還是更理直氣壯地不管對方的處境？","⑨ 把 4:8「公義的冠冕」講成事奉業績的獎盃或成功神學：「冠冕看你帶了多少人、建了多大的教會」「現在擺上越多，天上的冠冕越大，今生也越蒙福」。","4:8 的冠冕「不但賜給我，也賜給凡愛慕他顯現的人」——它不是使徒專用，也不是業績排名；στέφανος 是跑完的人戴的花冠。把冠冕講成比較，會讓默默跑自己那一段的人覺得自己沒有份（成功神學回指希伯來書立場四；議題見 ISS04_6）。","檢驗標準：一位一生在小教會默默服事、從來沒有上過台的長輩聽完，是知道那一圈花冠也為他存留，還是覺得冠冕是給大人物的？","⑩ 把 4:6--8 講成保羅的英雄傳記：「看保羅多勇敢，臨死還能說打過了，你要像他一樣堅強」，讓會眾更佩服保羅。","這一章的轉折是 4:17 的「惟有主」：保羅打得完，是因為主站在旁邊、加給他力量；他最後一句是「願榮耀歸給他」（4:18），不是「看我」。把焦點放在保羅的膽量，會讓本來就怯懦的提摩太們更覺得自己不夠格（鐵律七）。","檢驗標準：會眾聽完，是更佩服保羅，還是更認識那位在空蕩蕩的法庭上站在他旁邊、今天也站在我們旁邊的主？","⑪ 把 4:18「主必救我」講成保證免死或必得醫治：「只要信，主一定救你脫離這場病」；或反過來在病床邊說「不得醫治，就是神要接你回家，不必再求了」。","保羅寫這句話時知道自己快被處死，他說的救是「救我進他的天國」——救不是免死，但也沒有叫人停止求醫治、停止就醫。給人神沒有給的保證，等不到醫治的家屬會以為神失信；替神宣布結局，則會奪走病人和家屬禱告的盼望。","檢驗標準：一位為家人禱告了很久、還沒有等到醫治的弟兄姊妹聽完，是更相信主沒有失信，還是更覺得自己的信心不夠，或被要求放棄？","⑫ 跳過 4:20 的特羅非摩，只講神蹟故事來壓病人：「保羅能行神蹟，你病了是信心不夠」「生病的同工就是不夠屬靈才被擺上」。","保羅行過醫病的神蹟，這一次卻把生病的同工留在米利都休養；病了不是信心不夠的記號，留下來養病也不是失敗。把病講成屬靈問題，會讓病人羞愧、隱瞞病情，甚至拖延就醫。","檢驗標準：一位因病暫停服事的同工聽完，是安心地休養、按時就醫，還是覺得自己被教會留在米利都、被忘記了？","⑬ 用 4:11 的馬可強迫和好：「保羅和馬可都和好了，你為甚麼不能原諒他、回到原來的關係」，甚至要受害者與加害者立刻一起同工。","保羅與馬可的修復，是十幾年裡兩個人都被主改變的結果（這使我們想起西 4:10、門 24），不是一次被要求的和好；饒恕不等於恢復原來的信任，有傷害、有虐待的地方，安全先於和好。逼人和好，會讓受傷的人再受一次傷（議題見 ISS04_8）。","檢驗標準：一位曾被同工深深傷害的人聽完，是看見和好有一條慢慢的路、可以有界線，還是覺得自己若不馬上原諒就是不屬靈？","⑭ 把 4:7「那美好的仗」講成得勝口號或競爭：「321 得勝者就是要贏、要拚業績、要打敗對手」，或用它鼓動會眾跟某些人、某些群體「打仗」。","保羅的仗三個動詞都是完成式：打過了、跑盡了、守住了——得勝不是贏得多，是守得住、跑得完；基督的精兵打的仗不是跟人打的（2:24），而且這場仗是主陪他打完的（4:17）。把 4:7 講成口號，會把一封叫人剛強的信，講成一封叫人好鬥的信。","檢驗標準：會眾聽完 4:7，是更想把自己那一段跑完、把所信的守住，還是更想去贏過誰、打倒誰？"]}],"txt":{"1":["奉神旨意，照著在基督耶穌裡生命的應許，作基督耶穌使徒的保羅","寫信給我親愛的兒子提摩太。願恩惠、憐憫、平安從父神和我們主基督耶穌歸與你！","我感謝神，就是我接續祖先用清潔的良心所事奉的神。祈禱的時候，不住的想念你，","記念你的眼淚，晝夜切切地想要見你，好叫我滿心快樂。","想到你心裡無偽之信，這信是先在你外祖母羅以和你母親友妮基心裡的，我深信也在你的心裡。","為此我提醒你，使你將神藉我按手所給你的恩賜再如火挑旺起來。","因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。","你不要以給我們的主作見證為恥，也不要以我這為主被囚的為恥；總要按神的能力，與我為福音同受苦難。","神救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典；這恩典是萬古之先，在基督耶穌裡賜給我們的，","但如今藉著我們救主基督耶穌的顯現才表明出來了。他已經把死廢去，藉著福音，將不能壞的生命彰顯出來。","我為這福音奉派作傳道的，作使徒，作師傅。","為這緣故，我也受這些苦難。然而我不以為恥；因為知道我所信的是誰，也深信他能保全我所交付他的，直到那日。","你從我聽的那純正話語的規模，要用在基督耶穌裡的信心和愛心，常常守著。","從前所交託你的善道，你要靠著那住在我們裡面的聖靈牢牢地守著。","凡在亞細亞的人都離棄我，這是你知道的，其中有腓吉路和黑摩其尼。","願主憐憫阿尼色弗一家的人；因他屢次使我暢快，不以我的鎖鍊為恥，","反倒在羅馬的時候，殷勤地找我，並且找著了。","願主使他在那日得主的憐憫。他在以弗所怎樣多多地服事我，是你明明知道的。"],"2":["我兒啊，你要在基督耶穌的恩典上剛強起來。","你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。","你要和我同受苦難，好像基督耶穌的精兵。","凡在軍中當兵的，不將世務纏身，好叫那招他當兵的人喜悅。","人若在場上比武，非按規矩，就不能得冠冕。","勞力的農夫理當先得糧食。","我所說的話，你要思想，因為凡事主必給你聰明。","你要記念耶穌基督乃是大衛的後裔，他從死裡復活，正合乎我所傳的福音。","我為這福音受苦難，甚至被捆綁，像犯人一樣。然而神的道卻不被捆綁。","所以，我為選民凡事忍耐，叫他們也可以得著那在基督耶穌裡的救恩和永遠的榮耀。","有可信的話說：我們若與基督同死，也必與他同活；","我們若能忍耐，也必和他一同作王。我們若不認他，他也必不認我們；","我們縱然失信，他仍是可信的，因為他不能背乎自己。","你要使眾人回想這些事，在主面前囑咐他們：不可為言語爭辯；這是沒有益處的，只能敗壞聽見的人。","你當竭力在神面前得蒙喜悅，作無愧的工人，按著正意分解真理的道。","但要遠避世俗的虛談，因為這等人必進到更不敬虔的地步。","他們的話如同毒瘡，越爛越大；其中有許米乃和腓理徒，","他們偏離了真道，說復活的事已過，就敗壞好些人的信心。","然而，神堅固的根基立住了；上面有這印記說：「主認識誰是他的人」；又說：「凡稱呼主名的人總要離開不義。」","在大戶人家，不但有金器銀器，也有木器瓦器；有作為貴重的，有作為卑賤的。","人若自潔，脫離卑賤的事，就必作貴重的器皿，成為聖潔，合乎主用，預備行各樣的善事。","你要逃避少年的私慾，同那清心禱告主的人追求公義、信德、仁愛、和平。","惟有那愚拙無學問的辯論，總要棄絕，因為知道這等事是起爭競的。","然而主的僕人不可爭競，只要溫溫和和地待眾人，善於教導，存心忍耐，","用溫柔勸戒那抵擋的人；或者神給他們悔改的心，可以明白真道，","叫他們這已經被魔鬼任意擄去的，可以醒悟，脫離他的網羅。"],"3":["你該知道，末世必有危險的日子來到。","因為那時，人要專顧自己，貪愛錢財，自誇，狂傲，謗讟，違背父母，忘恩負義，心不聖潔，","無親情，不解怨，好說讒言，不能自約，性情凶暴，不愛良善，","賣主賣友，任意妄為，自高自大，愛宴樂，不愛神，","有敬虔的外貌，卻背了敬虔的實意；這等人你要躲開。","那偷進人家、牢籠無知婦女的，正是這等人。這些婦女擔負罪惡，被各樣的私慾引誘，","常常學習，終久不能明白真道。","從前雅尼和佯庇怎樣敵擋摩西，這等人也怎樣敵擋真道。他們的心地壞了，在真道上是可廢棄的。","然而他們不能再這樣敵擋；因為他們的愚昧必在眾人面前顯露出來，像那二人一樣。","但你已經服從了我的教訓、品行、志向、信心、寬容、愛心、忍耐，","以及我在安提阿、以哥念、路司得所遭遇的逼迫、苦難。我所忍受是何等的逼迫；但從這一切苦難中，主都把我救出來了。","不但如此，凡立志在基督耶穌裡敬虔度日的也都要受逼迫。","只是作惡的和迷惑人的，必越久越惡，他欺哄人，也被人欺哄。","但你所學習的，所確信的，要存在心裡；因為你知道是跟誰學的，","並且知道你是從小明白聖經，這聖經能使你因信基督耶穌，有得救的智慧。","聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，","叫屬神的人得以完全，預備行各樣的善事。"],"4":["我在神面前，並在將來審判活人死人的基督耶穌面前，憑著他的顯現和他的國度囑咐你：","務要傳道，無論得時不得時，總要專心，並用百般的忍耐、各樣的教訓責備人，警戒人，勸勉人。","因為時候要到，人必厭煩純正的道理，耳朵發癢，就隨從自己的情慾增添好些師傅，","並且掩耳不聽真道，偏向荒渺的言語。","你卻要凡事謹慎，忍受苦難，做傳道的工夫，盡你的職分。","我現在被澆奠，我離世的時候到了。","那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。","從此以後，有公義的冠冕為我存留，就是按著公義審判的主到了那日要賜給我的；不但賜給我，也賜給凡愛慕他顯現的人。","你要趕緊地到我這裡來。","因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了；革勒士往加拉太去；提多往撻馬太去；","獨有路加在我這裡。你來的時候，要把馬可帶來，因為他在傳道的事上於我有益處。","我已經打發推基古往以弗所去。","我在特羅亞留於加布的那件外衣，你來的時候可以帶來，那些書也要帶來，更要緊的是那些皮卷。","銅匠亞歷山大多多地害我；主必照他所行的報應他。","你也要防備他，因為他極力敵擋了我們的話。","我初次申訴，沒有人前來幫助，竟都離棄我；但願這罪不歸與他們。","惟有主站在我旁邊，加給我力量，使福音被我盡都傳明，叫外邦人都聽見；我也從獅子口裡被救出來。","主必救我脫離諸般的凶惡，也必救我進他的天國。願榮耀歸給他，直到永永遠遠。阿們。","問百基拉、亞居拉，和阿尼色弗一家的人安。","以拉都在哥林多住下了。特羅非摩病了，我就留他在米利都。","你要趕緊在冬天以前到我這裡來。有友布羅、布田、利奴、革老底亞，和眾弟兄都問你安。","願主與你的靈同在！願恩惠常與你們同在！"]},"blk":{"1":[{"a":1,"z":2,"star":1,"grk":"<p lang=\"grc\">Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ διὰ θελήματος θεοῦ κατʼ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ</p><p lang=\"grc\">Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.</p>","lit":"<p>保羅，基督耶穌的使徒，藉著神的旨意，照著那在基督耶穌裡之生命的應許，</p><p>給提摩太，親愛的孩子：恩惠、憐憫、平安，從父神和基督耶穌我們的主。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ</td><td>Paulos apostolos Christou Iēsou</td><td>保羅，基督耶穌的使徒</td><td>牢裡寫信，名分沒有變</td></tr><tr><td>διὰ θελήματος θεοῦ</td><td>dia thelēmatos theou</td><td>藉著神的旨意</td><td>使徒職分不是皇帝給的</td></tr><tr><td>κατʼ ἐπαγγελίαν ζωῆς</td><td>kat' epangelian zōēs</td><td>照著生命的應許</td><td>將死的人，第一個盼望的字是生命</td></tr><tr><td>ἀγαπητῷ τέκνῳ</td><td>agapētō teknō</td><td>親愛的孩子</td><td>提前 1:2 作 γνησίῳ τέκνῳ「真兒子」</td></tr><tr><td>χάρις, ἔλεος, εἰρήνη</td><td>charis, eleos, eirēnē</td><td>恩惠、憐憫、平安</td><td>保羅書信中只見於給提摩太的兩封</td></tr></table>","gram":"<p><strong>開頭一句就落在「生命」上。</strong>κατʼ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ（kat' epangelian zōēs tēs en Christō Iēsou） 的 κατά（kata） 可以讀成「為著」（使徒職分是為了傳揚這生命的應許），也可以讀成「與……相稱」。不論哪一種，一個知道自己快被處死的人（4:6），寫信的第一句提到的是生命。這應許在 1:10 會再出現：「將不能壞的生命彰顯出來」（1:10）。</p><p>提前 1:2 稱提摩太 γνησίῳ τέκνῳ（gnēsiō teknō）「真兒子」，強調名分的真實；這裡改成 ἀγαπητῷ τέκνῳ（agapētō teknō）「親愛的孩子」，強調感情。τέκνον（teknon） 是「孩子」，帶著出生與養育的味道，不是法律上的繼承人 υἱός（huios）。問安的三樣 χάρις（charis）, ἔλεος（eleos）, εἰρήνη（eirēnē），在保羅書信中只見於寫給提摩太的兩封信（提多書 SBLGNT 只有恩惠、平安）；憐憫夾在恩惠與平安中間。</p>","exp":"<p>這封信的第一句，是一個坐牢的人寫的。他的頭銜沒有變：「作基督耶穌使徒的保羅」（1:1）。羅馬的鎖鍊捆得住他的手，捆不住他的名分；這名分是「奉神旨意」來的，不是皇帝給的，皇帝也拿不走。</p><p>他接著寫「生命的應許」。這時冬天快到了，他要兒子趕在冬天以前來（4:21）；他知道「我離世的時候到了」（4:6），信紙上第一個盼望的字卻是生命。這不是故作堅強，是他知道這生命「在基督耶穌裡」，不在羅馬的判決書裡。</p><p>收信人是「我親愛的兒子提摩太」（1:2）。提摩太不是保羅生的；路司得那個少年，父親是希臘人（徒 16:1）。沒有血緣，卻有一份父親的心。這是全卷第二條傳承線的起點：家裡有外祖母和母親（1:5），教會裡有屬靈的父親。一個家不完整的孩子，在神的家裡被叫作「親愛的兒子」。</p><p>問安裡多了「憐憫」。寫給一個年輕、膽小、常常生病的兒子（這使我們想起提前 5:23），保羅先替他求的不是成功，是憐憫。這使我們想起他自己的見證：「然而我還蒙了憐憫」（提前 1:13）。蒙過憐憫的人，最懂得替兒子求憐憫。</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας</p><p lang=\"grc\">ἐπιποθῶν σε ἰδεῖν, μεμνημένος σου τῶν δακρύων, ἵνα χαρᾶς πληρωθῶ</p>","lit":"<p>我向神存著感謝，就是我從祖先以來在清潔的良心中所事奉的那位；正如我在我的祈求中不間斷地存著對你的記念，夜裡和白日，</p><p>切切想要見你，記得你的眼淚，好叫我被喜樂充滿；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Χάριν ἔχω τῷ θεῷ</td><td>Charin echō tō theō</td><td>我對神存著感謝</td><td>提前 1:12 也用這個說法</td></tr><tr><td>λατρεύω ἀπὸ προγόνων</td><td>latreuō apo progonōn</td><td>從祖先以來我所事奉</td><td>信仰的連續：從以色列的根長出來</td></tr><tr><td>ἐν καθαρᾷ συνειδήσει</td><td>en kathara syneidēsei</td><td>在清潔的良心中</td><td>被定罪的人，良心仍是清潔的</td></tr><tr><td>ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν</td><td>adialeipton echō tēn peri sou mneian</td><td>我不間斷地存著對你的記念</td><td>記憶字群的第一個</td></tr><tr><td>νυκτὸς καὶ ἡμέρας</td><td>nyktos kai hēmeras</td><td>夜裡和白日</td><td>猶太人的說法，先夜後晝</td></tr><tr><td>μεμνημένος σου τῶν δακρύων</td><td>memnēmenos sou tōn dakryōn</td><td>記得你的眼淚</td><td>完成式分詞：那一幕至今還在</td></tr><tr><td>ἵνα χαρᾶς πληρωθῶ</td><td>hina charas plērōthō</td><td>好叫我被喜樂充滿</td><td>被動語態：喜樂是被填滿的</td></tr></table>","gram":"<p><strong>1:3--6 是一串記憶的字。</strong>μνείαν（記念）、μεμνημένος（記得）、ὑπόμνησιν（想起），到 1:6 的 ἀναμιμνῄσκω（提醒），四個字同一個字根。牢房裡的人能做的不多，但他能記得：在禱告裡記得兒子，記得他的眼淚，記得他家裡三代的信；然後把這份記憶交回去，叫兒子也想起來。</p><p>νυκτὸς καὶ ἡμέρας（nyktos kai hēmeras） 先說夜，這是猶太人以日落為一天開始的說法，保羅不在牢裡時也這樣說（帖前 2:9；3:10）。這個片語在文法上可以接前面的「祈禱」，也可以接 1:4 的「切切地想要」；和合本把它放進 1:4，兩種接法意思相去不遠。ἐπιποθῶν（epipothōn） 是強烈的渴想，字首加重了「想要」。μεμνημένος（memnēmenos） 是完成式分詞：那一次的眼淚，至今還在他眼前。ἵνα χαρᾶς πληρωθῶ（hina charas plērōthō） 用被動語態：喜樂不是他自己製造的，是見到兒子時被填滿的。</p>","exp":"<p>「我感謝神，就是我接續祖先用清潔的良心所事奉的神。」（1:3）保羅在牢裡的第一件事是感謝。他沒有先數算自己受的冤屈，先數算神的信實：從祖先到他自己，事奉的是同一位神。一個被當作犯人捆著的人說自己的良心是清潔的，這不是自誇，是在審判台前也站得住的平安。</p><p>接下來是眼淚。「記念你的眼淚，晝夜切切地想要見你」（1:4）。經上沒有記載這眼淚是在哪一次分手時流的，很可能是保羅最後一次與他分別的時候。我們只知道，提摩太哭過，保羅一直記得。屬靈的父親記得的，不是兒子的成績，是兒子的眼淚。</p><p>全卷從眼淚開始。這封遺書要談的事很重：受苦、離棄、末世、殉道。但保羅先讓兒子知道，他被想念著。一個人要接過重擔以前，先需要知道自己被愛。棒子交出去以前，先是一個擁抱。</p><p>讀到這裡，鎖鍊聲是聽得見的；但這兩節的果效不是悲壯。保羅說，見到你，「好叫我滿心快樂」（1:4）。一個快死的人還在盼望喜樂，因為他的喜樂不繫在牢門開不開，繫在主身上，也繫在主所託付給他的人身上。321 說「人比事重要」，在這兩節不必多講，一個父親晝夜的禱告已經講完了。</p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">ὑπόμνησιν λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.</p>","lit":"<p>得著那在你裡面無偽之信的提醒，這信先住在你的外祖母羅以和你的母親友妮基裡面，而我確信也在你裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑπόμνησιν λαβὼν</td><td>hypomnēsin labōn</td><td>得著提醒</td><td>想起，是被喚醒的記憶</td></tr><tr><td>ἀνυποκρίτου πίστεως</td><td>anypokritou pisteōs</td><td>無偽的信</td><td>否定字首＋「演員」：不戴面具</td></tr><tr><td>ἐνῴκησεν πρῶτον</td><td>enōkēsen prōton</td><td>先住在</td><td>與 1:14 ἐνοικοῦντος 同字根</td></tr><tr><td>τῇ μάμμῃ σου Λωΐδι</td><td>tē mammē sou Lōidi</td><td>你的外祖母羅以</td><td>「外祖母」一字新約只此一次</td></tr><tr><td>τῇ μητρί σου Εὐνίκῃ</td><td>tē mētri sou Eunikē</td><td>你的母親友妮基</td><td>猶太婦人，丈夫是希臘人</td></tr><tr><td>πέπεισμαι δὲ ὅτι καὶ ἐν σοί</td><td>pepeismai de hoti kai en soi</td><td>而我確信也在你裡面</td><td>完成式；1:12 再用</td></tr></table>","gram":"<p><strong>ἐνῴκησεν（enōkēsen） 是「住進去」。</strong>這信不是放在羅以與友妮基的頭腦裡，是「住」在她們裡面，像一個房客搬進家裡。1:14 保羅用同一個字根說聖靈：τοῦ ἐνοικοῦντος ἐν ἡμῖν（tou enoikountos en hēmin），「住在我們裡面的」。信住進外祖母，住進母親，也住進兒子；而叫人守得住的那一位，也住在裡面。</p><p>ἀνυποκρίτου（anypokritou） 是否定字首加上「演員」一字，指不戴面具的信；提前 1:5 也說「無偽的信心」。πρῶτον（prōton） 說的是次序，不是等級：外祖母先有，不是外祖母的比較好。πέπεισμαι（pepeismai） 是完成式，「我已經被說服，至今確信」；1:12 保羅講自己對主的確信，用的是同一個字。保羅對兒子的信心，與對主的信心，用同一個動詞。</p>","exp":"<p>〔背景〕徒 16:1--3（使徒行傳講義第 16 章）</p><p>「想到你心裡無偽之信，這信是先在你外祖母羅以和你母親友妮基心裡的，我深信也在你的心裡。」（1:5）這是全卷那一條線的起點：信是傳下來的。本系列使徒行傳講義第 16 章講過，保羅第二次到路司得，遇見這個年輕門徒，「是信主之猶太婦人的兒子，他父親卻是希臘人」（徒 16:1）。</p><p>那個「卻」字很重。提摩太的家並不完整。父親沒有出現在這信心的名單上；提摩太到成年還沒受割禮（徒 16:3），家裡在信仰上是分開的。所謂三代的信，其實是兩個女人在一個不完整的家裡，一點一點把聖經放進孩子心裡（3:15）。</p><p>所以這一節不是在說有基督徒家庭的人比較高一等。沒有基督徒家庭背景的弟兄姊妹不是次等的；提摩太自己就有一半是這樣的處境，而保羅這位屬靈的父親，是另一條同樣真實的傳承線。家庭信仰是祝福，不是得救的條件。兒女還沒有信主的父母，也不必在這節經文前自責：友妮基能做的，是讓信住在自己裡面；叫信住進兒子裡面的，是神。</p><p>還有一個細節：保羅說「我深信也在你的心裡」。提摩太當時大概正在懷疑自己。保羅不先指出他的軟弱，先指出他身上已經有的。後面的挑旺、不以為恥、牢牢守著，都建在這一句上：你裡面有真的東西。321 講「235」的屬靈父母兒女，在這裡可以認出一個樣子：父母的工作，是看見孩子身上神已經放進去的。</p>"},{"a":6,"z":6,"star":2,"grk":"<p lang=\"grc\">διʼ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·</p>","lit":"<p>為這緣故，我提醒你，要使神的恩賜再燃起來，就是那藉著我的按手而在你裡面的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διʼ ἣν αἰτίαν</td><td>di' hēn aitian</td><td>為這緣故</td><td>1:12 再用同一片語</td></tr><tr><td>ἀναμιμνῄσκω σε</td><td>anamimnēskō se</td><td>我提醒你</td><td>記憶字群的最後一個</td></tr><tr><td>ἀναζωπυρεῖν</td><td>anazōpyrein</td><td>使再燃起來</td><td>新約只此一次；現在式不定詞：常常搧</td></tr><tr><td>τὸ χάρισμα τοῦ θεοῦ</td><td>to charisma tou theou</td><td>神的恩賜</td><td>屬格說明來源：恩賜屬於神</td></tr><tr><td>ὅ ἐστιν ἐν σοὶ</td><td>ho estin en soi</td><td>那現在在你裡面的</td><td>現在式：沒有被收回</td></tr><tr><td>διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου</td><td>dia tēs epitheseōs tōn cheirōn mou</td><td>藉著我按手</td><td>提前 4:14 作「眾長老按手」</td></tr></table>","gram":"<p><strong>ἀναζωπυρεῖν（anazōpyrein） 在新約只出現這一次。</strong>這個字由「再」、「活的」、「火」合成，原是爐邊的字：把蓋著灰的炭撥開、搧一搧，讓火再活起來。和合本「再如火挑旺起來」譯得很準。它不一定表示火已經熄了；當時的用法也指讓一直在燒的火保持旺盛。現在式不定詞說的是持續的動作：不是挑一次，是常常挑。</p><p>τὸ χάρισμα τοῦ θεοῦ（to charisma tou theou） 的屬格說明來源：恩賜是神的，提摩太只是持有人。ὅ ἐστιν ἐν σοὶ（ho estin en soi） 是現在式，恩賜此刻仍在他裡面。διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου（dia tēs epitheseōs tōn cheirōn mou） 要與提前 4:14 的 μετὰ ἐπιθέσεως τοῦ πρεσβυτερίου（meta epitheseōs tou presbyteriou） 並看：一處說藉著我的手，一處說伴隨著眾長老的按手。最自然的讀法是同一次的按立，保羅與長老們一同按手。</p>","exp":"<p>〔提前〕提前 4:14（提摩太前書講義第 4 章）</p><p>「為此我提醒你，使你將神藉我按手所給你的恩賜再如火挑旺起來。」（1:6）「為此」接回上一節：因為你裡面有無偽之信。保羅不是在責備一個沒有信心的人，是在提醒一個有火的人：炭還在，只是蒙了灰。</p><p>灰從哪裡來？從疲倦，從挫折，從以弗所教會裡反對的聲音，從屬靈父親入獄的消息。灰不是罪名，是日子久了自然會積的東西。對付灰，不是換一爐新炭，是把原有的撥開。恩賜還「在你裡面」，神沒有收回。</p><p>提摩太前書講義第 4 章已經講過按手：「從前藉著預言、在眾長老按手的時候賜給你的」（提前 4:14）。按手不是魔術；手不是電線，恩賜也不是從保羅的手流過去的電。按手是交託與認可：教會當眾承認神在這個人身上的呼召，也把他交在神手裡。賜恩賜的始終是神，所以經文說的是「神……所給你的恩賜」。</p><p>挑旺是誰的工作？動詞的主詞是提摩太，但火是神點的。人能做的是撥灰、添柴、打開窗。321 說「用心靠聖靈」，在這裡看得很清楚：用心，是提摩太的責任；靠聖靈，是火的來源。下一節保羅要說明，這火的性情是甚麼。</p>"},{"a":7,"z":7,"star":3,"grk":"<p lang=\"grc\">οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.</p>","lit":"<p>因為神賜給我們的，不是膽怯的靈，而是能力的、愛的、和清明自守的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς</td><td>ou gar edōken hēmin ho theos</td><td>因為神沒有賜給我們</td><td>不定過去式：已經賜了；「我們」包括保羅</td></tr><tr><td>πνεῦμα δειλίας</td><td>pneuma deilias</td><td>膽怯的靈（心）</td><td>「膽怯」這個名詞新約只此一次</td></tr><tr><td>ἀλλὰ δυνάμεως</td><td>alla dynameōs</td><td>乃是能力的</td><td>和合本「剛強」；與 1:8 同字</td></tr><tr><td>καὶ ἀγάπης</td><td>kai agapēs</td><td>和愛的</td><td>能力的方向</td></tr><tr><td>καὶ σωφρονισμοῦ</td><td>kai sōphronismou</td><td>和清明自守的</td><td>新約只此一次；和合本「謹守」</td></tr></table>","gram":"<p><strong>πνεῦμα（pneuma） 是「心」還是「靈」？</strong>和合本譯作「心」，指一種性情、氣質；許多解經家認為這裡指聖靈，因為 1:14 說「住在我們裡面的聖靈」，而且「賜」這個動詞常用在神賜聖靈（這使我們想起羅 5:5）。兩種讀法可以合起來看：神所賜的聖靈，在人裡面結出剛強、仁愛、謹守的性情。羅馬書有相同的句型：「你們所受的，不是奴僕的心，仍舊害怕」（羅 8:15）。本講義取合讀，重點落在「神所賜」。</p><p>δειλίας（deilias） 在新約只出現這一次，是畏縮、退避的意思；同字根的形容詞，主在船上問門徒為甚麼膽怯時用過（太 8:26 的 δειλοί（deiloi））。對照的三樣由 ἀλλὰ（alla） 帶出：δυνάμεως（dynameōs）、ἀγάπης（agapēs）、σωφρονισμοῦ（sōphronismou）。σωφρονισμοῦ（sōphronismou） 也是新約只此一次，字根是「健全的心思」，指在壓力下仍能清明、自制，不被慌亂牽著走。三樣不是三種氣質，是一個整體。</p>","exp":"<p>「因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。」（1:7）這一節常被抄在卡片上，也常被用錯。先看第一個字：「因為」。它解釋上一節：為甚麼可以把火挑旺？因為火是神給的。再看主詞：神。再看動詞：賜。這是一句關於恩典的話，不是一份考卷。</p><p>所以這一節不是說「會害怕的人沒有信心」。保羅說的是神沒有賜甚麼、賜了甚麼，不是在檢查提摩太夠不夠勇敢。一位在焦慮、恐懼、憂鬱或創傷裡掙扎的弟兄姊妹，不應該在這節經文前多背一個罪名。神所賜的剛強，常常正是藉著醫生、藥物、輔導和弟兄姊妹的陪伴臨到人；禱告與就醫不是二選一。</p><p>也留意「我們」。保羅沒有說「神賜給你」，他說「賜給我們」。寫這句話的人在牢裡，身邊的人一個一個離開（1:15），他自己也需要這句話。這是一個軟弱的人對另一個軟弱的人說：我們手上的，都是領受來的。</p><p>三樣東西排在一起，像一盞油燈的三個部分。剛強（原文就是「能力」，與 1:8「神的能力」同字）是火力；仁愛是方向，叫能力用來服事人，而不是壓制人；謹守是燈罩，叫火在風裡也不亂竄。一個服事的人如果只有能力，會變成霸道；只有愛，會被人牽著走；只有謹慎，會甚麼都不敢做。神把三樣一起給。</p><p>提摩太大概天性不是勇敢的人（這使我們想起林前 16:10，保羅要哥林多人留心，叫他在那裡無所懼怕）。神使用的不是天生勇敢的人。321 說「聖靈是我的引導」，在這一節可以認出來：剛強、仁愛、謹守，不是靠意志力撐出來的性格，是聖靈住在人裡面所結的果子（這使我們想起加 5:22--23）。</p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,</p>","lit":"<p>所以你不要以我們主的見證為恥，也不要以我——他的囚犯——為恥，倒要照著神的能力，為福音一同受苦；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μὴ οὖν ἐπαισχυνθῇς</td><td>Mē oun epaischynthēs</td><td>所以不要以為恥</td><td>不定過去式假設語氣的禁止</td></tr><tr><td>τὸ μαρτύριον τοῦ κυρίου ἡμῶν</td><td>to martyrion tou kyriou hēmōn</td><td>我們主的見證</td><td>為主所作的見證</td></tr><tr><td>τὸν δέσμιον αὐτοῦ</td><td>ton desmion autou</td><td>他的囚犯</td><td>主的囚犯，不是羅馬的</td></tr><tr><td>συγκακοπάθησον τῷ εὐαγγελίῳ</td><td>synkakopathēson tō euangeliō</td><td>為福音一同受苦</td><td>「一同」是字首；2:3 再用</td></tr><tr><td>κατὰ δύναμιν θεοῦ</td><td>kata dynamin theou</td><td>照著神的能力</td><td>接回 1:7 的 δυνάμεως</td></tr></table>","gram":"<p><strong>οὖν（oun） 把 1:8 掛在 1:7 上。</strong>既然神賜的不是膽怯的心，所以不要以為恥。Μὴ（Mē）……ἐπαισχυνθῇς（epaischynthēs） 是不定過去式假設語氣的禁止，把整件事一次禁住：不要讓羞恥佔上風。ἐπαισχύνομαι（epaischynomai） 在本章出現三次：1:8 叫提摩太不要以為恥，1:12 保羅說自己不以為恥，1:16 阿尼色弗不以保羅的鎖鍊為恥。一章三次，像一條繩子把整章綁在一起。</p><p>τὸν δέσμιον αὐτοῦ（ton desmion autou） 的屬格要緊：保羅是主的囚犯，不是羅馬的。συγκακοπάθησον（synkakopathēson） 是「一同」加上「受惡待」的複合字，新約只見於本卷（1:8；2:3）。命令語氣，卻帶著「同」：不是叫兒子一個人去受苦，是與我一同。這苦有對象（τῷ εὐαγγελίῳ（tō euangeliō），為福音），也有力量的來源（κατὰ δύναμιν θεοῦ（kata dynamin theou））。</p>","exp":"<p>「你不要以給我們的主作見證為恥，也不要以我這為主被囚的為恥」（1:8）。羞恥常常比痛苦更難受。華人說「丟臉」，臉丟了，比皮肉受苦更叫人抬不起頭。提摩太的屬靈父親成了囚犯，被當作罪犯捆著；跟他站在一起，是要付面子的代價的。</p><p>這使我們想起主的話：「凡在這淫亂罪惡的世代，把我和我的道當作可恥的……人子……也要把那人當作可恥的」（可 8:38）。保羅寫羅馬書時說過：「我不以福音為恥」（羅 1:16）。如今他自己就在羅馬，福音的使者成了鎖鍊裡的人，這句話要用生命來寫了。</p><p>保羅叫兒子不要以為恥，卻沒有叫他一個人去扛。「總要按神的能力，與我為福音同受苦難」（1:8）。「同受」是關鍵：苦難是一起扛的，不是看著一個人扛。這也劃出一條界線：這裡的苦是「為福音」的苦，不是一切的苦都算。自己犯錯的後果、過勞拖垮的身體、在關係裡被虐待，都不是這一節說的苦；遇到人身安全的威脅，先保護生命、依法求助，這不是不屬靈。</p><p>力量從哪裡來？「按神的能力」。1:7 的剛強，在這裡兌現了。提摩太不必先變成勇敢的人才去受苦；他只要不離開那位賜能力的神。321 說的「無己」不是叫人硬撐，是把焦點從「我丟了臉」移到「主的見證」。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,</p><p lang=\"grc\">φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,</p>","lit":"<p>他救了我們，並以聖潔的呼召召了我們，不是照著我們的行為，而是照著他自己的定意和恩典；這恩典是在永世的時間以前，在基督耶穌裡賜給我們的，</p><p>但如今藉著我們救主基督耶穌的顯現被顯明了：他一方面廢掉了死，一方面藉著福音照亮了生命和不朽壞；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος</td><td>tou sōsantos hēmas kai kalesantos</td><td>那救了我們又召了我們的</td><td>一個冠詞統攝兩個分詞</td></tr><tr><td>οὐ κατὰ τὰ ἔργα ἡμῶν</td><td>ou kata ta erga hēmōn</td><td>不是照我們的行為</td><td>先拿走人的功勞</td></tr><tr><td>κατὰ ἰδίαν πρόθεσιν καὶ χάριν</td><td>kata idian prothesin kai charin</td><td>照他自己的定意和恩典</td><td>「自己的」：源頭在神</td></tr><tr><td>πρὸ χρόνων αἰωνίων</td><td>pro chronōn aiōniōn</td><td>在永世的時間以前</td><td>和合本「萬古之先」</td></tr><tr><td>διὰ τῆς ἐπιφανείας</td><td>dia tēs epiphaneias</td><td>藉著顯現</td><td>本卷用於兩次來臨（1:10；4:1、8）</td></tr><tr><td>καταργήσαντος μὲν τὸν θάνατον</td><td>katargēsantos men ton thanaton</td><td>一方面廢掉了死</td><td>使它失效，不是使它消失</td></tr><tr><td>φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν</td><td>phōtisantos de zōēn kai aphtharsian</td><td>一方面照亮了生命和不朽壞</td><td>μὲν……δὲ 成對</td></tr></table>","gram":"<p><strong>1:9--10 在原文是 1:8 的延長句。</strong>τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος（tou sōsantos hēmas kai kalesantos） 是屬格分詞，緊接 1:8 末尾的 θεοῦ（theou）：「神的能力」的那位神，就是救了我們、召了我們的神。保羅一說到受苦，就轉去講救恩；他不肯只講鎖鍊不講恩典。</p><p>結構是 οὐ（ou）……ἀλλὰ（alla） 的對照：不照我們的行為，乃照他的定意和恩典。這恩典 τὴν δοθεῖσαν（tēn dotheisan），在萬古之先已經賜下；φανερωθεῖσαν δὲ νῦν（phanerōtheisan de nyn），如今才顯明。一個在時間以前，一個在時間裡面。接著是一對 μὲν（men）……δὲ（de）：καταργήσαντος μὲν τὸν θάνατον（katargēsantos men ton thanaton） 與 φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν（phōtisantos de zōēn kai aphtharsian）。καταργέω（katargeō） 不是叫死亡消失，是使它失去效力，像拔掉毒蛇的牙；希伯來書說主「藉著死敗壞那掌死權的」（來 2:14），用的也是這個字。φωτίσαντος（phōtisantos） 是「照亮」：生命早在神裡面，福音把燈打開了。</p>","exp":"<p>保羅寫到「受苦」，筆鋒一轉就寫到萬古之先。這兩節像牢房牆上開的一扇窗：從一個窄小陰冷的地方望出去，是永恆。「神救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典」（1:9）。</p><p>這一句先拿走人的功勞。提摩太若以為事奉的果效取決於自己夠不夠勇敢，這一節告訴他：你的得救和蒙召，從來不是按你的行為。在時間開始以前，恩典已經在基督裡賜給了「我們」。一個怕自己不夠好的年輕傳道人，要先站在這個地基上。揀選與預定的細部是本章議題頁的題目；這裡要看見的是，恩典比我們的軟弱古老得多。</p><p>「他已經把死廢去，藉著福音，將不能壞的生命彰顯出來。」（1:10）寫這句話的人，正在等候自己的死刑。基督徒還是會死，保羅也會死；但死亡已經被拔了牙。它還能叫人受傷，卻不能把人留住。這使我們想起希伯來書說的，主要「釋放那些一生因怕死而為奴僕的人」（來 2:15）。</p><p>「顯現」這個字，本卷用在主的兩次來臨：這裡說他第一次的顯現已經把生命照亮；4:8 說信徒愛慕他的顯現，指的是第二次。保羅站在兩次顯現中間，回頭看見十字架與空墳墓，往前看見冠冕。321 說的改變觀點，在這裡有了地基：環境是牢房，觀點是永恆。</p>"},{"a":11,"z":12,"star":3,"grk":"<p lang=\"grc\">εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ διδάσκαλος</p><p lang=\"grc\">διʼ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλʼ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.</p>","lit":"<p>為此我被設立作傳令的、使徒和教師；</p><p>為這緣故我也受這些事，但我不以為恥，因為我知道我所信的是誰，並且我確信他有能力保守我的託付，直到那日。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰς ὃ ἐτέθην ἐγὼ</td><td>eis ho etethēn egō</td><td>我為此被設立</td><td>被動語態：職分是被安放的</td></tr><tr><td>κῆρυξ καὶ ἀπόστολος καὶ διδάσκαλος</td><td>kēryx kai apostolos kai didaskalos</td><td>傳令的、使徒、教師</td><td>◆ 經文鑑別：Treg、RP 加 ἐθνῶν</td></tr><tr><td>καὶ ταῦτα πάσχω</td><td>kai tauta paschō</td><td>也受這些事</td><td>現在式：正在受</td></tr><tr><td>ἀλλʼ οὐκ ἐπαισχύνομαι</td><td>all' ouk epaischynomai</td><td>但我不以為恥</td><td>本章第二次「以為恥」</td></tr><tr><td>οἶδα γὰρ ᾧ πεπίστευκα</td><td>oida gar hō pepisteuka</td><td>因為我知道我所信的是誰</td><td>ᾧ 指一個人，不是一套內容</td></tr><tr><td>δυνατός ἐστιν</td><td>dynatos estin</td><td>他是有能力的</td><td>與 1:7、1:8 的「能力」同一家族</td></tr><tr><td>τὴν παραθήκην μου</td><td>tēn parathēkēn mou</td><td>我的託付</td><td>兩讀：我交給他的／他交給我的</td></tr><tr><td>εἰς ἐκείνην τὴν ἡμέραν</td><td>eis ekeinēn tēn hēmeran</td><td>直到那日</td><td>1:18；4:8 再出現</td></tr></table>","gram":"<blockquote><p>◆ 經文鑑別（1:11）：SBLGNT、WH、NA28 在 διδάσκαλος（didaskalos） 後面沒有別的字，和合本「作師傅」與此相同；Treg 與 RP 所根據的抄本加上 ἐθνῶν（ethnōn），成了「外邦人的師傅」。提前 2:7 有 διδάσκαλος ἐθνῶν（didaskalos ethnōn） 這一句，抄寫的人很容易照那一處補上，所以較短的讀法比較可能是原文。本講義從 SBLGNT 與和合本。兩種讀法都不改變意思：保羅是外邦人的使徒，本是公認的事。</p></blockquote><p><strong>οἶδα γὰρ ᾧ πεπίστευκα（oida gar hō pepisteuka）。</strong>ᾧ（hō） 是關係代名詞的與格，指一個人：我所信靠的那一位，不是我所信的條文。πεπίστευκα（pepisteuka） 是完成式：從前信了，到如今仍然信。πέπεισμαι（pepeismai） 也是完成式，與 1:5 對提摩太說的是同一個字。</p><p><strong>τὴν παραθήκην μου（tēn parathēkēn mou） 有兩種讀法。</strong>παραθήκη（parathēkē） 是寄存、託管的字：把貴重的東西交給可靠的人保管。μου（mou） 可以讀成「我所交付他的」，指保羅把自己的生命與事工交在神手裡（和合本）；也可以讀成「他所交託我的」，指神交給保羅的福音（和合本註腳：或譯「他所交託我的」）。支持後者的理由是 1:14 τὴν καλὴν παραθήκην（tēn kalēn parathēkēn） 明明是交給提摩太的善道，提前 6:20 也是同一個字；支持前者的理由是這裡的保管者是神：δυνατός ἐστιν（dynatos estin） 之後接 φυλάξαι（phylaxai），是他保守。本講義講台照和合本，兩讀並陳；兩讀有一個共同點：最後保管的是神。</p>","exp":"<p>「我為這福音奉派作傳道的，作使徒，作師傅。」（1:11）三個身分：傳令的在城門口大聲宣告王的命令，使徒是被差遣出去的人，師傅是坐下來一句一句教的人。保羅三樣都做了，換來的是鎖鍊：「為這緣故，我也受這些苦難」（1:12）。</p><p>接著是本章的高峰：「然而我不以為恥；因為知道我所信的是誰」（1:12）。注意是「誰」，不是「甚麼」。保羅沒有說「我知道我信的道理是對的」，雖然那也重要；他說他認識那一位。在法庭上，證據可以被駁倒，論證可以被嘲笑，但一個人認識另一個人，是駁不倒的。不以為恥的祕訣不是自己勇敢，是焦點換了：從別人怎麼看我，換到我認識的是誰。</p><p>「也深信他能保全我所交付他的，直到那日」（1:12）。一個要把畢生心血交出去的人，最怕所託非人。保羅交給的是一位「能」的主。這是全卷那一條線的根基：不是我抓住他，是他保全我。像一個攀岩的人掛在繩上，安全不在他的手抓得多緊，在繩子另一端繫在哪裡。</p><p>如果採和合本註腳的另一讀「他所交託我的」，意思一樣叫人安穩：福音是神交給保羅的，保羅快死了，福音卻不會跟著死，因為最後保管它的是神。所以保羅才放心把它交給提摩太（1:14），提摩太再交給忠心的人（2:2）。棒子會換手，保管的那一位從來沒有換過。</p><p>「那日」是主再來審判的日子（4:8）。保羅用將來的那一天衡量眼前的羞辱。321 說「焦點在耶穌」，在這一節最清楚：焦點落在自己，人會怕；落在別人，人會羞；落在主身上，人就站得住。</p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρʼ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·</p><p lang=\"grc\">τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.</p>","lit":"<p>你要持守健康話語的範本，就是你從我聽見的，在那在基督耶穌裡的信和愛中；</p><p>那美好的託付，你要藉著那住在我們裡面的聖靈看守。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑποτύπωσιν ἔχε</td><td>hypotypōsin eche</td><td>要持守那範本</td><td>現在式命令；提前 1:16 同字</td></tr><tr><td>ὑγιαινόντων λόγων</td><td>hygiainontōn logōn</td><td>健康的話語</td><td>與 2:17 的毒瘡對照</td></tr><tr><td>ἐν πίστει καὶ ἀγάπῃ</td><td>en pistei kai agapē</td><td>在信與愛裡</td><td>持守的方式</td></tr><tr><td>τὴν καλὴν παραθήκην</td><td>tēn kalēn parathēkēn</td><td>美好的託付</td><td>提前 6:20 同字</td></tr><tr><td>φύλαξον</td><td>phylaxon</td><td>要看守</td><td>1:12 是神保守，這裡是你看守</td></tr><tr><td>τοῦ ἐνοικοῦντος ἐν ἡμῖν</td><td>tou enoikountos en hēmin</td><td>那住在我們裡面的</td><td>與 1:5 ἐνῴκησεν 同字根</td></tr></table>","gram":"<p><strong>ὑποτύπωσιν（hypotypōsin） 是草圖、範本。</strong>畫家先勾出輪廓，學徒照著描。提前 1:16 保羅說自己蒙憐憫是給後人作「榜樣」，用的就是這個字。ὑγιαινόντων（hygiainontōn） 是「健康的」，醫學用語；2:17 會說假教訓的話如同毒瘡，那裡的 γάγγραινα（gangraina） 是會蔓延的壞疽：一邊是叫人健壯的話，一邊是叫人腐爛的話。ἔχε（eche） 是現在式命令：不是拿到就好，是一直拿著。</p><p>1:12 與 1:14 用同一個動詞：δυνατός ἐστιν（dynatos estin） 之後的 φυλάξαι（phylaxai） 說神能保守，φύλαξον（phylaxon） 說你要看守。看守的責任交給了提摩太，看守的力量卻不在他自己：διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν（dia pneumatos hagiou tou enoikountos en hēmin）。分詞與 1:5 的 ἐνῴκησεν（enōkēsen） 同字根：信住在外祖母裡，聖靈住在我們裡。「我們」又一次把保羅和提摩太放在一起。</p>","exp":"<p>〔提前〕提前 6:20（提摩太前書講義第 6 章）</p><p>「你從我聽的那純正話語的規模，要用在基督耶穌裡的信心和愛心，常常守著。」（1:13）「規模」是範本，是一張草圖。保羅沒有叫提摩太逐字背誦他的講章，他交給兒子的是一個樣式：福音的輪廓、真理的骨架。提摩太要照著這個輪廓去講，在以弗所，在他自己的時代。傳承不等於複製；提摩太不必變成保羅，但他講的福音要和保羅講的是同一個。</p><p>而且要「在基督耶穌裡的信心和愛心」中守著。純正的話語也可以被冷冰冰地守，守成一把刀；保羅說要在信與愛裡守。對的話，要用對的心拿著。</p><p>「從前所交託你的善道，你要靠著那住在我們裡面的聖靈牢牢地守著。」（1:14）提摩太前書的最後一個囑咐是「你要保守所託付你的」（提前 6:20），兩封信在這個字上接起來。上一段是神保全保羅所交付的，這一段是提摩太看守所受託的，兩個動詞是同一個字。神把要守的交給人，又把守的能力也給人：住在裡面的聖靈。</p><p>守住不靠意志力。一個膽怯的年輕人，面對亞細亞眾人的離棄（下一節），憑自己是守不住的。321 說「聖靈是我的引導」，在這裡最實際：要守的是道，守的人是我，叫我守得住的，是住在我裡面的那一位。</p>"},{"a":15,"z":15,"star":1,"grk":"<p lang=\"grc\">Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.</p>","lit":"<p>你知道這事：所有在亞細亞的人都轉離了我，其中有腓吉路和黑摩其尼。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οἶδας τοῦτο</td><td>Oidas touto</td><td>這是你知道的</td><td>追蹤⑤：知道</td></tr><tr><td>ἀπεστράφησάν με</td><td>apestraphēsan me</td><td>他們轉離了我</td><td>被動形，主動意：把臉轉開</td></tr><tr><td>πάντες οἱ ἐν τῇ Ἀσίᾳ</td><td>pantes hoi en tē Asia</td><td>所有在亞細亞的人</td><td>痛到用「全部」來說</td></tr><tr><td>Φύγελος καὶ Ἑρμογένης</td><td>Phygelos kai Hermogenēs</td><td>腓吉路和黑摩其尼</td><td>新約只此一處</td></tr></table>","gram":"<p><strong>ἀπεστράφησάν（apestraphēsan） 是「轉過臉去」。</strong>這個被動形在這裡帶主動的意思：他們把臉轉開，不再認我。不定過去式指一件已經發生的事，很可能是在保羅被捕、受審的時候。πάντες οἱ ἐν τῇ Ἀσίᾳ（pantes hoi en tē Asia） 的「所有」不必讀成每一個人都走了，下一節以弗所的阿尼色弗一家就是例外；這是一個痛到用「全部」來說的說法。Φύγελος καὶ Ἑρμογένης（Phygelos kai Hermogenēs） 兩個名字在新約只出現這一次，我們對他們一無所知，只知道他們離開了。</p>","exp":"<p>「凡在亞細亞的人都離棄我，這是你知道的，其中有腓吉路和黑摩其尼。」（1:15）這是全卷的第一道谷。保羅曾在以弗所住了兩年多，「叫一切住在亞細亞的……都聽見主的道」（徒 19:10）。當年都聽見的地方，如今都轉過臉去。</p><p>保羅寫下兩個名字，卻沒有咒罵，也沒有解釋。他只說「這是你知道的」，像一個父親把一件心碎的事輕輕放在桌上。這兩個名字不是給講台拿來點名的；今天也不可拿這一節去影射離開教會、或曾經傷害教會的人。我們不知道他們的難處，也不知道他們後來的路。</p><p>這一節要說的是：被離棄是真的，會痛，連使徒也躲不過。服事的人若經歷同工離開，不必假裝不痛，也不必認定是自己徹底失敗。但這道谷不是終點。下一節阿尼色弗就來了；到了 4:16 眾人又一次離棄，接著卻是「惟有主站在我旁邊」（4:17）。越往下走，主越近。</p>"},{"a":16,"z":18,"star":2,"grk":"<p lang=\"grc\">δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·</p><p lang=\"grc\">ἀλλὰ γενόμενος ἐν Ῥώμῃ σπουδαίως ἐζήτησέν με καὶ εὗρεν—</p><p lang=\"grc\">δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.</p>","lit":"<p>願主賜憐憫給阿尼色弗的家，因為他屢次使我舒暢，也不以我的鎖鍊為恥；</p><p>反倒他到了羅馬，就殷勤地尋找我，並且找到了——</p><p>願主賜他在那日從主那裡找到憐憫——他在以弗所服事了多少，你知道得更清楚。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δῴη ἔλεος ὁ κύριος</td><td>dōē eleos ho kyrios</td><td>願主賜憐憫</td><td>祈願語氣；1:18 再用</td></tr><tr><td>τῷ Ὀνησιφόρου οἴκῳ</td><td>tō Onēsiphorou oikō</td><td>阿尼色弗的家</td><td>名字的意思是「帶來益處的」</td></tr><tr><td>πολλάκις με ἀνέψυξεν</td><td>pollakis me anepsyxen</td><td>屢次使我透一口氣</td><td>像悶熱牢房裡的一陣涼風</td></tr><tr><td>τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη</td><td>tēn halysin mou ouk epaischynthē</td><td>不以我的鎖鍊為恥</td><td>本章第三次「以為恥」</td></tr><tr><td>σπουδαίως ἐζήτησέν με καὶ εὗρεν</td><td>spoudaiōs ezētēsen me kai heuren</td><td>殷勤地找我，並且找到了</td><td>後面是一道破折號</td></tr><tr><td>εὑρεῖν ἔλεος παρὰ κυρίου</td><td>heurein eleos para kyriou</td><td>從主那裡找到憐憫</td><td>與 εὗρεν 呼應</td></tr><tr><td>βέλτιον σὺ γινώσκεις</td><td>beltion sy ginōskeis</td><td>你知道得更清楚</td><td>追蹤⑤：知道</td></tr></table>","gram":"<p><strong>δῴη（dōē） 是祈願語氣，表達一個願望。</strong>1:16 與 1:18 各用一次，兩個願望夾住阿尼色弗的事蹟。ἀνέψυξεν（anepsyxen） 字面是「使人再透一口氣」，像悶熱牢房裡吹進一陣涼風。ἅλυσίν（halysin） 是鎖鍊，單數；保羅在羅馬說「我原為以色列人所指望的，被這鍊子捆鎖」（徒 28:20），用的是同一個字。</p><p>1:17 與 1:18 有一個字的呼應：阿尼色弗 ἐζήτησέν με καὶ εὗρεν（ezētēsen me kai heuren），尋找我，並且「找到了」；保羅就求主使他 εὑρεῖν ἔλεος（heurein eleos），在那日「找到」憐憫。他在羅馬的大街小巷找到了一個囚犯，保羅願主在那日讓他找到憐憫。εὗρεν（heuren） 後面是一道破折號：保羅的話在這裡被一個禱告打斷，到 1:18 下半才接回來。</p>","exp":"<p>「願主憐憫阿尼色弗一家的人；因他屢次使我暢快，不以我的鎖鍊為恥」（1:16）。谷底出現一個人。他的名字意思是「帶來益處的」，他也真的名副其實。</p><p>「反倒在羅馬的時候，殷勤地找我，並且找著了」（1:17）。在一座大城裡找一個被關押的囚犯，不是容易的事。要四處打聽，要被衛兵盤問，要冒被當作同黨的風險。別人轉過臉去，他轉過身來找。這就是 1:8 那句話活出來的樣子：不以主的囚犯為恥。</p><p>保羅為他禱告兩次，都求憐憫：一次為他一家，一次為他自己「在那日」。阿尼色弗此時是否已經過世，經文沒有明說；4:19 保羅問候的是「阿尼色弗一家」，有人因此推想他已經不在了，也有人認為他只是還在外地。這一節能不能作為為過世的人禱告的根據，各傳統看法不同，本講義在議題頁並陳，不在這裡裁判。</p><p>可以確定的是：在一個被離棄的人生命裡，一個肯去找他的人有多重要。920 不必是一個大計劃，可以是一次探訪、一件送去的外衣、一句「我來看你」。你可以是某一個人的阿尼色弗。最後一句也值得留意：「他在以弗所怎樣多多地服事我，是你明明知道的」（1:18）。保羅要提摩太記得，在離棄的亞細亞，也有不離棄的人；而在一切人之上，有一位從不離棄的主。</p>"}],"2":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,</p>","lit":"<p>所以你，我的孩子，要在那在基督耶穌裡的恩典中被加力；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Σὺ οὖν</td><td>Sy oun</td><td>所以你</td><td>接回 1:15--18：眾人離棄，阿尼色弗留下——那你呢</td></tr><tr><td>τέκνον μου</td><td>teknon mou</td><td>我的孩子</td><td>1:2「我親愛的兒子」的回聲</td></tr><tr><td>ἐνδυναμοῦ</td><td>endynamou</td><td>要被加力</td><td>現在式命令，被動語態：不斷地被加上力量</td></tr><tr><td>ἐν τῇ χάριτι</td><td>en tē chariti</td><td>在恩典裡</td><td>力量的源頭，不只是範圍</td></tr><tr><td>τῇ ἐν Χριστῷ Ἰησοῦ</td><td>tē en Christō Iēsou</td><td>那在基督耶穌裡的</td><td>第二個冠詞把恩典釘在基督身上</td></tr></table>","gram":"<p><strong>Σὺ οὖν（Sy oun） 是一個轉身的手勢。</strong>1:15 剛說亞細亞的人都離棄了，1:16--18 又說阿尼色弗不以鎖鍊為恥。οὖν（oun） 把這兩幅畫面收攏，Σὺ（Sy） 放在句首，語氣是：別人走了，有人留下了——那麼你。τέκνον μου（teknon mou） 夾在中間，命令還沒出口，先叫一聲「孩子」。</p><p>ἐνδυναμοῦ（endynamou） 是現在式命令，字形可作中間語態或被動語態，多數解經家讀作被動：「要被加力」。命令句用被動語態，意思很清楚：力量不是提摩太自己生出來的，他要做的是一直站在力量流進來的地方。同一個動詞在 4:17 再出現：ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με（ho de kyrios moi parestē kai enedynamōsen me），主加給保羅力量。這是本卷「能力、剛強」那條追蹤的第一站，ἐνδυναμόω（endynamoō） 與 1:7 的 δύναμις（dynamis） 同字根。</p><p>ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ（en tē chariti tē en Christō Iēsou） 重複冠詞 τῇ（tē），把「恩典」限定為「那在基督耶穌裡的恩典」。ἐν（en） 在這裡偏重工具與源頭：靠著恩典，在恩典裡面得力。</p>","exp":"<p>「我兒啊，你要在基督耶穌的恩典上剛強起來。」（2:1）這一章叫作「兵」，可是第一道命令不是「去打仗」，是「被加力」。精兵、比武的、農夫，都排在這一節後面。次序不能顛倒：先有恩典，才有操練。</p><p>帆船不能自己生風，它能做的只是把帆張開，轉向風來的方向。ἐνδυναμοῦ（endynamou） 就是張帆的命令。保羅不是對一個天生勇敢的人說「再勇敢一點」，他是對一個可能天性怯懦、身體軟弱、剛被同工離棄的年輕人說：力量在恩典裡，你站到那裡去。這不是叫怯懦的人咬緊牙關硬撐，硬撐的人撐不久；恩典裡的剛強是領受來的，所以撐得到底。</p><p>現在式也值得記住。被加力不是一次充飽、用到沒電為止，是一路上不斷地接上電源。保羅自己在第 4 章說「惟有主站在我旁邊，加給我力量」（4:17），用的是同一個字。寫這一節的人，自己就活在這一節裡；他給兒子的，不是理論，是他在牢裡天天經歷的事。</p><p>本系列提摩太前書講義第 1 章講過保羅感謝那「給我力量」的主（提前 1:12），兩卷用的是同一個動詞。一位父親一生的見證，濃縮成給兒子的一道命令：讓那位加給我力量的，也加給你。</p>"},{"a":2,"z":2,"star":3,"grk":"<p lang=\"grc\">καὶ ἃ ἤκουσας παρʼ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.</p>","lit":"<p>並且你藉著許多見證人從我所聽見的，這些要交託給忠心的人，他們將足以也教導別人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἃ ἤκουσας παρʼ ἐμοῦ</td><td>ha ēkousas par' emou</td><td>你從我所聽見的</td><td>第一代→第二代</td></tr><tr><td>διὰ πολλῶν μαρτύρων</td><td>dia pollōn martyrōn</td><td>藉著許多見證人</td><td>公開、可查驗的傳承，不是密傳</td></tr><tr><td>ταῦτα παράθου</td><td>tauta parathou</td><td>這些要交託</td><td>不定過去式命令；與 1:12、14 παραθήκην 同字根</td></tr><tr><td>πιστοῖς ἀνθρώποις</td><td>pistois anthrōpois</td><td>忠心的人</td><td>第三代；第一個條件是忠心</td></tr><tr><td>οἵτινες ἱκανοὶ ἔσονται</td><td>hoitines hikanoi esontai</td><td>他們將足以</td><td>性質關係代名詞：這樣的人</td></tr><tr><td>καὶ ἑτέρους διδάξαι</td><td>kai heterous didaxai</td><td>也教導別人</td><td>第四代；καὶ 表示棒還要往下傳</td></tr></table>
